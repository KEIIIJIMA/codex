# tango-drill/ を GitHub Pages に公開する。
# 初回のみ リポジトリの Settings → Pages → Build and deployment → Source を "GitHub Actions" にする。
name: Deploy tango-drill to GitHub Pages
on:
  push:
    branches: [main, claude/adoring-maxwell-ch06ga]
    paths: ['tango-drill/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site directory
        run: |
          mkdir -p _site
          cp tango-drill/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
