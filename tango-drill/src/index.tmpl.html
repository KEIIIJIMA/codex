<style>
/* レイアウト: 上部に科目スイッチ付きの固定ヘッダー、3タブ、760px の単一カラム。学習中はヘッダーとタブを隠し、1枚のカードと下端の操作欄に集中させる。
   色の役割: --accent は科目の色（古文=臙脂、英語=青。選択中のタブ・進捗・主ボタン・見出し語の強調）。文字と線は --accent、塗りは --accent-fill（ダークで分かれる）。
   --ok は習得と正答、--bad は誤答と苦手、--warn は学習中（文字に使うときは --warn-ink）。 */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f5f6f9; --fg:#1b1d24; --muted:#5f6573; --line:#d8dbe2;
  --accent:#8c1c3f; --accent-fill:var(--accent); --accent-ink:#ffffff; --accent-soft:#f5e6eb;
  --ok:#2b7a4b; --ok-ink:#ffffff; --ok-soft:#e2f1e7; --bad-ink:#ffffff; --warn:#a2650a; --warn-ink:#8a5300; --warn-soft:#f9ecd4; --bad:#c2351d; --bad-soft:#fbe6e0; --new:#8a90a0;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 10px 28px -14px rgba(20,24,40,.22);
  --serif-ja:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --serif-en:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
  --r:14px;
}
:root[data-subj="eigo"]{--accent:#1f4e9c;--accent-soft:#e4ebf8}
/* ダークの定義は2か所（端末の設定に従う場合と、data-theme="dark" の指定）。同じ値にそろえる */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --surface:#1d2029; --surface2:#242834; --fg:#e8e9ee; --muted:#9aa0ae; --line:#303542;
    --accent:#f09ab4; --accent-fill:#b3294f; --accent-ink:#ffffff; --accent-soft:#3a2230;
    --ok:#6cc48e; --ok-ink:#0d2416; --ok-soft:#1f3328; --bad-ink:#2a0f0c; --warn:#e0b25b; --warn-ink:#e0b25b; --warn-soft:#3a3020; --bad:#f08a6c; --bad-soft:#40261d; --new:#6f7585;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-subj="eigo"]{--accent:#9dbaf5;--accent-fill:#3565c4;--accent-ink:#ffffff;--accent-soft:#222d46}
}
:root[data-theme="dark"]{
  --bg:#14161c; --surface:#1d2029; --surface2:#242834; --fg:#e8e9ee; --muted:#9aa0ae; --line:#303542;
  --accent:#f09ab4; --accent-fill:#b3294f; --accent-ink:#ffffff; --accent-soft:#3a2230;
  --ok:#6cc48e; --ok-ink:#0d2416; --ok-soft:#1f3328; --bad-ink:#2a0f0c; --warn:#e0b25b; --warn-ink:#e0b25b; --warn-soft:#3a3020; --bad:#f08a6c; --bad-soft:#40261d; --new:#6f7585;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="dark"][data-subj="eigo"]{--accent:#9dbaf5;--accent-fill:#3565c4;--accent-ink:#ffffff;--accent-soft:#222d46}

*{box-sizing:border-box}
/* html・body に高さを指定しない（指定すると、固定ヘッダーが1画面ぶん送ったところで外れ、末尾の下余白も効かない） */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button,select,summary,input,[role=button]{touch-action:manipulation}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 入力欄の枠は墨色（古文の臙脂だと、入力の誤りの表示に見える） */
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
[tabindex="-1"]:focus{outline:0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:760px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
/* 読み上げだけに出す文字 */
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 4px}
.top .wrap+.wrap{padding-block:2px 0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--serif-ja);font-weight:700;font-size:1.15rem;letter-spacing:.04em;white-space:nowrap}
.brand .lv{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.switch{display:inline-flex;flex:none;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;border-radius:999px;min-height:44px;padding:6px 16px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.switch button[aria-selected="true"]{background:var(--accent-fill);color:var(--accent-ink)}
/* 上と左右に4pxの余白を取り、フォーカス枠が横スクロールの枠で切れないようにする（負の余白で見た目の位置は変えない） */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 8px;margin:-4px -4px 0;scrollbar-width:none;min-width:0}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;min-height:44px;padding:5px 15px;font-size:.85rem;font-weight:500}
.subtabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.subtabs button .n{font-size:.72rem;margin-left:4px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:0;background:transparent;min-height:46px;padding:12px 14px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
/* スマホでは副題を隠して、題名とスイッチを1段にする */
@media (max-width:560px){.brand .lv{display:none}.top .wrap{flex-wrap:nowrap}}
/* 学習中（出題の途中）はヘッダー・タブ・フッターを隠す。render() が html に studying を付け外しする */
.studying .top,.studying .tabs,.studying footer.about{display:none}
/* 学習中の画面は1画面ぶんの高さを取り、操作欄（.actions）をいつも下端に置く（カードが短くても、ボタンの位置が変わらないように） */
.studying body{padding-bottom:0}
.studying #view{padding-top:calc(10px + env(safe-area-inset-top,0px));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.studying #view>.actions{margin-top:auto}
.studying #view>.card,.studying #view>.detail,.studying #view>.choices,.studying #view>.typeform{flex:none}

/* home */
.today{display:flex;gap:4px 16px;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap;align-items:center}
.today b{color:var(--fg)}
/* 直近7日の印（回答した日は塗り） */
.wk{display:inline-flex;gap:3px;vertical-align:-1px;margin-left:6px}
.wk i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--new)}
.wk i.on{background:var(--ok);border-color:var(--ok)}
/* 数字のタイルは押せないので面を持たせない。スマホ幅では出さない（同じ数は下の凡例にある） */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tile{padding:4px 0;min-width:0}
.tile .lab{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.tile .val{font-size:1.6rem;font-weight:700;line-height:1.2;margin-top:2px}
.tile .val small{font-size:.8rem;font-weight:400;color:var(--muted);margin-left:2px}
.tile.ok .val{color:var(--ok)}.tile.weak .val{color:var(--bad)}
.relsum{display:none}
@media (max-width:560px){.tiles{display:none}.relsum{display:block}}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);margin-bottom:6px}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}.bar .learning{background:var(--warn)}.bar .weak{background:var(--bad)}
/* 状態の印は、色に加えて形も変える（未学習=輪、学習中=半分、習得=塗り、苦手=三角） */
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:18px}
.legend span::before{content:"";display:inline-block;box-sizing:border-box;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;background:transparent;border:2px solid var(--new)}
.legend .ok::before{background:var(--ok);border-color:var(--ok)}
.legend .learning::before{background:linear-gradient(to right,var(--warn) 50%,transparent 50%);border-color:var(--warn)}
.legend .weak::before{background:var(--bad);border:0;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.jump{display:inline-flex;align-items:center;min-height:44px;border:0;background:transparent;padding:0 4px;margin:-8px 0 8px;font-size:.88rem;font-weight:700;color:var(--accent)}
.jump::after{content:"›";margin-left:6px;font-size:1.1em}
/* 今日の学習（ホーム最上部）。目標の進み具合は --accent-fill、達成したら --ok */
.tbox{padding:14px 16px 12px;margin-bottom:14px}
.tbox h2{margin-bottom:8px}
.goal{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.goal .track{flex:1;height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.goal .track i{display:block;height:100%;background:var(--accent-fill);border-radius:999px}
.goal.done .track i{background:var(--ok)}
.goal b{color:var(--fg)}
.goal .gdone{font-size:.75rem;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:1px 8px}
.tstart{display:block;width:100%;text-wrap:balance}
.tstart small{font-size:.82rem;font-weight:500;margin-top:2px}
.tnone{margin:0;font-size:.88rem}
.tsub{margin:8px 0 0}
.opts.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:560px){.opts.two{grid-template-columns:1fr}}
/* 意味・メモの編集 */
.edrow{display:flex;justify-content:flex-end;margin-top:12px}
.edrow .btn{flex:none;font-size:.85rem;font-weight:500;color:var(--muted);padding:8px 14px}
.edbox{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);text-align:left}
.edbox label{display:block;font-size:.75rem;color:var(--muted);margin:0 0 4px;letter-spacing:.04em}
.edbox textarea{display:block;font-family:inherit;line-height:1.5;margin-bottom:10px;background:var(--surface);resize:vertical}
.edbox .row .btn{flex:1 1 90px}
.edmsg{margin:0 0 10px;font-size:.85rem;color:var(--bad)}
.edmark{margin-top:8px;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.edb{font-weight:700;color:var(--warn-ink);background:var(--warn-soft);border-radius:6px;padding:1px 8px}
.orig{flex:1 1 12em;min-width:0}
.orig summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.orig .means{margin-top:0}
.note.memo{white-space:pre-wrap;overflow-wrap:anywhere}
.card.back .edrow,.card.back .edbox,.card.back .confirm{align-self:stretch}
.again{margin:-4px 0 8px;font-size:.8rem;font-weight:700;color:var(--warn-ink)}
.rsum{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:.9rem}
.rsum p{margin:0}.rsum p+p{margin-top:4px}
.rsum p>b:first-child{display:inline-block;min-width:5.2em;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:16px}
.panel h2{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .sub{font-weight:400;color:var(--muted);font-size:.8rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opts+.opts{margin-top:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.opts+.opts{grid-template-columns:1fr 1fr}.opts+.opts>.opt:nth-child(3){grid-column:1/-1}}
.opt label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
/* 入力欄の文字は16px以上（iPhone は16px未満の欄に触れると画面を拡大する） */
select,input[type=text],input[type=search],input[type=number],textarea{width:100%;font:inherit;font-size:16px;min-height:44px;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
::placeholder{color:var(--muted);opacity:1}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:60px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;box-shadow:var(--shadow)}
.mode:active{background:var(--surface2)}
.mode .t{font-size:1.05rem;font-weight:700}
.mode .d,.mode .c{font-size:.82rem;color:var(--muted)}
.mode .c .cx{display:inline-block}
/* スマホ幅は2列。説明文は出さない（「使い方」にある）。奇数個のときは先頭のフラッシュカードを横いっぱいにする */
@media (max-width:560px){
  .modes{grid-template-columns:1fr 1fr;gap:8px}
  .modes.odd .mode:first-child{grid-column:1/-1}
  .mode{padding:10px 14px;justify-content:center;gap:1px}
  .mode .d{display:none}
  .mode .t{font-size:.95rem}
  .mode .c{font-size:.74rem}
  .mode .c .cx{display:none}
}
.hint{font-size:.78rem;color:var(--muted);margin:0 0 12px}
/* 近道で送ったとき、固定ヘッダーの下に隠れないようにする */
#tables{scroll-margin-top:calc(136px + env(safe-area-inset-top,0px))}
.zero{font-size:.88rem;font-weight:500;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:10px 12px;margin:0 0 10px;scroll-margin:24px}
.share{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:.84rem;color:var(--fg)}
.share b{display:block;margin-bottom:2px}

/* study */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:.85rem;color:var(--muted)}
.prog .track{flex:1;height:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent-fill);transition:width .25s}
.prog .tally{font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .tally .o{color:var(--ok)}.prog .tally .x{color:var(--bad)}
.prog button{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:4px 16px;font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;min-height:340px;display:flex;flex-direction:column;justify-content:center;position:relative}
/* 4択・空所補充・読み入力の問題カード */
.card.q{min-height:0;padding:22px 24px}
.card.in{animation:rise .18s ease-out both}
/* 表面: 見出し語を中央に大きく。ラベルは上端へ。語の大きさは字数（--n）に合わせ、1行に収める */
.card.flip{cursor:pointer;align-items:center;text-align:center}
.card.flip .chips{position:absolute;top:16px;left:18px;right:18px;margin:0}
.card.flip .word{text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.card.flip .word.ja{font-size:clamp(1.5rem,calc((min(100vw,760px) - 100px)/var(--n,4)),3.4rem)}
.card.flip .word.en{font-size:clamp(1.5rem,calc((min(100vw,760px) - 100px)/(var(--n,8)*.56)),3.1rem)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
/* ラベル（押せない）は枠なしの四角寄り。押せる丸い部品（絞り込み・タブ）と形を分ける */
.chip{display:inline-block;font-size:.72rem;padding:3px 9px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip.num{background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
.word{line-height:1.2;margin:0}
.word.ja{font-family:var(--serif-ja);font-size:clamp(2rem,7vw,2.9rem);font-weight:700;letter-spacing:.02em}
.word.en{font-family:var(--serif-en);font-size:clamp(2.1rem,7vw,3.1rem);font-weight:600;letter-spacing:-.01em}
.word.gloss{font-size:1.35rem;font-weight:700}
.kanji{font-family:var(--serif-ja);color:var(--muted);font-size:1.05rem;margin-top:6px}
.tap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:.78rem;color:var(--muted)}
/* キーボード操作の案内（.kbd）は、タッチ操作の端末では出さない */
@media (hover:none) and (pointer:coarse){.kbd{display:none!important}}
.back{animation:rise .22s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.back .word.ja{font-size:1.6rem}.back .word.en{font-size:1.7rem}
.means{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;counter-reset:m}
.means li{display:flex;gap:10px;font-size:1.05rem;font-weight:500}
.means li>span{text-wrap:balance}
.means li::before{content:counter(m);counter-increment:m;flex:none;width:1.4em;height:1.4em;border-radius:50%;background:var(--accent-fill);color:var(--accent-ink);font-size:.72rem;display:grid;place-items:center;margin-top:.3em;font-weight:700}
/* 意味が1つなら番号を出さない。説明文の意味（古文常識・文学史、1つで長い意味）は細字の本文にする */
.means li:only-child::before{display:none}
.means.desc li{font-size:.95rem;font-weight:400;line-height:1.75}
.means.desc li>span{text-wrap:pretty}
.ex{margin:16px 0 0;padding:10px 14px;border-left:3px solid var(--line);border-left-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--surface2);border-radius:0 10px 10px 0;text-wrap:pretty}
.ex .q{font-weight:500}
.ex .q.ja{font-family:var(--serif-ja)}.ex .q.en{font-family:var(--serif-en);font-size:1.02rem}
.ex .q b.hit{color:var(--accent);font-weight:700}
.ex .tr{color:var(--muted);font-size:.9rem;margin-top:3px}
.note{margin-top:12px;font-size:.86rem;background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:8px 12px}
.note b{color:var(--warn-ink);margin-right:6px}
.der{margin-top:10px;font-size:.86rem;color:var(--muted)}
.sei{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.86rem;text-align:left}
.sei-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.sei-h b{color:var(--muted);font-size:.78rem;letter-spacing:.06em}
.sei-y{font-weight:700;font-size:.98rem}
.conf{margin-left:auto;font-size:.74rem;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.conf.hi{background:var(--ok-soft);color:var(--ok)}.conf.mid{background:var(--warn-soft);color:var(--warn-ink)}.conf.lo{background:var(--bad-soft);color:var(--bad)}
.sei-s{margin-top:8px;font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.sei ul{margin:2px 0 0;padding-left:1.25em}.sei li{margin:2px 0}
.sei p{margin:2px 0 0}
.sei p.sei-b{margin-top:8px;color:var(--muted);font-size:.8rem}
.figbox{margin-top:14px;padding:10px;background:var(--surface2);border-radius:10px;overflow-x:auto}
.figbox svg{display:block;width:100%;max-width:380px;height:auto;margin:0 auto}
.figbox svg text{font-family:var(--sans);fill:var(--fg)}
.figbox table{border-collapse:collapse;font-size:.82rem;width:100%}
.figbox td,.figbox th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.figbox th{color:var(--muted);font-weight:500;white-space:nowrap}
.figbox mark{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 2px;border-radius:3px}
.figbox .cap{font-size:.75rem;color:var(--muted);margin-top:6px;text-align:center}
.ill{margin:14px 0 0}.ill img{display:block;max-width:100%;max-height:360px;margin:0 auto;border-radius:8px;border:1px solid var(--line)}
.means.per{gap:10px}.means.per li>span{min-width:0;flex:1}
.ex.sm{display:block;margin:6px 0 0;padding:7px 12px;font-weight:400;font-size:.95rem}
.ex.sm .q,.ex.sm .tr{display:block}.ex.sm .tr{font-size:.85rem}
.rel{margin-top:12px;font-size:.88rem}
.rel>b{display:block;margin-bottom:4px;font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.rel ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rel li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 10px;background:var(--surface2);border-radius:8px}
.rel .rw{font-family:var(--serif-ja);font-weight:700}.rel .rp{font-size:.72rem;color:var(--muted)}.rel .rm{flex:1 1 160px;min-width:0}
.der b{color:var(--fg);font-weight:500;margin-right:6px}
/* スマホではカードの左右の余白を詰め、意味ごとの用例の箱を番号の下まで広げる（番号のある行だけ） */
@media (max-width:520px){
  .card{padding:24px 18px}
  .card.q{padding:20px 18px}
  .detail{padding:16px}
  .means.per li:not(:only-child) .ex.sm{margin-left:-26px}
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.actions.one{grid-template-columns:1fr}
/* 学習中の操作欄（答えを見る／まだ・覚えた／正誤と次へ）は画面の下端に固定する。ページ全体を送る形は変えない */
#view>.actions{position:sticky;bottom:0;z-index:4;margin-top:6px;padding:14px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);background:linear-gradient(to bottom,transparent,var(--bg) 14px)}
.actions.band{grid-template-columns:minmax(0,1fr) auto;align-items:stretch;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:14px 16px;font-weight:700;font-size:1rem;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.acc{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.text{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.btn.sm{padding:8px 14px}
.btn small{display:block;font-weight:400;font-size:.72rem}
.band .btn{min-width:108px}
@media (max-width:360px){.band .btn{min-width:84px}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}

/* cloze */
.cloze{margin:4px 0 0;font-size:1.25rem;line-height:1.7;font-weight:500}
.cloze.en{font-family:var(--serif-en)}.cloze.ja{font-family:var(--serif-ja)}
/* 空所は下線1本（中の「＿」は見せない）。線は墨色で、正誤が出たときだけ緑・赤になる */
.blank{display:inline-block;min-width:4.5em;text-align:center;border-bottom:2px solid var(--fg);padding:0 .3em;font-weight:700}
.blank:not(.ok):not(.ng){color:transparent}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.ng{color:var(--bad);border-color:var(--bad)}
.typeform{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
.typeform input{font-size:1.1rem;padding:12px 14px}
@media (max-width:480px){.typeform .btn{padding-inline:14px;white-space:nowrap}}
/* reference tables */
.refd{border-top:1px solid var(--line)}
.refd:first-of-type{border-top:0}
.refd summary{cursor:pointer;font-weight:700;font-size:.92rem;padding:11px 0}
.refd[open]{padding-bottom:12px}
.tblwrap{overflow-x:auto;margin-top:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
/* 外周のセル枠は消し、.tblwrap の枠1本にする */
table.ref{border-collapse:collapse;border-style:hidden;font-size:.8rem;min-width:100%;white-space:nowrap}
table.ref.wide{white-space:normal;min-width:760px}
table.ref th,table.ref td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.ref tr:first-child th{background:var(--surface2);color:var(--muted);font-weight:500}
table.ref.wrap{white-space:normal}
table.ref.wrap td:nth-child(2){min-width:4.5em}
table.ref th{background:var(--surface2);font-weight:500}
table.ref b{font-family:var(--serif-ja);font-size:1rem}
table.ref tr>*:first-child{white-space:normal;min-width:5.2em;max-width:6.5em}
table.ref small{display:block;color:var(--muted);font-size:.72rem;margin-bottom:4px}
table.ref td.tr{color:var(--accent)}
table.ref td[rowspan],table.ref th[rowspan]{vertical-align:middle}
table.ref mark{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 2px;border-radius:3px}
.refd .cap{font-size:.75rem;color:var(--muted);margin:6px 0 0}
/* quiz */
.qprompt{font-size:.8rem;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.choices{display:grid;gap:10px;margin-top:16px}

.mm,.mp{display:inline-block;max-width:100%}

}

.verdict{margin-top:16px;font-weight:700;font-size:1.05rem}

/* スマホ幅では、単語帳の行と同じく、語の下に意味を置く（2列だと意味の列が狭く、細かく折れる） */

const baseOf=k=>SUBJ[k].base||k;const groupOf=k=>GROUPS.find(g=>g.subs.includes(k)).key;const isEn=()=>baseOf(S.subj)==='eigo';

  kobun:KOBUN_RAW.map(r=>({id:'k:'+r[0]+(r[1]?'|'+r[1]:''),w:r[0],k:r[1],pos:r[2],m:r[3],ex:r[4],tr:r[5],note:r[6],lv:r[7],tags:r[8]})),
  eigo:EIGO_RAW.map(r=>({id:'e:'+r[0],w:r[0],k:'',pos:r[1],m:r[2],ex:r[3],tr:r[4],der:r[5],lv:r[6],tags:r[7]}))
};
let BOOKREL=[];
// 古文330の見出し語・関連語の添え書き（「けしき(気色)」の漢字、「かたちをかふ〔やつす〕」の言い換え、「たまふ(四段)」の区別）は
// 語そのものに含めない。語の表示・選択肢・字数のヒント・照合には添え書きを外した形（bareW）を使い、添え書きは漢字表記の欄（k）に出す。

const NOTE_RE=/\([^)]*\)|〔[^〕]*〕/g;
const bareW=s=>String(s).replace(NOTE_RE,''),noteW=s=>(String(s).match(NOTE_RE)||[]).map(x=>x[0]==='('?x.slice(1,-1):x).join('・');
if(SUBJ.book){DATA.book=BOOK_RAW.map(r=>({id:'b:'+r[0],num:r[0],w:bareW(r[1]),k:r[2]||noteW(r[1]),pos:r[3],m:r[4],ex:r[5],tr:r[6],note:r[7],lv:r[8],tags:r[9],rel:r[10]||[],exs:r[11]||null}));
  DATA.book.forEach(it=>{if(it.exs&&it.exs[0]){it.ex=it.exs[0][0];it.tr=it.exs[0][1];}});

// 英語は「レベル→ABC 順」に並べてから、レベル別タブの一覧を作る（レベル別タブも、全レベルタブと同じ ABC 順にするため）
DATA.eigo.sort((a,b)=>a.lv-b.lv||a.w.localeCompare(b.w,'en'));
for(const l of [1,2,3,4])DATA['eigo'+l]=DATA.eigo.filter(it=>it.lv===l);
if(SUBJ.joshiki)DATA.joshiki=JOSHIKI_RAW.map(r=>({id:'j:'+r[1],w:r[1],k:'',pos:r[0],m:[r[3]],rd:r[2]!==r[1]?r[2]:'',alt:r[5]||'',ex:'',tr:'',note:'',lv:r[6],tags:[],img:r[7],fig:r[8],page:r[4]}));
if(typeof EXTRA_SUBJ!=='undefined')for(const e of EXTRA_SUBJ){SUBJ[e.key]=Object.assign({cls:'ja',qw:'語',joshiki:true,noCloze:true},e.meta);GROUPS[0].subs.push(e.key);
  DATA[e.key]=e.items.map(r=>Object.assign({},r,{id:e.key+':'+r.w+'|'+(r.k||'')+'|'+r.pos}));}
const findAny=id=>{for(const s in DATA){const x=DATA[s].find(it=>it.id===id);if(x)return x;}return BOOKREL.find(it=>it.id===id);};
if(typeof KOBUN_EXS!=='undefined')DATA.kobun.forEach(it=>{const e=KOBUN_EXS[it.w+'|'+(it.k||'')];if(e&&e.length===it.m.length){it.exs=e;it.ex=e[0][0];it.tr=e[0][1];}});
if(typeof EIGO_EXS!=='undefined')DATA.eigo.forEach(it=>{const e=EIGO_EXS[it.w];if(e&&e.length===it.m.length){it.exs=e;it.ex=e[0][0];it.tr=e[0][1];}});
for(const k of ['kobun','eigo','book'])(DATA[k]||[]).forEach(it=>{if(!it.exs&&it.m.length===1&&it.ex)it.exs=[[it.ex,it.tr]];});
DATA.kobun.sort((a,b)=>a.w.localeCompare(b.w,'ja'));
const TAGS={};for(const s in DATA){const t=new Set();DATA[s].forEach(it=>it.tags.forEach(x=>t.add(x)));TAGS[s]=[...t];}
const STATUS={new:'未学習',learning:'学習中',weak:'苦手',ok:'習得'};
// 教材の分け方（レベル・章・分野・時代…）。出題範囲・単語帳の絞り込みのラベルに使う。「レベル」の教材だけ、出題範囲に「レベル1: 」を付ける
const LVK={kobun:'レベル',eigo:'レベル',book:'章',yomi:'分類',joshiki:'分野',bungaku:'時代',waka:'種類',bunpo:'分野'};
const lvKind=k=>LVK[baseOf(k)]||'レベル';
// 出題範囲の絞り込み（タグ）のラベル。本の印のタグは、意味が分かる名前にする
const TAGLAB={'マーカー':'本でマーカーが付いている語','チェックリスト':'チェックリストの語','まとめ':'まとめの項目','作者':'作者の項目'};
const tagLab=t=>TAGLAB[t]||('分野: '+t);

/* ---- storage ---- */
// 保存データの版 v（無ければ0）より新しい移行を番号順に当て、記録を新しいIDへ付け替える。
// 1つの移行は同時の付け替え（新しい prog を作ってから差し替えるので、a→b と b→a が同じ移行にあれば入れ替わる）。
// 対応表に無いIDはそのまま。付け替え先が重なったら回答数（c＋x）の多いほうを残す。
// 消した印（del。下の「保存データの形」）のIDも、同じ対応で付け替える。

// 保存データの形（キー tango-drill-v1 に、全体を1つの JSON で入れる）
//   prog  {ID:{c:正答数, x:誤答数, s:連続正解数, t:最後に答えた時刻, g:復習の段階, d:次に出す日}}     days {日付:その日の回答数}     prefs 設定     v 版（移行の番号）
//         g・d は後から足した欄で、無くてもよい（古い版の記録・古いバックアップ）。無い記録は、読むたびに s と t から換算する（下の sched）。保存データは書き換えない
//   edits {ID:{m:[意味…], n:メモ, t:更新時刻}}。利用者が書き換えた意味（m）と追記したメモ（n）。どちらか片方だけでもよい。
//         編集を消したときは {t:時刻, del:1} を残す（2つのタブで開いているとき、もう片方の古い編集が戻らないように）。一度も編集していなければ、この欄は無い。
//         学習記録（prog）とは別もので、「記録のリセット」では消さない。出題（選択肢・正誤の判定・空所補充）には使わず、表示だけに使う
//   del   {ID:記録を消した時刻}。記録を消した印。2つのタブで開いているとき、もう片方が覚えている古い記録と合わせても、

const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o),isNum=v=>typeof v==='number'&&isFinite(v)&&v>=0;

// lastRaw … 最後に読んだ（または書いた）保存内容の文字列。同じなら読み直さない
let lastRaw=null,saveWarned=false;
let store=load();
// 読み込み。古い版の記録は、元の内容を BAK に退避してから移行し、すぐ保存する。記録が空なら v を最新にするだけ
function load(){let raw=null,j=null;try{raw=localStorage.getItem(KEY);j=JSON.parse(raw);}catch(e){}

function put(o){try{const raw=JSON.stringify(o);localStorage.setItem(KEY,raw);lastRaw=raw;return true;}catch(e){warnSave();return false;}}
// 保存。直前に、いまの保存内容を読んで合わせる（2つのタブで開いていても、片方の記録がもう片方を上書きして消さないように）。保存できたら true
function save(){sync();return put(store);}
// 保存できなかったとき（容量の不足、プライベートブラウズなど）は、画面に一度だけ知らせる（閉じたあとは、もう出さない）
function warnSave(){if(saveWarned)return;saveWarned=true;const v=document.getElementById('view');if(!v)return;
  const n=document.createElement('div');n.id='savewarn';n.className='note';n.setAttribute('role','alert');n.style.margin='0 0 16px';
  n.innerHTML='<b>保存できません</b>学習記録を保存できませんでした。端末の空き容量が足りないか、プライベートブラウズで開いている可能性があります。このままページを閉じると、ここからの記録は残りません。記録を残すには、成績タブの「記録をコピー」で控えを取ってください。 <button type="button" class="fchip">閉じる</button>';
  n.querySelector('button').addEventListener('click',()=>n.remove());v.parentNode.insertBefore(n,v);}
// いまの保存内容を読み、覚えている内容に合わせる。記録を変える操作の前、出題を始める前、保存の直前、ほかのタブが保存したとき（storage イベント）に呼ぶ。
// 古い版のタブが書いた内容は、移行してから合わせる。新しい版の内容なら、版を下げない。
// 合わせるのは学習記録（prog・days・del）だけ。出題設定（prefs）は、このタブの画面に出ている内容のままにする（保存データでは、後から保存したタブの設定が残る）
function sync(){let raw,j;try{raw=localStorage.getItem(KEY);}catch(e){return;}
  if(raw==null||raw===lastRaw)return;lastRaw=raw;
  try{j=JSON.parse(raw);}catch(e){return;}
  if(!isObj(j)||!isObj(j.prog))return;
  if((+j.v||0)<VER)migrate(j);else if(+j.v>(+store.v||0))store.v=j.v;
  merge(j);mergeEdits(j.edits);}
// 2つの記録のうち b を残すか: 回答数（c＋x）の多いほう。同数なら新しいほう（それも同じなら連続正解・正答の多いほう。どのタブでも同じ結果にするための決め）
const nAns=r=>(+r.c||0)+(+r.x||0);
const bWins=(a,b)=>(nAns(b)-nAns(a)||(+b.t||0)-(+a.t||0)||(+b.s||0)-(+a.s||0)||(+b.c||0)-(+a.c||0))>0;
// 保存内容 o（最新の版に移行ずみ）を、覚えている内容に合わせる。o から取り込んだ記録の数を返す。
//   記録 … 項目ごとに、回答数の多いほう（同数なら新しいほう）を残す。形のおかしい記録と、消した印より前の記録は取り込まない
//   日別の回答数 … 多いほうを残す     消した印 … 新しいほうを残す
//   restore（バックアップの復元）のときは、消した印があっても取り込む（消した時刻の直後の記録として扱う。消したあとでバックアップから戻せるように）
function merge(o,restore){let n=0;const del={};
  for(const src of [store.del,o.del])if(isObj(src))for(const id in src)if(isNum(src[id])&&!(del[id]>=src[id]))del[id]=src[id];
  for(const id in store.prog){const a=store.prog[id];if(a&&del[id]>=(+a.t||0))delete store.prog[id];}
  for(const id in o.prog){let b=o.prog[id];if(!validRec(b))continue;
    if(del[id]>=b.t){if(!restore)continue;b=Object.assign({},b,{t:del[id]+1});}
    const a=store.prog[id];if(!a||bWins(a,b)){store.prog[id]=b;n++;}}
  if(isObj(o.days))for(const d in o.days)if(isNum(o.days[d])&&!(store.days[d]>=o.days[d]))store.days[d]=o.days[d];

/* ---- 利用者が編集した意味・メモ ---- */
// 形の検査をして、正しい形に直したものを返す（おかしければ null）。意味は空でない文字列の配列、メモは空でない文字列。どちらも EDMAX 字まで
const EDMAX=2000;
function cleanEdit(e){if(!isObj(e)||!isNum(e.t))return null;if(e.del)return{t:e.t,del:1};const o={t:e.t};

  if(e.n!==undefined){if(typeof e.n!=='string'||!e.n.trim()||e.n.length>EDMAX)return null;o.n=e.n;}
  return o.m||o.n?o:null;}
const rawEdit=id=>isObj(store.edits)&&Object.prototype.hasOwnProperty.call(store.edits,id)?cleanEdit(store.edits[id]):null;
// 項目 id の編集（無い・消した・形がおかしい、なら null）
const editOf=id=>{const e=rawEdit(id);return e&&!e.del?e:null;};
// 表示に使う意味（編集していれば利用者の意味、していなければ元の意味）
const mOf=it=>{const e=editOf(it.id);return e&&e.m?e.m:it.m;};
const editCount=()=>isObj(store.edits)?Object.keys(store.edits).filter(id=>editOf(id)).length:0;
// 保存内容の edits を、覚えている内容に合わせる: 項目ごとに、更新の新しいほうを残す（消した印も同じ）。取り込んだ編集の数を返す。

function mergeEdits(src,restore){let n=0;if(!isObj(src))return n;
  for(const id of Object.keys(src)){if(id==='__proto__')continue;let b=cleanEdit(src[id]);if(!b||(restore&&b.del))continue;const a=rawEdit(id);
    if(a&&b.t<=a.t){if(!(restore&&a.del))continue;b=Object.assign({},b,{t:a.t+1});}

  return n;}
// 編集を保存する（o＝{m,n}。どちらも無ければ編集を消す）。保存できたら true
function setEdit(id,o){sync();const a=rawEdit(id),t=Math.max(Date.now(),a?a.t+1:0);
  if(o&&(o.m||o.n)){if(!isObj(store.edits))store.edits={};const e={t};if(o.m)e.m=o.m;if(o.n)e.n=o.n;store.edits[id]=e;}

// 項目 id の記録を消した時刻（消していなければ0）
const delAt=id=>{const d=isObj(store.del)?store.del[id]:0;return isNum(d)?d:0;};
// 記録を消す。消した印を残す
function forget(ids){const now=Date.now();for(const id of ids){const r=store.prog[id];if(r===undefined)continue;
  if(!isObj(store.del))store.del={};store.del[id]=Math.max(now,delAt(id),+(r&&r.t)||0);delete store.prog[id];}}
// 記録に付ける時刻。消した印より後にする（端末の時計がずれていても、消したあとの新しい記録が「消した記録」の扱いにならないように）
const stamp=id=>Math.max(Date.now(),delAt(id)+1);
function today(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
/* ---- 復習の間隔 ---- */
// 記録の g（段階 0〜5）と d（次に出す日。端末のローカル日付 'YYYY-MM-DD'）で、日をあけて出し直す。
//   正解 … 次に出す日が来ていれば段階を1つ上げ、IV[段階] 日後を次の日にする（1→3→7→14→30日後）。初めての語の正解は段階1（翌日）。
//           次に出す日が来る前の正解は、段階も日も変えない（同じ日に何度正解しても1回ぶん。差し戻しの正解でも上がらない）
//   誤答 … 段階0に戻し、翌日に出す
//   習得 … 段階3以上（日をあけて3回正解）。習得した語も、次に出す日が来たら復習に出る
// 古い版の記録（g・d が無い）は s と t から換算する: 連続正解2以上（以前の「習得」）→段階3・最後に答えた日の7日後、1→段階1・翌日、0→段階0・翌日。

const IV=[1,1,3,7,14,30],GMAX=5,GOK=3,DAY_RE=/^\d{4}-\d{2}-\d{2}$/;

const schedOf=it=>{const r=store.prog[it.id];return r?sched(r):null;};
const isDue=it=>{const s=schedOf(it);return !!s&&s.d<=today();};
// 状態。習得＝段階3以上。苦手＝誤答が2回以上の語か、正解したことがあるのに落とした語（段階0で、誤答の前に正解がある＝正答数が連続正解数より多い。

function status(it){const r=store.prog[it.id];if(!r)return'new';const g=sched(r).g;if(g>=GOK)return'ok';if(r.x>=2||(r.x>=1&&g===0&&r.c>r.s))return'weak';return'learning';}
function record(it,ok){sync();const had=store.prog[it.id],r=had||{c:0,x:0,s:0,t:0},sc=had?sched(r):null,td=today();

// 単語帳からの手動の登録。苦手＝誤答2回ぶん・段階0（翌日に出る）。習得済み＝段階3（7日後に出る。すでに3以上ならそのまま）
function setStatus(it,st){sync();const o=store.prog[it.id]||{c:0,x:0,s:0,t:0},td=today();

function countOf(list){const c={new:0,learning:0,weak:0,ok:0,total:0};list.forEach(it=>{c[status(it)]++;c.total++;});return c;}
function counts(subj){return countOf(DATA[subj]);}
function streak(){let n=0;const d=new Date();if(!store.days[today(d)])d.setDate(d.getDate()-1);while(store.days[today(d)]){n++;d.setDate(d.getDate()-1);}return n;}

/* ---- state ---- */
// list.shown … 単語帳に出す語数（PAGE 語ずつ「さらに表示」で増やす）   leave … 学習の途中で離れようとしたときの確認（確認のあとに行う操作）
// resume … 前回の途中のセッション（読み込み直後に「続きから」を出す）
const PAGE=200;
const S={subj:store.prefs.subj||'kobun',tab:'home',session:null,list:{q:'',st:'all',lv:'all',open:null,shown:PAGE},confirm:false,msg:'',zero:false,dm:false,leave:null,resume:null,howto:null,edit:null,edConfirm:false,resOpen:null};
const prefsOf=()=>Object.assign({range:'auto',count:'20',order:'smart',rel:'no',from:'',to:''},isObj(store.prefs[S.subj])?store.prefs[S.subj]:{});
function setPref(k,v){store.prefs[S.subj]=Object.assign(prefsOf(),{[k]:v});save();}
// 古文330の章 lv の番号の範囲 [最初, 最後]（文字列）。章は番号と1対1（2章＝No.51〜150）
function chapRange(lv){const a=(DATA.book||[]).filter(it=>it.lv===lv).map(it=>it.num);return a.length?[String(Math.min(...a)),String(Math.max(...a))]:null;}
// 古文330で出題範囲を変えたとき: 章を選んだら番号欄にその章の範囲を入れる（章と番号が食い違って0語にならないように）。
// 章の選択をやめたら、章から入った番号だけ消す（手で入れた番号は残す）
function chapSync(prev,now){if(!SUBJ[S.subj].book)return false;const p=prefsOf(),lv=r=>/^lv\d+$/.test(r)?chapRange(+r.slice(2)):null,a=lv(prev),b=lv(now);

  if(a&&p.from===a[0]&&p.to===a[1]){setPref('from','');setPref('to','');return true;}
  return false;}

/* ---- session ---- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(subj,range){let all=DATA[subj];
  if(SUBJ[subj].book){const p=prefsOf();if(p.rel==='with')all=all.concat(BOOKREL);else if(p.rel==='only')all=BOOKREL.slice();
    const a=parseInt(p.from)||1,b=parseInt(p.to)||330;all=all.filter(it=>it.num>=a&&it.num<=b);}
  if(range==='auto'||range==='all')return all.slice();
  if(range==='new')return all.filter(it=>status(it)==='new');
  if(range==='weak')return all.filter(it=>status(it)==='weak');
  if(range==='notok')return all.filter(it=>status(it)!=='ok');
  if(/^lv\d+$/.test(range))return all.filter(it=>it.lv===+range.slice(2));
  if(range.startsWith('tag:')){const t=range.slice(4);return all.filter(it=>it.tags.includes(t));}
  return all.slice();}
function order(items,mode){
  if(mode==='index')return items[0]&&items[0].num?items.slice().sort((a,b)=>a.num-b.num||(a.isRel?1:0)-(b.isRel?1:0)):items;
  return shuffle(items);}
// 出題の優先: 0 期限が来た復習 → 1 苦手 → 2 学習中 → 3 未学習 → 4 習得（期限が来ていない）
function prio(it){const r=store.prog[it.id];if(!r)return 3;if(sched(r).d<=today())return 0;const s=status(it);return s==='weak'?1:s==='learning'?2:4;}
// items から n 語を、復習と新出に配分して選ぶ。{rev:復習, fresh:新出, rest:習得（期限前）で埋めた分, due:期限が来ている語の数}
//   復習 … 期限が来た語（期限の古い順）→ 苦手 → 学習中（どちらも答えてから日がたった順）。dueOnly なら期限が来た語だけ
//   新出 … 未学習の語。全体の NEW_SHARE（4割）を新出に取っておき、復習が足りなければ新出で、新出が足りなければ復習で埋める
//   keep … 同じ組の中の順を items の並びのままにする（収録順の出題）。指定しなければ、同じ条件の語は無作為の順

//   ・読みの末尾のかっこ書き（藤原定家＝ふじわらのさだいえ（ていか））は別の読み。最後の「の」より後ろを入れ替えた形（ふじわらのていか）を正解にする

  const each=s=>{const ps=s.split('・');if(ps.length>1&&ps.length!==nw)ps.forEach(x=>add(x));else add(s);};
  for(const s0 of [it.rd||it.m[0],it.alt]){if(!s0)continue;const s=String(s0),m=YPAR.exec(s);

  for(const t of it.m.concat(it.note||''))for(const m of String(t).matchAll(/「([ぁ-ゖー]+)」とも/g))add(m[1],true);

const yomiOk=(it,ans)=>{const a=normY(ans);return !!a&&readings(it).ok.has(a);};
/* ---- 4択の選択肢と設問文 ---- */
// 1枚に複数の語と意味が並ぶ項目（「よし＝良い／よろし＝…」「［行幸］…／［行啓］…」）。見出し語ごとに意味を分けて書いてあり、4択では答えが見えるので、
// 4択（両方向）と空所補充には出さない（フラッシュカードと単語帳には出す）
const isMulti=it=>{const ws=String(it.w).split('・'),ks=String(it.k||'').split('・').filter(Boolean);
  return ws.length>1&&it.m.length>1&&it.m.every(m=>ws.some(w=>m.startsWith(w+'＝'))||ks.some(k=>m.startsWith('［'+k+'］')));};
// その出題モードに出せる語か
function askable(it,mode){if(mode==='flash')return true;if(mode==='typeY')return !!it.rd&&/[一-龠々]/.test(it.w);
  return !isMulti(it)&&(!mode.startsWith('cloze')||canCloze(it));}
// 見出し語の表記を語に分ける。全角かっこの添え書き（む（ん）、こころ（を）やる）は、外した形・入れた形・中身（末尾のとき）のどれも語として扱う
const PAR=/[（(][^（）()]*[）)]/g;

const LET='ぁ-ゖァ-ヺー一-龠々A-Za-z0-9',HIDE=new WeakMap();
function masker(forms,any1){const long=forms.filter(x=>x.length>1).sort((a,b)=>b.length-a.length),re=long.length?new RegExp(long.map(reEsc).join('|'),'g'):null;

function hideForms(it){let h=HIDE.get(it);if(h)return h;
  if(it.id.startsWith('e:')){const re=new RegExp('\\b'+reEsc(it.w)+'\\w*','ig');h={en:true,w:s=>s.replace(re,'＿＿'),k:s=>s};}
  else{let ws=wordForms(it.w,/[・〜]/);if(String(it.w).includes('〜'))ws=ws.filter(x=>x.length>1||!KANA_RE.test(x));
    const jk=/^(k|b|br):/.test(it.id),ks=jk?String(it.k||'').replace(/[〔〕]/g,'').split('・').filter(x=>x&&!ws.includes(x)):[];
    // かっこ書きの中だけは、活用形（あいなく、なのめなら）も伏せる。地の文は訳語（聞こえる、申し上げる）まで消えるので、活用形では伏せない
    const infl=jk?[...new Set(formsOf(it).map(f=>f.s))].filter(x=>x.length>1&&!ws.includes(x)&&!ks.includes(x)):[];
    h={en:false,w:masker(ws,true),k:masker(ks,false),kp:masker(ks.concat(infl),false)};}

// 意味の文 m の中の、項目 it の見出し語を「＿＿」にする。withK: 地の文の漢字表記も伏せる（語→意味の選択肢。設問に漢字表記が出ているため）。
// 英語は、英字を含むかっこ書き（(be absorbed in)）を取り除く。古文は、かっこ書きの中の漢字表記と活用形も伏せ、中身が伏せ字だけになったかっこ書き（(異なり)）は取り除く
function maskM(it,m,withK){const h=hideForms(it);
  if(h.en)m=h.w(m.replace(/[（(][^）)]*[A-Za-z][^）)]*[）)]/g,''));

// 文 t に、項目 it の見出し語（と漢字表記）が出ているか
const mentions=(it,t)=>{const h=hideForms(it);return h.w(t)!==t||h.k(t)!==t;};
// 伏せたあとに何も残らない文か
const blankM=s=>!s.replace(/＿＿/g,'').replace(/[\s・／〜～~。、（）()「」]/g,'');
// 意味→語の設問文（意味ごと）。選択肢がかなの語なので、地の文の漢字表記（徒歩、難しい）は伏せない
function hideWord(it){const r=it.m.map(m=>maskM(it,m,false)).filter(s=>!blankM(s));return r.length?r:it.m.slice();}
// 意味の重なりの判定に使う訳語の集合: かっこ書きを除き、「・」「／」で区切る。「〜を」「〜に」などの前置きと「〜」は外して比べる（「〜を非難する」と「非難する」は同じ）
const GPAR=/[（(［【〔][^（）()［］【】〔〕]*[）)］】〕]/g,GL=new WeakMap();
function glossSet(ms){const o=new Set();

    for(const t of m.split(/[・／\/]/)){const g=t.replace(/※.*$/,'').replace(/^[〜～~]+(?:から|[をにがとへでの])?/,'').replace(/[〜～~\s]/g,'');if(g)o.add(g);}}
  return o;}
const glossAll=it=>{let g=GL.get(it);if(!g)GL.set(it,g=glossSet(it.m));return g;};
// 語→意味の選択肢に出す意味: 先頭から2つ（ms＝元の文、t＝見出し語を伏せた表示、g＝重なりの判定用）。伏せると何も残らない意味（あした＝朝 の「朝」）は飛ばす。
// どの意味も残らない語（かち＝徒歩。意味が漢字表記そのもの）は bare。元の意味のまま出し、代わりに設問の漢字表記を回答まで出さない（qKanji）
const CM=new WeakMap();
function choiceM(x){let c=CM.get(x);if(c)return c;
  const on=x.m.map(m=>({m,t:maskM(x,m,true)})).filter(o=>!blankM(o.t)).slice(0,2),bare=!on.length,ms=bare?x.m.slice(0,2):on.map(o=>o.m);

  let tl=bare?ms.map(m=>maskM(x,m,false)).filter(s=>!blankM(s)):on.map(o=>o.t);if(!tl.length)tl=ms.slice();

function choiceText(x,toM){return toM?choiceM(x).t:x.w;}
// 語→意味の設問に出す漢字表記（出さないときは空）
const qKanji=it=>it.k&&!choiceM(it).bare?it.k:'';
// 品詞の大分類の一覧（1つ目が主な品詞）。古文は「動カ四・下二」→動、「副・形動ナリ」→副・形動。英語は品詞表記を「・」で分ける。
// 文法は「格助詞」「係助詞」などをまとめて助詞とし、助動詞・動詞の活用などはそのまま。古文常識・文学史・和歌は分類（時刻・方角、作品・作者、枕詞・掛詞 など）をそのまま使う。
// 文学史の作品は、ジャンルの系統が同じ作品を先にする。系統は、説明の「〜時代（n世紀）の歌物語」のジャンル名の末尾の字（歌物語・軍記物語は「語」、勅撰集・俳諧集は「集」、日記は「記」）。
// 書名の「物語」「日記」「集」だけで正答が決まらないようにするため
const PC=new WeakMap();
function posCls(it){let c=PC.get(it);if(c)return c;const pos=String(it.pos);
  if(/^(k|b|br):/.test(it.id)){c=[];let cur='';for(const t of pos.split('・')){const m=/^(形動|動|形|名|副|連語|連体|感動|接)/.exec(t);if(m)cur=m[1];if(cur&&!c.includes(cur))c.push(cur);}if(!c.length)c=[pos];}
  else if(it.id.startsWith('e:'))c=pos.split('・');
  else{c=[/助詞$/.test(pos)?'助詞':pos];const g=pos==='作品'&&/時代（[^）]*）の([^。]+)/.exec(it.m[0]||'');if(g)c.unshift(pos+'／'+g[1].slice(-1));}
  PC.set(it,c);return c;}
// 説明の文の集合: 意味を「。」で区切る（かっこ書きはそのまま比べる。文学史の「平安時代（11世紀）の物語。紫式部」→ 2文）
const SENT=new WeakMap(),sentSet=ms=>{const o=new Set();for(const m of ms)for(const t of m.split('。')){const g=t.replace(/\s/g,'');if(g)o.add(g);}return o;};
const sentAll=it=>{let s=SENT.get(it);if(!s)SENT.set(it,s=sentSet(it.m));return s;};
// 4択の選択肢（正解＋誤答3つ）を作る。mode が quiz（語→意味）なら選択肢は意味、それ以外（意味→語・空所補充）は語。
// 誤答にしない語:
//   ・正解と同じ語（併記のどれかが同じ。が と が・の、同じ語形の たまふ）、1枚に複数の語が並ぶ項目
//   ・正解と意味が重なる語（訳語が1つでも同じ）。語→意味は選択肢に出す意味を、それ以外はすべての意味を、正解のすべての意味と比べる
//   ・説明がまるごと当てはまる語。語→意味は、選択肢の文がすべて正解の語の説明にもある語（源氏物語に対する「平安時代（11世紀）の物語」）。
//     それ以外は、設問文（正解の語の説明）がすべてその語の説明にもある語（「平安時代（11世紀）の物語」に対する源氏物語）
//   ・語→意味で、選択肢の文に正解の見出し語が出る語。選択肢の表示がほかと同じになる語、訳がほかの誤答とまったく同じ語（む と むず を両方は出さない）
// 誤答の順: 正解と同じ品詞の大分類（主な品詞が同じ → 品詞が1つでも同じ → ほか）を先に、その中ではレベル・章・区分が近い語を先に選ぶ。同じ品詞で足りないときだけ、次の語で補う。
// 古文の動詞は、主な品詞が同じ語の中でも、語尾の字（＝活用の行）が同じ語を先にする。意味→語と空所補充は設問に「動カ四」のように行を出すので、
// 語尾が正答だけ違うと、意味を知らなくても選べるため
const ALT=new WeakMap(),wordAlts=it=>{let a=ALT.get(it);if(!a)ALT.set(it,a=wordForms(String(it.w).toLowerCase(),'・'));return a;};

  const by=new Map();for(const x of DATA[subj]){if(x.id===it.id)continue;const r=rank(x);if(!by.has(r))by.set(r,[]);by.get(r).push(x);}
  // 順位の高い組から、組の中は無作為の順に、誤答にできる語を3つ選ぶ（できるかどうかは、選ぶ段になってから確かめる）

  return shuffle([it,...picks]);}
// 読み上げ用の知らせ（画面には出さない）。画面全体を読み上げ対象にする代わりに、正誤などの短い文だけを伝える
function say(t){const l=$('#live');if(l)l.textContent=t||'';}
// 間違えた語は、同じセットの3〜5問あとにもう一度出す（残りが少なければ最後）。1語につき REASK 回まで。
// 出題の列（sess.items）に差し込むので、問題数の表示・進み具合・中断からの再開は、差し込んだ後の列で数える。差し戻しの回答も1回の回答として記録する
const REASK=2;
const isAgain=sess=>sess.items.indexOf(sess.items[sess.i])<sess.i;
function answer(ok){const sess=S.session,it=sess.items[sess.i],m=sess.mode;record(it,ok);sess.res.push({it,ok});S.leave=null;
  if(!ok&&sess.items.filter(x=>x===it).length<=REASK)sess.items.splice(Math.min(sess.items.length,sess.i+3+Math.floor(Math.random()*3)),0,it);
  saveSess();

function next(){const sess=S.session;S.leave=null;S.edit=null;sess.i++;sess.flipped=false;sess.picked=null;sess.choices=null;sess.typedAns='';say('');render();const a=$('#ans');if(a)a.focus();}
// フラッシュカードをめくる。めくった直後（GUARD ミリ秒）は「まだ／覚えた」を受け付けない（「答えを見る」と同じ位置に出るので、2回押しで記録されないように）
const GUARD=300;
function flip(){const sess=S.session;if(!sess||sess.mode!=='flash'||sess.flipped||sess.i>=sess.items.length)return;sess.flipped=true;sess.flipAt=Date.now();render();}
const canJudge=sess=>sess.flipped&&Date.now()-(sess.flipAt||0)>=GUARD;

/* ---- rendering ---- */
function render(){
  const root=document.documentElement,studying=unfinished();
  root.setAttribute('data-subj',baseOf(S.subj));
  // 学習中（出題の途中）はヘッダーとタブを隠す（CSS の .studying）。結果画面では戻す
  root.classList.toggle('studying',studying);
  const grp=groupOf(S.subj);
  document.querySelectorAll('.switch [data-group]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.group===grp)));
  const subs=GROUPS.find(g=>g.key===grp).subs.filter(k=>SUBJ[k]);
  $('.subtabs').innerHTML=subs.map(k=>`<button role="tab" data-subj="${k}" aria-selected="${k===S.subj}">${esc(SUBLABEL[k]||SUBJ[k].name)}<span class="n">${DATA[k].length}</span></button>`).join('');
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  const v=$('#view');v.setAttribute('aria-labelledby','tab-'+S.tab);
  if(!studying)S.leave=null;
  if(S.session){v.innerHTML=(S.leave?leaveHtml():'')+(S.session.i>=S.session.items.length?viewResult():(S.session.mode==='flash'?viewFlash():S.session.mode.startsWith('cloze')?viewCloze():S.session.mode==='typeY'?viewTypeY():viewQuiz()));}
  else if(S.tab==='home')v.innerHTML=viewHome();
  else if(S.tab==='list')v.innerHTML=viewList();
  else v.innerHTML=viewStats();
  const vk=S.subj+'|'+S.tab+'|'+(S.session?'s'+S.session.i:''),moved=vk!==render.vk;
  if(moved){render.vk=vk;try{window.scrollTo({top:0});}catch(e){}}
  if(studying){const sess=S.session,q=sess.i;
    // 問題が変わったときだけ、進捗バーを前の幅から動かし、カードに入りの動きを付ける（毎回付けると、選ぶたびに問題カードが動く）
    if(moved){const bar=$('.prog .track i'),c=$('.card');if(c)c.classList.add('in');
      if(bar&&render.pq===q-1){const w=bar.style.width;bar.style.width=((q-1)/sess.items.length*100)+'%';bar.getBoundingClientRect();bar.style.width=w;}}
    render.pq=q;
    // めくった直後は判定ボタンを押せなくしてあるので、時間がたったら押せるようにする
    const lock=[...document.querySelectorAll('[data-ans][disabled]')];
    if(lock.length)setTimeout(()=>lock.forEach(b=>{b.disabled=false;}),Math.max(0,GUARD-(Date.now()-(sess.flipAt||0))));
    // 次に操作する所へフォーカスを移す（描き直すたびに body へ戻らないように）。画面は送らない（解説を飛ばして下まで送られないように）
    const a=$('#ans'),f=a&&sess.picked===null?a:sess.picked!==null?$('[data-next]'):(moved||sess.flipped)&&!S.leave?$('.card'):null;
    if(f)try{f.focus({preventScroll:f!==a});}catch(e){}
  }else render.pq=null;
  showSub();
}
// 選択中の教材タブが横スクロールの外に隠れていたら、タブの列だけを横に送って中央に出す（ページの縦位置は動かさない）
function showSub(){const st=$('.subtabs'),b=st.querySelector('[aria-selected="true"]');if(!b)return;
  const r=b.getBoundingClientRect(),c=st.getBoundingClientRect();if(r.left<c.left||r.right>c.right)st.scrollLeft+=r.left-c.left-(c.width-r.width)/2;}
function leaveHtml(){return `<div class="confirm" role="alert" style="margin:0 0 14px"><span>学習を中断しますか？ ここまでの回答は記録されています。</span><button class="btn bad sm" data-leave="yes">中断する</button><button class="btn ghost sm" data-leave="no">続ける</button></div>`;}
function resumeHtml(){const r=S.resume,n=r.items.length;
  return `<section class="panel"><h2>前回の続き <span class="sub">${esc(SUBJ[r.subj].name)}・${MODES[r.mode]}（全${n}問）</span></h2><div class="confirm" style="margin-top:0"><span>学習が途中で止まっています。</span><button class="btn acc sm" data-resume="yes">続きから（${r.res.length+1}問目）</button><button class="btn ghost sm" data-resume="no">やめる</button></div></section>`;}
// 英語の語・例文には lang="en" を付ける（読み上げの発音と、英字の書体の選び方のため）
const enAttr=()=>isEn()?' lang="en"':'';
// 見出し語。--n は字数（カードの表面で、語の大きさを字数に合わせるのに使う）
function wordHtml(it,cls,k=it.k){const c=SUBJ[S.subj].cls;return `<p class="word ${c}${cls||''}"${enAttr()} style="--n:${[...String(it.w)].length}">${esc(it.w)}</p>${k?`<div class="kanji">${esc(k)}</div>`:''}`;}
// 進捗行。学習中はヘッダーを隠すので、これが画面の先頭になる。正誤の数は、色に加えて記号でも示す
function progHtml(sess){const n=sess.items.length,ok=sess.res.filter(r=>r.ok).length,ng=sess.res.length-ok;
  return `<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div>${sess.res.length?`<span class="tally" aria-label="正解 ${ok}、不正解 ${ng}"><span class="o">◯${ok}</span> <span class="x">✕${ng}</span></span>`:''}<button data-quit>中断</button></div>${isAgain(sess)?'<p class="again">さっき間違えた語をもう一度</p>':''}`;}
// 解答後の下端の帯: 正誤（text は .verdict の中身の HTML）と「次へ」
function bandHtml(ok,text,clamp){return `<div class="actions band"><div class="verdict ${ok?'ok':'ng'}${clamp?' clamp':''}">${text}</div><button class="btn acc" data-next>次へ<small class="kbd" aria-hidden="true">Enter</small></button></div>`;}
// 意味の並びを、意味ごとの塊（.mm）にして「／」でつなぐ。塊の途中では折り返さない（区切りの「／」「・」は前の塊に付ける）。文字は ms.join('／') と同じ
// 1行に入らない長い塊は、中の「・」の区切り（.mp）で折り返す
const mmHtml=ms=>ms.map((m,j)=>{const ps=String(m).split('・');return `<span class="mm">${ps.map((x,i)=>`<span class="mp">${esc(x)}${i<ps.length-1?'・':j<ms.length-1?'／':''}</span>`).join('')}</span>`;}).join('');
// 選択肢の番号。解答後は、正答を「✓」、選んだ誤答を「✕」に替え、読み上げ用の文字を添える
function choiceHtml(i,state,inner){const mark=state==='correct'?'✓':state==='wrong'?'✕':i+1,sr=state==='correct'?'<span class="sr">正答</span>':state==='wrong'?'<span class="sr">あなたの答え</span>':'';
  return `<button class="choice${state?' '+state:''}" data-pick="${i}"${state?' disabled':''}><span class="n">${mark}</span>${inner}${sr}</button>`;}
function chipsHtml(it){return `<div class="chips">${it.num?`<span class="chip num">No.${it.num}${it.isRel?' 関連':''}</span>`:''}<span class="chip acc">${esc(it.pos)}</span><span class="chip lv">${esc(lvName(it))}</span>${it.tags.filter(t=>t!==lvName(it)).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`;}

const FIGS={
 clock(it){const E=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'],C=160,pt=(a,r)=>[C+r*Math.sin(a*Math.PI/180),C-r*Math.cos(a*Math.PI/180)];

 moon(it){const M=[[1,'朔日'],[3,'三日月'],[7,'七日'],[10,'十日余り'],[13,'十三夜'],[15,'望月'],[16,'十六夜'],[17,'立ち待ち'],[18,'居待ち'],[19,'寝待ち'],[20,'更け待ち'],[22,'二十日余り'],[29,'晦日']];
  const key={'朔日':[1],'三日月':[3],'十三夜の月':[13],'望月':[15],'十六夜の月':[16],'立ち待ちの月':[17],'居待ちの月':[18],'寝待ちの月':[19],'更け待ちの月':[20],'二十日余りの月':[22],'晦日':[29],'夕月夜':[3,7,10,13,15],'有明の月':[16,17,18,19,20,22]}[it.w]||[];
  let g='';M.forEach(([d,n],i)=>{const cx=30+(i%7)*46,cy=30+Math.floor(i/7)*74,r=15,th=2*Math.PI*d/29.53,k=(1-Math.cos(th))/2,wax=d<14.77,rx=Math.abs(r*Math.cos(th)).toFixed(1),on=key.includes(d);

  return `<svg viewBox="0 0 330 152" role="img" aria-label="月の満ち欠けと呼び名">${g}</svg><div class="cap">旧暦は月の満ち欠けで日付が決まる。十五日が満月。十六日以後、夜明けに残る月が有明の月。</div>`;},
 kani(it){const R=[['一位','太政大臣','上達部'],['二位','左大臣・右大臣・内大臣','上達部'],['三位','大納言・中納言・参議','上達部'],['四位','参議・弁','参議は上達部、ほかは殿上人'],['五位','弁・蔵人・守（大国）','弁・蔵人は殿上人（選ばれた人）、守は地下'],['六位','蔵人・守（小国）','蔵人だけ殿上人、ほかは地下'],['七位以下','','地下']];
  const m=x=>it.w&&it.w.length>1?x.split(it.w).join('<mark>'+it.w+'</mark>'):x;

 kyo(it){const on=n=>it.w===n||(it.w==='山'&&n==='比叡山'),hl=n=>on(n)?'font-weight="700" style="fill:var(--accent)"':'';
  // 京の外の地名: [名前, 文字のx, y, 字の大きさ, 印のx, y]。印は位置を示す点（強調する地名だけ科目の色）

  <text x="30" y="238" text-anchor="middle" font-size="11" font-weight="700">北 ↑</text></svg><div class="cap">天皇が内裏で南を向くと東が左になるので、東半分が左京、西半分が右京。鳥辺野・化野は葬送の地。</div>`;},

// 文学史: 成立年の根拠・注意点・確実性
const CONF={'高':['hi','記録あり'],'中':['mid','諸説あり'],'低':['lo','推定']};
function seiHtml(s){const c=CONF[s.conf]||CONF['中'];
  return `<div class="sei"><div class="sei-h"><b>成立</b><span class="sei-y">${esc(s.y)}</span><span class="conf ${c[0]}">確実性：${esc(s.conf)}（${c[1]}）</span></div>
  <div class="sei-s">根拠</div><ul>${s.basis.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  ${s.caveat?`<div class="sei-s">注意点</div><p>${esc(s.caveat)}</p>`:''}
  ${/\?/.test(s.book||'')?`<p class="sei-b">本の年表の「${esc(s.book)}」の「?」は、成立年に諸説があることを示します。</p>`:''}</div>`;}
// 用例の中の見出し語（空所補充で空所にする部分）を強調する。見つからない用例（「〜」「・」のある見出し語、活用形が見つからない文）はそのまま出す
function exHtml(it,sent){const f=/^(k|b|e):/.test(it.id)?findForm(it,sent):null;return f?esc(f.pre)+'<b class="hit">'+esc(f.hit)+'</b>'+esc(f.post):esc(sent);}
// 利用者が意味を編集していれば、その意味を出す（「編集済み」の印と、元の意味を確かめる折りたたみを添える）。意味ごとの用例は元の意味に対応するものなので、
// 編集した意味には付けず、下にまとめて出す。メモは意味の下。利用者の文字は必ず esc() を通す
function detailHtml(it){const c=SUBJ[S.subj].cls,en=enAttr(),ed=editOf(it.id),em=ed&&ed.m,ms=em||it.m;
  const per=!em&&it.exs&&it.exs.length===it.m.length;

  // 説明文の意味（古文常識・文学史の項目、1つだけで20字以上の意味）は、訳語と同じ太字にせず細字の本文にする。文法・和歌の短い意味は太字のまま
  const desc=/^(j|bungaku):/.test(it.id)||(ms.length===1&&[...ms[0]].length>=20);
  return `<ol class="means${per?' per':''}${desc?' desc':''}">${ms.map((m,i)=>`<li><span>${desc?esc(m):mmHtml([m])}${per?`<span class="ex sm"><span class="q ${c}"${en}>${exHtml(it,it.exs[i][0])}</span><span class="tr">${esc(it.exs[i][1])}</span></span>`:''}</span></li>`).join('')}</ol>
  ${ed?`<div class="edmark" data-edmark><span class="edb">編集済み</span>${em?`<details class="orig"><summary>元の意味を見る</summary><ol class="means desc">${it.m.map(m=>`<li><span>${esc(m)}</span></li>`).join('')}</ol></details>`:''}</div>`:''}
  ${ed&&ed.n?`<div class="note memo" data-memo><b>メモ</b>${esc(ed.n)}</div>`:''}
  ${exl.map(e=>`<div class="ex"><div class="q ${c}"${en}>${exHtml(it,e[0])}</div><div class="tr">${esc(e[1])}</div></div>`).join('')}
  ${it.rd&&!it.yomi?`<div class="der"><b>読み</b>${esc(it.rd)}${it.alt&&it.alt!==it.rd?'（歴史的仮名遣い：'+esc(it.alt)+'）':''}</div>`:''}

  ${it.img&&typeof JOSHIKI_IMG!=='undefined'&&JOSHIKI_IMG[it.img]?`<figure class="ill"><img src="${JOSHIKI_IMG[it.img]}" alt="${esc(it.w)}の挿絵"></figure>`:''}

// 意味・メモの編集。「編集」を押すと、その場に編集欄が開く（S.edit＝{id, revert:元に戻す確認中, msg:保存できなかった知らせ}）。
// 意味は1行に1つ。空にして保存すると編集を消す（元の表示に戻る）。元の意味と同じ内容なら、意味の編集としては残さない
function editHtml(it){const ed=editOf(it.id),E=S.edit&&S.edit.id===it.id?S.edit:null,id=esc(it.id);
  if(!E)return `<div class="edrow"><button type="button" class="btn ghost sm" data-edit="${id}">意味・メモを編集</button></div>`;
  if(E.revert)return `<div class="confirm" role="alert" data-edconfirm><span>編集した意味とメモを消して、元の意味に戻します。</span><button type="button" class="btn bad sm" data-ed="revert-yes">元に戻す</button><button type="button" class="btn ghost sm" data-ed="revert-no">やめる</button></div>`;
  const ms=ed&&ed.m||it.m;
  return `<form class="edbox" data-edform="${id}"><label for="ed-m">意味（1行に1つ。書き換えたり、行を足したりできます）</label><textarea id="ed-m" maxlength="${EDMAX}" rows="${Math.min(8,Math.max(2,ms.length+1))}">${esc(ms.join('\n'))}</textarea>

    <p class="hint" style="margin:8px 0 0">この端末のブラウザに保存されます。4択の選択肢と正誤の判定は、元の意味のままです。</p></form>`;}
// 編集欄の開け閉めのあとの描き直し。focus: 編集欄を開いたら意味の欄へ、閉じたら「編集」のボタンへ（キーボードで続けて操作できるように）
function reEdit(id){if(!S.session&&S.tab==='list')renderList();else redraw();

// 編集欄の内容を保存する
function saveEdit(it){const lines=$('#ed-m').value.split('\n').map(x=>x.trim()).filter(Boolean),n=$('#ed-n').value.trim().slice(0,EDMAX);
  while(lines.length&&lines.join('\n').length>EDMAX)lines.pop();
  const same=lines.length===it.m.length&&lines.every((x,i)=>x===it.m[i]),o={};if(lines.length&&!same)o.m=lines;if(n)o.n=n;
  if(setEdit(it.id,o)){S.edit=null;reEdit(it.id);}else{S.edit.msg='保存できませんでした。端末の空き容量が足りないか、プライベートブラウズで開いている可能性があります。';reEdit();}}
// 本の番号（古文330・読み）。紙の本で引けるように、結果と苦手ワードの一覧に出す
const numLab=it=>it.num?'No.'+it.num:'';

// その教材の出題モードの一覧 [[キー, 名前], …]。並び: カード／4択 語→意味／4択 意味→語／空所 4択／空所 記述／読み入力
function modesOf(){const sj=SUBJ[S.subj],typeY=sj.yomi||(sj.joshiki&&DATA[S.subj].some(it=>it.rd&&/[一-龠々]/.test(it.w)));
  return [['flash','フラッシュカード'],['quiz','4択：'+(sj.yomi?'漢字 → 読み':isEn()?'単語 → 意味':'語 → 意味')],['quizR','4択：'+(sj.yomi?'読み → 漢字':isEn()?'意味 → 単語':'意味 → 語')]]
    .concat(sj.yomi||sj.noCloze?[]:[['cloze','空所補充：4択'],['clozeT','空所補充：記述']],typeY?[['typeY','読みを入力']]:[]);}
// 次に出す日の言い方（今日・明日・n日後）
const dueLab=d=>{const n=dayDiff(d,today());return n<=0?'今日':n===1?'明日':n+'日後';};
// 1日の目標（回答数）。全教材で共通
const GOALS=[10,20,30,50,100],goalOf=()=>GOALS.includes(+store.prefs.goal)?+store.prefs.goal:30;
// ホーム最上部の「今日の学習」: 1日の目標と達成度、期限が来た復習と新出を配分した1セットを始めるボタン
function todayHtml(){const tp=todayPlan(),r=tp.rev.length,f=tp.fresh.length,t=store.days[today()]||0,g=goalOf(),done=t>=g,mode=todayMode();
  let nextDue='';if(!r&&!f){const ds=pool(S.subj,'auto').map(schedOf).filter(Boolean).map(s=>s.d).sort();if(ds.length)nextDue='次の復習は'+dueLab(ds[0])+'です。';}
  return `<section class="panel tbox" data-today><h2>今日の学習 <span class="sub">${esc(SUBJ[S.subj].name)}</span></h2>
    <div class="goal${done?' done':''}" data-goal role="img" aria-label="今日の回答 ${t}問。目標 ${g}問${done?'を達成':''}"><div class="track"><i style="width:${Math.min(100,t/g*100)}%"></i></div><span class="num"><b>${t}</b> / ${g} 問</span>${done?'<span class="gdone">達成</span>':''}</div>
    ${r+f?`<button class="btn acc tstart" data-start-today>今日の学習を始める<small>（復習 ${r}語＋新出 ${f}語）</small></button>`
      :`<p class="tnone">今日の復習と新しい語は、もうありません。${nextDue}下の出題モードから、自由に練習できます。</p>`}
    <p class="hint tsub">${tp.due>r?`復習待ち ${tp.due}語・`:''}形式: ${esc(modesOf().find(x=>x[0]===mode)[1])}（出題設定で変えられます）</p></section>`;}
// 学習ホーム。上から:（今日の学習）→ 今日の行 → 進捗バーと凡例 →（一覧表への近道）→ 出題モード → 出題設定 → 一覧表 → 使い方・案内。
// 開いてすぐ始められるよう、出題モードを設定より上に置く。並べ替えは CSS ではなく、ここの出力順で行う
function viewHome(){const sj=SUBJ[S.subj],c=counts(S.subj),p=prefsOf(),t=store.days[today()]||0,sk=streak();

  const pct=k=>c.total?(c[k]/c.total*100):0;
  const sel=(v)=>p.range===v?' selected':'';
  const lvOpts=sj.fixLv?'':Object.keys(sj.lv).map(l=>`<option value="lv${l}"${sel('lv'+l)}>${lvKind(S.subj)==='レベル'?'レベル'+l+': ':''}${esc(sj.lvd[l])}</option>`).join('');
  const tagOpts=TAGS[S.subj].map(t=>`<option value="tag:${esc(t)}"${p.range==='tag:'+t?' selected':''}>${esc(tagLab(t))}</option>`).join('');
  const tagKind=TAGS[S.subj].every(t=>TAGLAB[t])?'本の印':TAGS[S.subj].some(t=>TAGLAB[t])?'分野・本の印':'分野';
  const fresh=!Object.keys(store.prog).length;
  // 直近7日の印（回答した日は塗り。右端が今日）
  const week=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);week.push(store.days[today(d)]?'<i class="on"></i>':'<i></i>');}
  const tables=(sj.tables||[]).filter(t=>t.html);
  const modes=modesOf().map(([k,t])=>[k,t,k.startsWith('cloze')?czn:'']),tm=todayMode(),g=goalOf();
  return `${S.resume?resumeHtml():''}${fresh?firstHtml()+howtoHtml(true):''}${todayHtml()}
  <div class="today"><span>今日の回答 <b class="num">${t}</b> 問</span><span>連続学習 <b class="num">${sk}</b> 日<span class="wk" aria-hidden="true">${week.join('')}</span></span><span>${esc(sj.name)}の習得率 <b class="num">${c.total?Math.round(c.ok/c.total*100):0}%</b></span><span>学習した語 <b class="num">${c.total-c.new}</b> / ${c.total}</span></div>
  <section class="tiles">
    <div class="tile"><div class="lab">収録語数</div><div class="val num">${c.total}<small>語</small></div>${relLab('total')}</div>
    <div class="tile ok"><div class="lab">習得</div><div class="val num">${c.ok}<small>語</small></div>${relLab('ok')}</div>
    <div class="tile weak"><div class="lab">苦手</div><div class="val num">${c.weak}<small>語</small></div>${relLab('weak')}</div>
    <div class="tile"><div class="lab">未学習</div><div class="val num">${c.new}<small>語</small></div>${relLab('new')}</div>
  </section>
  <div class="bar" aria-hidden="true"><i class="ok" style="width:${pct('ok')}%"></i><i class="learning" style="width:${pct('learning')}%"></i><i class="weak" style="width:${pct('weak')}%"></i></div>
  <div class="legend"${rc?' style="margin-bottom:4px"':''}><span class="ok">習得 ${c.ok}</span><span class="learning">学習中 ${c.learning}</span><span class="weak">苦手 ${c.weak}</span><span>未学習 ${c.new}</span></div>
  ${rc?`<p class="hint relsum" style="margin-bottom:14px">関連語 ${rc.total}語：習得 ${rc.ok}・学習中 ${rc.learning}・苦手 ${rc.weak}・未学習 ${rc.new}</p>`:''}
  ${tables.length?`<button type="button" class="jump" data-jump>一覧表（${tables.length}表）</button>`:''}
  ${S.zero?`<p class="zero" role="alert" data-zero>この条件に当てはまる語がありません。下の「出題設定」で範囲を変えてください。</p>`:''}
  <section class="modes${modes.length%2?' odd':''}">${modes.map(([k,t,x])=>`<button class="mode" data-start="${k}"><span class="t">${t}</span><span class="d">${modeDesc(k)}</span>${x}</button>`).join('')}</section>
  <section class="panel"><h2>出題設定 <span class="sub">科目ごとに記憶されます</span></h2>
    <div class="opts">
      <div class="opt"><label for="o-range">出題範囲</label><select id="o-range" data-pref="range">
        <optgroup label="状態">
        <option value="auto"${sel('auto')}>おまかせ（復習・苦手を優先）</option>
        <option value="notok"${sel('notok')}>未習得のみ（苦手＋学習中＋未学習）</option>
        <option value="weak"${sel('weak')}>苦手のみ</option>
        <option value="new"${sel('new')}>未学習のみ</option>
        <option value="all"${sel('all')}>すべて</option></optgroup>
        ${lvOpts?`<optgroup label="${lvKind(S.subj)}">${lvOpts}</optgroup>`:''}
        ${tagOpts?`<optgroup label="${tagKind}">${tagOpts}</optgroup>`:''}</select></div>
      <div class="opt"><label for="o-count">問題数</label><select id="o-count" data-pref="count">
        ${['10','20','30','50','all'].map(n=>`<option value="${n}"${p.count===n?' selected':''}>${n==='all'?'全部':n+'問'}</option>`).join('')}</select></div>
      <div class="opt"><label for="o-order">出題順</label><select id="o-order" data-pref="order">
        <option value="smart"${p.order==='smart'?' selected':''}>復習→苦手→学習中→未学習</option>
        <option value="random"${p.order==='random'?' selected':''}>ランダム</option>
        <option value="index"${p.order==='index'?' selected':''}>収録順</option></select></div>
    </div>
    ${sj.book?`<div class="opts">
      <div class="opt"><label for="o-from">番号（から）</label><input type="number" id="o-from" data-pref="from" min="1" max="330" inputmode="numeric" placeholder="1" value="${esc(p.from)}"></div>
      <div class="opt"><label for="o-to">番号（まで）</label><input type="number" id="o-to" data-pref="to" min="1" max="330" inputmode="numeric" placeholder="330" value="${esc(p.to)}"></div>
      <div class="opt"><label for="o-rel">関連語</label><select id="o-rel" data-pref="rel"><option value="no"${p.rel==='no'?' selected':''}>見出し語のみ</option><option value="with"${p.rel==='with'?' selected':''}>関連語も出題（${BOOKREL.length}語）</option><option value="only"${p.rel==='only'?' selected':''}>関連語だけ</option></select></div></div>`:''}
    <div class="opts two">
      <div class="opt"><label for="o-tmode">「今日の学習」の形式</label><select id="o-tmode" data-pref="tmode">${modes.map(([k,t])=>`<option value="${k}"${k===tm?' selected':''}>${t}</option>`).join('')}</select></div>
      <div class="opt"><label for="o-goal">1日の目標（全教材で共通）</label><select id="o-goal" data-gpref="goal">${GOALS.map(n=>`<option value="${n}"${n===g?' selected':''}>${n}問</option>`).join('')}</select></div></div>
  </section>
  ${tables.length?`<section class="panel" id="tables" tabindex="-1"><h2>一覧表 <span class="sub">タップで開く。表は横にスクロールできます</span></h2>${tables.map(t=>`<details class="refd"><summary>${esc(t.title)}</summary><div class="tblwrap">${t.html}</div></details>`).join('')}</section>`:''}
  ${fresh?'':howtoHtml(false)}
  <p class="hint kbd">キーボード操作: Space で裏返す、← まだ ／ → 覚えた、1〜4 で選択、Enter で答え合わせ・次へ。</p>
  <div class="share"><b>このページについて</b>学習記録（習得・苦手）は、この端末のブラウザの中に保存され、他の人には見えません。別の端末へは「成績」タブのバックアップで移せます。iPhone では、Safari の共有ボタンから「ホーム画面に追加」して開くと、記録が消えにくくなります。</div>`;}
// 出題モードの説明文（科目ごと）。古文330は古文単語と同じ。無い科目・モードは古文単語の文を使う
const FLASH_D='「覚えた／まだ」を自分で判定します。';
const MODE_D={
  kobun:{flash:'語を見て意味を思い出し、めくって確認。'+FLASH_D,quiz:'読解で問われる基本形。選んだ瞬間に正誤と用例を表示します。',
    cloze:'用例の空所に入る語を4つから選ぶ。文脈で語を使う力を試します。',clozeT:'空所に入る語をひらがなで入力。活用した形でも終止形でも正解。語形まで定着させます。',
    quizR:'意味から語を引く逆方向。和歌・文法問題の語彙力に。'},
  eigo:{flash:'語を見て意味を思い出し、めくって確認。'+FLASH_D,quiz:'読解で問われる基本形。選んだ瞬間に正誤と用例を表示します。',
    cloze:'例文の空所に入る単語を4つから選ぶ。文脈で語を使う力を試します。',clozeT:'空所に入る単語を自分で入力。活用形か原形のどちらでも正解。綴りまで定着させます。',
    quizR:'意味から語を引く逆方向。作文・空所補充の語彙力に。'},
  yomi:{flash:'漢字を見て読みを思い出し、めくって確認。'+FLASH_D,quiz:'漢字の正しい読みを4つから選ぶ。選んだ瞬間に正誤と意味を表示します。',

  joshiki:{flash:'古文常識の語を見て、意味や当時の習わしを思い出し、めくって確認。'+FLASH_D,quiz:'古文常識の語の意味を4つから選ぶ。選んだ瞬間に正誤と解説を表示します。',

  bungaku:{flash:'作品名・作者名を見て、時代・ジャンル・作者などを思い出し、めくって確認。'+FLASH_D,quiz:'作品・作者について、時代・ジャンル・作者などの説明を4つから選ぶ。選んだ瞬間に正誤と解説を表示します。',
