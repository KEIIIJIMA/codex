<!doctype html><!--SKEL-->
<html lang="ja"><!--SKEL-->
<head><!--SKEL-->
<meta charset="utf-8"><!--SKEL-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--SKEL-->
<title>難関大 単語ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Source+Serif+4:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* レイアウト: 上部に科目スイッチ付きの固定ヘッダー、3タブ、760px の単一カラム。学習中は1枚のカードに集中させる */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f5f6f9; --fg:#1b1d24; --muted:#5f6573; --line:#d8dbe2;
  --accent:#9b2335; --accent-ink:#ffffff; --accent-soft:#f7e7ea;
  --ok:#2b7a4b; --ok-ink:#ffffff; --ok-soft:#e2f1e7; --bad-ink:#ffffff; --warn:#a2650a; --warn-soft:#f9ecd4; --bad:#b4372c; --bad-soft:#f9e3e0; --new:#8a90a0;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 10px 28px -14px rgba(20,24,40,.22);
  --serif-ja:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --serif-en:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
  --r:14px;
}
:root[data-subj="eigo"]{--accent:#1f4e9c;--accent-soft:#e4ebf8}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --surface:#1d2029; --surface2:#242834; --fg:#e8e9ee; --muted:#9aa0ae; --line:#303542;
    --accent:#e2808d; --accent-ink:#1a0d10; --accent-soft:#3a2229;
    --ok:#6cc48e; --ok-ink:#0d2416; --ok-soft:#1f3328; --bad-ink:#2a0f0c; --warn:#e0b25b; --warn-soft:#3a3020; --bad:#ef8a7f; --bad-soft:#3d2422; --new:#6f7585;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-subj="eigo"]{--accent:#8fb0f2;--accent-ink:#0b1630;--accent-soft:#222d46}
}
:root[data-theme="dark"]{
  --bg:#14161c; --surface:#1d2029; --surface2:#242834; --fg:#e8e9ee; --muted:#9aa0ae; --line:#303542;
  --accent:#e2808d; --accent-ink:#1a0d10; --accent-soft:#3a2229;
  --ok:#6cc48e; --ok-ink:#0d2416; --ok-soft:#1f3328; --bad-ink:#2a0f0c; --warn:#e0b25b; --warn-soft:#3a3020; --bad:#ef8a7f; --bad-soft:#3d2422; --new:#6f7585;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="dark"][data-subj="eigo"]{--accent:#8fb0f2;--accent-ink:#0b1630;--accent-soft:#222d46}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:760px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--serif-ja);font-weight:700;font-size:1.15rem;letter-spacing:.04em}
.brand .lv{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.switch{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch{flex-wrap:wrap}.switch button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.switch button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:500}
.subtabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.subtabs button .n{font-size:.72rem;margin-left:4px;opacity:.75;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:0;background:transparent;padding:12px 14px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* home */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .lab{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.tile .val{font-size:1.6rem;font-weight:700;line-height:1.2;margin-top:2px}
.tile .val small{font-size:.8rem;font-weight:400;color:var(--muted);margin-left:2px}
.tile.ok .val{color:var(--ok)}.tile.weak .val{color:var(--bad)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);margin-bottom:6px}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}.bar .learning{background:var(--warn)}.bar .weak{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:22px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--new)}
.legend .ok::before{background:var(--ok)}.legend .learning::before{background:var(--warn)}.legend .weak::before{background:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:16px}
.panel h2{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2 .sub{font-weight:400;color:var(--muted);font-size:.8rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
select,input[type=text],input[type=search],textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;box-shadow:var(--shadow)}
.mode:hover{transform:translateY(-1px);border-color:var(--accent)}
.mode .k{font-size:.72rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
.mode .t{font-size:1.05rem;font-weight:700}
.mode .d{font-size:.82rem;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);margin:0 0 12px}
.today{display:flex;gap:18px;font-size:.85rem;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}
.today b{color:var(--fg)}
.share{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:.84rem;color:var(--fg)}
.share b{display:block;margin-bottom:2px}

/* study */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:.85rem;color:var(--muted)}
.prog .track{flex:1;height:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.prog button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;min-height:340px;display:flex;flex-direction:column;justify-content:center;position:relative}
.card.flip{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.chip.lv{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.word{line-height:1.2;margin:0}
.word.ja{font-family:var(--serif-ja);font-size:clamp(2rem,7vw,2.9rem);font-weight:700;letter-spacing:.02em}
.word.en{font-family:var(--serif-en);font-size:clamp(2.1rem,7vw,3.1rem);font-weight:600;letter-spacing:-.01em}
.kanji{font-family:var(--serif-ja);color:var(--muted);font-size:1.05rem;margin-top:6px}
.tap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:.78rem;color:var(--muted)}
.back{animation:rise .22s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.back .word.ja{font-size:1.6rem}.back .word.en{font-size:1.7rem}
.means{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.means li{display:flex;gap:10px;font-size:1.05rem;font-weight:500}
.means li::before{content:counter(m);counter-increment:m;flex:none;width:1.4em;height:1.4em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem;display:grid;place-items:center;margin-top:.3em;font-weight:700}
.means{counter-reset:m}
.ex{margin:16px 0 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0}
.ex .q{font-weight:500}
.ex .q.ja{font-family:var(--serif-ja)}.ex .q.en{font-family:var(--serif-en);font-style:italic;font-size:1.02rem}
.ex .tr{color:var(--muted);font-size:.9rem;margin-top:3px}
.note{margin-top:12px;font-size:.86rem;background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:8px 12px}
.note b{color:var(--warn);margin-right:6px}
.der{margin-top:10px;font-size:.86rem;color:var(--muted)}
.sei{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.86rem;text-align:left}
.sei-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.sei-h b{color:var(--muted);font-size:.78rem;letter-spacing:.06em}
.sei-y{font-weight:700;font-size:.98rem}
.conf{margin-left:auto;font-size:.74rem;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.conf.hi{background:var(--ok-soft);color:var(--ok)}.conf.mid{background:var(--warn-soft);color:var(--warn)}.conf.lo{background:var(--bad-soft);color:var(--bad)}
.sei-s{margin-top:8px;font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.sei ul{margin:2px 0 0;padding-left:1.25em}.sei li{margin:2px 0}
.sei p{margin:2px 0 0}
.sei p.sei-b{margin-top:8px;color:var(--muted);font-size:.8rem}
.figbox{margin-top:14px;padding:10px;background:var(--surface2);border-radius:10px;overflow-x:auto}
.figbox svg{display:block;width:100%;max-width:380px;height:auto;margin:0 auto}
.figbox svg text{font-family:var(--sans);fill:var(--fg)}
.figbox table{border-collapse:collapse;font-size:.82rem;width:100%}
.figbox td,.figbox th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.figbox th{color:var(--muted);font-weight:500;white-space:nowrap}
.figbox mark{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 2px;border-radius:3px}
.figbox .cap{font-size:.75rem;color:var(--muted);margin-top:6px;text-align:center}
.ill{margin:14px 0 0}.ill img{display:block;max-width:100%;max-height:360px;margin:0 auto;border-radius:8px;border:1px solid var(--line)}
.means.per{gap:10px}.means.per li>span{min-width:0;flex:1}
.ex.sm{display:block;margin:6px 0 0;padding:7px 12px;font-weight:400;font-size:.95rem}
.ex.sm .q,.ex.sm .tr{display:block}.ex.sm .tr{font-size:.85rem}
.rel{margin-top:12px;font-size:.88rem}
.rel>b{display:block;margin-bottom:4px;font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.rel ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rel li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 10px;background:var(--surface2);border-radius:8px}
.rel .rw{font-family:var(--serif-ja);font-weight:700}.rel .rp{font-size:.72rem;color:var(--muted)}.rel .rm{flex:1 1 160px;min-width:0}
.chip.num{background:var(--fg);color:var(--bg);border-color:var(--fg);font-variant-numeric:tabular-nums}
.der b{color:var(--fg);font-weight:500;margin-right:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-weight:700;font-size:1rem;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn small{display:block;font-weight:400;font-size:.72rem;opacity:.75}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}

/* cloze */
.cloze{margin:4px 0 0;font-size:1.25rem;line-height:1.7;font-weight:500}
.cloze.en{font-family:var(--serif-en)}.cloze.ja{font-family:var(--serif-ja)}
.blank{display:inline-block;min-width:4.5em;text-align:center;border-bottom:2px solid var(--accent);color:var(--accent);padding:0 .3em;font-weight:700}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.ng{color:var(--bad);border-color:var(--bad)}
.typeform{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
@media (max-width:480px){.typeform{grid-template-columns:1fr}}
.typeform input{font-size:1.1rem;padding:12px 14px}
/* reference tables */
.refd{border-top:1px solid var(--line);padding:10px 0}
.refd:first-of-type{border-top:0;padding-top:0}
.refd summary{cursor:pointer;font-weight:700;font-size:.92rem;padding:4px 0}
.tblwrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.ref{border-collapse:collapse;font-size:.8rem;min-width:100%;white-space:nowrap}
table.ref.wide{white-space:normal;min-width:760px}
table.ref th,table.ref td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.ref tr:first-child th{background:var(--surface2);color:var(--muted);font-weight:500}
table.ref.wrap{white-space:normal}
table.ref.wrap td:nth-child(2){min-width:4.5em}
table.ref th{background:var(--surface2);font-weight:500}
table.ref b{font-family:var(--serif-ja);font-size:1rem}
table.ref tr>*:first-child{white-space:normal;min-width:4.2em;max-width:6.5em}
table.ref small{display:block;color:var(--muted);font-size:.72rem;margin-bottom:4px}
table.ref td.tr{color:var(--accent)}
table.ref td[rowspan],table.ref th[rowspan]{vertical-align:middle}
table.ref mark{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 2px;border-radius:3px}
.refimg{display:block;width:1100px;max-width:none}
.refd .cap{font-size:.75rem;color:var(--muted);margin:6px 0 0}
/* quiz */
.qprompt{font-size:.8rem;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:1rem;line-height:1.45;min-width:0;transition:border-color .12s,background .12s}
.choice .n{flex:none;width:1.6em;height:1.6em;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.choice .txt{min-width:0;overflow-wrap:anywhere}
.choice .txt.en{font-family:var(--serif-en);font-size:1.15rem}
.choice .txt.ja{font-family:var(--serif-ja);font-size:1.15rem}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--ok-soft);border-color:var(--ok)}.choice.correct .n{background:var(--ok);color:var(--ok-ink);border-color:var(--ok)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}.choice.wrong .n{background:var(--bad);color:var(--bad-ink);border-color:var(--bad)}
.choice.dim{opacity:.55}
.verdict{margin-top:16px;font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--bad)}
.detail{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;animation:rise .2s ease-out both}

/* result */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.ring{width:120px;height:120px;flex:none}
.score .big{font-size:2rem;font-weight:700;line-height:1.1}
.score .sm{color:var(--muted);font-size:.9rem}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wlist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.wlist .w{font-weight:700;font-size:1.05rem}
.wlist .w.ja{font-family:var(--serif-ja)}.wlist .w.en{font-family:var(--serif-en)}
.wlist .m{color:var(--muted);flex:1 1 200px;min-width:0}

/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vrow{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vrow>button{width:100%;border:0;background:transparent;text-align:left;padding:11px 14px;display:grid;grid-template-columns:10px minmax(0,1.1fr) minmax(0,2fr);gap:12px;align-items:center}
@media (max-width:560px){.vrow>button{grid-template-columns:10px 1fr}.vrow .vm{grid-column:2}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--new)}
.dot.ok{background:var(--ok)}.dot.learning{background:var(--warn)}.dot.weak{background:var(--bad)}
.vw{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.vw.ja{font-family:var(--serif-ja)}.vw.en{font-family:var(--serif-en)}
.vw small{font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px;font-family:var(--sans)}
.vm{color:var(--muted);font-size:.9rem;min-width:0;overflow-wrap:anywhere}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='tango-drill-v1',BAK=KEY+'-bak';
// 項目IDの移行表 [{v:連番,map:{旧ID:新ID}}]。build.js が src/migrations.json を埋め込む（この行の形は変えない）
const MIGRATIONS=/*MIGRATIONS*/[];
const VER=MIGRATIONS.reduce((n,m)=>Math.max(n,m.v),0);
const SUBJ={kobun:{name:'古文単語',cls:'ja',qw:'語',lv:{1:'必修',2:'発展'},lvd:{1:'必修（どの難関大でも必要）',2:'発展（最難関向け）'}},eigo:{name:'英単語',cls:'en',qw:'単語',lv:{1:'基礎',2:'標準',3:'発展',4:'最難関'},lvd:{1:'基礎（共通テスト・高校必修）',2:'標準（MARCH・関関同立・地方国公立）',3:'発展（早慶上智・旧帝大）',4:'最難関（東大京大・早慶上位・医学部）'}}};
if(typeof BOOK_RAW!=='undefined')SUBJ.book=Object.assign({name:'単語集',cls:'ja',qw:'語',book:true,lv:{1:'1章',2:'2章',3:'3章',4:'4章',5:'5章'},lvd:{1:'1章',2:'2章',3:'3章',4:'4章',5:'5章'}},typeof BOOK_META!=='undefined'?BOOK_META:{});
if(typeof YOMI_RAW!=='undefined')SUBJ.yomi={name:'読み',cls:'ja',qw:'漢字',yomi:true,lv:{1:'読み'},lvd:{1:'読み重要語'}};
for(const l of [1,2,3,4])SUBJ['eigo'+l]=Object.assign({},SUBJ.eigo,{name:SUBJ.eigo.lv[l],base:'eigo',fixLv:l});
if(typeof JOSHIKI_RAW!=='undefined')SUBJ.joshiki=Object.assign({name:'古文常識',cls:'ja',qw:'語',joshiki:true,noCloze:true,lv:{},lvd:{}},JOSHIKI_META);
const GROUPS=[{key:'kobun',name:'古文',subs:['kobun','book','yomi','joshiki']},{key:'eigo',name:'英語',subs:['eigo','eigo1','eigo2','eigo3','eigo4']}];
const SUBLABEL={kobun:'古文単語',eigo:'全レベル'};
const baseOf=k=>SUBJ[k].base||k;const groupOf=k=>GROUPS.find(g=>g.subs.includes(k)).key;const isEn=()=>baseOf(S.subj)==='eigo';
const lvName=(it)=>SUBJ[S.subj].lv[it.lv]||('Lv'+it.lv);
const DATA={
  kobun:KOBUN_RAW.map(r=>({id:'k:'+r[0]+(r[1]?'|'+r[1]:''),w:r[0],k:r[1],pos:r[2],m:r[3],ex:r[4],tr:r[5],note:r[6],lv:r[7],tags:r[8]})),
  eigo:EIGO_RAW.map(r=>({id:'e:'+r[0],w:r[0],k:'',pos:r[1],m:r[2],ex:r[3],tr:r[4],der:r[5],lv:r[6],tags:r[7]}))
};
let BOOKREL=[];
// 古文330の見出し語・関連語の添え書き（「けしき(気色)」の漢字、「かたちをかふ〔やつす〕」の言い換え、「たまふ(四段)」の区別）は
// 語そのものに含めない。語の表示・選択肢・字数のヒント・照合には添え書きを外した形（bareW）を使い、添え書きは漢字表記の欄（k）に出す。
// 元のデータ（BOOK_RAW）は変えない。IDは番号で決まるので、ここを変えても学習記録には響かない
const NOTE_RE=/\([^)]*\)|〔[^〕]*〕/g;
const bareW=s=>String(s).replace(NOTE_RE,''),noteW=s=>(String(s).match(NOTE_RE)||[]).map(x=>x[0]==='('?x.slice(1,-1):x).join('・');
if(SUBJ.book){DATA.book=BOOK_RAW.map(r=>({id:'b:'+r[0],num:r[0],w:bareW(r[1]),k:r[2]||noteW(r[1]),pos:r[3],m:r[4],ex:r[5],tr:r[6],note:r[7],lv:r[8],tags:r[9],rel:r[10]||[],exs:r[11]||null}));
  DATA.book.forEach(it=>{if(it.exs&&it.exs[0]){it.ex=it.exs[0][0];it.tr=it.exs[0][1];}});
  DATA.book.forEach(it=>it.rel.forEach((x,i)=>BOOKREL.push({id:'br:'+it.num+':'+i,num:it.num,w:bareW(x[0]),k:noteW(x[0]),pos:x[1],m:x[2].split('・'),ex:'',tr:'',note:'「'+it.w+'」（No.'+it.num+'）の関連語',lv:it.lv,tags:['関連語'],rel:[],isRel:true,parent:it})));}
// 古文330は、関連語の記録も集計・苦手の復習・リセットの対象にする（数は見出し語と分けて出す）
const relOf=subj=>SUBJ[subj].book?BOOKREL:[];
if(SUBJ.yomi)DATA.yomi=YOMI_RAW.map(r=>({id:'y:'+r[0],num:r[0],w:r[1],k:'',pos:'読み',m:[r[2]],rd:r[2],alt:r[4]||'',ex:'',tr:'',note:r[3]+(r[4]&&r[4]!==r[2]?'（歴史的仮名遣い：'+r[4]+'）':''),lv:1,tags:[],yomi:true}));
// 英語は「レベル→ABC 順」に並べてから、レベル別タブの一覧を作る（レベル別タブも、全レベルタブと同じ ABC 順にするため）
DATA.eigo.sort((a,b)=>a.lv-b.lv||a.w.localeCompare(b.w,'en'));
for(const l of [1,2,3,4])DATA['eigo'+l]=DATA.eigo.filter(it=>it.lv===l);
if(SUBJ.joshiki)DATA.joshiki=JOSHIKI_RAW.map(r=>({id:'j:'+r[1],w:r[1],k:'',pos:r[0],m:[r[3]],rd:r[2]!==r[1]?r[2]:'',alt:r[5]||'',ex:'',tr:'',note:'',lv:r[6],tags:[],img:r[7],fig:r[8],page:r[4]}));
if(typeof EXTRA_SUBJ!=='undefined')for(const e of EXTRA_SUBJ){SUBJ[e.key]=Object.assign({cls:'ja',qw:'語',joshiki:true,noCloze:true},e.meta);GROUPS[0].subs.push(e.key);
  DATA[e.key]=e.items.map(r=>Object.assign({},r,{id:e.key+':'+r.w+'|'+(r.k||'')+'|'+r.pos}));}
const findAny=id=>{for(const s in DATA){const x=DATA[s].find(it=>it.id===id);if(x)return x;}return BOOKREL.find(it=>it.id===id);};
if(typeof KOBUN_EXS!=='undefined')DATA.kobun.forEach(it=>{const e=KOBUN_EXS[it.w+'|'+(it.k||'')];if(e&&e.length===it.m.length){it.exs=e;it.ex=e[0][0];it.tr=e[0][1];}});
if(typeof EIGO_EXS!=='undefined')DATA.eigo.forEach(it=>{const e=EIGO_EXS[it.w];if(e&&e.length===it.m.length){it.exs=e;it.ex=e[0][0];it.tr=e[0][1];}});
for(const k of ['kobun','eigo','book'])(DATA[k]||[]).forEach(it=>{if(!it.exs&&it.m.length===1&&it.ex)it.exs=[[it.ex,it.tr]];});
DATA.kobun.sort((a,b)=>a.w.localeCompare(b.w,'ja'));
const TAGS={};for(const s in DATA){const t=new Set();DATA[s].forEach(it=>it.tags.forEach(x=>t.add(x)));TAGS[s]=[...t];}
const STATUS={new:'未学習',learning:'学習中',weak:'苦手',ok:'習得'};

/* ---- storage ---- */
// 保存データの版 v（無ければ0）より新しい移行を番号順に当て、記録を新しいIDへ付け替える。
// 1つの移行は同時の付け替え（新しい prog を作ってから差し替えるので、a→b と b→a が同じ移行にあれば入れ替わる）。
// 対応表に無いIDはそのまま。付け替え先が重なったら回答数（c＋x）の多いほうを残す。
// 消した印（del。下の「保存データの形」）のIDも、同じ対応で付け替える。
// ただし、印は「そのIDで消した記録」だけに効かせる。2つのIDが1つにまとまるとき、まとめ先に別のIDから来た記録（消していない記録）が
// 残っていたら、その印は捨てる（残すと、次に合わせる処理が走ったときに、消した覚えのない記録が消える）。
// そのために、消したのに残っていた記録（印の時刻以前）は付け替える前に捨てておく（これで、付け替えたあとに印の時刻以前の記録があれば、別のIDから来た記録だとわかる）
function migrate(j){const from=+j.v||0,has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k),n=r=>r?(r.c||0)+(r.x||0):-1;let prog=j.prog||{},del=isObj(j.del)?j.del:null;
  if(del&&MIGRATIONS.some(m=>m.v>from)){const np={};for(const id in prog)if(!(prog[id]&&del[id]>=(+prog[id].t||0)))np[id]=prog[id];prog=np;}
  for(const m of MIGRATIONS){if(m.v<=from)continue;const np={};
    for(const id in prog){const to=has(m.map,id)?m.map[id]:id;if(to===null)continue;if(!has(np,to)||n(prog[id])>n(np[to]))np[to]=prog[id];}
    prog=np;
    if(del){const nd={};for(const id in del){const to=has(m.map,id)?m.map[id]:id;if(to!==null&&!(nd[to]>=del[id]))nd[to]=del[id];}
      for(const id in nd)if(prog[id]&&nd[id]>=(+prog[id].t||0))delete nd[id];del=nd;}}
  j.prog=prog;if(del)j.del=del;j.v=VER;return j;}
// 保存データの形（キー tango-drill-v1 に、全体を1つの JSON で入れる）
//   prog  {ID:{c:正答数, x:誤答数, s:連続正解数, t:最後に答えた時刻}}     days {日付:その日の回答数}     prefs 設定     v 版（移行の番号）
//   del   {ID:記録を消した時刻}。記録を消した印。2つのタブで開いているとき、もう片方が覚えている古い記録と合わせても、
//         消した記録が戻らないようにするためのもの（その時刻以前の記録は捨てる）。一度も消していなければ、この欄は無い
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o),isNum=v=>typeof v==='number'&&isFinite(v)&&v>=0;
// 記録の形の検査: c・x・s・t がどれも0以上の数値
const validRec=r=>isObj(r)&&isNum(r.c)&&isNum(r.x)&&isNum(r.s)&&isNum(r.t);
// lastRaw … 最後に読んだ（または書いた）保存内容の文字列。同じなら読み直さない
let lastRaw=null,saveWarned=false;
let store=load();
// 読み込み。古い版の記録は、元の内容を BAK に退避してから移行し、すぐ保存する。記録が空なら v を最新にするだけ
function load(){let raw=null,j=null;try{raw=localStorage.getItem(KEY);j=JSON.parse(raw);}catch(e){}
  if(!j||!j.prog)return{prog:{},days:{},prefs:{},v:VER};
  j=Object.assign({prog:{},days:{},prefs:{}},j);lastRaw=raw;
  if((+j.v||0)<VER){try{if(Object.keys(j.prog).length)localStorage.setItem(BAK,raw);}catch(e){}migrate(j);put(j);}
  return j;}
function put(o){try{const raw=JSON.stringify(o);localStorage.setItem(KEY,raw);lastRaw=raw;}catch(e){warnSave();}}
// 保存。直前に、いまの保存内容を読んで合わせる（2つのタブで開いていても、片方の記録がもう片方を上書きして消さないように）
function save(){sync();put(store);}
// 保存できなかったとき（容量の不足、プライベートブラウズなど）は、画面に一度だけ知らせる（閉じたあとは、もう出さない）
function warnSave(){if(saveWarned)return;saveWarned=true;const v=document.getElementById('view');if(!v)return;
  const n=document.createElement('div');n.id='savewarn';n.className='note';n.setAttribute('role','alert');n.style.margin='0 0 16px';
  n.innerHTML='<b>保存できません</b>学習記録を保存できませんでした。端末の空き容量が足りないか、プライベートブラウズで開いている可能性があります。このままページを閉じると、ここからの記録は残りません。記録を残すには、成績タブの「記録をコピー」で控えを取ってください。 <button type="button" class="fchip">閉じる</button>';
  n.querySelector('button').addEventListener('click',()=>n.remove());v.parentNode.insertBefore(n,v);}
// いまの保存内容を読み、覚えている内容に合わせる。記録を変える操作の前、出題を始める前、保存の直前、ほかのタブが保存したとき（storage イベント）に呼ぶ。
// 古い版のタブが書いた内容は、移行してから合わせる。新しい版の内容なら、版を下げない。
// 合わせるのは学習記録（prog・days・del）だけ。出題設定（prefs）は、このタブの画面に出ている内容のままにする（保存データでは、後から保存したタブの設定が残る）
function sync(){let raw,j;try{raw=localStorage.getItem(KEY);}catch(e){return;}
  if(raw==null||raw===lastRaw)return;lastRaw=raw;
  try{j=JSON.parse(raw);}catch(e){return;}
  if(!isObj(j)||!isObj(j.prog))return;
  if((+j.v||0)<VER)migrate(j);else if(+j.v>(+store.v||0))store.v=j.v;
  merge(j);}
// 2つの記録のうち b を残すか: 回答数（c＋x）の多いほう。同数なら新しいほう（それも同じなら連続正解・正答の多いほう。どのタブでも同じ結果にするための決め）
const nAns=r=>(+r.c||0)+(+r.x||0);
const bWins=(a,b)=>(nAns(b)-nAns(a)||(+b.t||0)-(+a.t||0)||(+b.s||0)-(+a.s||0)||(+b.c||0)-(+a.c||0))>0;
// 保存内容 o（最新の版に移行ずみ）を、覚えている内容に合わせる。o から取り込んだ記録の数を返す。
//   記録 … 項目ごとに、回答数の多いほう（同数なら新しいほう）を残す。形のおかしい記録と、消した印より前の記録は取り込まない
//   日別の回答数 … 多いほうを残す     消した印 … 新しいほうを残す
//   restore（バックアップの復元）のときは、消した印があっても取り込む（消した時刻の直後の記録として扱う。消したあとでバックアップから戻せるように）
function merge(o,restore){let n=0;const del={};
  for(const src of [store.del,o.del])if(isObj(src))for(const id in src)if(isNum(src[id])&&!(del[id]>=src[id]))del[id]=src[id];
  for(const id in store.prog){const a=store.prog[id];if(a&&del[id]>=(+a.t||0))delete store.prog[id];}
  for(const id in o.prog){let b=o.prog[id];if(!validRec(b))continue;
    if(del[id]>=b.t){if(!restore)continue;b=Object.assign({},b,{t:del[id]+1});}
    const a=store.prog[id];if(!a||bWins(a,b)){store.prog[id]=b;n++;}}
  if(isObj(o.days))for(const d in o.days)if(isNum(o.days[d])&&!(store.days[d]>=o.days[d]))store.days[d]=o.days[d];
  if(Object.keys(del).length)store.del=del;
  return n;}
// 項目 id の記録を消した時刻（消していなければ0）
const delAt=id=>{const d=isObj(store.del)?store.del[id]:0;return isNum(d)?d:0;};
// 記録を消す。消した印を残す
function forget(ids){const now=Date.now();for(const id of ids){const r=store.prog[id];if(r===undefined)continue;
  if(!isObj(store.del))store.del={};store.del[id]=Math.max(now,delAt(id),+(r&&r.t)||0);delete store.prog[id];}}
// 記録に付ける時刻。消した印より後にする（端末の時計がずれていても、消したあとの新しい記録が「消した記録」の扱いにならないように）
const stamp=id=>Math.max(Date.now(),delAt(id)+1);
function today(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function status(it){const r=store.prog[it.id];if(!r)return'new';if(r.s>=2)return'ok';if(r.x>0)return'weak';return'learning';}
function record(it,ok){sync();const r=store.prog[it.id]||{c:0,x:0,s:0,t:0};if(ok){r.c++;r.s++;}else{r.x++;r.s=0;}r.t=stamp(it.id);store.prog[it.id]=r;const d=today();store.days[d]=(store.days[d]||0)+1;save();}
function setStatus(it,st){sync();if(st==='weak'){store.prog[it.id]={c:(store.prog[it.id]||{}).c||0,x:Math.max(1,(store.prog[it.id]||{}).x||0),s:0,t:stamp(it.id)};}
  else if(st==='ok'){const r=store.prog[it.id]||{c:0,x:0,s:0,t:0};r.s=2;r.c++;r.t=stamp(it.id);store.prog[it.id]=r;}
  else if(st==='new'){forget([it.id]);}save();}
function countOf(list){const c={new:0,learning:0,weak:0,ok:0,total:0};list.forEach(it=>{c[status(it)]++;c.total++;});return c;}
function counts(subj){return countOf(DATA[subj]);}
function streak(){let n=0;const d=new Date();if(!store.days[today(d)])d.setDate(d.getDate()-1);while(store.days[today(d)]){n++;d.setDate(d.getDate()-1);}return n;}

/* ---- state ---- */
const S={subj:store.prefs.subj||'kobun',tab:'home',session:null,list:{q:'',st:'all',lv:'all',open:null},confirm:false,msg:''};
const prefsOf=()=>Object.assign({range:'auto',count:'20',order:'smart',rel:'no',from:'',to:''},store.prefs[S.subj]||{});
function setPref(k,v){store.prefs[S.subj]=Object.assign(prefsOf(),{[k]:v});save();}

/* ---- session ---- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(subj,range){let all=DATA[subj];
  if(SUBJ[subj].book){const p=prefsOf();if(p.rel==='with')all=all.concat(BOOKREL);else if(p.rel==='only')all=BOOKREL.slice();
    const a=parseInt(p.from)||1,b=parseInt(p.to)||330;all=all.filter(it=>it.num>=a&&it.num<=b);}
  if(range==='auto'||range==='all')return all.slice();

// 意味の重なりの判定に使う訳語の集合: かっこ書きを除き、「・」「／」で区切る。「〜を」「〜に」などの前置きと「〜」は外して比べる（「〜を非難する」と「非難する」は同じ）
const GPAR=/[（(［【〔][^（）()［］【】〔〕]*[）)］】〕]/g,GL=new WeakMap();
function glossSet(ms){const o=new Set();
  for(let m of ms){let p;do{p=m;m=m.replace(GPAR,'');}while(m!==p);
    for(const t of m.split(/[・／\/]/)){const g=t.replace(/※.*$/,'').replace(/^[〜～~]+(?:から|[をにがとへでの])?/,'').replace(/[〜～~\s]/g,'');if(g)o.add(g);}}

const glossAll=it=>{let g=GL.get(it);if(!g)GL.set(it,g=glossSet(it.m));return g;};
// 語→意味の選択肢に出す意味: 先頭から2つ（ms＝元の文、t＝見出し語を伏せた表示、g＝重なりの判定用）。伏せると何も残らない意味（あした＝朝 の「朝」）は飛ばす。
// どの意味も残らない語（かち＝徒歩。意味が漢字表記そのもの）は bare。元の意味のまま出し、代わりに設問の漢字表記を回答まで出さない（qKanji）

  const on=x.m.map(m=>({m,t:maskM(x,m,true)})).filter(o=>!blankM(o.t)).slice(0,2),bare=!on.length,ms=bare?x.m.slice(0,2):on.map(o=>o.m);
  let t=(bare?ms.map(m=>maskM(x,m,false)).filter(s=>!blankM(s)):on.map(o=>o.t)).join('／');if(!t)t=ms.join('／');

// 語→意味の設問に出す漢字表記（出さないときは空）
const qKanji=it=>it.k&&!choiceM(it).bare?it.k:'';
// 品詞の大分類の一覧（1つ目が主な品詞）。古文は「動カ四・下二」→動、「副・形動ナリ」→副・形動。英語は品詞表記を「・」で分ける。
// 文法は「格助詞」「係助詞」などをまとめて助詞とし、助動詞・動詞の活用などはそのまま。古文常識・文学史・和歌は分類（時刻・方角、作品・作者、枕詞・掛詞 など）をそのまま使う。
// 文学史の作品は、ジャンルの系統が同じ作品を先にする。系統は、説明の「〜時代（n世紀）の歌物語」のジャンル名の末尾の字（歌物語・軍記物語は「語」、勅撰集・俳諧集は「集」、日記は「記」）。
// 書名の「物語」「日記」「集」だけで正答が決まらないようにするため
const PC=new WeakMap();
function posCls(it){let c=PC.get(it);if(c)return c;const pos=String(it.pos);
  if(/^(k|b|br):/.test(it.id)){c=[];let cur='';for(const t of pos.split('・')){const m=/^(形動|動|形|名|副|連語|連体|感動|接)/.exec(t);if(m)cur=m[1];if(cur&&!c.includes(cur))c.push(cur);}if(!c.length)c=[pos];}
  else if(it.id.startsWith('e:'))c=pos.split('・');
  else{c=[/助詞$/.test(pos)?'助詞':pos];const g=pos==='作品'&&/時代（[^）]*）の([^。]+)/.exec(it.m[0]||'');if(g)c.unshift(pos+'／'+g[1].slice(-1));}
  PC.set(it,c);return c;}
// 説明の文の集合: 意味を「。」で区切る（かっこ書きはそのまま比べる。文学史の「平安時代（11世紀）の物語。紫式部」→ 2文）
const SENT=new WeakMap(),sentSet=ms=>{const o=new Set();for(const m of ms)for(const t of m.split('。')){const g=t.replace(/\s/g,'');if(g)o.add(g);}return o;};
const sentAll=it=>{let s=SENT.get(it);if(!s)SENT.set(it,s=sentSet(it.m));return s;};
// 4択の選択肢（正解＋誤答3つ）を作る。mode が quiz（語→意味）なら選択肢は意味、それ以外（意味→語・空所補充）は語。
// 誤答にしない語:
//   ・正解と同じ語（併記のどれかが同じ。が と が・の、同じ語形の たまふ）、1枚に複数の語が並ぶ項目
//   ・正解と意味が重なる語（訳語が1つでも同じ）。語→意味は選択肢に出す意味を、それ以外はすべての意味を、正解のすべての意味と比べる
//   ・説明がまるごと当てはまる語。語→意味は、選択肢の文がすべて正解の語の説明にもある語（源氏物語に対する「平安時代（11世紀）の物語」）。
//     それ以外は、設問文（正解の語の説明）がすべてその語の説明にもある語（「平安時代（11世紀）の物語」に対する源氏物語）
//   ・語→意味で、選択肢の文に正解の見出し語が出る語。選択肢の表示がほかと同じになる語、訳がほかの誤答とまったく同じ語（む と むず を両方は出さない）
// 誤答の順: 正解と同じ品詞の大分類（主な品詞が同じ → 品詞が1つでも同じ → ほか）を先に、その中ではレベル・章・区分が近い語を先に選ぶ。同じ品詞で足りないときだけ、次の語で補う。
// 古文の動詞は、主な品詞が同じ語の中でも、語尾の字（＝活用の行）が同じ語を先にする。意味→語と空所補充は設問に「動カ四」のように行を出すので、
// 語尾が正答だけ違うと、意味を知らなくても選べるため
const ALT=new WeakMap(),wordAlts=it=>{let a=ALT.get(it);if(!a)ALT.set(it,a=wordForms(String(it.w).toLowerCase(),'・'));return a;};
const verbEnd=x=>/^(k|b|br):/.test(x.id)&&posCls(x)[0]==='動'?String(x.w).slice(-1):'';
function makeChoices(it,mode,subj){const toM=mode==='quiz',gi=glossAll(it),si=sentAll(it),wi=wordAlts(it),pi=posCls(it),ei=verbEnd(it);
  const gOf=x=>toM?choiceM(x).g:glossAll(x),txt=x=>toM?choiceM(x).t:x.w.toLowerCase(),gkey=x=>'\n'+[...gOf(x)].sort().join('\n');
  const any=(a,b)=>{for(const x of a)if(b.has(x))return true;return false;},within=(a,b)=>{if(!a.size)return false;for(const x of a)if(!b.has(x))return false;return true;};
  const ok=x=>!isMulti(x)&&!wordAlts(x).some(w=>wi.includes(w))&&!any(gOf(x),gi)&&!(toM?within(sentSet(choiceM(x).ms),si)||mentions(it,choiceM(x).t):within(si,sentAll(x)));
  const rank=x=>{const px=posCls(x);return (px[0]===pi[0]?(ei&&verbEnd(x)!==ei?1:0):px.some(p=>pi.includes(p))?2:3)*100+(Math.abs(x.lv-it.lv)||0);};
  const by=new Map();for(const x of DATA[subj]){if(x.id===it.id)continue;const r=rank(x);if(!by.has(r))by.set(r,[]);by.get(r).push(x);}
  // 順位の高い組から、組の中は無作為の順に、誤答にできる語を3つ選ぶ（できるかどうかは、選ぶ段になってから確かめる）
  const picks=[],seen=new Set([txt(it)]);

  <section class="panel"><h2>出題設定 <span class="sub">科目ごとに記憶されます</span></h2>

    <button class="mode" data-start="quizR"><span class="k">QUIZ B</span><span class="t">4択：${SUBJ[S.subj].yomi?'読み → 漢字':isEn()?'意味 → 単語':'意味 → 語'}</span><span class="d">意味から語を引く逆方向。${S.subj==='kobun'?'和歌・文法問題の語彙力に。':'作文・空所補充の語彙力に。'}</span></button>

    return `<details class="refd"><summary>${esc(t.title)}</summary>${t.html?`<div class="tblwrap">${t.html}</div>`:''}${im?`<div class="tblwrap"><img class="refimg" src="${im}" alt="${esc(t.title)}（本の表）"></div><p class="cap">本の表の写真。横にスクロールして見られます。</p>`:''}</details>`;}).join('')}</section>`:''}
  <p class="hint">キーボード操作: Space で裏返す、← まだ ／ → 覚えた、1〜4 で選択、Enter で答え合わせ・次へ。</p>
  <div class="share"><b>${SUBJ.book?'このページについて':'共有について'}</b>${SUBJ.book?'このページは個人用です。URLを他の人に渡さないでください。':'このページのURLをそのまま友人や生徒に渡せます。'}学習記録（習得・苦手）は開いた端末のブラウザごとに保存され、他の人には見えません。別の端末へ移すときは「成績」タブのバックアップを使ってください。</div>`;}

function viewFlash(){const sess=S.session,it=sess.items[sess.i],n=sess.items.length;
  const head=`<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div><button data-quit>中断</button></div>`;
  if(!sess.flipped)return head+`<div class="card flip" data-flip tabindex="0" role="button" aria-label="めくって意味を見る">${chipsHtml(it)}${wordHtml(it)}<div class="tap">タップ / Space で意味を表示</div></div>
    <div class="actions"><button class="btn bad" data-ans="0">まだ<small>← / 1</small></button><button class="btn ok" data-ans="1">覚えた<small>→ / 2</small></button></div>`;
  return head+`<div class="card back">${chipsHtml(it)}${wordHtml(it)}${detailHtml(it)}</div>
    <div class="actions"><button class="btn bad" data-ans="0">まだ<small>← / 1</small></button><button class="btn ok" data-ans="1">覚えた<small>→ / 2</small></button></div>`;}

function viewQuiz(){const sess=S.session,it=sess.items[sess.i],n=sess.items.length,toM=sess.mode==='quiz',c=SUBJ[S.subj].cls;
  if(!sess.choices)sess.choices=makeChoices(it,sess.mode,S.subj);
  const head=`<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div><button data-quit>中断</button></div>`;
  const prompt=toM?`<div class="qprompt">${SUBJ[S.subj].yomi?'この漢字の読みは？':isEn()?'この単語の意味は？':'この語の意味は？'}</div>${chipsHtml(it)}${wordHtml(it,'',qKanji(it))}`
    :`<div class="qprompt">${SUBJ[S.subj].yomi?'この読みの漢字は？':'この意味を表す'+SUBJ[S.subj].qw+'は？'}</div><div class="chips"><span class="chip acc">${esc(it.pos)}</span><span class="chip lv">${esc(lvName(it))}</span></div><p class="word" style="font-size:1.35rem;font-weight:700">${esc(hideWord(it).join('　／　'))}</p>`;
  const picked=sess.picked;
  const choices=sess.choices.map((x,i)=>{let cls='choice';if(picked!==null){if(x.id===it.id)cls+=' correct';else if(i===picked)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-pick="${i}"${picked!==null?' disabled':''}><span class="n">${i+1}</span><span class="txt ${toM?'':c}">${esc(choiceText(x,toM))}</span></button>`;}).join('');
  let after='';
  if(picked!==null){const ok=sess.choices[picked].id===it.id;
    after=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}${ok?'':'　正答: '+esc(toM?it.m[0]:it.w)}</div><div class="detail">${wordHtml(it)}${detailHtml(it)}</div>
    <div class="actions" style="grid-template-columns:1fr"><button class="btn acc" data-next>次へ<small>Enter</small></button></div>`;}
  return head+`<div class="card" style="min-height:0;padding:22px 24px">${prompt}</div><div class="choices">${choices}</div>${after}`;}

function curCloze(sess){const it=sess.items[sess.i];sess.cz=sess.cz||{};
  if(it.exs){if(sess.cz[sess.i]===undefined){const ok=it.exs.map((e,j)=>findForm(it,e[0])?j:-1).filter(j=>j>=0);sess.cz[sess.i]=ok.length?ok[Math.floor(Math.random()*ok.length)]:-1;}
    const j=sess.cz[sess.i];if(j>=0)return{f:findForm(it,it.exs[j][0]),tr:it.exs[j][1],mi:j};}
  return{f:findForm(it),tr:it.tr,mi:-1};}
function viewCloze(){const sess=S.session,it=sess.items[sess.i],n=sess.items.length,typed=sess.mode==='clozeT',c=SUBJ[S.subj].cls,cz=curCloze(sess),f=cz.f;
  if(!typed&&!sess.choices)sess.choices=makeChoices(it,sess.mode,S.subj);
  const head=`<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div><button data-quit>中断</button></div>`;
  const done=sess.picked!==null;const ok=done&&(typed?sess.picked===true:sess.choices[sess.picked].id===it.id);
  const bw=f.base||it.w; // 空所に入る語の終止形（併記の見出し語なら、用例に入っている1語）
  const sent=`<p class="cloze ${c}">${esc(done?f.pre:f.mpre)}<span class="blank ${done?(ok?'ok':'ng'):''}">${done?esc(f.hit):'＿＿＿＿'}</span>${esc(done?f.post:f.mpost)}</p><div class="tr" style="color:var(--muted);margin-top:6px">${esc(cz.tr)}</div>${done&&cz.mi>=0?`<div class="hint" style="margin:8px 0 0">この用例は意味${'①②③④⑤⑥'[cz.mi]}「${esc(it.m[cz.mi])}」</div>`:''}`;
  const prompt=`<div class="qprompt">空所に入る${SUBJ[S.subj].qw}は？</div><div class="chips"><span class="chip acc">${esc(it.pos)}</span><span class="chip lv">${esc(lvName(it))}</span>${typed?`<span class="chip">${esc(bw[0])}${'・'.repeat(Math.max(0,bw.length-1))}（${bw.length}字）</span>`:''}</div>${sent}`;
  let body='';
  if(typed){body=done?'':`<form class="typeform" data-submit><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${isEn()?'英単語を入力':'ひらがなで入力'}" lang="${isEn()?'en':'ja'}"><button class="btn acc" type="submit">答え合わせ<small>Enter</small></button></form>`;}
  else{body=`<div class="choices">${sess.choices.map((x,i)=>{let cls='choice';if(done){if(x.id===it.id)cls+=' correct';else if(i===sess.picked)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-pick="${i}"${done?' disabled':''}><span class="n">${i+1}</span><span class="txt ${c}">${esc(x.w)}</span></button>`;}).join('')}</div>`;}
  let after='';
  if(done){after=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}${ok?'':'　正答: '+esc(f.hit)+(f.hit.toLowerCase()!==bw.toLowerCase()?'（'+esc(bw)+'）':'')}${typed&&sess.typedAns&&!ok?'　あなたの答え: '+esc(sess.typedAns):''}</div><div class="detail">${wordHtml(it)}${detailHtml(it)}</div>
    <div class="actions" style="grid-template-columns:1fr"><button class="btn acc" data-next>次へ<small>Enter</small></button></div>`;}
  return head+`<div class="card" style="min-height:0;padding:22px 24px">${prompt}</div>${body}${after}`;}

function viewTypeY(){const sess=S.session,it=sess.items[sess.i],n=sess.items.length,done=sess.picked!==null,ok=sess.picked===true;
  const head=`<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div><button data-quit>中断</button></div>`;
  const prompt=`<div class="qprompt">この漢字の読みは？（現代仮名遣いで。歴史的仮名遣いでも正解）</div>${chipsHtml(it)}${wordHtml(it)}`,more=readings(it).more;
  const body=done?'':`<form class="typeform" data-submit><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ひらがなで入力" lang="ja"><button class="btn acc" type="submit">答え合わせ<small>Enter</small></button></form>`;
  const after=done?`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}　読み: ${esc(it.rd||it.m[0])}${more.length?'（別の読み: '+esc(more.join('・'))+'）':''}${!ok&&sess.typedAns?'　あなたの答え: '+esc(sess.typedAns):''}</div><div class="detail">${wordHtml(it)}${detailHtml(it)}</div>
    <div class="actions" style="grid-template-columns:1fr"><button class="btn acc" data-next>次へ<small>Enter</small></button></div>`:'';
  return head+`<div class="card" style="min-height:0;padding:22px 24px">${prompt}</div>${body}${after}`;}

function viewResult(){const sess=S.session,n=sess.res.length,ok=sess.res.filter(r=>r.ok).length,wrong=sess.res.filter(r=>!r.ok).map(r=>r.it),pct=n?Math.round(ok/n*100):0,c=SUBJ[S.subj].cls;
  const r=52,circ=2*Math.PI*r;
  return `<section class="panel"><div class="score">
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(circ*pct/100).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="var(--fg)" font-family="var(--sans)">${pct}%</text></svg>
    <div><div class="big num">${ok} / ${n} 問</div><div class="sm">${pct===100?'全問正解。次は範囲を広げましょう。':pct>=80?'あと一歩。間違えた語を復習しましょう。':'間違えた語は「苦手」に登録されました。もう一度挑戦。'}</div></div></div>
    <div class="row">${wrong.length?`<button class="btn acc" data-retry="wrong">間違えた ${wrong.length} 語をもう一度</button>`:''}<button class="btn" data-retry="same">同じ設定でもう一度</button><button class="btn ghost" data-quit>ホームへ</button></div></section>
    ${wrong.length?`<h2 style="font-size:.95rem;margin:4px 0 10px">今回間違えた語</h2><ul class="wlist">${wrong.map(it=>`<li><span class="w ${c}">${esc(it.w)}${it.k?`<small style="font-weight:400;color:var(--muted);margin-left:6px">${esc(it.k)}</small>`:''}</span><span class="m">${esc(it.m.join('／'))}</span></li>`).join('')}</ul>`:''}`;}

function viewList(){const L=S.list,c=SUBJ[S.subj].cls,q=L.q.trim().toLowerCase();
  let items=DATA[S.subj].filter(it=>L.st==='all'||status(it)===L.st).filter(it=>L.lv==='all'||it.lv===+L.lv);
  if(q)items=items.filter(it=>(it.w+' '+(it.k||'')+' '+it.m.join(' ')+' '+(it.der||'')+' '+(it.rel||[]).map(x=>x[0]+' '+x[2]).join(' ')+' '+(it.num||'')).toLowerCase().includes(q));
  const total=items.length,CAP=200;items=items.slice(0,CAP);
  const chip=(k,v,lab)=>`<button class="fchip" data-f="${k}" data-v="${v}" aria-pressed="${String(L[k])===v}">${lab}</button>`;
  return `<input type="search" id="q" placeholder="語・意味で検索" value="${esc(L.q)}" autocomplete="off">
  <div class="filters">${chip('st','all','すべて')}${chip('st','new','未学習')}${chip('st','learning','学習中')}${chip('st','weak','苦手')}${chip('st','ok','習得')}<span style="width:8px"></span>${SUBJ[S.subj].fixLv||SUBJ[S.subj].yomi?'':chip('lv','all','全レベル')+Object.keys(SUBJ[S.subj].lv).map(l=>chip('lv',l,SUBJ[S.subj].lv[l])).join('')}</div>
  <div class="count num">${total} 語${total>CAP?`（先頭 ${CAP} 語を表示。検索や絞り込みで狭めてください）`:''}</div>
  ${items.length?`<ul class="vlist">${items.map(it=>{const st=status(it),open=L.open===it.id;
    return `<li class="vrow"><button data-open="${esc(it.id)}" aria-expanded="${open}"><span class="dot ${st}" title="${STATUS[st]}"></span><span class="vw ${c}">${it.num?`<small style="margin:0 6px 0 0">${it.num}</small>`:''}${esc(it.w)}${it.k?`<small>${esc(it.k)}</small>`:''}<small>${esc(it.pos)}</small></span><span class="vm">${esc(it.m.join('／'))}</span></button>
    ${open?`<div class="vdet">${detailHtml(it)}<div class="row"><button class="btn" data-set="weak" data-id="${esc(it.id)}">苦手に登録</button><button class="btn" data-set="ok" data-id="${esc(it.id)}">習得済みにする</button><button class="btn ghost" data-set="new" data-id="${esc(it.id)}">記録を消す</button></div></div>`:''}</li>`;}).join('')}</ul>`
  :'<div class="empty">該当する語がありません</div>'}`;}

function viewStats(){const c=SUBJ[S.subj].cls;
  const subjBlock=s=>{const cc=counts(s),all=DATA[s],rc=SUBJ[s].book?countOf(BOOKREL):null;const lvs=Object.keys(SUBJ[s].lv).map(n=>{const a=all.filter(it=>it.lv===+n),o=a.filter(it=>status(it)==='ok').length;return{n,lab:SUBJ[s].lv[n],a:a.length,o};});
    return `<div class="panel"><h2>${esc(SUBJ[s].name)} <span class="sub">${cc.total}語</span></h2>
    <div class="bar"><i class="ok" style="width:${cc.ok/cc.total*100}%"></i><i class="learning" style="width:${cc.learning/cc.total*100}%"></i><i class="weak" style="width:${cc.weak/cc.total*100}%"></i></div>
    <div class="legend" style="margin-bottom:6px"><span class="ok">習得 ${cc.ok}</span><span class="learning">学習中 ${cc.learning}</span><span class="weak">苦手 ${cc.weak}</span><span>未学習 ${cc.new}</span></div>
    ${rc?`<p class="hint" style="margin:0 0 6px">関連語 ${rc.total}語：習得 ${rc.ok}・学習中 ${rc.learning}・苦手 ${rc.weak}・未学習 ${rc.new}</p>`:''}
    ${lvs.map(l=>`<div class="lvbar"><span class="lab">${l.n} ${esc(l.lab)}</span><div class="track"><i style="width:${l.a?l.o/l.a*100:0}%"></i></div><span class="v num">${l.o}/${l.a}</span></div>`).join('')}</div>`;};
  // 14日間の回答数
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:today(d),d,n:store.days[today(d)]||0});}
  const max=Math.max(1,...days.map(x=>x.n)),W=560,H=120,pad=22,bw=(W-pad*2)/14;
  const bars=days.map((x,i)=>{const h=x.n/max*(H-40);const bx=pad+i*bw+3;return `<rect x="${bx.toFixed(1)}" y="${(H-24-h).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${x.n?'var(--accent)':'var(--line)'}"/>${x.n?`<text x="${(bx+(bw-6)/2).toFixed(1)}" y="${(H-28-h).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.n}</text>`:''}${i%2===1?`<text x="${(bx+(bw-6)/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.d.getMonth()+1}/${x.d.getDate()}</text>`:''}`;}).join('');
  const isWeak=it=>status(it)==='weak',wHead=DATA[S.subj].filter(isWeak),wRel=relOf(S.subj).filter(isWeak);
  const weak=wHead.concat(wRel).map(it=>({it,r:store.prog[it.id]})).sort((a,b)=>b.r.x-a.r.x||a.r.c-b.r.c).slice(0,15);
  const total=Object.values(store.days).reduce((a,b)=>a+b,0);
  return `<div class="sgrid">${Object.keys(SUBJ).filter(k=>!SUBJ[k].base).map(subjBlock).join('')}</div>
  <section class="panel"><h2>学習の記録 <span class="sub">直近14日 ／ 累計 ${total} 問 ／ 連続 ${streak()} 日</span></h2>
    <svg class="act" viewBox="0 0 ${W} ${H}" role="img" aria-label="直近14日間の回答数"><line x1="${pad}" y1="${H-24}" x2="${W-pad}" y2="${H-24}" stroke="var(--line)"/>${bars}</svg></section>
  <section class="panel"><h2>${esc(SUBJ[S.subj].name)}の苦手ワード <span class="sub">間違いが多い順・上位15${SUBJ[S.subj].book?`（見出し語 ${wHead.length}語・関連語 ${wRel.length}語）`:''}</span></h2>
    ${weak.length?`<ul class="wlist">${weak.map(({it,r})=>`<li><span class="w ${c}">${esc(it.w)}</span>${it.isRel?'<span class="chip">関連語</span>':''}<span class="m">${esc(it.m.join('／'))}</span><span class="num" style="color:var(--bad);font-size:.8rem">✕${r.x}　◯${r.c}</span></li>`).join('')}</ul>
    ${wHead.concat(wRel).some(it=>askable(it,'quiz'))?'<div class="row" style="margin-top:12px"><button class="btn acc" data-start-weak>苦手ワードだけ4択で復習</button></div>':''}`:'<p class="hint" style="margin:0">苦手に登録された語はありません。</p>'}</section>
  <section class="panel"><h2>バックアップ <span class="sub">別の端末へ記録を移す</span></h2>
    <div class="row"><button class="btn" data-export>記録をコピー</button></div>
    <p class="hint" style="margin:10px 0 6px">コピーした文字列を別の端末の下の欄に貼り付けて「復元」を押すと、記録が引き継がれます。</p>
    <textarea id="imp" placeholder="ここに貼り付け"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" data-import>復元（既存の記録と統合）</button></div>
    <div class="msg" id="msg">${esc(S.msg)}</div></section>
  <section class="panel"><h2 class="danger">記録のリセット</h2>
    ${S.confirm?`<div class="confirm"><span>${esc(SUBJ[S.subj].name)}の学習記録${SUBJ[S.subj].book?'（関連語を含む）':''}をすべて消します。元に戻せません。</span><button class="btn bad" data-reset="yes" style="padding:8px 14px">消す</button><button class="btn ghost" data-reset="no" style="padding:8px 14px">やめる</button></div>`
    :`<div class="row"><button class="btn ghost danger" data-reset="ask">${esc(SUBJ[S.subj].name)}の記録を消す</button></div>`}</section>`;}

/* ---- events ---- */
function setSubj(k){if(k!==S.subj){S.list.q='';S.list.st='all';}S.subj=k;store.prefs.subj=k;store.prefs.last=Object.assign({},store.prefs.last,{[groupOf(k)]:k});save();S.session=null;S.msg='';S.confirm=false;S.list.open=null;S.list.lv='all';render();}
document.querySelector('.switch').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(!b)return;const g=b.dataset.group;const last=(store.prefs.last||{})[g];setSubj(last&&SUBJ[last]?last:g);});
document.querySelector('.subtabs').addEventListener('click',e=>{const b=e.target.closest('[data-subj]');if(!b)return;setSubj(b.dataset.subj);});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.session=null;S.msg='';S.confirm=false;render();});
const view=$('#view');
view.addEventListener('change',e=>{const s=e.target.closest('[data-pref]');if(s){setPref(s.dataset.pref,s.value);document.querySelectorAll('[data-czn]').forEach(x=>{x.textContent=clozeNote();});}});
view.addEventListener('input',e=>{if(e.target.id==='q'){S.list.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(x){}}}});
view.addEventListener('click',e=>{
  const t=e.target;const h=(sel)=>t.closest(sel);let b;
  if(b=h('[data-start]')){start(b.dataset.start);return;}
  if(h('[data-start-weak]')){sync();const items=shuffle(DATA[S.subj].concat(relOf(S.subj)).filter(it=>status(it)==='weak'));start('quiz',items);return;}
  if(h('[data-quit]')){S.session=null;S.tab='home';render();return;}
  if(h('[data-flip]')){S.session.flipped=true;render();return;}
  if(b=h('[data-ans]')){answer(b.dataset.ans==='1');next();return;}
  if(b=h('[data-pick]')){const sess=S.session;if(sess.picked!==null)return;sess.picked=+b.dataset.pick;answer(sess.choices[sess.picked].id===sess.items[sess.i].id);render();return;}
  if(h('[data-next]')){next();return;}
  if(b=h('[data-retry]')){const sess=S.session;if(b.dataset.retry==='wrong'){start(sess.mode,shuffle(sess.res.filter(r=>!r.ok).map(r=>r.it)));}else{start(sess.mode);}return;}
  if(b=h('[data-f]')){S.list[b.dataset.f]=b.dataset.v;render();return;}
  if(b=h('[data-open]')){S.list.open=S.list.open===b.dataset.open?null:b.dataset.open;render();return;}
  if(b=h('[data-set]')){const it=DATA[S.subj].find(x=>x.id===b.dataset.id);if(it){setStatus(it,b.dataset.set);render();}return;}
  if(b=h('[data-reset]')){if(b.dataset.reset==='ask'){S.confirm=true;}else if(b.dataset.reset==='yes'){sync();forget(DATA[S.subj].concat(relOf(S.subj)).map(it=>it.id));save();S.confirm=false;S.msg='';}else{S.confirm=false;}render();return;}
  if(h('[data-export]')){sync();const txt=JSON.stringify({v:store.v,prog:store.prog,days:store.days});const done=()=>{S.msg='コピーしました。別の端末で貼り付けてください。';render();};
    const fallback=()=>{const ta=$('#imp');if(ta){ta.value=txt;ta.focus();ta.select();}S.msg='下の欄に記録を表示しました。全選択してコピーしてください。';const m=$('#msg');if(m)m.textContent=S.msg;};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}else fallback();}catch(x){fallback();}return;}
  // バックアップの取り込み。形を確かめてから取り込む: 記録は {c,x,s,t} がどれも0以上の数値のものだけ（余分な欄は落とす）、
  // 日別の回答数は「年-月-日」の日付と0以上の数値の組だけ。おかしな項目は捨てて、取り込んだ件数と捨てた件数を知らせる。
  // 取り込みの優先は、2つのタブの記録を合わせるときと同じ（merge）
  if(h('[data-import]')){const ta=$('#imp');try{const j=JSON.parse(ta.value);if(!isObj(j)||!isObj(j.prog))throw 0;const prog={},days={};let bad=0;
      for(const id in j.prog){const r=j.prog[id];if(validRec(r))prog[id]={c:r.c,x:r.x,s:r.s,t:r.t};else bad++;}
      if(isObj(j.days)){for(const d in j.days){if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&isNum(j.days[d]))days[d]=j.days[d];else bad++;}}else if(j.days!=null)bad++;
      sync();const n=merge(migrate({v:j.v,prog,days}),true);save();S.msg=n+' 語の記録を取り込みました。'+(bad?'形の正しくない '+bad+' 件は読み飛ばしました。':'');}
    catch(x){S.msg='読み取れませんでした。コピーした文字列をそのまま貼り付けてください。';}render();return;}
});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('[data-flip]')){S.session.flipped=true;render();}});
view.addEventListener('submit',e=>{const f=e.target.closest('[data-submit]');if(!f)return;e.preventDefault();const sess=S.session;if(!sess||sess.picked!==null)return;const v=$('#ans').value;if(!v.trim())return;sess.typedAns=v.trim();const it_=sess.items[sess.i];const ok=sess.mode==='typeY'?yomiOk(it_,v):clozeOk(it_,v,curCloze(sess).f);sess.picked=ok;answer(ok);render();});
// 回答のキー操作。Ctrl・Alt・Meta を押しながらの操作（ブラウザのタブ切り替えや「戻る」）と、入力欄にいるときの操作は、回答に使わない
document.addEventListener('keydown',e=>{const sess=S.session;if(!sess||sess.i>=sess.items.length)return;if(e.ctrlKey||e.altKey||e.metaKey)return;if(e.target.matches('input,textarea,select'))return;
  if(sess.mode==='flash'){
    if(e.key===' '){e.preventDefault();if(!sess.flipped){sess.flipped=true;render();}return;}
    if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();answer(false);next();return;}
    if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();answer(true);next();return;}
  }else{
    if((sess.mode==='clozeT'||sess.mode==='typeY')&&sess.picked===null)return;
    if(/^[1-4]$/.test(e.key)&&sess.picked===null&&sess.choices){const i=+e.key-1;sess.picked=i;answer(sess.choices[i].id===sess.items[sess.i].id);render();return;}
    if((e.key==='Enter'||e.key===' ')&&sess.picked!==null){e.preventDefault();next();return;}
  }});
// ほかのタブ（同じ保存データを使う、ほかのウィンドウ）が保存したら、その内容を取り込む。画面は描き直さない（入力中の文字や、開いた表を消さないため）。次に描くときに反映される
window.addEventListener('storage',e=>{if(e.key===KEY)sync();});

// テスト用の窓口（tests/ が、全用例の空所の位置などをページの中で確かめるのに使う。アプリの動きには関わらない）
window.__tangoTest={DATA,BOOKREL,findForm,makeChoices,choiceText,choiceMs:x=>choiceM(x).ms,hideWord,askable,qKanji,yomiOk,readings:it=>{const r=readings(it);return{ok:[...r.ok],more:r.more};}};
$('#n-kobun').textContent=DATA.kobun.length;$('#n-eigo').textContent=DATA.eigo.length;
{if(SUBJ.book){$('.about').textContent='収録: '+SUBJ.book.name+' '+DATA.book.length+'語（関連語 '+BOOKREL.length+'語）／読み '+(DATA.yomi?DATA.yomi.length:0)+'語'+(DATA.joshiki?'／古文常識 '+DATA.joshiki.length+'語':'')+'／古文 '+DATA.kobun.length+'語／英単語 '+DATA.eigo.length+'語。学習記録はこの端末のブラウザにだけ保存されます。';}}
if(!SUBJ[S.subj])S.subj='kobun';
function boot(d){try{if(d&&d.S){S.subj=d.S.subj||S.subj;S.tab=d.S.tab||S.tab;if(d.S.session)S.session=d.S.session;}}catch(e){}render();}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S:{subj:S.subj,tab:S.tab,session:S.session}}));}catch(e){}
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(boot):boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
