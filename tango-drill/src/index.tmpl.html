  waka:{flash:'枕詞・掛詞・縁語・歌枕などを見て、かかる語や意味を思い出し、めくって確認。'+FLASH_D,quiz:'枕詞がかかる語や、掛詞・縁語・歌枕・修辞の用語の意味を4つから選ぶ。選んだ瞬間に正誤と解説を表示します。',
    typeY:'歌枕などの漢字の読みをひらがなで入力します。現代仮名遣いで答えます。',quizR:'かかる語や意味から、枕詞・掛詞などを選ぶ逆方向。和歌の修辞を見抜く力に。'},
  bunpo:{flash:'助動詞・助詞・活用の名前を見て、意味・接続・活用を思い出し、めくって確認。'+FLASH_D,quiz:'助動詞・助詞の意味や、活用の形を4つから選ぶ。選んだ瞬間に正誤と接続・活用の解説を表示します。',
    typeY:'漢字の読みをひらがなで入力します。現代仮名遣いで答えます。',quizR:'意味や活用の形から、助動詞・助詞などを選ぶ逆方向。文法問題の識別に。'}};
MODE_D.book=MODE_D.kobun;
const modeDesc=mode=>{const d=MODE_D[baseOf(S.subj)]||MODE_D.kobun;return esc(d[mode]||MODE_D.kobun[mode]);};
// アプリ内の「使い方」。記録が空のとき（初めて開いたとき）は開いて出す。一度閉じたら prefs.howto='closed' を保存し、次からは閉じて出す。
// 同じページの中では、自分で開け閉めした状態（S.howto）を描き直しても保つ。
// 開いた状態で描くと、ブラウザが描画の直後に toggle を知らせてくる。これは利用者の操作ではないので、印（data-init）を付けて読み飛ばす
// （読み飛ばさないと、初回に閉じないまま学習したあとも「開いた」と覚えてしまい、ホームに戻っても開いたまま残る）。
// 記録が空のときはホームの上部に、記録があるときは出題設定の下に置く
function howtoHtml(fresh){const open=S.howto!=null?S.howto:(fresh&&store.prefs.howto!=='closed');
  const kobun=GROUPS[0].subs.filter(k=>SUBJ[k]).map(k=>SUBJ[k].name).join('・');
  const P=(h,t)=>`<p style="margin:8px 0 0"><b>${h}</b>　${t}</p>`;
  return `<section class="panel"><details class="refd" data-howto${open?' open data-init':''}><summary>使い方</summary><div class="hint" style="margin:0;font-size:.84rem;color:var(--fg)">
    ${P('教科と教材','上の「古文／英語」で教科を、その下のタブで教材を選びます（タブは横に送ると続きがあります）。古文は'+esc(kobun)+'、英語は英単語（全レベルとレベル別）。')}
    ${P('出題設定','出題モードのボタンを押すと始まります。出題範囲・問題数・出題順は、その下の「出題設定」で変えられます。設定は教材ごとに記憶されます。「おまかせ」は、復習の日が来た語と苦手の語を優先し、新しい語を4割ほど混ぜて出します。間違えた語は、同じセットの3〜5問あとにもう一度出ます。いちばん上の「今日の学習を始める」は、その日の復習と新しい語を1セットにして出します。')}
    ${P('出題モード','フラッシュカードは、めくって意味を確かめ「覚えた／まだ」を自分で付けます。4択は「語 → 意味」と「意味 → 語」の両方向。空所補充は、用例の空所に入る語を選ぶ・書く形です（古文単語・古文330・英単語）。読みを入力は、漢字の読みをひらがなで答えます（読み・古文常識など）。')}
    ${P('復習の間隔','正解した語は、翌日・3日後・7日後・14日後・30日後と、日をあけて復習に出ます。同じ日に何度正解しても、進むのは1回ぶんです。間違えると、翌日からやり直しになります。')}
    ${P('習得と苦手','日をあけて3回正解すると「習得」（習得した語も、日が来れば復習に出ます）。「苦手」は、一度正解したあとで間違えた語と、2回以上間違えた語です。初めて見た語を1回間違えただけなら「学習中」です。フラッシュカードの「覚えた」は正解、「まだ」は不正解として数えます。')}
    ${P('単語帳と成績','単語帳では語を検索して一覧で見られます。語を開くと意味や用例を確かめて、「苦手に登録」「習得済みにする」「記録を消す」ができます。カードの裏面・解答後の解説・単語帳にある「意味・メモを編集」で、意味を書き換えたり、自分のメモ（語呂・注意点）を足したりできます。編集した内容はこの端末に保存され、「元に戻す」でいつでも元の意味に戻せます（4択の選択肢と正誤の判定は元の意味のままです）。成績では、教材ごとの習得の割合、直近14日の回答数、苦手ワードを見られます。')}
    ${P('バックアップ','学習記録はこの端末のブラウザにだけ保存されます。別の端末へ移すときや控えを取るときは、成績タブの「記録をコピー」で文字列をコピーし、別の端末の欄に貼り付けて「復元」を押します。')}
    ${P('ホーム画面に追加','iPhone では、Safari の共有ボタンから「ホーム画面に追加」を選び、追加したアイコンから開くと、記録が消えにくくなります（Safari は、しばらく開かないページの保存データを消すことがあります）。')}
  </div></details></section>`;}
// 記録が空のときだけ、ホームの上部に出す一言
const firstHtml=()=>`<section class="panel" data-first><h2>はじめに</h2><p class="hint" style="margin:0 0 12px;font-size:.86rem;color:var(--fg)">上のタブで教材を選び、まずは「フラッシュカード」で語をめくってみましょう。間違えた語は、少しあとでもう一度出ます。</p><div class="row"><button class="btn acc" data-start-first>フラッシュカードで始める</button></div></section>`;

// フラッシュカード。表面は「答えを見る」だけ（カードのタップでもめくれる）。「まだ／覚えた」は、めくってから同じ位置に出す
function viewFlash(){const sess=S.session,it=sess.items[sess.i],head=progHtml(sess);
  if(!sess.flipped)return head+`<div class="card flip" data-flip tabindex="0" role="button">${chipsHtml(it)}${wordHtml(it)}<div class="tap">タップ<span class="kbd"> / Space </span>で意味を表示</div></div>
    <div class="actions one"><button class="btn acc" data-flip>答えを見る<small class="kbd" aria-hidden="true">Space</small></button></div>`;
  const lock=canJudge(sess)?'':' disabled';
  return head+`<div class="card back" tabindex="-1">${chipsHtml(it)}${wordHtml(it)}${detailHtml(it)}</div>
    <div class="actions"><button class="btn bad" data-ans="0"${lock}>まだ<small class="kbd" aria-hidden="true">← / 1</small></button><button class="btn ok" data-ans="1"${lock}>覚えた<small class="kbd" aria-hidden="true">→ / 2</small></button></div>`;}

function viewQuiz(){const sess=S.session,it=sess.items[sess.i],toM=sess.mode==='quiz',c=SUBJ[S.subj].cls;
  if(!sess.choices)sess.choices=makeChoices(it,sess.mode,S.subj);
  const prompt=toM?`<div class="qprompt">${SUBJ[S.subj].yomi?'この漢字の読みは？':isEn()?'この単語の意味は？':'この語の意味は？'}</div>${chipsHtml(it)}${wordHtml(it,'',qKanji(it))}`
    :`<div class="qprompt">${SUBJ[S.subj].yomi?'この読みの漢字は？':'この意味を表す'+SUBJ[S.subj].qw+'は？'}</div><div class="chips"><span class="chip acc">${esc(it.pos)}</span><span class="chip lv">${esc(lvName(it))}</span></div><p class="word gloss">${esc(hideWord(it).join('　／　'))}</p>`;
  const picked=sess.picked;
  // 語→意味の選択肢は、意味ごとの塊（.mm）に分け、塊の途中で折り返さないようにする（区切りの「／」は前の塊に付ける）
  const choices=sess.choices.map((x,i)=>{const st=picked===null?'':x.id===it.id?'correct':i===picked?'wrong':'dim';
    const inner=toM?`<span class="txt">${mmHtml(choiceM(x).tl)}</span>`:`<span class="txt ${c}"${enAttr()}>${esc(x.w)}</span>`;
    return choiceHtml(i,st,inner);}).join('');
  let after='';
  if(picked!==null){const ok=sess.choices[picked].id===it.id;
    after=`<div class="detail">${wordHtml(it)}${detailHtml(it)}</div>${bandHtml(ok,(ok?'正解':'不正解')+(ok?'':'　正答: '+esc(toM?it.m[0]:it.w)),true)}`;}
  return progHtml(sess)+`<div class="card q" tabindex="-1">${prompt}</div><div class="choices">${choices}</div>${after}`;}

function curCloze(sess){const it=sess.items[sess.i];sess.cz=sess.cz||{};
  if(it.exs){if(sess.cz[sess.i]===undefined){const ok=it.exs.map((e,j)=>findForm(it,e[0])?j:-1).filter(j=>j>=0);sess.cz[sess.i]=ok.length?ok[Math.floor(Math.random()*ok.length)]:-1;}
    const j=sess.cz[sess.i];if(j>=0)return{f:findForm(it,it.exs[j][0]),tr:it.exs[j][1],mi:j};}
  return{f:findForm(it),tr:it.tr,mi:-1};}
function viewCloze(){const sess=S.session,it=sess.items[sess.i],typed=sess.mode==='clozeT',c=SUBJ[S.subj].cls,cz=curCloze(sess),f=cz.f,en=enAttr();
  if(!typed&&!sess.choices)sess.choices=makeChoices(it,sess.mode,S.subj);
  const done=sess.picked!==null;const ok=done&&(typed?sess.picked===true:sess.choices[sess.picked].id===it.id);
  const bw=f.base||it.w; // 空所に入る語の終止形（併記の見出し語なら、用例に入っている1語）
  const sent=`<p class="cloze ${c}"${en}>${esc(done?f.pre:f.mpre)}<span class="blank ${done?(ok?'ok':'ng'):''}">${done?esc(f.hit):'＿＿＿＿'}</span>${esc(done?f.post:f.mpost)}</p><div class="tr" style="color:var(--muted);margin-top:6px">${esc(cz.tr)}</div>${done&&cz.mi>=0?`<div class="hint" style="margin:8px 0 0">この用例は意味${'①②③④⑤⑥'[cz.mi]}「${esc(it.m[cz.mi])}」</div>`:''}`;
  const prompt=`<div class="qprompt">空所に入る${SUBJ[S.subj].qw}は？${typed?(isEn()?'（英字で入力）':'（ひらがなで入力）'):''}</div><div class="chips"><span class="chip acc">${esc(it.pos)}</span><span class="chip lv">${esc(lvName(it))}</span>${typed?`<span class="chip">${esc(bw[0])}${'・'.repeat(Math.max(0,bw.length-1))}（${bw.length}字）</span>`:''}</div>${sent}`;
  let body='';
  if(typed){body=done?'':typeForm(isEn()?'英単語を入力':'ひらがなで入力',isEn()?'en':'ja');}
  else{body=`<div class="choices">${sess.choices.map((x,i)=>choiceHtml(i,!done?'':x.id===it.id?'correct':i===sess.picked?'wrong':'dim',`<span class="txt ${c}"${en}>${esc(x.w)}</span>`)).join('')}</div>`;}
  let after='';
  if(done){after=`<div class="detail">${wordHtml(it)}${detailHtml(it)}</div>${bandHtml(ok,(ok?'正解':'不正解')+(ok?'':'　正答: '+esc(f.hit)+(f.hit.toLowerCase()!==bw.toLowerCase()?'（'+esc(bw)+'）':''))+(typed&&sess.typedAns&&!ok?'　あなたの答え: '+esc(sess.typedAns):''),!typed)}`;}
  return progHtml(sess)+`<div class="card q" tabindex="-1">${prompt}</div>${body}${after}`;}
// 入力式の解答欄。スマホ幅でも入力欄と「答え合わせ」を1行に並べる（キーボードに隠れないように）
const typeForm=(ph,lang)=>`<form class="typeform" data-submit><input type="text" id="ans" aria-label="答えを入力" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="${ph}" lang="${lang}"><button class="btn acc" type="submit">答え合わせ<small class="kbd" aria-hidden="true">Enter</small></button></form>`;

function viewTypeY(){const sess=S.session,it=sess.items[sess.i],done=sess.picked!==null,ok=sess.picked===true;
  const prompt=`<div class="qprompt">この漢字の読みは？（ひらがなで入力。現代仮名遣いで。歴史的仮名遣いでも正解）</div>${chipsHtml(it)}${wordHtml(it)}`,more=readings(it).more;
  const body=done?'':typeForm('ひらがなで入力','ja');
  const after=done?`<div class="detail">${wordHtml(it)}${detailHtml(it)}</div>${bandHtml(ok,(ok?'正解':'不正解')+'　読み: '+esc(it.rd||it.m[0])+(more.length?'（別の読み: '+esc(more.join('・'))+'）':'')+(!ok&&sess.typedAns?'　あなたの答え: '+esc(sess.typedAns):''),false)}`:'';
  return progHtml(sess)+`<div class="card q" tabindex="-1">${prompt}</div>${body}${after}`;}

// 結果。主ボタン（塗り）は、誤答があれば「間違えたn語をもう一度」、全問正解なら「次のn問へ」。
// 「次のn問へ」は、これまでの回に出た語を除いて出題する（除くと0語になるときは「同じ設定でもう一度」）
// 正答数は、語ごとの最初の回答で数える（差し戻しの回答は数に入れず、回数だけ添える）。
// 「今回」の行: このセットで新しく習得になった語・まだ学習中の語（苦手を含む）の数と、次の復習の時期
function resultSum(sess){const first=new Map();for(const x of sess.res)if(!first.has(x.it))first.set(x.it,x.ok);
  const its=[...first.keys()],pre=sess.pre||{},st=its.map(status),by={};
  for(const it of its){const s=schedOf(it);if(s){const l=dueLab(s.d);by[l]=(by[l]||0)+1;}}
  return{its,n:its.length,ok:[...first.values()].filter(Boolean).length,wrong:its.filter(it=>!first.get(it)),again:sess.res.length-its.length,
    got:its.filter((it,i)=>st[i]==='ok'&&pre[it.id]&&pre[it.id]!=='ok').length,kept:its.filter((it,i)=>st[i]==='ok'&&pre[it.id]==='ok').length,
    learning:st.filter(s=>s==='learning'||s==='weak').length,weak:st.filter(s=>s==='weak').length,
    due:Object.entries(by).sort((a,b)=>(parseInt(a[0])||(a[0]==='明日'?1:0))-(parseInt(b[0])||(b[0]==='明日'?1:0))).map(([l,k])=>l+' '+k+'語').join('・')};}
function viewResult(){const sess=S.session,rs=resultSum(sess),n=rs.n,ok=rs.ok,wrong=rs.wrong,pct=n?Math.round(ok/n*100):0,c=SUBJ[S.subj].cls,en=enAttr();
  const r=52,circ=2*Math.PI*r,nx=nextItems(sess),t=store.days[today()]||0;
  return `<section class="panel"><div class="score">
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(circ*pct/100).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="var(--fg)" font-family="var(--sans)">${pct}%</text></svg>
    <div>${pct===100?'<span class="perfect">全問正解</span>':''}<div class="big num">${ok} / ${n} 問</div><div class="sm">${pct===100?'次は範囲を広げましょう。':pct>=80?'あと一歩。間違えた語は明日また出ます。':'間違えた語は明日また出ます。もう一度挑戦。'}${rs.again?`（間違えた語の出し直し ${rs.again}回）`:''}</div><div class="sm num">今日 ${t} / ${goalOf()} 問・連続 ${streak()} 日</div></div></div>
    <div class="rsum" data-rsum><p><b>今回</b>習得 <b class="num">${rs.got}</b>語・学習中 <b class="num">${rs.learning}</b>語${rs.weak?`（うち苦手 ${rs.weak}語）`:''}${rs.kept?`・習得のまま ${rs.kept}語`:''}</p>${rs.due?`<p><b>次の復習</b>${rs.due}</p>`:''}</div>
    <div class="row">${wrong.length?`<button class="btn acc" data-retry="wrong">間違えた ${wrong.length} 語をもう一度</button>`:''}<button class="btn${wrong.length?'':' acc'}" data-retry="same">${nx?'次の '+nx.length+' 問へ':'同じ設定でもう一度'}</button><button class="btn text" data-quit>ホームへ</button></div></section>
    ${wrong.length?`<h2 style="font-size:.95rem;margin:4px 0 4px">今回間違えた語 <span class="sub" style="font-weight:400;color:var(--muted);font-size:.8rem">押すと解説が開きます</span></h2><ul class="wlist res">${wrong.map(it=>`<li><details${S.resOpen===it.id?' open':''}><summary><span class="w ${c}"${en}>${esc(it.w)}${it.k||it.num?`<small>${numLab(it)}${it.k&&it.num?'　':''}${esc(it.k)}</small>`:''}</span><span class="m">${mmHtml(mOf(it))}</span></summary><div class="vdet">${detailHtml(it)}</div></details></li>`).join('')}</ul>`:''}`;}

// 単語帳。検索欄（#q）は残し、絞り込み・件数・一覧（#lbody）だけを差し替える（入力のたびに検索欄を作り直すと、日本語の変換入力が壊れる）
function viewList(){return `<input type="search" id="q" aria-label="語・意味で検索" placeholder="語・意味で検索" value="${esc(S.list.q)}" autocomplete="off" enterkeyhint="search">
  <div id="lbody">${listBody()}</div>`;}
function listBody(){const L=S.list,c=SUBJ[S.subj].cls,q=L.q.trim().toLowerCase();
  let items=DATA[S.subj].filter(it=>L.st==='all'||status(it)===L.st).filter(it=>L.lv==='all'||it.lv===+L.lv);
  const edTxt=it=>{const e=editOf(it.id);return e?' '+(e.m||[]).join(' ')+' '+(e.n||''):'';}; // 利用者の意味・メモも検索に当てる
  if(q)items=items.filter(it=>(it.w+' '+(it.k||'')+' '+it.m.join(' ')+edTxt(it)+' '+(it.der||'')+' '+(it.rel||[]).map(x=>x[0]+' '+x[2]).join(' ')+' '+(it.num||'')).toLowerCase().includes(q));
  const total=items.length;items=items.slice(0,L.shown);
  const chip=(k,v,lab)=>`<button class="fchip" data-f="${k}" data-v="${v}" aria-pressed="${String(L[k])===v}">${lab}</button>`;
  // 絞り込みは「状態」と「レベル・章・分野」の2段に分ける。分け方が6個を超える教材（古文常識など）は選択欄にする
  const lvs=SUBJ[S.subj].fixLv||SUBJ[S.subj].yomi?[]:Object.keys(SUBJ[S.subj].lv),kind=lvKind(S.subj);
  const lvF=!lvs.length?'':lvs.length>6?`<select data-fsel="lv" aria-label="${kind}で絞り込み"><option data-f="lv" value="all"${L.lv==='all'?' selected':''}>全${kind}</option>${lvs.map(l=>`<option data-f="lv" value="${l}"${String(L.lv)===l?' selected':''}>${esc(SUBJ[S.subj].lv[l])}</option>`).join('')}</select>`
    :chip('lv','all','全'+kind)+lvs.map(l=>chip('lv',l,esc(SUBJ[S.subj].lv[l]))).join('');
  return `<div class="filters"><div class="fgrp"><span class="fl">状態</span>${chip('st','all','すべて')}${chip('st','new','未学習')}${chip('st','learning','学習中')}${chip('st','weak','苦手')}${chip('st','ok','習得')}</div>${lvF?`<div class="fgrp"><span class="fl">${kind}</span>${lvF}</div>`:''}</div>
  <div class="count num">全 ${total} 語中 ${items.length} 語を表示</div>
  ${items.length?`<ul class="vlist">${items.map(it=>{const st=status(it),open=L.open===it.id;
    return `<li class="vrow"><button data-open="${esc(it.id)}" aria-expanded="${open}"><span class="dot ${st}" title="${STATUS[st]}"></span><span class="sr">${STATUS[st]}</span><span class="vw ${c}">${it.num?`<small style="margin:0 6px 0 0">${it.num}</small>`:''}<span${enAttr()}>${esc(it.w)}</span>${it.k?`<small>${esc(it.k)}</small>`:''}<small>${esc(it.pos)}</small></span><span class="vm">${mmHtml(mOf(it))}</span></button>
    ${open?`<div class="vdet">${detailHtml(it)}${schedOf(it)?`<p class="hint" data-due style="margin:10px 0 0">次の復習: ${dueLab(schedOf(it).d)}（段階 ${schedOf(it).g} / ${GMAX}。3以上で習得）</p>`:''}<div class="row"><button class="btn" data-set="weak" data-id="${esc(it.id)}">苦手に登録</button><button class="btn" data-set="ok" data-id="${esc(it.id)}">習得済みにする</button><button class="btn ghost" data-set="new" data-id="${esc(it.id)}">記録を消す</button></div></div>`:''}</li>`;}).join('')}</ul>
  ${total>items.length?`<div class="row" style="margin-top:12px"><button class="btn" data-more>さらに表示（残り ${total-items.length} 語）</button></div>`:''}`
  :'<div class="empty">該当する語がありません</div>'}`;}
// 単語帳の一覧だけを描き直す（単語帳を開いていなければ、画面全体を描く）
// 描き直したあと、押していた行・絞り込みにフォーカスを戻す（キーボードで続けて操作できるように）
function renderList(){const b=$('#lbody');if(!(b&&!S.session&&S.tab==='list')){render();return;}
  const a=document.activeElement,d=a&&b.contains(a)?a.dataset:null,sel=!d?'':d.open?`[data-open="${CSS.escape(d.open)}"]`:d.f?`[data-f="${d.f}"][data-v="${d.v}"]`:d.fsel?'[data-fsel]':'';
  b.innerHTML=listBody();const n=sel&&b.querySelector(sel);if(n)try{n.focus({preventScroll:true});}catch(e){}}

// 成績。上から: 学習の記録（今日・連続・累計と直近14日）→ 選択中の教材の内訳と苦手ワード → ほかの教材（タブと同じ順に1行ずつ。押すと内訳が開く）→ データ管理（折りたたみ）
function viewStats(){const c=SUBJ[S.subj].cls,cur=baseOf(S.subj);
  const body=s=>{const cc=counts(s),all=DATA[s],rc=SUBJ[s].book?countOf(BOOKREL):null;const lvn=Object.keys(SUBJ[s].lv).length>1&&!Object.values(SUBJ[s].lv).some(x=>/\d/.test(x));const lvs=Object.keys(SUBJ[s].lv).map(n=>{const a=all.filter(it=>it.lv===+n),o=a.filter(it=>status(it)==='ok').length;return{n,lab:SUBJ[s].lv[n],a:a.length,o};});
    return `<div class="legend" style="margin-bottom:6px"><span class="ok">習得 ${cc.ok}</span><span class="learning">学習中 ${cc.learning}</span><span class="weak">苦手 ${cc.weak}</span><span>未学習 ${cc.new}</span></div>
    ${rc?`<p class="hint" style="margin:0 0 6px">関連語 ${rc.total}語：習得 ${rc.ok}・学習中 ${rc.learning}・苦手 ${rc.weak}・未学習 ${rc.new}</p>`:''}
    ${lvs.map(l=>`<div class="lvbar"><span class="lab">${lvn?l.n+' ':''}${esc(l.lab)}</span><div class="track"><i style="width:${l.a?l.o/l.a*100:0}%"></i></div><span class="v num">${l.o}/${l.a}</span></div>`).join('')}`;};
  const barOf=cc=>`<div class="bar" aria-hidden="true"><i class="ok" style="width:${cc.ok/cc.total*100}%"></i><i class="learning" style="width:${cc.learning/cc.total*100}%"></i><i class="weak" style="width:${cc.weak/cc.total*100}%"></i></div>`;
  const openBlock=s=>{const cc=counts(s);return `<div class="panel"><h2>${esc(SUBJ[s].name)} <span class="sub">${cc.total}語</span></h2>${barOf(cc)}${body(s)}</div>`;};
  const lineBlock=s=>{const cc=counts(s);return `<details class="panel"><summary><h2>${esc(SUBJ[s].name)} <span class="sub">${cc.total}語</span></h2>${barOf(cc)}<span class="pc">${cc.total?Math.round(cc.ok/cc.total*100):0}%</span></summary>${body(s)}</details>`;};
  // 14日間の回答数。スマホ幅では図の基準の幅を小さくして、文字が小さくなりすぎないようにする
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:today(d),d,n:store.days[today(d)]||0});}
  const narrow=window.innerWidth<=560,max=Math.max(1,...days.map(x=>x.n)),W=narrow?340:560,H=narrow?130:120,pad=narrow?6:22,bw=(W-pad*2)/14,fs=narrow?11:10,gap=narrow?4:6;
  const bars=days.map((x,i)=>{const h=x.n/max*(H-44);const bx=pad+i*bw+gap/2;return `<rect x="${bx.toFixed(1)}" y="${(H-24-h).toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${x.n?'var(--accent-fill)':'var(--line)'}"/>${x.n?`<text x="${(bx+(bw-gap)/2).toFixed(1)}" y="${(H-28-h).toFixed(1)}" text-anchor="middle" font-size="${fs}" fill="var(--muted)">${x.n}</text>`:''}${i%2===1?`<text x="${(bx+(bw-gap)/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="${fs}" fill="var(--muted)">${x.d.getMonth()+1}/${x.d.getDate()}</text>`:''}`;}).join('');
  const isWeak=it=>status(it)==='weak',wHead=DATA[S.subj].filter(isWeak),wRel=relOf(S.subj).filter(isWeak);
  const weak=wHead.concat(wRel).map(it=>({it,r:store.prog[it.id]})).sort((a,b)=>b.r.x-a.r.x||a.r.c-b.r.c).slice(0,15);
  const total=Object.values(store.days).reduce((a,b)=>a+b,0),t=store.days[today()]||0;
  // 教材の並びはタブと同じ（選択中の教材だけ先頭に出す）
  const subjs=GROUPS.flatMap(g=>g.subs.filter(k=>SUBJ[k]&&!SUBJ[k].base));
  return `<section class="panel"><h2>学習の記録 <span class="sub">直近14日</span></h2>
    <div class="sum3"><div><div class="lab">今日</div><div class="val num">${t}<small>問</small></div></div><div><div class="lab">連続</div><div class="val num">${streak()}<small>日</small></div></div><div><div class="lab">累計</div><div class="val num" data-total>${total}<small>問</small></div></div></div>
    <svg class="act" viewBox="0 0 ${W} ${H}" role="img" aria-label="直近14日間の回答数"><line x1="${pad}" y1="${H-24}" x2="${W-pad}" y2="${H-24}" stroke="var(--line)"/>${bars}</svg>
    ${days.some(x=>x.n)?'':'<p class="hint" style="margin:8px 0 0">学習すると、ここに日ごとの回答数が出ます。</p>'}</section>
  <div class="sgrid">${openBlock(cur)}
  <section class="panel"><h2>${esc(SUBJ[S.subj].name)}の苦手ワード <span class="sub">間違いが多い順・上位15${SUBJ[S.subj].book?`（見出し語 ${wHead.length}語・関連語 ${wRel.length}語）`:''}</span></h2>
    ${weak.length?`<ul class="wlist">${weak.map(({it,r})=>`<li><span class="w ${c}"${enAttr()}>${esc(it.w)}</span>${it.num?`<span class="chip num">${numLab(it)}</span>`:''}${it.isRel?'<span class="chip">関連語</span>':''}<span class="m">${mmHtml(mOf(it))}</span><span class="num wn"><span class="wx">✕${r.x}</span><span class="wo">◯${r.c}</span></span></li>`).join('')}</ul>
    ${wHead.concat(wRel).some(it=>askable(it,'quiz'))?'<div class="row" style="margin-top:12px"><button class="btn acc" data-start-weak>苦手ワードだけ4択で復習</button></div>':''}`:'<p class="hint" style="margin:0">苦手に登録された語はありません。</p>'}</section>
  ${subjs.filter(k=>k!==cur).map(lineBlock).join('')}</div>
  <details class="panel dm" data-dm${S.dm||S.confirm||S.edConfirm?' open':''}><summary><h2>データ管理 <span class="sub">バックアップ・記録のリセット</span></h2></summary>
    <h3>バックアップ <span class="sub" style="font-weight:400;color:var(--muted);font-size:.8rem">別の端末へ記録を移す</span></h3>
    <div class="row"><button class="btn" data-export>記録をコピー</button></div>
    <p class="hint" style="margin:10px 0 6px">コピーした文字列を別の端末の下の欄に貼り付けて「復元」を押すと、記録が引き継がれます。</p>
    <textarea id="imp" aria-label="記録の貼り付け欄" placeholder="ここに貼り付け"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" data-import>復元（既存の記録と統合）</button></div>
    <div class="msg" id="msg" role="status">${esc(S.msg)}</div>
    <h3>編集した意味・メモ <span class="sub" style="font-weight:400;color:var(--muted);font-size:.8rem" data-edcount>${editCount()}件</span></h3>
    ${S.edConfirm?`<div class="confirm"><span>全教材の、編集した意味とメモ（${editCount()}件）をすべて消して、元の意味に戻します。元に戻せません。学習記録は消えません。</span><button class="btn bad sm" data-edreset="yes">消す</button><button class="btn ghost sm" data-edreset="no">やめる</button></div>`
    :editCount()?`<div class="row"><button class="btn ghost danger" data-edreset="ask">編集した意味・メモをすべて消す</button></div>`:'<p class="hint" style="margin:0">カードの裏面や単語帳の「意味・メモを編集」で書き換えた意味とメモは、ここに件数が出ます。記録のリセットでは消えません。</p>'}
    <h3 class="danger">記録のリセット</h3>
    ${S.confirm?`<div class="confirm"><span>${esc(SUBJ[S.subj].name)}の学習記録${SUBJ[S.subj].book?'（関連語を含む）':''}をすべて消します。元に戻せません。</span><button class="btn bad sm" data-reset="yes">消す</button><button class="btn ghost sm" data-reset="no">やめる</button></div>`
    :`<div class="row"><button class="btn ghost danger" data-reset="ask">${esc(SUBJ[S.subj].name)}の記録を消す</button></div>`}</details>`;}

/* ---- events ---- */
function setSubj(k){S.edit=null;S.edConfirm=false;if(k!==S.subj){S.list.q='';S.list.st='all';}S.list.shown=PAGE;S.subj=k;store.prefs.subj=k;store.prefs.last=Object.assign({},store.prefs.last,{[groupOf(k)]:k});save();S.session=null;S.msg='';S.zero=false;S.confirm=false;S.list.open=null;S.list.lv='all';render();}
document.querySelector('.switch').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(!b)return;const g=b.dataset.group;const last=(store.prefs.last||{})[g];leave(()=>setSubj(last&&SUBJ[last]?last:g));});
document.querySelector('.subtabs').addEventListener('click',e=>{const b=e.target.closest('[data-subj]');if(!b)return;const k=b.dataset.subj;leave(()=>setSubj(k));});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;const tab=b.dataset.tab;leave(()=>{S.tab=tab;S.session=null;S.msg='';S.zero=false;S.confirm=false;S.edit=null;S.edConfirm=false;render();});});
const view=$('#view');
view.addEventListener('change',e=>{const fs=e.target.closest('[data-fsel]');if(fs){S.list[fs.dataset.fsel]=fs.value;S.list.shown=PAGE;renderList();return;}
  const gp=e.target.closest('[data-gpref]');if(gp){store.prefs[gp.dataset.gpref]=gp.value;save();render();return;}
  const s=e.target.closest('[data-pref]');if(!s)return;const prev=prefsOf().range;setPref(s.dataset.pref,s.value);
  // 「今日の学習」の語数は、形式・問題数・番号・関連語の設定で変わるので、その枠だけ描き直す
  const tb=$('[data-today]');if(tb&&!S.session)tb.outerHTML=todayHtml();
  // 設定を変えたら、0語の案内は消す
  S.zero=false;const z=$('[data-zero]');if(z)z.remove();
  if(s.dataset.pref==='range'&&chapSync(prev,s.value)){const p=prefsOf(),f=$('#o-from'),t=$('#o-to');if(f)f.value=p.from;if(t)t.value=p.to;}
  document.querySelectorAll('[data-czn]').forEach(x=>{x.innerHTML=clozeNote();});});
// 単語帳の検索。日本語の変換中（compositionstart〜compositionend）は一覧を変えず、確定したときに反映する。
// 確定の知らせと input の順はブラウザによって違うので、どちらが先でも確定した文字で絞り込む。変換中の印は入力欄そのものに付ける（入力欄が作り直されたら消える）
const onSearch=q=>{if(S.list.q===q.value)return;S.list.q=q.value;S.list.shown=PAGE;renderList();};
view.addEventListener('compositionstart',e=>{if(e.target.id==='q')e.target._composing=true;});
view.addEventListener('compositionend',e=>{if(e.target.id==='q'){e.target._composing=false;onSearch(e.target);}});
view.addEventListener('input',e=>{if(e.target.id!=='q'||e.isComposing||e.target._composing)return;onSearch(e.target);});
view.addEventListener('click',e=>{
  const t=e.target;const h=(sel)=>t.closest(sel);let b;
  if(b=h('[data-start]')){start(b.dataset.start);return;}
  if(h('[data-start-first]')){start('flash');return;}
  if(h('[data-start-today]')){sync();const tp=todayPlan();start(todayMode(),tp.rev.concat(tp.fresh));return;}
  if(h('[data-start-weak]')){sync();const items=shuffle(DATA[S.subj].concat(relOf(S.subj)).filter(it=>status(it)==='weak'));start('quiz',items);return;}
  if(h('[data-quit]')){leave(()=>{S.session=null;S.edit=null;S.tab='home';render();});return;}
  if(b=h('[data-leave]')){const act=S.leave;S.leave=null;if(b.dataset.leave==='yes'&&act){S.session=null;saveSess();act();}else redraw();return;}
  if(b=h('[data-resume]')){if(b.dataset.resume==='yes')resume();else{S.resume=null;try{localStorage.removeItem(SKEY);}catch(x){}render();}return;}
  if(h('[data-more]')){S.list.shown+=PAGE;renderList();return;}
  if(h('[data-flip]')){flip();return;}
  if(b=h('[data-ans]')){if(!canJudge(S.session))return;answer(b.dataset.ans==='1');next();return;}
  if(h('[data-jump]')){const t=$('#tables');if(t)try{t.scrollIntoView({block:'start',behavior:'smooth'});t.focus({preventScroll:true});}catch(x){}return;}
  if(b=h('[data-pick]')){const sess=S.session;if(sess.picked!==null)return;sess.picked=+b.dataset.pick;answer(sess.choices[sess.picked].id===sess.items[sess.i].id);render();return;}
  if(h('[data-next]')){next();return;}
  if(b=h('[data-retry]')){const sess=S.session,seen=sess.seen.concat(sess.items.map(it=>it.id));
    if(b.dataset.retry==='wrong'){start(sess.mode,shuffle(resultSum(sess).wrong),seen);}else{const nx=nextItems(sess);if(nx)start(sess.mode,nx,seen);else start(sess.mode);}return;}
  if((b=h('[data-f]'))&&b.dataset.v!==undefined){S.list[b.dataset.f]=b.dataset.v;S.list.shown=PAGE;renderList();return;}
  if(b=h('[data-open]')){S.edit=null;S.list.open=S.list.open===b.dataset.open?null:b.dataset.open;renderList();return;}
  if(b=h('[data-set]')){const it=DATA[S.subj].find(x=>x.id===b.dataset.id);if(it){setStatus(it,b.dataset.set);renderList();}return;}
  if(b=h('[data-reset]')){S.dm=true;if(b.dataset.reset==='ask'){S.confirm=true;}else if(b.dataset.reset==='yes'){sync();forget(DATA[S.subj].concat(relOf(S.subj)).map(it=>it.id));save();S.confirm=false;S.msg='';}else{S.confirm=false;}render();return;}
  if(b=h('[data-edit]')){S.edit={id:b.dataset.edit};if(S.session&&!unfinished())S.resOpen=b.dataset.edit;reEdit();return;}
  if(b=h('[data-ed]')){const a=b.dataset.ed,E=S.edit;if(!E)return;const id=E.id;
    if(a==='revert')E.revert=true;else{if(a==='revert-yes')setEdit(id,null);S.edit=null;}
    reEdit(id);return;}
  if(b=h('[data-edreset]')){S.dm=true;const a=b.dataset.edreset;if(a==='ask')S.edConfirm=true;else{S.edConfirm=false;
      if(a==='yes'){sync();const t=Date.now();for(const id of Object.keys(store.edits||{})){const e=rawEdit(id);if(e&&!e.del)store.edits[id]={t:Math.max(t,e.t+1),del:1};}S.edit=null;S.msg=save()?'編集した意味・メモを消しました。':'';}}
    render();return;}
  if(h('[data-export]')){S.dm=true;sync();const txt=JSON.stringify(Object.assign({v:store.v,prog:store.prog,days:store.days},isObj(store.edits)?{edits:store.edits}:{}));const done=()=>{S.msg='コピーしました。別の端末で貼り付けてください。';render();};
    const fallback=()=>{const ta=$('#imp');if(ta){ta.value=txt;ta.focus();ta.select();}S.msg='下の欄に記録を表示しました。全選択してコピーしてください。';const m=$('#msg');if(m)m.textContent=S.msg;};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}else fallback();}catch(x){fallback();}return;}
  // バックアップの取り込み。形を確かめてから取り込む: 記録は {c,x,s,t} がどれも0以上の数値のものだけ（復習の段階と次の日 g・d は、形が正しければ残す。ほかの余分な欄は落とす）、
  // 日別の回答数は「年-月-日」の日付と0以上の数値の組だけ。おかしな項目は捨てて、取り込んだ件数と捨てた件数を知らせる。
  // 取り込みの優先は、2つのタブの記録を合わせるときと同じ（merge）
  if(h('[data-import]')){S.dm=true;const ta=$('#imp');try{const j=JSON.parse(ta.value);if(!isObj(j)||!isObj(j.prog))throw 0;const prog={},days={};let bad=0;
      for(const id in j.prog){const r=j.prog[id];if(validRec(r)){prog[id]={c:r.c,x:r.x,s:r.s,t:r.t};if(validG(r)){prog[id].g=r.g;prog[id].d=r.d;}}else bad++;}
      if(isObj(j.days)){for(const d in j.days){if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&isNum(j.days[d]))days[d]=j.days[d];else bad++;}}else if(j.days!=null)bad++;
      // 編集した意味・メモ（edits）は、形の正しいものだけ取り込む。古い控え（edits なし）はそのまま読める
      let edits;if(isObj(j.edits)){edits={};for(const id of Object.keys(j.edits)){const e=cleanEdit(j.edits[id]);if(e&&id!=='__proto__')edits[id]=e;else bad++;}}else if(j.edits!=null)bad++;
      sync();const mj=migrate(Object.assign({v:j.v,prog,days},edits?{edits}:{})),n=merge(mj,true),ne=mergeEdits(mj.edits,true);save();S.msg=n+' 語の記録を取り込みました。'+(ne?'編集した意味・メモ '+ne+' 件を取り込みました。':'')+(bad?'形の正しくない '+bad+' 件は読み飛ばしました。':'');}
    catch(x){S.msg='読み取れませんでした。コピーした文字列をそのまま貼り付けてください。';}render();return;}
});
// 「使い方」の開け閉め（toggle は泡立たないので、捕捉の段階で受ける）。閉じたら次からは閉じて出す
view.addEventListener('toggle',e=>{const d=e.target;if(!d.matches)return;if(d.matches('details[data-dm]')){S.dm=d.open;return;}if(!d.matches('details[data-howto]'))return;
  if(d.hasAttribute('data-init')){d.removeAttribute('data-init');if(d.open)return;}S.howto=d.open;
  if(!d.open&&store.prefs.howto!=='closed'){store.prefs.howto='closed';save();}},true);
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.card[data-flip]')){e.preventDefault();flip();}});
view.addEventListener('submit',e=>{const ef=e.target.closest('[data-edform]');if(ef){e.preventDefault();const it=findAny(ef.dataset.edform);if(it)saveEdit(it);return;}
  const f=e.target.closest('[data-submit]');if(!f)return;e.preventDefault();const sess=S.session;if(!sess||sess.picked!==null)return;const v=$('#ans').value;if(!v.trim())return;sess.typedAns=v.trim();const it_=sess.items[sess.i];const ok=sess.mode==='typeY'?yomiOk(it_,v):clozeOk(it_,v,curCloze(sess).f);sess.picked=ok;answer(ok);render();});
// 回答のキー操作。Ctrl・Alt・Meta を押しながらの操作（ブラウザのタブ切り替えや「戻る」）と、入力欄にいるときの操作は、回答に使わない
document.addEventListener('keydown',e=>{const sess=S.session;if(!sess||sess.i>=sess.items.length||S.leave||S.edit)return;if(e.target.closest&&e.target.closest('[data-edit]'))return;if(e.ctrlKey||e.altKey||e.metaKey)return;if(e.target.matches('input,textarea,select'))return;
  if(sess.mode==='flash'){
    if(e.key===' '){e.preventDefault();flip();return;}
    // 「まだ／覚えた」は、めくってから（表面では受け付けない）
    if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();if(canJudge(sess)){answer(false);next();}return;}
    if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();if(canJudge(sess)){answer(true);next();}return;}
  }else{
    if((sess.mode==='clozeT'||sess.mode==='typeY')&&sess.picked===null)return;
    if(/^[1-4]$/.test(e.key)&&sess.picked===null&&sess.choices){const i=+e.key-1;sess.picked=i;answer(sess.choices[i].id===sess.items[sess.i].id);render();return;}
    if((e.key==='Enter'||e.key===' ')&&sess.picked!==null){e.preventDefault();next();return;}
  }});
// ほかのタブ（同じ保存データを使う、ほかのウィンドウ）が保存したら、その内容を取り込む。画面は描き直さない（入力中の文字や、開いた表を消さないため）。次に描くときに反映される
window.addEventListener('storage',e=>{if(e.key===KEY)sync();});

// テスト用の窓口（tests/ が、全用例の空所の位置などをページの中で確かめるのに使う。アプリの動きには関わらない）
window.__tangoTest={editOf,status,schedOf,todayPlan,resultSum,session:()=>S.session,render,DATA,BOOKREL,findForm,makeChoices,choiceText,choiceMs:x=>choiceM(x).ms,hideWord,askable,qKanji,yomiOk,readings:it=>{const r=readings(it);return{ok:[...r.ok],more:r.more};}};
// フッターの収録内容。教材の一覧（GROUPS）から、タブと同じ名前・順で、語数はデータから数える（英語のレベル別タブは英単語に含まれるので出さない）
$('.about').textContent='収録: '+GROUPS.flatMap(g=>g.subs.filter(k=>SUBJ[k]&&!SUBJ[k].base)).map(k=>SUBJ[k].name+' '+DATA[k].length+'語'+(SUBJ[k].book?'（関連語 '+BOOKREL.length+'語）':'')).join('／')+'。学習記録はこの端末のブラウザにだけ保存されます。';
if(!SUBJ[S.subj])S.subj='kobun';
function boot(d){try{if(d&&d.S){S.subj=d.S.subj||S.subj;S.tab=d.S.tab||S.tab;if(d.S.session){S.session=d.S.session;if(!Array.isArray(S.session.seen))S.session.seen=[];}}}catch(e){}if(!S.session)S.resume=loadSess();render();}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S:{subj:S.subj,tab:S.tab,session:S.session}}));}catch(e){}
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(boot):boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
