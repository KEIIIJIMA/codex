r this course.","その大学はこの課程に100人の定員を設けている。"]],"quotation":[["The essay opens with a famous quotation from Shakespeare.","そのエッセイはシェイクスピアの有名な引用文で始まる。"],["We asked three companies to send us a quotation for the repairs.","私たちは修理の見積書を送るよう3社に依頼した。"]],"quote":[["The author quotes several historians to support her argument.","著者は自説を裏づけるために数人の歴史家の言葉を引用している。"],["The teacher wrote a famous quote from Einstein on the board.","先生はアインシュタインの有名な引用文を黒板に書いた。"],["The builder gave us a quote of five million yen for the work.","建設業者はその工事に500万円の見積もりを出した。"]],"radical":[["The invention brought about radical changes in the way people communicate.","その発明は人々のコミュニケーションの仕方に根本的な変化をもたらした。"],["The party's radical members demanded the immediate end of the monarchy.","その党の急進的な議員たちは君主制の即時廃止を要求した。"],["The group published radical views that shocked many ordinary citizens.","そのグループは多くの一般市民に衝撃を与える過激な主張を発表した。"]],"ramification":[["Every legal change has ramifications that nobody predicted at first.","あらゆる法改正には、当初だれも予想しなかった派生的結果が生じる。"],["The ramifications of the decision are still being felt today.","その決定の波及的影響は今なお感じられている。"]],"rampant":[["Disease was rampant in the crowded refugee camps.","混雑した難民キャンプでは病気が蔓延していた。"],["Corruption was rampant in the old government.","旧政府では汚職がはびこっていた。"]],"rancor":[["Years of rancor between the families finally ended with an apology.","何年も続いた両家の深い恨みは、ついに謝罪で終わった。"],["The speech was full of rancor toward foreign workers.","その演説は外国人労働者への憎悪に満ちていた。"]],"random":[["The researchers selected participants at random from the list.","研究者たちはリストから無作為に参加者を選んだ。"],["He gave a few random answers because he had not studied.","彼は勉強していなかったので、でたらめな答えをいくつか書いた。"]],"range":[["The shop offers a wide range of products for children.","その店は子ども向けの幅広い範囲の商品を扱っている。"],["The price of the tickets ranges from ten to fifty dollars.","チケットの値段は10ドルから50ドルまで及ぶ。"],["Tall mountains range along the northern border of the country.","高い山々がその国の北の国境沿いに並んでいる。"]],"rank":[["He rose to the rank of general at the age of forty.","彼は40歳で将軍の地位に昇った。"],["Soldiers of lower rank must obey their superiors.","下位の階級の兵士は上官に従わなければならない。"],["Experts rank this city as one of the safest in the world.","専門家はこの都市を世界で最も安全な都市の一つに位置づけている。"]],"rare":[["It is rare for a student to finish the whole book in a day.","生徒が1日で本全体を読み終えることはまれだ。"],["This rare bird lives only in the mountains of the north.","この珍しい鳥は北の山地にしか生息しない。"]],"rate":[["The birth rate in Japan has been falling for decades.","日本の出生率は数十年にわたって低下し続けている。"],["The ice is melting at a faster rate than scientists expected.","氷は科学者の予想より速い速度で溶けている。"],["Customers rated the hotel highly for its friendly staff.","客は親切な従業員のおかげでそのホテルを高く評価した。"]],"rational":[["Choosing the cheaper option was the most rational decision.","安い方を選んだのは最も合理的な判断だった。"],["A rational person would think carefully before making such a decision.","理性的な人ならそのような決断をする前に慎重に考えるだろう。"]],"react":[["Children often react strongly to changes in their daily routine.","子どもは日課の変化に強く反応することがよくある。"],["Many residents reacted against the plan to build a factory nearby.","多くの住民が近くに工場を建てる計画に反発した。"]],"readily":[["Fresh vegetables are readily available at the local market.","新鮮な野菜は地元の市場で簡単に手に入る。"],["She readily agreed to help us move to the new house.","彼女は新居への引っ越しを手伝うことを快く承諾した。"]],"reality":[["Reality is often very different from what we expect.","現実はしばしば私たちの予想とまったく異なる。"],["The report revealed the reality of working conditions in the factory.","その報告書は工場の労働条件の実態を明らかにした。"]],"reasonable":[["It is reasonable to expect students to finish homework on time.","生徒が宿題を期限内に終えると期待するのは道理にかなっている。"],["The restaurant offers good food at a reasonable price.","そのレストランは手頃な値段でおいしい料理を出す。"]],"rebel":[["The rebel was arrested and accused of plotting against the king.","その反逆者は王に対する陰謀を企てた罪で逮捕された。"],["Teenagers sometimes rebel against their parents' rules.","十代の若者は時に親の決まりに反抗する。"]],"rebuke":[["The teacher rebuked the student for cheating on the exam.","教師は試験でカンニングをした生徒を叱責した。"],["The minister's remarks drew a sharp rebuke from the opposition.","大臣の発言は野党から厳しい非難を招いた。"]],"recalcitrant":[["The recalcitrant student refused to follow any of the rules.","その反抗的な生徒はどの規則にも従おうとしなかった。"],["The farmer struggled with a recalcitrant donkey that would not move.","農夫は動こうとしない手に負えないロバに苦戦した。"]],"recall":[["I cannot recall where I first met her.","彼女とどこで初めて会ったのか思い出せない。"],["The government recalled its ambassador after the diplomatic dispute.","政府は外交上の対立の後、大使を本国に呼び戻した。"]],"recant":[["Under pressure, the scientist recanted his earlier statement.","圧力を受けて、その科学者は以前の発言を撤回した。"],["He refused to recant his words even when threatened with prison.","彼は投獄すると脅されても前言を取り消そうとしなかった。"]],"recede":[["The glacier has receded by several kilometers over the past century.","その氷河は過去100年で数キロ後退した。"],["The sound of the train slowly receded into the distance.","列車の音はゆっくりと遠くへ遠ざかっていった。"],["As the flood waters receded, residents returned to their homes.","洪水の水が引くと、住民は家に戻った。"]],"recession":[["Many small shops closed during the long recession.","長引く不況の間に多くの小さな店が閉店した。"],["Economists warned that the country was heading toward another recession.","経済学者たちは、その国がまたも景気後退に向かっていると警告した。"]],"recipient":[["The recipient of the package must sign for it at the door.","小包の受取人は玄関で受領のサインをしなければならない。"],["The recipients of the award were announced on Friday.","受賞者は金曜日に発表された。"],["Organ recipients must take medicine for the rest of their lives.","臓器の受容者は生涯薬を飲み続けなければならない。"]],"reclaim":[["She went to the station to reclaim her lost luggage.","彼女は失くした荷物を取り戻しに駅へ行った。"],["Dutch engineers reclaimed large areas of land from the sea.","オランダの技術者たちは海から広大な土地を開墾した。"]],"recognize":[["Children learn to recognize letters before they start school.","子どもは学校に上がる前に文字を認識できるようになる。"],["Scientists now recognize the importance of sleep for memory.","科学者たちは今では記憶にとっての睡眠の重要性を認めている。"],["I recognized her face from a photograph I had seen.","その写真で見たことがあったので、彼女の顔に見覚えがあった。"]],"recover":[["It took him several months to recover from the injury.","彼がけがから回復するのに数か月かかった。"],["Police recovered the stolen paintings from a warehouse near the port.","警察は港近くの倉庫から盗まれた絵画を取り戻した。"]],"recruit":[["The company plans to recruit fifty new graduates next spring.","その会社は来春50人の新卒者を採用する予定だ。"],["The club is recruiting new members this month.","そのクラブは今月、新入部員を募集している。"],["Every new recruit must complete a month of basic training.","新人は全員1か月の基礎訓練を修了しなければならない。"]],"rectify":[["The company promised to rectify the error immediately.","会社はその誤りを直ちに是正すると約束した。"],["It is never too late to rectify a mistake.","誤りを正すのに遅すぎることはない。"]],"reduce":[["We must reduce the amount of plastic waste we produce.","私たちは出すプラスチックごみの量を減らさなければならない。"],["Regular exercise can reduce the risk of heart disease.","定期的な運動は心臓病のリスクを減少させる。"]],"redundant":[["The report contains a lot of redundant information.","その報告書には余分な情報が多く含まれている。"],["Hundreds of workers were made redundant when the factory closed.","工場の閉鎖で数百人の労働者が解雇された。"]],"refer":[["The author refers to several studies to support her claim.","著者は主張を裏付けるためにいくつかの研究に言及している。"],["Students may refer to their notes during the open-book exam.","生徒は持ち込み可の試験中にノートを参照してよい。"],["The doctor referred her to a specialist at the university hospital.","医師は彼女を大学病院の専門医のもとへ差し向けた。"]],"refine":[["Years of practice helped her refine her technique as a violinist.","長年の練習のおかげで、彼女はバイオリニストとしての技術を洗練させることができた。"],["Oil must be refined before it can be used as fuel.","石油は燃料として使えるようになる前に精製されなければならない。"]],"reflect":[["The survey results reflect a change in public attitudes.","その調査結果は世論の態度の変化を反映している。"],["He took a walk by the river to reflect on his decision.","彼は決断について熟考するために川沿いを散歩した。"],["The white walls reflect sunlight and keep the house cool.","白い壁は日光を反射し、家を涼しく保つ。"]],"reform":[["The government promised to carry out education reform.","政府は教育改革を実施すると約束した。"],["The company promised to reform its hiring practices.","その会社は採用の慣行を改善すると約束した。"]],"refrain":[["Visitors are asked to refrain from taking photographs.","来場者は写真撮影をお控えください。"],["The speaker refrained from commenting on the ongoing investigation.","発言者は進行中の捜査についてコメントを差し控えた。"]],"refuse":[["The company refused to admit that the product was dangerous.","会社はその製品が危険だと認めることを拒んだ。"],["She refused the job offer because the salary was too low.","彼女は給料が低すぎたので、その仕事の誘いを断った。"]],"regain":[["The team hopes to regain the title it lost last year.","そのチームは昨年失った王座を取り戻したいと願っている。"],["It took weeks for her to regain consciousness after the crash.","事故後、彼女が意識を回復するまで数週間かかった。"]],"regard":[["Many people regard the invention as a turning point in history.","多くの人がその発明を歴史の転換点とみなしている。"],["Many people regard him as the greatest player of his generation.","多くの人が彼を同世代で最高の選手と見なしている。"],["The students hold their teacher in high regard.","生徒たちは先生に高い敬意を抱いている。"]],"regime":[["The military regime ruled the country for nearly twenty years.","軍事政権は20年近くその国を支配した。"],["The old regime collapsed after years of public protest.","旧体制は何年にもわたる民衆の抗議の末に崩壊した。"],["The new tax regime favors small businesses over large ones.","新しい税制度は大企業より中小企業を優遇する。"]],"region":[["This region is famous for its mild climate and fresh fruit.","この地域は温暖な気候と新鮮な果物で有名だ。"],["Snowfall is heavy in the Tohoku region every winter.","東北地方では毎冬雪が多い。"]],"regulate":[["The government regulates the sale of dangerous chemicals.","政府は危険な化学物質の販売を規制している。"],["The thermostat regulates the temperature of the room automatically.","サーモスタットは部屋の温度を自動的に調整する。"]],"rehabilitate":[["The center helps injured soldiers rehabilitate and return to normal life.","そのセンターは負傷した兵士が社会復帰して通常の生活に戻れるよう手助けする。"],["The program helps prisoners rehabilitate and find jobs.","そのプログラムは受刑者が更生して仕事を見つけるのを助ける。"],["The city plans to rehabilitate the old district by repairing its buildings.","市は建物を修繕して旧市街を修復する計画だ。"]],"rehearse":[["The actors rehearsed the final scene again and again.","俳優たちは最後の場面を何度もリハーサルした。"],["She rehearsed her speech in front of the mirror every night.","彼女は毎晩鏡の前で演説を予行した。"]],"reimburse":[["The company will reimburse you for travel expenses.","会社があなたに出張費を払い戻します。"],["He reimbursed his friend the money he had borrowed.","彼は借りていた金を友人に返済した。"]],"reject":[["She rejected his offer of help and tried to do it herself.","彼女は彼の手助けの申し出を拒絶し、自分でやろうとした。"],["The committee rejected the proposal because of its high cost.","委員会は費用の高さを理由にその提案を却下した。"]],"rejoice":[["The whole village rejoiced at the news of the safe return.","村中が無事帰還の知らせに喜んだ。"],["Crowds rejoiced in the streets to celebrate the national victory.","群衆は国の勝利を祝って通りで歓喜した。"]],"rejuvenate":[["A week in the mountains rejuvenated her tired mind and body.","山で過ごした一週間は彼女の疲れた心身を若返らせた。"],["New businesses helped rejuvenate the declining town center.","新しい店が衰退する町の中心部を活性化させた。"]],"relegate":[["The team was relegated to the second division after a poor season.","そのチームは不振なシーズンの後、2部に格下げされた。"],["Women were often relegated to minor roles in the past.","女性は過去には取るに足りない役割に追いやられることが多かった。"]],"relentless":[["The soldiers faced the relentless attacks of the enemy.","兵士たちは敵の容赦のない攻撃に直面した。"],["The team faced relentless pressure from the media.","チームはメディアからの絶え間ない圧力に直面した。"]],"relevant":[["Please include only information that is relevant to the topic.","話題に関連のある情報だけを含めてください。"],["Choose a relevant example to support your argument in the essay.","エッセイでは主張を支える適切な例を選びなさい。"]],"reliable":[["We need a reliable source of clean energy.","私たちには信頼できるクリーンエネルギー源が必要だ。"],["We need reliable evidence before we can accept the theory.","その理論を受け入れる前に確かな証拠が必要だ。"]],"relieve":[["Gentle exercise can relieve stress and improve your mood.","軽い運動はストレスを和らげ気分を向上させる。"],["The good news relieved her parents, who had been worried for days.","その吉報は、何日も心配していた彼女の両親を安心させた。"]],"relinquish":[["The king was forced to relinquish his claim to the throne.","王は王位継承権を手放さざるを得なかった。"],["He relinquished his right to appeal the decision.","彼はその決定に控訴する権利を放棄した。"]],"reluctance":[["The students showed reluctance to start the long assignment.","生徒たちはその長い課題に取りかかる気が進まない様子を見せた。"],["Her reluctance to speak in public surprised her friends.","人前で話すことへの彼女のためらいは友人たちを驚かせた。"]],"rely":[["Many farmers rely on rain to water their crops.","多くの農家は作物に水をやるのに雨に頼っている。"],["You cannot rely on him to arrive on time.","彼が時間どおりに来ることは当てにできない。"]],"remain":[["Several important questions remain unanswered after the experiment.","実験の後も、いくつかの重要な疑問が未解決のまま残っている。"],["Many villagers remained in their homes despite the warning.","多くの村人は警告にもかかわらず家にとどまった。"],["He ate the remains of the cake and went to bed.","彼はケーキの残りを食べて寝た。"]],"remark":[["She made a thoughtful remark about the future of education.","彼女は教育の将来について思慮深い意見を述べた。"],["His casual remark made everyone in the room laugh.","彼のさりげない一言が部屋中の人を笑わせた。"],["The teacher remarked that the class had improved a great deal.","先生はクラスが大きく進歩したと述べた。"]],"remedy":[["Rest is the best remedy for a common cold.","安静は普通の風邪にとって最良の治療法だ。"],["There is no simple remedy for the problem of poverty.","貧困問題には簡単な解決策はない。"],["The city must remedy the shortage of nurses soon.","市は看護師不足を早急に改善しなければならない。"]],"reminiscent":[["The smell of the sea is reminiscent of my childhood.","海の香りは私に子どものころを思い起こさせる。"],["The architecture is reminiscent of ancient Greek temples.","その建築様式は古代ギリシャの神殿を連想させる。"]],"remnant":[["He gave the remnants of the fabric to his sister.","彼は布の残りを妹にあげた。"],["Remnants of the ancient wall can still be seen today.","古代の城壁の名残は今でも見ることができる。"],["Archaeologists found remnants of a Stone Age settlement near the river.","考古学者たちは川の近くで石器時代の集落の遺物を発見した。"]],"remonstrate":[["He remonstrated with the officials over the unfair decision.","彼は不公平な決定について役人に抗議した。"],["She tried to remonstrate with her brother about his reckless driving.","彼女は兄の無謀な運転をいさめようとした。"]],"remove":[["Workers removed the fallen trees from the road after the storm.","作業員たちは嵐の後、道路から倒木を取り除いた。"],["This filter can remove harmful chemicals from drinking water.","このフィルターは飲料水から有害な化学物質を除去できる。"]],"render":[["The accident rendered him unable to walk.","その事故で彼は歩けなくなった。"],["The artist rendered the scene of the harbor in soft colors.","画家は港の情景を柔らかな色で表現した。"]],"renew":[["You must renew your passport before it expires.","パスポートは期限が切れる前に更新しなければならない。"],["The two countries agreed to renew trade talks next month.","両国は来月、貿易交渉を再開することで合意した。"],["A good night's sleep helped renew her energy for the day.","ぐっすり眠って、彼女はその日への活力を新たにした。"]],"renounce":[["He renounced his claim to the family fortune.","彼は一族の財産に対する権利を放棄した。"],["After his illness, he renounced smoking and alcohol for good.","病気の後、彼はたばこと酒を永久に断った。"],["The prince renounced his family and left the palace forever.","王子は家族と縁を切り、永遠に宮殿を去った。"]],"renovate":[["They plan to renovate the old library next year.","彼らは来年、古い図書館を改装する予定だ。"],["Volunteers helped renovate the damaged school after the earthquake.","ボランティアたちは地震後、被害を受けた学校の修復を手伝った。"]],"renowned":[["The renowned chef opened a restaurant in the center of Kyoto.","その有名な料理人は京都の中心部にレストランを開いた。"],["She is a renowned scientist known for her work on climate change.","彼女は気候変動に関する研究で知られる名高い科学者だ。"]],"repay":[["He worked two jobs to repay his debts.","彼は借金を返済するために二つの仕事をかけもちした。"],["She wanted to repay her teacher for all his kindness.","彼女は先生のあらゆる親切に恩返しをしたかった。"]],"repeal":[["Parliament voted to repeal the unpopular law.","議会は不評な法律を廃止することを票決した。"],["Activists called for the repeal of the outdated law.","活動家たちはその時代遅れの法律の撤廃を求めた。"]],"repel":[["The soldiers repelled the enemy attack at the border.","兵士たちは国境で敵の攻撃を撃退した。"],["The proud king repelled every offer of peace from his rivals.","誇り高い王は敵からの和平の申し出をことごとくはねつけた。"]],"replace":[["Robots may replace human workers in many factories.","ロボットが多くの工場で人間の労働者に取って代わるかもしれない。"],["We plan to replace the old computers with new ones next year.","私たちは来年、古いコンピューターを新しいものに置き換える計画だ。"]],"replenish":[["The shop replenishes its shelves every morning.","その店は毎朝棚の商品を補充する。"],["The farmer waited for the rain to replenish the dry reservoir.","農夫は雨が干上がった貯水池を再び満たしてくれるのを待った。"]],"replicate":[["Viruses use host cells to replicate themselves.","ウイルスは自らを複製するために宿主細胞を利用する。"],["Other researchers failed to replicate the results of the experiment.","他の研究者たちはその実験結果を再現できなかった。"]],"reprehensible":[["Such cruel behavior is morally reprehensible.","そのような残酷な行為は道徳的に非難されるべきだ。"],["It is reprehensible that the company ignored the workers' complaints.","会社が労働者の苦情を無視したのは、けしからぬことだ。"]],"represent":[["Each delegate represents a different country at the meeting.","各代表はその会議で異なる国を代表している。"],["The red line on the map represents the old border.","地図上の赤い線は旧国境を表している。"]],"repress":[["The government tried to repress any form of protest.","政府はあらゆる形の抗議を抑え込もうとした。"],["He tried to repress a yawn during the long speech.","彼は長い演説の間、あくびを抑えようとした。"]],"reprimand":[["The manager reprimanded him for arriving late again.","部長は再び遅刻した彼を叱責した。"],["The officer received a formal reprimand for ignoring the safety rules.","その職員は安全規則を無視したため正式に譴責を受けた。"]],"reproach":[["She looked at him with a glance of silent reproach.","彼女は無言の非難のまなざしで彼を見た。"],["The boy hung his head, afraid of his father's reproach.","少年は父の叱責を恐れてうなだれた。"],["She reproached herself for forgetting her friend's birthday.","彼女は友人の誕生日を忘れたことで自分を責めた。"]],"reproduce":[["Some animals reproduce only once in their lifetime.","一生に一度しか繁殖しない動物もいる。"],["The experiment was hard to reproduce in other laboratories.","その実験は他の研究室では再現が難しかった。"],["The museum reproduced the ancient map for sale in its shop.","博物館は古代の地図を複製して売店で販売した。"]],"repudiate":[["The leader repudiated the claim that he had broken the law.","指導者は法を犯したという主張を否定した。"],["The new government repudiated the treaty signed by its predecessor.","新政府は前政権が署名した条約を拒絶した。"]],"reputation":[["The school has a good reputation for its science program.","その学校は理科のプログラムで評判が高い。"],["The scientist gained an international reputation for her work on cancer.","その科学者はがんの研究で国際的な名声を得た。"]],"require":[["This job requires a high level of concentration.","この仕事は高い集中力を必要とする。"],["The law requires all drivers to carry a valid license.","その法律はすべての運転者に有効な免許の携帯を要求している。"]],"requisite":[["Patience is a requisite quality for any good teacher.","忍耐は優れた教師すべてに必須の資質だ。"],["A high score on the exam is a requisite for admission.","試験での高得点は入学の必要条件だ。"]],"rescind":[["The government rescinded the ban on public meetings last year.","政府は昨年、集会禁止令を廃止した。"],["The board voted to rescind the controversial policy.","理事会は物議を醸した方針を撤回することを票決した。"]],"resent":[["Many workers resented the sudden change in their working hours.","多くの労働者が勤務時間の突然の変更に憤慨した。"],["She resented being treated like a child by her relatives.","彼女は親戚に子ども扱いされるのを不快に思った。"]],"reserve":[["We reserved a table for six at the restaurant.","私たちはレストランに6人用の席を予約した。"],["He reserved a part of his salary for emergencies.","彼は給料の一部を非常時のために取っておいた。"],["The country holds large oil reserves under the desert.","その国は砂漠の下に大量の石油の蓄えを持っている。"]],"reside":[["Most of the residents reside in the northern part of the city.","住民の大半は市の北部に住んでいる。"],["The real power in the company resides in the board of directors.","その会社の真の権力は取締役会に存在する。"]],"residence":[["The family bought a large residence on the hill.","その家族は丘の上の大きな住居を購入した。"],["Foreigners must prove six months of residence to apply.","外国人は申請するために6か月間の居住を証明しなければならない。"]],"residual":[["The residual amount was paid back to the customers.","残りの金額は客に返金された。"],["Residual heat from the engine kept the room warm for hours.","エンジンの残熱が何時間も部屋を暖かく保った。"]],"resign":[["The minister resigned after the scandal became public.","スキャンダルが公になった後、大臣は辞任した。"],["He resigned himself to the fact that he would not win.","彼は勝てないという事実をあきらめて受け入れた。"]],"resist":[["The villagers resisted the army for several months.","村人たちは数か月間軍に抵抗した。"],["This metal can resist very high temperatures without melting.","この金属は溶けることなく非常な高温に耐える。"],["I could not resist laughing at his joke.","彼の冗談に、私は笑いを我慢できなかった。"]],"resolve":[["The two countries resolved the conflict through peaceful talks.","両国は平和的な話し合いによって紛争を解決した。"],["She resolved to study abroad after graduating from university.","彼女は大学卒業後に留学することを決意した。"],["His firm resolve helped him overcome many difficulties.","彼の固い決意が多くの困難を乗り越える助けとなった。"]],"resource":[["Water is one of the most valuable natural resources.","水は最も貴重な天然資源の一つだ。"],["The library offers online resources for students writing papers.","図書館は論文を書く学生のためにオンライン資料を提供している。"],["Her last resource was to appeal directly to the mayor.","彼女の最後の手段は市長に直接訴えることだった。"]],"respective":[["The two friends went to their respective homes after the party.","二人の友人はパーティーの後、それぞれの家に帰った。"],["The students returned to their respective seats after the break.","生徒たちは休憩の後、各自の席へ戻った。"]],"respond":[["The patient responded well to the new treatment.","その患者は新しい治療によく反応した。"],["She has not yet responded to my email.","彼女はまだ私のメールに返答していない。"]],"responsible":[["Who is responsible for cleaning the classroom this week?","今週は誰が教室の掃除の責任を負っていますか。"],["Smoking is responsible for many cases of lung disease.","喫煙は多くの肺疾患の原因である。"]],"restore":[["The treatment helped restore his hearing after the accident.","その治療は事故後の彼の聴力を回復させる助けになった。"],["Volunteers worked hard to restore the old temple to its original state.","ボランティアたちは古い寺を元の状態に復元するために懸命に働いた。"]],"restrain":[["She tried to restrain her anger during the argument.","彼女は議論の間、怒りを抑えようとした。"],["Two guards had to restrain the angry man at the gate.","2人の警備員は門のところで怒った男を制止しなければならなかった。"]],"restraint":[["The government called for restraint in the use of water.","政府は水の使用に抑制を求めた。"],["The police showed great restraint during the demonstration.","警察はデモの間、非常に自制した対応を見せた。"],["The law imposes strict restraints on the sale of weapons.","その法律は武器の販売に厳しい制限を課している。"]],"restrict":[["The law restricts the use of mobile phones while driving.","その法律は運転中の携帯電話の使用を制限している。"],["The study restricts its analysis to students in urban schools.","その研究は分析を都市部の学校の生徒に限定している。"]],"resume":[["The talks will resume as soon as both sides are ready.","両者の準備ができ次第、協議は再開される。"],["After the break, she resumed her work with fresh energy.","休憩の後、彼女は新たな気力で仕事を再び始めた。"]],"retail":[["Online shopping has changed the retail industry dramatically.","インターネット通販は小売業界を劇的に変えた。"],["The store retails the same shirt at twice the wholesale price.","その店は同じシャツを卸値の2倍で小売りしている。"]],"retaliate":[["The country threatened to retaliate against the new tariffs.","その国は新たな関税に報復すると警告した。"],["When he pushed her, she retaliated by pushing him back.","彼に押されて、彼女は押し返してやり返した。"]],"reticent":[["The reticent boy rarely spoke to anyone in class.","その無口な少年は教室でほとんど誰とも話さなかった。"],["He was reticent about his past and rarely spoke of it.","彼は過去について口数が少なく、めったに話題にしなかった。"]],"retreat":[["The enemy was forced to retreat to the other side of the river.","敵は川の向こう岸へ退くことを余儀なくされた。"],["The army was forced to retreat after heavy losses.","軍は大きな損害を受けて撤退を余儀なくされた。"],["The cabin in the forest is a quiet retreat for the writer.","森の小屋はその作家にとって静かな避難所だ。"]],"retribution":[["Many believed the disaster was divine retribution for human greed.","多くの人が、その災害は人間の強欲に対する天の報いだと信じた。"],["Many feared retribution if they spoke out against the leader.","多くの人が指導者に異を唱えれば報復されることを恐れた。"]],"retrieve":[["The divers retrieved the wreckage from the sea floor.","潜水士たちは海底から残骸を回収した。"],["The system can retrieve any record from the database in seconds.","そのシステムはデータベースから任意の記録を数秒で検索できる。"]],"retrospective":[["The film offers a retrospective view of the artist's long career.","その映画は芸術家の長い経歴を回顧的に見渡している。"],["The museum is holding a retrospective of the artist's work.","美術館はその芸術家の回顧展を開催している。"]],"reveal":[["The investigation revealed that the company had hidden the truth.","調査により、会社が真実を隠していたことが明らかになった。"],["The magazine revealed the senator's secret meetings with lobbyists.","その雑誌は上院議員がロビイストと秘密裏に会っていたことを暴露した。"]],"revenue":[["The city's main source of revenue is tourism.","その市の主な収入源は観光だ。"],["The government's revenue fell sharply during the economic crisis.","経済危機の間に政府の歳入は急減した。"]],"reverse":[["The new manager decided to reverse the order of the speeches.","新しい責任者は演説の順番を逆にすることにした。"],["The ship sailed in the reverse direction to avoid the storm.","船は嵐を避けるため逆の方向へ航行した。"],["The reverse is also true: high prices reduce demand.","その逆も真である。物価が高いと需要が減る。"]],"review":[["The committee will conduct a full review of the safety rules.","委員会は安全規則の全面的な再検討を行う予定だ。"],["The novel received a glowing review in the Sunday newspaper.","その小説は日曜版の新聞で絶賛の批評を受けた。"],["The teacher asked us to review the lesson before the test.","先生は試験の前に授業を復習するよう私たちに言った。"]],"revise":[["The author revised the book to include new data.","著者は新しいデータを含めるためにその本を改訂した。"],["The company had to revise its plan after the budget was cut.","予算が削減された後、その会社は計画を見直さなければならなかった。"]],"revive":[["The festival was revived after being banned for years.","その祭りは何年も禁止された後に復活した。"],["The nurse managed to revive the man who had collapsed.","看護師は倒れた男性を生き返らせることができた。"]],"revoke":[["The authorities revoked his license after the accident.","当局は事故の後、彼の免許を取り消した。"],["The new law revokes all earlier rules and makes them invalid.","新法はそれ以前の規則をすべて無効にする。"]],"reward":[["The workers demanded a fair reward for their long hours.","労働者たちは長時間労働に見合う正当な報酬を要求した。"],["The child received a small gift as a reward for good behavior.","その子どもは良い行いの褒美として小さな贈り物をもらった。"],["The company rewards employees who produce excellent results.","その会社は優れた成果を出した従業員に報いる。"]],"rhetoric":[["The essay analyzes the rhetoric of famous speeches, such as repetition.","そのエッセイは反復など有名な演説の修辞を分析している。"],["The politician's speech was full of rhetoric but short on facts.","その政治家の演説は美辞麗句にあふれ、事実に乏しかった。"],["Ancient Greek students studied rhetoric to prepare for public life.","古代ギリシャの学生たちは公の場に備えて雄弁術を学んだ。"]],"ridicule":[["The idea was met with ridicule when it was first proposed.","その考えは最初に提案されたとき嘲笑を浴びた。"],["Classmates ridiculed him for wearing old, worn-out shoes.","同級生たちは古びた靴を履いていると彼をあざ笑った。"]],"rife":[["The city was rife with rumors of a coming strike.","市内にはストライキが起こるといううわさが蔓延していた。"],["The history of the region is rife with conflict and betrayal.","その地域の歴史は争いと裏切りに満ちている。"]],"rift":[["A deep rift opened in the ground after the earthquake.","地震の後、地面に深い亀裂が走った。"],["The disagreement caused a deep rift between the two brothers.","その意見の相違は兄弟間に深い不和を生んだ。"]],"ritual":[["The villagers performed an ancient ritual to pray for rain.","村人たちは雨乞いのために古代の儀式を行った。"],["Drinking tea together is a daily ritual in many cultures.","一緒にお茶を飲むことは多くの文化で日々の習慣となっている。"]],"rival":[["Our main rival in the market has lowered its prices again.","市場での私たちの主な競争相手がまた値下げした。"],["The two companies have been fierce rivals for decades.","その2社は数十年にわたって激しいライバル関係にある。"],["No other city can rival Paris for its beautiful architecture.","美しい建築においてパリに匹敵する都市はほかにない。"]],"role":[["Teachers play an important role in shaping children's futures.","教師は子どもの将来を形作る上で重要な役割を果たす。"],["The young actress played the role of a queen in the drama.","その若い女優はドラマで女王の役を演じた。"]],"rotate":[["The Earth rotates once every twenty-four hours.","地球は24時間に1回自転する。"],["The managers rotate the night shift among all the staff.","管理者たちは夜勤を全従業員で交替させている。"]],"rudimentary":[["The children only have a rudimentary understanding of fractions.","子どもたちは分数について初歩的な理解しかない。"],["Some deep-sea fish have only rudimentary eyes.","深海魚の中には未発達の目しか持たないものもいる。"]],"ruin":[["Gambling led the businessman to financial ruin.","ギャンブルがその実業家を経済的破滅へ導いた。"],["One mistake can ruin a person's reputation forever.","たった一つの過ちが人の評判を永遠に台無しにすることがある。"],["The tourists walked among the ruins of the ancient city.","観光客たちは古代都市の廃墟の中を歩いた。"]],"ruminate":[["He sat alone, ruminating on the events of the day.","彼は一人で座り、その日の出来事についてじっくり考えていた。"],["Cows ruminate for hours, chewing their food again and again.","牛は食べ物を何度も噛み直して何時間も反芻する。"]],"rupture":[["A rupture in the pipeline caused a large oil spill.","パイプラインの破裂が大規模な原油流出を引き起こした。"],["The dispute led to a rupture in relations between the two countries.","その争いは両国関係の決裂を招いた。"],["The scandal ruptured the friendship between the two politicians.","そのスキャンダルは二人の政治家の友情を断絶させた。"]],"rural":[["She grew up in a quiet rural town surrounded by hills.","彼女は丘に囲まれた静かな田舎町で育った。"],["Young people in rural areas often move to big cities for work.","農村地域の若者は仕事のために大都市へ移ることが多い。"]],"ruthless":[["The ruthless dictator crushed all opposition.","冷酷な独裁者はあらゆる反対勢力を押しつぶした。"],["The ruthless landlord threw the poor family out of their home.","無慈悲な家主は貧しい一家を家から追い出した。"]],"sabotage":[["Officials suspected that the delay was caused by deliberate sabotage.","当局は遅れが意図的な妨害によるものだと疑った。"],["The spies were sent to the country to carry out acts of sabotage.","スパイたちは破壊工作を行うためにその国へ送り込まれた。"],["Rivals attempted to sabotage the negotiations at the last minute.","対立者たちは土壇場で交渉を妨害しようとした。"]],"sacrifice":[["Parents often make great sacrifices for the sake of their children.","親は子どものために大きな犠牲を払うことが多い。"],["In ancient times, people offered animals as a sacrifice to the gods.","古代、人々は神々へのいけにえとして動物を捧げた。"],["He sacrificed his free time to take care of his sick mother.","彼は病気の母の世話をするために自由な時間を犠牲にした。"]],"sagacity":[["The old judge was admired for his sagacity and fairness.","その老判事は賢明さと公正さで尊敬されていた。"],["Her sagacity allowed her to see the risks that others missed.","彼女の洞察力のおかげで、他の人が見逃した危険に気づくことができた。"]],"sake":[["For the sake of your health, you should get more sleep.","健康のために、もっと睡眠をとるべきだ。"],["They made the decision for the sake of the public interest.","彼らは公共の利益のためにその決定を下した。"],["Some people read for the sake of reading, not for any practical goal.","実用的な目的ではなく、読書そのものを目的として読む人もいる。"]],"salary":[["Her salary is much higher than that of her colleagues.","彼女の給料は同僚たちよりずっと高い。"],["He receives a monthly salary of three hundred thousand yen.","彼は月給30万円を受け取っている。"]],"salient":[["The most salient feature of the plan is its low cost.","その計画の最も顕著な特徴は低コストだ。"],["The most salient detail in the painting is the bright red door.","その絵で最も際立った細部は鮮やかな赤い扉だ。"]],"salutary":[["The failure proved to be a salutary lesson for the young player.","その失敗は若い選手にとって有益な教訓となった。"],["A salutary respect for the sea kept the sailors cautious.","海への健全な敬意が船乗りたちを慎重にさせた。"]],"salvage":[["Workers managed to salvage valuable items from the burning building.","作業員たちは燃える建物から貴重な物を運び出すことができた。"],["The salvage of the sunken ship took more than three months.","沈没船の引き揚げには3か月以上かかった。"]],"sanction":[["Several countries imposed economic sanctions on the regime.","いくつかの国がその政権に経済制裁を科した。"],["The project cannot begin without the sanction of the city council.","そのプロジェクトは市議会の認可なしには始められない。"],["The board refused to sanction the use of r the company's failure.","その部長は会社の失敗の身代わりにされた。"],["Immigrants are often made the scapegoat when the economy is poor.","景気が悪いと、移民がスケープゴートにされることが多い。"]],"scathing":[["The newspaper published a scathing review of the new film.","新聞はその新作映画に対する痛烈な批評を掲載した。"],["The senator launched a scathing attack on the opposition leader.","上院議員は野党党首に対して辛辣な攻撃を行った。"]],"scatter":[["Farmers scatter seeds across the field in early spring.","農家は早春に畑一面に種をまき散らす。"],["Papers were scattered all over the floor of his room.","彼の部屋の床中に書類が散らばっていた。"]],"scenery":[["Tourists come to the island for its beautiful scenery.","観光客はその美しい風景を求めて島にやって来る。"],["We admired the scenery from the window of the train.","私たちは列車の窓から景色を眺めて楽しんだ。"]],"scheme":[["The city has introduced a new scheme to reduce traffic.","市は交通量を減らす新しい計画を導入した。"],["Police uncovered a scheme to steal money from elderly people.","警察は高齢者から金を盗む陰謀を暴いた。"],["The rebels schemed to overthrow the king.","反乱者たちは王を倒すことを企てた。"]],"scholar":[["The scholar spent thirty years studying ancient languages.","その学者は30年間古代言語の研究に費やした。"],["She entered the university as a scholar with full financial support.","彼女は全額支給の奨学生としてその大学に入学した。"]],"scope":[["The scope of this research is limited to junior high school students.","この研究の範囲は中学生に限定されている。"],["Travel broadens one's scope and changes how we see the world.","旅行は視野を広げ、世界の見方を変える。"],["There is still scope for improvement in the design.","その設計にはまだ改善の余地がある。"]],"scorn":[["Critics treated the new theory with open scorn.","批評家たちはその新理論を露骨に軽蔑して扱った。"],["Many people scorned the idea as foolish when it was first proposed.","その考えが最初に提案されたとき、多くの人が愚かだとあざけった。"]],"scrupulous":[["She is a scrupulous doctor who always puts patients first.","彼女は常に患者を第一に考える良心的な医師だ。"],["The accountant was scrupulous in checking every figure.","会計士はすべての数字を細心の注意を払って確認した。"]],"sector":[["The service sector employs most workers in developed countries.","先進国ではサービス部門が大半の労働者を雇用している。"],["The government is investing heavily in the energy sector.","政府はエネルギー分野に多額の投資を行っている。"]], 、使いに持たせる"]],"しる|知る・領る":[["事のよしを知らず","事情を知らない"],["この国を知る人","この国を治める人"]],"しるし|著し":[["しるく見ゆ","はっきりと見える"],["しるく、人の言ひしごとく雨降りぬ","案の定、人が言ったとおり雨が降った"]],"しるし|験・徴":[["祈りのしるしありて","祈りの効き目があって"],["雲のけしきは嵐のしるしなり","雲の様子は嵐の前兆だ"]],"すきずきし|好き好きし":[["すきずきしき心","風流を好む心"],["すきずきしき男、夜ごとに忍び歩く","色好みの男が、毎晩こっそり出歩く"]],"すごし|凄し":[["すごき風の音","ぞっとするような寂しい風の音"],["かの君の笛の音、すごく聞こゆ。","あの方の笛の音は、ぞっとするほどすばらしく聞こえる。"]],"すさまじ|":[["すさまじきもの。昼ほゆる犬。春の網代(枕)","興ざめなもの。昼に吠える犬。春の網代"],["霜枯れの野辺は、いとすさまじ。","霜枯れの野原は、まことに殺風景で寒々としている。"]],"すずろなり・そぞろなり|漫ろなり":[["すずろに涙ぞ落つる","なんとなく涙が落ちる"],["すずろに人を疑ふは、よからぬことなり。","むやみに人を疑うのは、よくないことだ。"],["すずろなる人の家に迷ひ入りぬ。","縁もゆかりもない人の家に迷い込んでしまった。"]],"すなはち|即ち":[["すなはち門を閉づ","すぐに門を閉じる"],["船出でしすなはちに、風ぞ吹き出でける。","船が出たそのときに、風が吹き出したのだった。"]],"せうそこ|消息":[["かの人のもとへせうそこをつかはす。","あの人のところへ手紙を送る。"],["門に立ちて、せうそこ申せども、答ふる人なし。","門に立って、案内を請うたけれども、答える人がいない。"]],"せめて|":[["せめて留むれど、聞き入れず。","無理に引き止めるが、聞き入れない。"],["せめて問へば","しきりに尋ねると"],["せめては、一言なりとも聞かせ給へ。","せめて一言だけでも聞かせてください。"]],"たづき|方便":[["たづきも知らず","手段もわからない"],["霧深くて、行く先のたづきも見えず。","霧が深くて、行く先の様子も見当がつかない。"]],"たてまつる|奉る":[["帝に御文をたてまつる。","帝にお手紙を差し上げる。"],["帝、御衣たてまつる。","帝はお召し物をお召しになる。"],["姫君を迎へたてまつる。","姫君をお迎え申し上げる。"]],"たのむ|頼む":[["今日来むと言ひし人を頼みて待つ。","今日来ようと言った人をあてにして待つ。"],["頼めし人は来ず","あてにさせた(期待を持たせた)人は来ない"]],"たばかる|謀る":[["いかにしてとたばかる","どうしようかと策を練る"],["親をたばかりて、夜な夜な出で歩く。","親をだまして、毎晩出歩く。"]],"たまふ|給ふ":[["帝、人々に禄を給ふ。","帝は人々に褒美の品をお与えになる。"],["大臣、御文を見給ふ。","大臣はお手紙をご覧になる。"],["かくなむ思ひ給ふる。","このように存じております。"]],"ためらふ|":[["心をためらひて","気持ちを落ち着けて"],["しばし病をためらひ給へ。","しばらく病を養生なさい。"]],"ちぎり|契り":[["ちぎりを違へて来ぬ人を恨む。","約束を違えて来ない人を恨む。"],["契り深き仲","前世からの因縁の深い仲"],["二人のちぎり、末まで変はらざりけり。","二人の夫婦の縁は、最後まで変わらなかった。"]],"つたなし|拙し":[["つたなき筆にて書き記す。","下手な筆跡で書き記す。"],["つたなき身のほどを嘆く。","運の悪いわが身の境遇を嘆く。"]],"つとめて|":[["冬はつとめて。雪の降りたるは言ふべきにもあらず(枕)","冬は早朝。雪が降っているのは言うまでもない"],["人々、夜深くまで遊びて、そのつとめてぞ帰りける。","人々は夜更けまで遊んで、その翌朝帰ったのだった。"]],"つれづれなり|徒然なり":[["つれづれなるままに日暮らし硯に向かひて(徒然)","することもなく退屈なのにまかせて一日中硯に向かって"],["世を去りし人を思ひて、つれづれなる日々を送る。","亡くなった人を思って、しんみりと寂しい日々を送る。"]],"つれなし|":[["つれなき人を恋ふ","冷淡な人を恋い慕う"],["いみじく恐ろしけれど、つれなくもてなす。","ひどく恐ろしいけれど、平然とふるまう。"],["霜降る朝も、松はつれなく緑なり。","霜が降りる朝も、松は何の変化もなく緑のままだ。"]],"ときめく|時めく":[["世に時めく人の家には、人多く集まる。","世間で時流に乗って栄えている人の家には、人が大勢集まる。"],["いとやむごとなき際にはあらぬがすぐれて時めき給ふありけり(源氏)","それほど高貴な身分ではない方で、際立って寵愛を受けていらっしゃる方があった"]],"ところせし|所狭し":[["物多くて、所せき部屋なり。","物が多くて、窮屈な部屋だ。"],["所せき御勢ひにて、世の人みなかしこまる。","堂々としたご威勢で、世の人はみな恐れ入る。"],["大人ばかりの座に交じりて、所せく思ふ。","年長者ばかりの席に交じって、気詰まりに思う。"]],"ながむ|眺む・詠む":[["端近くゐて、暮るるまで空をながむ。","縁側近くに座って、日が暮れるまで物思いにふけって空を見つめる。"],["月の下に出でて、古き歌をながむ。","月の下に出て、古い歌を口ずさむ。"]],"なかなか|中々":[["なかなか言はぬぞよき","かえって言わないほうがよい"],["なかなかなる物言ひは、せぬこそよけれ。","中途半端な物言いは、しないほうがよい。"]],"なづむ|泥む":[["雪になづみて","雪に行き悩んで"],["古き例になづみて、改むることをせず。","古い前例にこだわって、改めることをしない。"]],"なでふ|何でふ":[["かかる所に、なでふ人のゐたるぞ。","このような所に、どういう人がいるのか。"],["なでふ、さることのあらむ。","どうしてそのようなことがあろうか、いやない。"]],"なのめなり|斜めなり":[["なのめなる心にては、この道を極めがたし。","いい加減な気持ちでは、この道を極めにくい。"],["なのめならず喜ぶ","格別に喜ぶ"]],"なべて|並べて":[["なべて人の心は、移ろひやすきものなり。","総じて人の心は移ろいやすいものだ。"],["なべての人にはあらず","並の人ではない"]],"なほ|猶":[["なほ飽かずやありけむ","やはり満足できなかったのだろうか"],["雪はなほ降り増さりぬ。","雪はいっそう降りまさった。"]],"なやむ|悩む":[["母君、重く悩み給ふ。","母君は重い病気で苦しんでおいでになる。"],["里人ども、水なきに悩む。","里の人々は水がなくて苦労する。"]],"ならふ|慣らふ・習ふ":[["ならはぬ旅の空","慣れない旅先"],["師に就きて、琴をならふ。","師について、琴を習う。"]],"にほふ|匂ふ":[["紅葉の錦、夕日ににほふ。","紅葉の錦が夕日に美しく映える。"],["人はいさ心も知らずふるさとは花ぞ昔の香ににほひける(古今)","あなたの心はさあどうだか分からない、この古里では花が昔のままの香りで咲きにおっていることよ"],["右大臣の御勢ひにほひて、世の人なびき従ふ。","右大臣のご威勢が栄えて、世の人は従う。"]],"ねたし|妬し":[["ねたきことなり","しゃくなことだ"],["ねたきまでに歌を詠みなしたり。","憎らしいほど見事に歌を詠みあげた。"]],"ねんず|念ず":[["念じて見給ふ","こらえてご覧になる"],["観音を念じ奉る。","観音様に祈り申し上げる。"]],"ののしる|罵る":[["火のいできたりとて、人々ののしる。","火事が起こったといって、人々が大声で騒ぐ。"],["その琵琶の上手、世にののしる。","その琵琶の名手は、世間で評判が高い。"]],"はかなし|果無し":[["露のごとく、はかなきこの世なり。","露のように、むなしく頼りないこの世だ。"],["はかなき事をも言ひ","ちょっとした事も言い"],["はかなく亡せ給ひぬ。","あっけなくお亡くなりになった。"]],"はかばかし|果々し":[["はかばかしき後見しなければ(源氏)","しっかりした後ろ盾がないので"],["はかばかしく事を行ひて、滞ることなし。","てきぱきと事を行って、滞ることがない。"]],"はしたなし|端なし":[["はしたなき年ごろにて、子とも大人とも言ひがたし。","中途半端な年頃で、子供とも大人とも言いにくい。"],["はしたなきもの。こと人を呼ぶに、我ぞとてさし出でたる(枕)","きまりが悪いもの。他の人を呼んだのに、自分だと思って出て行ったの"],["はしたなく言ひ放ちて、立ち去りぬ。","そっけなく言い放って、立ち去った。"]],"はづかし|恥づかし":[["いとはづかしき人なり","たいそう(こちらが気後れするほど)立派な人だ"],["あやしき姿を見られて、はづかしく思ふ。","みすぼらしい姿を見られて、恥ずかしく思う。"]],"はべり|侍り":[["女房、大臣の御前に侍り。","女房は大臣のおそばにお仕えする(控えている)。"],["ここに侍り","ここにおります"],["いと悲しく思ひ侍り。","たいそう悲しく思います。"]],"ひがひがし|僻々し":[["ひがひがしき心にて、人の言ふことを聞かず。","ひねくれた心で、人の言うことを聞かない。"],["ひがひがしからむ人は、花を見ても心動かさじ。","風流を解さないような人は、花を見ても心を動かさないだろう。"]],"ひたぶるなり|一向なり":[["ひたぶるに泣く","ひたすら泣く"],["ひたぶるなる心にて、道理も弁へず。","むやみな心で、道理もわきまえない。"]],"びんなし|便なし":[["びんなきことなり","不都合なことだ"],["さる目に遭ふこと、びんなくて、見るに忍びず。","そのような目に遭うことは、気の毒で、見るに忍びない。"]],"ふみ|文":[["文を奉る","手紙を差し上げる"],["唐土より渡れるふみども多く蔵に置けり。","中国から渡来した書物が多く蔵に置いてある。"],["ふみの道に心を入れて、年ごろ励む。","学問の道に心を傾けて、長年励む。"]],"まうく|設く・儲く":[["酒まうけて待つ","酒を用意して待つ"],["老いて男子をまうけたり。","年老いて男の子を手に入れた(もうけた)。"]],"まうす|申す":[["大臣、帝に事の由を申す。","大臣は帝に事の次第を申し上げる。"],["君の御ことを深く案じ申す。","あなた様のことを深く心配申し上げる。"]],"まかる|罷る":[["女房、大臣の御前よりまかる。","女房は大臣のおそばから退出する。"],["それがし、あすは田舎へまかる。","私は明日は田舎へ参ります。"]],"まさなし|正無し":[["まさなきことを言ふ","みっともないことを言う"],["まさなき知らせに、人々驚き騒ぐ。","思いがけない知らせに、人々は驚き騒ぐ。"]],"まどふ|惑ふ":[["道にまどひて、日も暮れにけり。","道に迷って、日も暮れてしまった。"],["泣きまどふ","ひどく泣いて取り乱す"]],"まめなり|実なり・忠実なり":[["まめなる人","誠実な人"],["雅なる品よりも、まめなる品を賜はりて喜ぶ。","風流な品よりも、実用的な品をいただいて喜ぶ。"]],"まゐらす|参らす":[["御文まゐらす","お手紙を差し上げる"],["御子を抱きまゐらす。","御子をお抱き申し上げる。"]],"まゐる|参る":[["明日、宮中にまゐるべし。","明日、宮中に参上するはずだ。"],["帝に桜の枝をまゐる。","帝に桜の枝を差し上げる。"],["帝、御酒まゐる。","帝はお酒を召し上がる。"]],"むくつけし|":[["むくつけき者ども","気味の悪い者たち"],["むくつけき田舎人は、物言ひもあらあらし。","無骨な田舎者は、物の言い方も荒々しい。"]],"むげなり|無下なり":[["むげなる仕打ちを受けて、恨めしく思ふ。","ひどい仕打ちを受けて、恨めしく思う。"],["むげに知らぬ人","まったく知らない人"]],"むつかし|難し":[["長雨降り続きて、むつかしき日々なり。","長雨が降り続いて、うっとうしい日々だ。"],["夜の山寺はむつかしくて、え寝ず。","夜の山寺は気味が悪くて、眠ることができない。"],["むつかしき世をいとひて","わずらわしい世の中をいやがって"]],"めざまし|目覚まし":[["めざましきものにおとしめそねみ給ふ(源氏)","気にくわない者とさげすみねたみなさる"],["いとめざましく美しき人の、田舎に住みけり。","目を見張るほどすばらしく美しい人が、田舎に住んでいた。"]],"めす|召す":[["御前に召して","御前にお呼びになって"],["帝、御衣を召す。","帝はお召し物をお召しになる。"]],"めづ|愛づ":[["人々、その歌をめづ。","人々はその歌をほめたたえる。"],["虫めづる姫君(堤中納言)","虫を愛する姫君"]],"めづらし|珍し":[["初花のめづらしく美しきを、人々めでたり。","初花が新鮮ですばらしく美しいのを、人々は賞美した。"],["唐土より渡れる、めづらしき鳥を見る。","中国から渡ってきた、珍しい鳥を見る。"]],"やがて|":[["衣も脱がで、やがて伏しぬ。","着物も脱がないで、そのまま横になった。"],["やがて帰りぬ","すぐに帰った"]],"やさし|優し":[["みすぼらしき姿を人に見られ、やさしくて身も縮む心地す。","みすぼらしい姿を人に見られ、恥ずかしくて身も縮む思いがする。"],["やさしき人かな","優美な(殊勝な)人だなあ"]],"やすし|安し・易し":[["心やすく思ふ","安心に思う"],["やすき事なれば、すぐに成りぬ。","たやすいことなので、すぐに成し遂げた。"]],"やつす|窶す":[["身をやつして","目立たない姿に変えて"],["髪を下ろし、墨染めに身をやつす。","髪を下ろし、墨染めの衣をまとって出家する。"]],"やむごとなし|止む事無し":[["いとやむごとなき際にはあらぬが(源氏)","それほど高貴な身分ではない方で"],["やむごとなき御心ざしを見せ給ふ。","並々でないご愛情をお見せになる。"],["やむごとなき事ありて、今日は参りがたし。","捨てておけない用事があって、今日は参上しにくい。"]],"ゆかし|":[["ゆかしかりしかど、神へ参るこそ本意なれと思ひて(徒然)","見てみたかったけれど、神へ参るのが本来の目的だと思って"],["いとゆかしき御心ばへなり。","たいそう心ひかれる(慕わしい)ご気性だ。"]],"ゆゆし|忌々し":[["ゆゆしきことをな言ひそ。","不吉なことを言うな。"],["ゆゆしく大きなる木あり。","はなはだしく大きな木がある。"],["ゆゆしき笛の上手なり。","並外れてすばらしい笛の名手だ。"]],"よし|由":[["さるよしのありて、え参らず。","そういう理由があって、参上できない。"],["よしある人の住まひと見えて、庭の趣深し。","由緒ある人の住まいと見えて、庭の風情が深い。"],["逢ふよしもなし。","会う方法もない。"],["その由を申す","その旨を申し上げる"]],"よし・よろし・わろし・あし|":[["この花の色、いとよし。","この花の色はたいそう良い。"],["この歌のさま、よろしと見ゆ。","この歌の様子は、まあよいと見える。"],["昼になりて、ぬるくゆるびもていけば、火桶の火も白き灰がちになりてわろし(枕)","昼になって暖かくゆるんでいくと、火桶の火も白い灰ばかりになってよくない"],["あしき心をば持つべからず。","悪い心を持ってはならない。"]],"よしなし|由無し":[["よしなく物恐ろしくて、身震ひす。","わけもなく何となく恐ろしくて、身震いする。"],["よしなしごとを、そこはかとなく書きつくれば(徒然)","つまらないことを、あてもなく書きつけていると"],["今は逃るるよしなくて、ただ嘆く。","今は逃れる方法がなくて、ただ嘆く。"]],"よばふ|呼ばふ":[["よばふ人多かり","求婚する人が多かった"],["門に立ちて、夜もすがら人をよばふ。","門に立って、一晩中人を呼び続ける。"]],"よろづ|万":[["よろづのことに使ひけり(竹取)","いろいろなことに使った"],["よろづ、君の御心にぞ任せ奉る。","万事、あなたのお心にお任せ申し上げる。"]],"らうがはし|乱がはし":[["らうがはしき人声","騒がしい人声"],["らうがはしき文机の上に、反故ども散りたり。","乱雑な机の上に、書き損じの紙が散らばっている。"]],"らうらうじ|":[["らうらうじく、もの言ひたり","洗練されたふうに物を言った"],["らうらうじき女房の、客あしらひもよく慣れたり。","もの慣れた女房が、客のあしらいにもよく慣れている。"]],"わたる|渡る":[["大臣、新しき御殿にわたり給ふ。","大臣は新しいお屋敷にお移りになる。"],["年ごろ思ひわたる","長年思い続ける"]],"わづらふ|煩ふ":[["身の行く末をわづらひて、夜も寝ず。","わが身の行く末に思い悩んで、夜も眠れない。"],["母、重くわづらひて、日ごろになりぬ。","母は重い病気になって、何日にもなった。"],["歌を詠みわづらひて、筆を置く。","歌を詠みあぐねて、筆を置く。"]],"わびし|侘びし":[["わびしきこと限りなし","つらいこと限りない"],["一人旅の夜、いとわびし。","一人旅の夜は、たいそう寂しく心細い。"],["わびしき家に住まひて、年を送る。","貧しい家に住んで、年月を過ごす。"],["酒の座に無粋なる者交じりて、座もわびしくなりぬ。","酒の席に無粋な者が加わって、座も興ざめになってしまった。"]],"わぶ|侘ぶ":[["都を離れし身をわびて、涙ぐむ。","都を離れた身をつらく思って、涙ぐむ。"],["旅人ども、宿なくてわぶ。","旅人たちは宿がなくて困る。"],["訪れぬ人を待ちわぶ。","訪れない人を待ちかねる。"]],"わりなし|理無し":[["わりなき事を言ひて、人を困らす。","道理に合わないことを言って、人を困らせる。"],["わりなく思ひ乱る","どうしようもなく思い乱れる"],["わりなくめでたき舞ひを見る。","この上なくすばらしい舞を見る。"]],"ゐる|居る":[["ゐて待つ","座って待つ"],["都に出でず、年ごろ山里にゐたり。","都に出ないで、長年山里にとどまっていた。"]],"をかし|":[["月のいと明き夜、いとをかし。","月がたいそう明るい夜は、たいそう趣がある。"],["顔いとをかしき幼子の、走り来たり。","顔がたいそうかわいらしい幼い子が、走って来た。"],["人の語る昔のこと、をかしくて聞きゐたり。","人の語る昔のことが興味深くて、聞き入っていた。"],["法師の転びたるさま、をかしくて笑ひぬ。","法師が転んだ様子がこっけいで、笑ってしまった。"]],"おこす|遣す":[["都より文をおこせたり","都から手紙をよこした"],["女、かく言ひおこせたり。","女は、このように言ってよこした。"]],"ことわる|判る":[["ことわるべき人もなし","是非を判断できる人もいない"],["人の道を、ことわりて説き聞かす。","人の道を、道理を説いて明らかにして説き聞かせる。"]],"かしこまる|畏まる":[["かしこまりて御前に参る","恐れ入って御前に参上する"],["大臣の仰せ言を、かしこまりて承る。","大臣のおおせ言を、つつしんで承る。"]],"かたらふ|語らふ":[["旧き友とかたらひて、夜を明かす。","古い友と打ち解けて語り合って、夜を明かす。"],["ひそかにかたらふ仲となりぬ","ひそかに契りを結ぶ仲となった"],["武士どもをかたらひて、兵を起こす。","武士たちを説得して味方に引き入れ、兵を挙げる。"]],"ぐす|具す":[["供人を具して出で給ふ","供の者を連れてお出かけになる"],["親に具して、都を出づ。","親に連れ立って、都を出る。"],["才も心ばへも具したる人なり。","才能も気立ても兼ね備えた人だ。"]],"つかうまつる|仕うまつる":[["御供につかうまつる","お供としてお仕えする"],["帝の仰せにて、歌をつかうまつる。","帝のおおせで、歌をお作りいたす。"]],"つかはす|遣はす":[["帝、使ひをつかはす","帝は使者をお遣わしになる"],["帝、大臣に御衣をつかはす。","帝は大臣にお召し物をお与えになる。"]],"とぶらふ|訪ふ":[["旧き友の家をとぶらふ。","古い友の家を訪問する。"],["病む人をとぶらひに行く","病気の人を見舞いに行く"],["亡き人の後世をとぶらふ。","亡き人の後世を弔う。"]],"はぐくむ|育む":[["幼き子をはぐくみ給ふ","幼い子を大切にお育てになる"],["罪を得し人を、はぐくみて匿ふ。","罪を得た人を、かばって匿う。"]],"ねぶ|老ぶ":[["ねびたる尼君の、いと清げなる","年をとった尼君で、たいそうこざっぱりしている"],["ねびゆかむさまゆかしき人かな(源氏)","成長していく様子が見たい人だなあ"]],"しつらふ|設ふ":[["客人のために、新しき座をしつらひたり","客人のために、新しい座席を設けた"],["寝殿をしつらひて待つ","寝殿を飾りつけ整えて待つ"]],"まうづ|詣づ":[["帝の御前にまうでて、事の由を奏す","帝の御前に参上して、事情を申し上げる"],["初瀬にまうでたり","初瀬(の寺)に参詣した"]],"いそぐ|急ぐ":[["旅立ちをいそぐ","旅立ちの準備をする"],["いそぎ帰りて、母に告げけり","急いで帰って、母に告げた"]],"みゆ|見ゆ":[["遠く山の見ゆる所なり","遠くに山が見える所だ"],["かの人、門のほどに見えたり","あの人が門のあたりに姿を現した"],["女、男に見えずして年経にけり","女は男に会う(結婚する)こともなく年月が過ぎてしまった"]],"もてなす|":[["幼き子を大切にもてなし給ふ","幼い子を大切に扱いなさる"],["いとつつましげにもてなして、ものも言はず","たいそう慎ましそうにふるまって、ものも言わない"],["客を心して手厚くもてなす","客に心を配って手厚くごちそうする(歓待する)"]],"やる|遣る":[["手紙をやる","手紙を送る"],["歌を詠みて、心をやる","歌を詠んで、気を晴らす"],["遠き山を見やれば、霞たなびけり","遠くの山をはるかに見やると、霞がたなびいている"]],"ゆるす|許す":[["出づることを許し給はず","外出することをお許しにならない"],["鳥の足の緒をゆるして放つ","鳥の足のひもをゆるめて放つ"]],"わきまふ|弁ふ":[["善悪をわきまふ","善悪を見分ける"],["世のことわりをわきまへたる人","世の道理をわきまえている人"]],"おはします|":[["帝、都におはします", function findForm(it,sent){const ex=(sent!==undefined?sent:it.ex)||'';if(!ex||/[〜・]/.test(it.w))return null;const w=it.w;
  if(isEn()){const esc_=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const b=esc_(w),e=w.endsWith('e')?esc_(w.slice(0,-1)):null,y=w.endsWith('y')?esc_(w.slice(0,-1)):null,last=esc_(w.slice(-1));
    const pats=[b,b+'(?:s|es|ed|d|ing|ly|er|est|ness|ment|al|ity|ive|ion|ions|ally)',e&&e+'(?:ing|ed|es|er|ion|ation|ive|ity|ure|al|ly)',y&&y+'(?:ies|ied|ier|ily|iness)',b+last+'(?:ing|ed|er)',w.length>=6&&esc_(w.slice(0,-2))+'\\w{0,6}'].filter(Boolean);
    for(const p of pats){const m=new RegExp('\\b'+p+'\\b','i').exec(ex);if(m)return{pre:ex.slice(0,m.index),hit:m[0],post:ex.slice(m.index+m[0].length)};}return null;}
  for(const st of [w,w.length>=3?w.slice(0,-1):null,w.length>=4?w.slice(0,-2):null].filter(Boolean)){const i=ex.indexOf(st);if(i>=0){let j=i+st.length;return{pre:ex.slice(0,i),hit:ex.slice(i,j),post:ex.slice(j)};}}return null;}
function clozeOk(it,ans,f){f=f||findForm(it);ans=String(ans||'').trim().toLowerCase();return !!ans&&(ans===it.w.toLowerCase()||(f&&ans===f.hit.toLowerCase()));}
function hideWord(it){const re=new RegExp(it.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');return it.m.map(m=>m.replace(/[（(][^）)]*[A-Za-z][^）)]*[）)]/g,'').replace(re,'＿＿').replace(/^[・\s]+|[・\s]+$/g,'')).filter(Boolean);}
function choiceText(x,toM){return toM?x.m.slice(0,2).join('／'):x.w;}
function answer(ok){const sess=S.session,it=sess.items[sess.i];record(it,ok);sess.res.push({it,ok});}
function next(){const sess=S.session;sess.i++;sess.flipped=false;sess.picked=null;sess.choices=null;sess.typedAns='';render();const a=$('#ans');if(a)a.focus();}

function render(){
  document.documentElement.setAttribute('data-subj',baseOf(S.subj));
  const grp=groupOf(S.subj);
  document.querySelectorAll('.switch [data-group]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.group===grp)));
  const subs=GROUPS.find(g=>g.key===grp).subs.filter(k=>SUBJ[k]);
  $('.subtabs').innerHTML=subs.map(k=>`<button role="tab" data-subj="${k}" aria-selected="${k===S.subj}">${esc(SUBLABEL[k]||SUBJ[k].name)}<span class="n">${DATA[k].length}</span></button>`).join('');
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  const v=$('#view');
  if(S.session){v.innerHTML=S.session.i>=S.session.items.length?viewResult():(S.session.mode==='flash'?viewFlash():S.session.mode.startsWith('cloze')?viewCloze():S.session.mode==='typeY'?viewTypeY():viewQuiz());}
  else if(S.tab==='home')v.innerHTML=viewHome();
  else if(S.tab==='list')v.innerHTML=viewList();
  else v.innerHTML=viewStats();
  try{window.scrollTo({top:0});}catch(e){}
  const a=$('#ans');if(a&&S.session&&S.session.picked===null)a.focus();
}
function wordHtml(it,cls){const c=SUBJ[S.subj].cls;return `<p class="word ${c}${cls||''}">${esc(it.w)}</p>${it.k?`<div class="kanji">${esc(it.k)}</div>`:''}`;}
function chipsHtml(it){return `<div class="chips">${it.num?`<span class="chip num">No.${it.num}${it.isRel?' 関連':''}</span>`:''}<span class="chip acc">${esc(it.pos)}</span><span class="chip lv">${esc(lvName(it))}</span>${it.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`;}
function detailHtml(it){const c=SUBJ[S.subj].cls;
  const per=it.exs&&it.exs.length===it.m.length;
  return `<ol class="means${per?' per':''}">${it.m.map((m,i)=>`<li><span>${esc(m)}${per?`<span class="ex sm"><span class="q ${c}">${esc(it.exs[i][0])}</span><span class="tr">${esc(it.exs[i][1])}</span></span>`:''}</span></li>`).join('')}</ol>
  ${it.ex&&!per?`<div class="ex"><div class="q ${c}">${esc(it.ex)}</div><div class="tr">${esc(it.tr)}</div></div>`:''}
  ${it.note?`<div class="note"><b>${it.yomi?'意味':'注'}</b>${esc(it.note)}</div>`:''}
  ${it.rel&&it.rel.length?`<div class="rel"><b>関連語</b><ul>${it.rel.map(x=>`<li><span class="rw">${esc(x[0])}</span><span class="rp">${esc(x[1])}</span><span class="rm">${esc(x[2])}</span></li>`).join('')}</ul></div>`:''}
  ${it.der?`<div class="der"><b>派生・関連</b>${esc(it.der)}</div>`:''}`;}

function viewFlash(){const sess=S.session,it=sess.items[sess.i],n=sess.items.length;
  const head=`<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div><button data-quit>中断</button></div>`;
  if(!sess.flipped)return head+`<div class="card flip" data-flip tabindex="0" role="button" aria-label="めくって意味を見る">${chipsHtml(it)}${wordHtml(it)}<div class="tap">タップ / Space で意味を表示</div></div>
    <div class="actions"><button class="btn bad" data-ans="0">まだ<small>← / 1</small></button><button class="btn ok" data-ans="1">覚えた<small>→ / 2</small></button></div>`;
  return head+`<div class="card back">${chipsHtml(it)}${wordHtml(it)}${detailHtml(it)}</div>
    <div class="actions"><button class="btn bad" data-ans="0">まだ<small>← / 1</small></button><button class="btn ok" data-ans="1">覚えた<small>→ / 2</small></button></div>`;}

function viewQuiz(){const sess=S.session,it=sess.items[sess.i],n=sess.items.length,toM=sess.mode==='quiz',c=SUBJ[S.subj].cls;
  if(!sess.choices)sess.choices=makeChoices(it);
  const head=`<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div><button data-quit>中断</button></div>`;
  const prompt=toM?`<div class="qprompt">${SUBJ[S.subj].yomi?'この漢字の読みは？':isEn()?'この単語の意味は？':'この語の意味は？'}</div>${chipsHtml(it)}${wordHtml(it)}`
    :`<div class="qprompt">${SUBJ[S.subj].yomi?'この読みの漢字は？':'この意味を表す'+SUBJ[S.subj].qw+'は？'}</div><div class="chips"><span class="chip acc">${esc(it.pos)}</span><span class="chip lv">${esc(lvName(it))}</span></div><p class="word" style="font-size:1.35rem;font-weight:700">${esc(hideWord(it).join('　／　'))}</p>`;
  const picked=sess.picked;
  const choices=sess.choices.map((x,i)=>{let cls='choice';if(picked!==null){if(x.id===it.id)cls+=' correct';else if(i===picked)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-pick="${i}"${picked!==null?' disabled':''}><span class="n">${i+1}</span><span class="txt ${toM?'':c}">${esc(choiceText(x,toM))}</span></button>`;}).join('');
  let after='';
  if(picked!==null){const ok=sess.choices[picked].id===it.id;
    after=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}${ok?'':'　正答: '+esc(toM?it.m[0]:it.w)}</div><div class="detail">${wordHtml(it)}${detailHtml(it)}</div>

  return head+`<div class="card" style="min-height:0;padding:22px 24px">${prompt}</div><div class="choices">${choices}</div>${after}`;}

function curCloze(sess){const it=sess.items[sess.i];sess.cz=sess.cz||{};
  if(it.exs){if(sess.cz[sess.i]===undefined){const ok=it.exs.map((e,j)=>findForm(it,e[0])?j:-1).filter(j=>j>=0);sess.cz[sess.i]=ok.length?ok[Math.floor(Math.random()*ok.length)]:-1;}
    const j=sess.cz[sess.i];if(j>=0)return{f:findForm(it,it.exs[j][0]),tr:it.exs[j][1],mi:j};}
  return{f:findForm(it),tr:it.tr,mi:-1};}
function viewCloze(){const sess=S.session,it=sess.items[sess.i],n=sess.items.length,typed=sess.mode==='clozeT',c=SUBJ[S.subj].cls,cz=curCloze(sess),f=cz.f;
  if(!typed&&!sess.choices)sess.choices=makeChoices(it);
  const head=`<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div><button data-quit>中断</button></div>`;
  const done=sess.picked!==null;const ok=done&&(typed?sess.picked===true:sess.choices[sess.picked].id===it.id);
  const sent=`<p class="cloze ${c}">${esc(f.pre)}<span class="blank ${done?(ok?'ok':'ng'):''}">${done?esc(f.hit):'＿＿＿＿'}</span>${esc(f.post)}</p><div class="tr" style="color:var(--muted);margin-top:6px">${esc(cz.tr)}</div>${done&&cz.mi>=0?`<div class="hint" style="margin:8px 0 0">この用例は意味${'①②③④⑤⑥'[cz.mi]}「${esc(it.m[cz.mi])}」</div>`:''}`;
  const prompt=`<div class="qprompt">空所に入る${SUBJ[S.subj].qw}は？</div><div class="chips"><span class="chip acc">${esc(it.pos)}</span><span class="chip lv">${esc(lvName(it))}</span>${typed?`<span class="chip">${esc(it.w[0])}${'・'.repeat(Math.max(0,it.w.length-1))}（${it.w.length}字）</span>`:''}</div>${sent}`;
  let body='';
  if(typed){body=done?'':`<form class="typeform" data-submit><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${isEn()?'英単語を入力':'ひらがなで入力'}" lang="${isEn()?'en':'ja'}"><button class="btn acc" type="submit">答え合わせ<small>Enter</small></button></form>`;}
  else{body=`<div class="choices">${sess.choices.map((x,i)=>{let cls='choice';if(done){if(x.id===it.id)cls+=' correct';else if(i===sess.picked)cls+=' wrong';else cls+=' dim';}
    return `<button class="${cls}" data-pick="${i}"${done?' disabled':''}><span class="n">${i+1}</span><span class="txt ${c}">${esc(x.w)}</span></button>`;}).join('')}</div>`;}
  let after='';
  if(done){after=`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}${ok?'':'　正答: '+esc(f.hit)+(f.hit.toLowerCase()!==it.w.toLowerCase()?'（'+esc(it.w)+'）':'')}${typed&&sess.typedAns&&!ok?'　あなたの答え: '+esc(sess.typedAns):''}</div><div class="detail">${wordHtml(it)}${detailHtml(it)}</div>
    <div class="actions" style="grid-template-columns:1fr"><button class="btn acc" data-next>次へ<small>Enter</small></button></div>`;}
  return head+`<div class="card" style="min-height:0;padding:22px 24px">${prompt}</div>${body}${after}`;}

function viewTypeY(){const sess=S.session,it=sess.items[sess.i],n=sess.items.length,done=sess.picked!==null,ok=sess.picked===true;
  const head=`<div class="prog"><span class="num">${sess.i+1} / ${n}</span><div class="track"><i style="width:${sess.i/n*100}%"></i></div><button data-quit>中断</button></div>`;
  const prompt=`<div class="qprompt">この漢字の読みは？（現代仮名遣い。歴史的仮名遣いでも正解）</div>${chipsHtml(it)}${wordHtml(it)}`;
  const body=done?'':`<form class="typeform" data-submit><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ひらがなで入力" lang="ja"><button class="btn acc" type="submit">答え合わせ<small>Enter</small></button></form>`;
  const after=done?`<div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}　読み: ${esc(it.m[0])}${!ok&&sess.typedAns?'　あなたの答え: '+esc(sess.typedAns):''}</div><div class="detail">${wordHtml(it)}${detailHtml(it)}</div>
    <div class="actions" style="grid-template-columns:1fr"><button class="btn acc" data-next>次へ<small>Enter</small></button></div>`:'';
  return head+`<div class="card" style="min-height:0;padding:22px 24px">${prompt}</div>${body}${after}`;}

function viewResult(){const sess=S.session,n=sess.res.length,ok=sess.res.filter(r=>r.ok).length,wrong=sess.res.filter(r=>!r.ok).map(r=>r.it),pct=n?Math.round(ok/n*100):0,c=SUBJ[S.subj].cls;
  const r=52,circ=2*Math.PI*r;
  return `<section class="panel"><div class="score">
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(circ*pct/100).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="var(--fg)" font-family="var(--sans)">${pct}%</text></svg>
    <div><div class="big num">${ok} / ${n} 問</div><div class="sm">${pct===100?'全問正解。次は範囲を広げましょう。':pct>=80?'あと一歩。間違えた語を復習しましょう。':'間違えた語は「苦手」に登録されました。もう一度挑戦。'}</div></div></div>
    <div class="row">${wrong.length?`<button class="btn acc" data-retry="wrong">間違えた ${wrong.length} 語をもう一度</button>`:''}<button class="btn" data-retry="same">同じ設定でもう一度</button><button class="btn ghost" data-quit>ホームへ</button></div></section>
    ${wrong.length?`<h2 style="font-size:.95rem;margin:4px 0 10px">今回間違えた語</h2><ul class="wlist">${wrong.map(it=>`<li><span class="w ${c}">${esc(it.w)}${it.k?`<small style="font-weight:400;color:var(--muted);margin-left:6px">${esc(it.k)}</small>`:''}</span><span class="m">${esc(it.m.join('／'))}</span></li>`).join('')}</ul>`:''}`;}

function viewList(){const L=S.list,c=SUBJ[S.subj].cls,q=L.q.trim().toLowerCase();
  let items=DATA[S.subj].filter(it=>L.st==='all'||status(it)===L.st).filter(it=>L.lv==='all'||it.lv===+L.lv);
  if(q)items=items.filter(it=>(it.w+' '+(it.k||'')+' '+it.m.join(' ')+' '+(it.der||'')+' '+(it.rel||[]).map(x=>x[0]+' '+x[2]).join(' ')+' '+(it.num||'')).toLowerCase().includes(q));
  const total=items.length,CAP=200;items=items.slice(0,CAP);
  const chip=(k,v,lab)=>`<button class="fchip" data-f="${k}" data-v="${v}" aria-pressed="${String(L[k])===v}">${lab}</button>`;
  return `<input type="search" id="q" placeholder="語・意味で検索" value="${esc(L.q)}" autocomplete="off">
  <div class="filters">${chip('st','all','すべて')}${chip('st','new','未学習')}${chip('st','learning','学習中')}${chip('st','weak','苦手')}${chip('st','ok','習得')}<span style="width:8px"></span>${SUBJ[S.subj].fixLv||SUBJ[S.subj].yomi?'':chip('lv','all','全レベル')+Object.keys(SUBJ[S.subj].lv).map(l=>chip('lv',l,SUBJ[S.subj].lv[l])).join('')}</div>
  <div class="count num">${total} 語${total>CAP?`（先頭 ${CAP} 語を表示。検索や絞り込みで狭めてください）`:''}</div>
  ${items.length?`<ul class="vlist">${items.map(it=>{const st=status(it),open=L.open===it.id;
    return `<li class="vrow"><button data-open="${esc(it.id)}" aria-expanded="${open}"><span class="dot ${st}" title="${STATUS[st]}"></span><span class="vw ${c}">${it.num?`<small style="margin:0 6px 0 0">${it.num}</small>`:''}${esc(it.w)}${it.k?`<small>${esc(it.k)}</small>`:''}<small>${esc(it.pos)}</small></span><span class="vm">${esc(it.m.join('／'))}</span></button>
    ${open?`<div class="vdet">${detailHtml(it)}<div class="row"><button class="btn" data-set="weak" data-id="${esc(it.id)}">苦手に登録</button><button class="btn" data-set="ok" data-id="${esc(it.id)}">習得済みにする</button><button class="btn ghost" data-set="new" data-id="${esc(it.id)}">記録を消す</button></div></div>`:''}</li>`;}).join('')}</ul>`
  :'<div class="empty">該当する語がありません</div>'}`;}

function viewStats(){const c=SUBJ[S.subj].cls;
  const subjBlock=s=>{const cc=counts(s),all=DATA[s];const lvs=Object.keys(SUBJ[s].lv).map(n=>{const a=all.filter(it=>it.lv===+n),o=a.filter(it=>status(it)==='ok').length;return{n,lab:SUBJ[s].lv[n],a:a.length,o};});
    return `<div class="panel"><h2>${esc(SUBJ[s].name)} <span class="sub">${cc.total}語</span></h2>
    <div class="bar"><i class="ok" style="width:${cc.ok/cc.total*100}%"></i><i class="learning" style="width:${cc.learning/cc.total*100}%"></i><i class="weak" style="width:${cc.weak/cc.total*100}%"></i></div>
    <div class="legend" style="margin-bottom:6px"><span class="ok">習得 ${cc.ok}</span><span class="learning">学習中 ${cc.learning}</span><span class="weak">苦手 ${cc.weak}</span><span>未学習 ${cc.new}</span></div>
    ${lvs.map(l=>`<div class="lvbar"><span class="lab">${l.n} ${esc(l.lab)}</span><div class="track"><i style="width:${l.a?l.o/l.a*100:0}%"></i></div><span class="v num">${l.o}/${l.a}</span></div>`).join('')}</div>`;};
  // 14日間の回答数
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:today(d),d,n:store.days[today(d)]||0});}
  const max=Math.max(1,...days.map(x=>x.n)),W=560,H=120,pad=22,bw=(W-pad*2)/14;
  const bars=days.map((x,i)=>{const h=x.n/max*(H-40);const bx=pad+i*bw+3;return `<rect x="${bx.toFixed(1)}" y="${(H-24-h).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${x.n?'var(--accent)':'var(--line)'}"/>${x.n?`<text x="${(bx+(bw-6)/2).toFixed(1)}" y="${(H-28-h).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.n}</text>`:''}${i%2===1?`<text x="${(bx+(bw-6)/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${x.d.getMonth()+1}/${x.d.getDate()}</text>`:''}`;}).join('');
  const weak=DATA[S.subj].filter(it=>status(it)==='weak').map(it=>({it,r:store.prog[it.id]})).sort((a,b)=>(b.r.x-b.r.c)-(a.r.x-a.r.c)).slice(0,15);
  const total=Object.values(store.days).reduce((a,b)=>a+b,0);
  return `<div class="sgrid">${Object.keys(SUBJ).filter(k=>!SUBJ[k].base).map(subjBlock).join('')}</div>
  <section class="panel"><h2>学習の記録 <span class="sub">直近14日 ／ 累計 ${total} 問 ／ 連続 ${streak()} 日</span></h2>
    <svg class="act" viewBox="0 0 ${W} ${H}" role="img" aria-label="直近14日間の回答数"><line x1="${pad}" y1="${H-24}" x2="${W-pad}" y2="${H-24}" stroke="var(--line)"/>${bars}</svg></section>
  <section class="panel"><h2>${esc(SUBJ[S.subj].name)}の苦手ワード <span class="sub">間違いが多い順・上位15</span></h2>
    ${weak.length?`<ul class="wlist">${weak.map(({it,r})=>`<li><span class="w ${c}">${esc(it.w)}</span><span class="m">${esc(it.m.join('／'))}</span><span class="num" style="color:var(--bad);font-size:.8rem">✕${r.x}　◯${r.c}</span></li>`).join('')}</ul>
    <div class="row" style="margin-top:12px"><button class="btn acc" data-start-weak>苦手ワードだけ4択で復習</button></div>`:'<p class="hint" style="margin:0">苦手に登録された語はありません。</p>'}</section>
  <section class="panel"><h2>バックアップ <span class="sub">別の端末へ記録を移す</span></h2>
    <div class="row"><button class="btn" data-export>記録をコピー</button></div>
    <p class="hint" style="margin:10px 0 6px">コピーした文字列を別の端末の下の欄に貼り付けて「復元」を押すと、記録が引き継がれます。</p>
    <textarea id="imp" placeholder="ここに貼り付け"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" data-import>復元（既存の記録と統合）</button></div>
    <div class="msg" id="msg">${esc(S.msg)}</div></section>
  <section class="panel"><h2 class="danger">記録のリセット</h2>
    ${S.confirm?`<div class="confirm"><span>${esc(SUBJ[S.subj].name)}の学習記録をすべて消します。元に戻せません。</span><button class="btn bad" data-reset="yes" style="padding:8px 14px">消す</button><button class="btn ghost" data-reset="no" style="padding:8px 14px">やめる</button></div>`
    :`<div class="row"><button class="btn ghost danger" data-reset="ask">${esc(SUBJ[S.subj].name)}の記録を消す</button></div>`}</section>`;}

/* ---- events ---- */
function setSubj(k){S.subj=k;store.prefs.subj=k;store.prefs.last=Object.assign({},store.prefs.last,{[groupOf(k)]:k});save();S.session=null;S.msg='';S.confirm=false;S.list.open=null;S.list.lv='all';render();}
document.querySelector('.switch').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(!b)return;const g=b.dataset.group;const last=(store.prefs.last||{})[g];setSubj(last&&SUBJ[last]?last:g);});
document.querySelector('.subtabs').addEventListener('click',e=>{const b=e.target.closest('[data-subj]');if(!b)return;setSubj(b.dataset.subj);});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.session=null;S.msg='';S.confirm=false;render();});
const view=$('#view');
view.addEventListener('change',e=>{const s=e.target.closest('[data-pref]');if(s){setPref(s.dataset.pref,s.value);}});
view.addEventListener('input',e=>{if(e.target.id==='q'){S.list.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(x){}}}});
view.addEventListener('click',e=>{
  const t=e.target;const h=(sel)=>t.closest(sel);let b;
  if(b=h('[data-start]')){start(b.dataset.start);return;}
  if(h('[data-start-weak]')){const items=shuffle(DATA[S.subj].filter(it=>status(it)==='weak'));start('quiz',items);return;}
  if(h('[data-quit]')){S.session=null;S.tab='home';render();return;}
  if(h('[data-flip]')){S.session.flipped=true;render();return;}
  if(b=h('[data-ans]')){answer(b.dataset.ans==='1');next();return;}
  if(b=h('[data-pick]')){const sess=S.session;if(sess.picked!==null)return;sess.picked=+b.dataset.pick;answer(sess.choices[sess.picked].id===sess.items[sess.i].id);render();return;}
  if(h('[data-next]')){next();return;}
  if(b=h('[data-retry]')){const sess=S.session;if(b.dataset.retry==='wrong'){start(sess.mode,shuffle(sess.res.filter(r=>!r.ok).map(r=>r.it)));}else{start(sess.mode);}return;}
  if(b=h('[data-f]')){S.list[b.dataset.f]=b.dataset.v;render();return;}
  if(b=h('[data-open]')){S.list.open=S.list.open===b.dataset.open?null:b.dataset.open;render();return;}
  if(b=h('[data-set]')){const it=DATA[S.subj].find(x=>x.id===b.dataset.id);if(it){setStatus(it,b.dataset.set);render();}return;}
  if(b=h('[data-reset]')){if(b.dataset.reset==='ask'){S.confirm=true;}else if(b.dataset.reset==='yes'){DATA[S.subj].forEach(it=>delete store.prog[it.id]);save();S.confirm=false;S.msg='';}else{S.confirm=false;}render();return;}
  if(h('[data-export]')){const txt=JSON.stringify({prog:store.prog,days:store.days});const done=()=>{S.msg='コピーしました。別の端末で貼り付けてください。';render();};
    const fallback=()=>{const ta=$('#imp');if(ta){ta.value=txt;ta.focus();ta.select();}S.msg='下の欄に記録を表示しました。全選択してコピーしてください。';const m=$('#msg');if(m)m.textContent=S.msg;};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}else fallback();}catch(x){fallback();}return;}
  if(h('[data-import]')){const ta=$('#imp');try{const j=JSON.parse(ta.value);if(!j||typeof j.prog!=='object')throw 0;let n=0;
      for(const id in j.prog){const a=store.prog[id],b=j.prog[id];if(!b)continue;if(!a||(b.t||0)>(a.t||0)){store.prog[id]=b;n++;}}
      for(const d in (j.days||{})){store.days[d]=Math.max(store.days[d]||0,j.days[d]);}save();S.msg=n+' 語の記録を取り込みました。';}
    catch(x){S.msg='読み取れませんでした。コピーした文字列をそのまま貼り付けてください。';}render();return;}
});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('[data-flip]')){S.session.flipped=true;render();}});
view.addEventListener('submit',e=>{const f=e.target.closest('[data-submit]');if(!f)return;e.preventDefault();const sess=S.session;if(!sess||sess.picked!==null)return;const v=$('#ans').value;if(!v.trim())return;sess.typedAns=v.trim();const it_=sess.items[sess.i],nk=x=>String(x).replace(/[\s　]/g,'');const ok=sess.mode==='typeY'?(nk(v)===nk(it_.m[0])||(!!it_.alt&&nk(v)===nk(it_.alt))):clozeOk(it_,v,curCloze(sess).f);sess.picked=ok;answer(ok);render();});
document.addEventListener('keydown',e=>{const sess=S.session;if(!sess||sess.i>=sess.items.length)return;if(e.target.matches('input,textarea,select'))return;
  if(sess.mode==='flash'){
    if(e.key===' '){e.preventDefault();if(!sess.flipped){sess.flipped=true;render();}return;}
    if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();answer(false);next();return;}
    if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();answer(true);next();return;}
  }else{
    if((sess.mode==='clozeT'||sess.mode==='typeY')&&sess.picked===null)return;
    if(/^[1-4]$/.test(e.key)&&sess.picked===null&&sess.choices){const i=+e.key-1;sess.picked=i;answer(sess.choices[i].id===sess.items[sess.i].id);render();return;}
    if((e.key==='Enter'||e.key===' ')&&sess.picked!==null){e.preventDefault();next();return;}
  }});

$('#n-kobun').textContent=DATA.kobun.length;$('#n-eigo').textContent=DATA.eigo.length;
{if(SUBJ.book){$('.about').textContent='収録: '+SUBJ.book.name+' '+DATA.book.length+'語（関連語 '+BOOKREL.length+'語）／読み '+(DATA.yomi?DATA.yomi.length:0)+'語／古文 '+DATA.kobun.length+'語／英単語 '+DATA.eigo.length+'語。学習記録はこの端末のブラウザにだけ保存されます。';}}
if(!SUBJ[S.subj])S.subj='kobun';
function boot(d){try{if(d&&d.S){S.subj=d.S.subj||S.subj;S.tab=d.S.tab||S.tab;if(d.S.session)S.session=d.S.session;}}catch(e){}render();}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S:{subj:S.subj,tab:S.tab,session:S.session}}));}catch(e){}
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(boot):boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
