<title>難関大 単語ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Source+Serif+4:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* レイアウト: 上部に科目スイッチ付きの固定ヘッダー、3タブ、760px の単一カラム。学習中は1枚のカードに集中させる */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f5f6f9; --fg:#1b1d24; --muted:#5f6573; --line:#d8dbe2;
  --accent:#9b2335; --accent-ink:#ffffff; --accent-soft:#f7e7ea;
  --ok:#2b7a4b; --ok-ink:#ffffff; --ok-soft:#e2f1e7; --bad-ink:#ffffff; --warn:#a2650a; --warn-soft:#f9ecd4; --bad:#b4372c; --bad-soft:#f9e3e0; --new:#8a90a0;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 10px 28px -14px rgba(20,24,40,.22);
  --serif-ja:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --serif-en:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
  --r:14px;
}
:root[data-subj="eigo"]{--accent:#1f4e9c;--accent-soft:#e4ebf8}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --surface:#1d2029; --surface2:#242834; --fg:#e8e9ee; --muted:#9aa0ae; --line:#303542;
    --accent:#e2808d; --accent-ink:#1a0d10; --accent-soft:#3a2229;
    --ok:#6cc48e; --ok-ink:#0d2416; --ok-soft:#1f3328; --bad-ink:#2a0f0c; --warn:#e0b25b; --warn-soft:#3a3020; --bad:#ef8a7f; --bad-soft:#3d2422; --new:#6f7585;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-subj="eigo"]{--accent:#8fb0f2;--accent-ink:#0b1630;--accent-soft:#222d46}
}
:root[data-theme="dark"]{
  --bg:#14161c; --surface:#1d2029; --surface2:#242834; --fg:#e8e9ee; --muted:#9aa0ae; --line:#303542;
  --accent:#e2808d; --accent-ink:#1a0d10; --accent-soft:#3a2229;
  --ok:#6cc48e; --ok-ink:#0d2416; --ok-soft:#1f3328; --bad-ink:#2a0f0c; --warn:#e0b25b; --warn-soft:#3a3020; --bad:#ef8a7f; --bad-soft:#3d2422; --new:#6f7585;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="dark"][data-subj="eigo"]{--accent:#8fb0f2;--accent-ink:#0b1630;--accent-soft:#222d46}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:760px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--serif-ja);font-weight:700;font-size:1.15rem;letter-spacing:.04em}
.brand .lv{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.switch{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch{flex-wrap:wrap}.switch button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.switch button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:500}
.subtabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.subtabs button .n{font-size:.72rem;margin-left:4px;opacity:.75;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:0;background:transparent;padding:12px 14px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* home */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .lab{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.tile .val{font-size:1.6rem;font-weight:700;line-height:1.2;margin-top:2px}
.tile .val small{font-size:.8rem;font-weight:400;color:var(--muted);margin-left:2px}
.tile.ok .val{color:var(--ok)}.tile.weak .val{color:var(--bad)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);margin-bottom:6px}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}.bar .learning{background:var(--warn)}.bar .weak{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:22px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--new)}
.legend .ok::before{background:var(--ok)}.legend .learning::before{background:var(--warn)}.legend .weak::before{background:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:16px}
.panel h2{font-size:.95rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2 .sub{font-weight:400;color:var(--muted);font-size:.8rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
select,input[type=text],input[type=search],textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;box-shadow:var(--shadow)}
.mode:hover{transform:translateY(-1px);border-color:var(--accent)}
.mode .k{font-size:.72rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
.mode .t{font-size:1.05rem;font-weight:700}
.mode .d{font-size:.82rem;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);margin:0 0 12px}
.today{display:flex;gap:18px;font-size:.85rem;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}
.today b{color:var(--fg)}
.share{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:.84rem;color:var(--fg)}
.share b{display:block;margin-bottom:2px}

/* study */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:.85rem;color:var(--muted)}
.prog .track{flex:1;height:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.prog button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;min-height:340px;display:flex;flex-direction:column;justify-content:center;position:relative}
.card.flip{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.chip.lv{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.word{line-height:1.2;margin:0}
.word.ja{font-family:var(--serif-ja);font-size:clamp(2rem,7vw,2.9rem);font-weight:700;letter-spacing:.02em}
.word.en{font-family:var(--serif-en);font-size:clamp(2.1rem,7vw,3.1rem);font-weight:600;letter-spacing:-.01em}
.kanji{font-family:var(--serif-ja);color:var(--muted);font-size:1.05rem;margin-top:6px}
.tap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:.78rem;color:var(--muted)}
.back{animation:rise .22s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.back .word.ja{font-size:1.6rem}.back .word.en{font-size:1.7rem}
.means{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.means li{display:flex;gap:10px;font-size:1.05rem;font-weight:500}
.means li::before{content:counter(m);counter-increment:m;flex:none;width:1.4em;height:1.4em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem;display:grid;place-items:center;margin-top:.3em;font-weight:700}
.means{counter-reset:m}
.ex{margin:16px 0 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0}
.ex .q{font-weight:500}
.ex .q.ja{font-family:var(--serif-ja)}.ex .q.en{font-family:var(--serif-en);font-style:italic;font-size:1.02rem}
.ex .tr{color:var(--muted);font-size:.9rem;margin-top:3px}
.note{margin-top:12px;font-size:.86rem;background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:8px 12px}
.note b{color:var(--warn);margin-right:6px}
.der{margin-top:10px;font-size:.86rem;color:var(--muted)}
.means.per{gap:10px}.means.per li>span{min-width:0;flex:1}
.ex.sm{display:block;margin:6px 0 0;padding:7px 12px;font-weight:400;font-size:.95rem}
.ex.sm .q,.ex.sm .tr{display:block}.ex.sm .tr{font-size:.85rem}
.rel{margin-top:12px;font-size:.88rem}
.rel>b{display:block;margin-bottom:4px;font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.rel ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rel li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 10px;background:var(--surface2);border-radius:8px}
.rel .rw{font-family:var(--serif-ja);font-weight:700}.rel .rp{font-size:.72rem;color:var(--muted)}.rel .rm{flex:1 1 160px;min-width:0}
.chip.num{background:var(--fg);color:var(--bg);border-color:var(--fg);font-variant-numeric:tabular-nums}
.der b{color:var(--fg);font-weight:500;margin-right:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-weight:700;font-size:1rem;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn small{display:block;font-weight:400;font-size:.72rem;opacity:.75}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}

/* cloze */
.cloze{margin:4px 0 0;font-size:1.25rem;line-height:1.7;font-weight:500}
.cloze.en{font-family:var(--serif-en)}.cloze.ja{font-family:var(--serif-ja)}
.blank{display:inline-block;min-width:4.5em;text-align:center;border-bottom:2px solid var(--accent);color:var(--accent);padding:0 .3em;font-weight:700}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.ng{color:var(--bad);border-color:var(--bad)}
.typeform{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
@media (max-width:480px){.typeform{grid-template-columns:1fr}}
.typeform input{font-size:1.1rem;padding:12px 14px}
/* quiz */
.qprompt{font-size:.8rem;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:1rem;line-height:1.45;min-width:0;transition:border-color .12s,background .12s}
.choice .n{flex:none;width:1.6em;height:1.6em;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.choice .txt{min-width:0;overflow-wrap:anywhere}
.choice .txt.en{font-family:var(--serif-en);font-size:1.15rem}
.choice .txt.ja{font-family:var(--serif-ja);font-size:1.15rem}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--ok-soft);border-color:var(--ok)}.choice.correct .n{background:var(--ok);color:var(--ok-ink);border-color:var(--ok)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}.choice.wrong .n{background:var(--bad);color:var(--bad-ink);border-color:var(--bad)}
.choice.dim{opacity:.55}
.verdict{margin-top:16px;font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--bad)}
.detail{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;animation:rise .2s ease-out both}

/* result */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.ring{width:120px;height:120px;flex:none}
.score .big{font-size:2rem;font-weight:700;line-height:1.1}
.score .sm{color:var(--muted);font-size:.9rem}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wlist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.wlist .w{font-weight:700;font-size:1.05rem}
.wlist .w.ja{font-family:var(--serif-ja)}.wlist .w.en{font-family:var(--serif-en)}
.wlist .m{color:var(--muted);flex:1 1 200px;min-width:0}

/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vrow{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vrow>button{width:100%;border:0;background:transparent;text-align:left;padding:11px 14px;display:grid;grid-template-columns:10px minmax(0,1.1fr) minmax(0,2fr);gap:12px;align-items:center}
@media (max-width:560px){.vrow>button{grid-template-columns:10px 1fr}.vrow .vm{grid-column:2}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--new)}
.dot.ok{background:var(--ok)}.dot.learning{background:var(--warn)}.dot.weak{background:var(--bad)}
.vw{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.vw.ja{font-family:var(--serif-ja)}.vw.en{font-family:var(--serif-en)}
.vw small{font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px;font-family:var(--sans)}
.vm{color:var(--muted);font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.vdet{padding:0 14px 14px;border-top:1px dashed var(--line);margin-top:0;padding-top:12px;animation:rise .18s ease-out both}
.vdet .row{margin-top:12px}
.vdet .row .btn{flex:1 1 140px;padding:9px 12px;font-size:.88rem;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:40px 0}

/* stats */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:560px){.sgrid{grid-template-columns:1fr}}
.lvbar{display:flex;align-items:center;gap:10px;font-size:.85rem;margin-top:8px}
.lvbar .lab{width:6.5em;color:var(--muted);flex:none}
.lvbar .track{flex:1;height:8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.lvbar .track i{display:block;height:100%;background:var(--accent)}
.lvbar .v{width:4.5em;text-align:right;flex:none}
.act{width:100%;height:auto;display:block;margin-top:6px}
.danger{color:var(--bad)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.9rem}
.msg{font-size:.85rem;color:var(--ok);margin-top:8px;min-height:1.2em}
textarea{min-height:80px;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace}
footer.about{margin-top:36px;font-size:.78rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header class="top"><div class="wrap">
  <div class="brand"><h1>単語ドリル</h1><span class="lv">共通テスト〜最難関大レベル</span></div>
  <div class="switch" role="tablist" aria-label="科目">
    <button role="tab" data-group="kobun" aria-selected="true">古文</button>
    <button role="tab" data-group="eigo" aria-selected="false">英語</button>
  </div>
</div>
<div class="wrap"><nav class="subtabs" role="tablist" aria-label="教材"></nav></div></header>
<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="画面">
    <button role="tab" data-tab="home" aria-selected="true">学習</button>
    <button role="tab" data-tab="list" aria-selected="false">単語帳</button>
    <button role="tab" data-tab="stats" aria-selected="false">成績</button>
  </nav>
  <main id="view" aria-live="polite"></main>
  <footer class="about">収録: 古文 <span id="n-kobun"></span>語 / 英単語 <span id="n-eigo"></span>語。学習記録はこの端末のブラウザにだけ保存されます。</footer>
</div>
<script>
// 古文単語データ
// [見出し, 漢字表記, 品詞, [意味...], 用例, 用例訳, 注, レベル(1=必修,2=発展), [タグ]]
const KOBUN_RAW = [

rs.","政府は労働時間に関する法律を改正する計画だ。"],["Please amend the report to include the latest figures.","最新の数字を含めるように報告書を修正してください。"]],"amid":[["The team won the final amid cheers from thousands of fans.","チームは数千人のファンの歓声の中で決勝戦に勝った。"],["The old temple stands amid tall trees on the hill.","その古い寺は丘の上の高い木々に囲まれて建っている。"]],"amorphous":[["Clouds are amorphous masses that constantly change shape.","雲は絶えず形を変える不定形の塊だ。"],["The amorphous plan gave workers no clear direction.","その漠然とした計画は従業員に明確な方向を示さなかった。"]],"amount":[["A large amount of water is wasted in the process of farming.","農業の過程で大量の水が無駄になっている。"],["The total amount of the bill was higher than I expected.","請求書の総額は私が予想したより高かった。"],["His debts amount to more than ten million yen.","彼の借金は総計で1000万円以上になる。"]],"amplify":[["Social media can amplify rumors and spread them quickly.","ソーシャルメディアはうわさを増幅し、素早く広めることがある。"],["The media coverage amplified the effects of the crisis.","メディアの報道は危機の影響を拡大した。"]],"analogy":[["Reasoning by analogy, scientists applied the results from mice to humans.","類推によって、科学者たちはマウスでの結果を人間に当てはめた。"],["The teacher used an analogy to explain how electricity flows.","先生は電気の流れを説明するためにたとえを用いた。"]],"ancient":[["Ancient people used the stars to find their way at night.","古代の人々は夜に道を見つけるのに星を利用した。"],["They still follow an ancient custom of sharing food with neighbors.","彼らは今も近所の人と食べ物を分け合う古くからの習慣に従っている。"]],"annihilate":[["The invading army was annihilated in a single battle.","侵略軍は一度の戦闘で全滅させられた。"],["Our team annihilated the rivals by a score of ten to zero.","私たちのチームは10対0でライバルを完敗させた。"]],"announce":[["The company announced plans to build a new factory next year.","その会社は来年新工場を建設する計画を発表した。"],["The loudspeaker announced that the train would be delayed.","拡声器は列車が遅れることを告げた。"]],"annoy":[["Loud noise from the construction site annoyed the neighbors.","工事現場の大きな騒音は近隣住民をいらだたせた。"],["Mosquitoes annoyed the campers all night long.","蚊が一晩中キャンプをする人たちを悩ませた。"]],"annual":[["The company holds an annual meeting for all of its shareholders.","その会社は全株主のための年1回の総会を開く。"],["The annual festival attracts thousands of visitors from all over Japan.","その例年の祭りには日本中から数千人が訪れる。"]],"anomaly":[["Scientists noticed an anomaly in the data from the satellite.","科学者たちはその衛星のデータに異常があることに気づいた。"],["The warm winter was an anomaly in an otherwise cold decade.","その暖冬は、寒かった10年間における例外だった。"]],"antagonism":[["There was deep antagonism between the two rival political groups.","二つの対立する政治団体の間には深い敵意があった。"],["Antagonism between the two groups made cooperation almost impossible.","二つの集団の対立が、協力をほとんど不可能にした。"]],"anticipate":[["We did not anticipate such a strong reaction from the public.","私たちは世間からこれほど強い反応があるとは予想していなかった。"],["Children eagerly anticipate the arrival of summer vacation.","子どもたちは夏休みの到来を楽しみに待っている。"]],"antidote":[["The doctor gave him an antidote to the snake's poison.","医師は彼にそのヘビの毒に対する解毒剤を与えた。"],["Travel is often an antidote to boredom and narrow thinking.","旅行はしばしば退屈や視野の狭さに対する対抗手段となる。"]],"anxiety":[["Many students feel anxiety before taking important entrance exams.","多くの学生は重要な入試の前に不安を感じる。"],["Her anxiety about her son's health kept her awake all night.","息子の健康への心配のせいで、彼女は一晩中眠れなかった。"]],"anxious":[["She was anxious about her son's safety during the storm.","彼女は嵐の間、息子の安全を心配していた。"],["He was anxious to start his new job as soon as possible.","彼は新しい仕事をできるだけ早く始めたいと切望していた。"]],"apathy":[["Voter apathy has become a serious problem in many democracies.","有権者の無関心は多くの民主主義国家で深刻な問題となっている。"],["After months of failure, the workers fell into apathy.","何か月もの失敗の後、労働者たちは無気力に陥った。"]],"apocryphal":[["The quote is often attributed to Einstein, but it is apocryphal.","その言葉はよくアインシュタインのものとされるが、出所は疑わしい。"],["The story about the president's childhood is probably apocryphal.","その大統領の幼少期についての話はおそらく作り話だろう。"]],"apparatus":[["The laboratory has a lot of expensive scientific apparatus.","その研究室には高価な科学器具がたくさんある。"],["Divers wear a breathing apparatus when they go deep underwater.","ダイバーは深く潜るとき呼吸用の装置を身につける。"],["The state apparatus was too slow to respond to the crisis.","国家の機構は危機への対応があまりに遅かった。"]],"apparent":[["It soon became apparent that the plan would fail.","その計画が失敗することはすぐに明らかになった。"],["Despite his apparent calm, he was extremely nervous inside.","見せかけの落ち着きにもかかわらず、彼は内心とても緊張していた。"]],"appeal":[["The charity appealed to the public for donations after the flood.","その慈善団体は洪水の後、一般の人々に寄付を求めて訴えかけた。"],["The city's main appeal is its beautiful old streets.","その市の最大の魅力は美しい古い街並みだ。"],["The defendant appealed to a higher court against the verdict.","被告は判決を不服として上級裁判所に上訴した。"]],"appease":[["The government tried to appease angry citizens by lowering taxes.","政府は減税によって怒れる市民をなだめようとした。"],["The mayor offered extra pay to appease the strikers' demands.","市長はストライキ参加者の要求を和らげるために追加の賃金を提示した。"]],"appetite":[["Hard exercise gave the boys a huge appetite.","激しい運動で少年たちは大変な食欲がわいた。"],["The public has a growing appetite for news about space travel.","世間では宇宙旅行についてのニュースへの欲求が高まっている。"]],"applaud":[["The audience stood up and applauded the performers loudly.","観客は立ち上がり、出演者に盛大な拍手を送った。"],["Critics applauded the mayor's decision to protect the forest.","批評家たちは森を守るという市長の決定を称賛した。"]],"applicable":[["The same rule is applicable to every member of the team.","同じ規則がチームのすべてのメンバーに当てはまる。"],["This discount is not applicable to sale items.","この割引はセール品には適用されない。"]],"applicant":[["Applicants for the scholarship must submit an essay in English.","奨学金の志願者は英語の小論文を提出しなければならない。"],["There were over a hundred applicants for the position.","その職には100人以上の応募者がいた。"]],"apply":[["You can apply for the scholarship online until the end of May.","5月末までオンラインで奨学金に申し込める。"],["This rule does not apply to students under the age of ten.","この規則は10歳未満の生徒には当てはまらない。"],["Engineers apply scientific knowledge to solve practical problems.","技術者は実際的な問題を解決するために科学的知識を応用する。"]],"appoint":[["The president appointed her as the head of the new committee.","社長は彼女を新しい委員会の委員長に任命した。"],["Both sides agreed to meet at the appointed time and place.","双方は指定された日時と場所で会うことに同意した。"]],"appraisal":[["The teacher gave an honest appraisal of the student's essay 。"],["The rules of the ancient game seemed arcane to outsiders.","その古い遊戯の規則は部外者には難解に思えた。"]],"ardent":[["He wrote an ardent letter to the woman he loved.","彼は愛する女性に熱烈な手紙を書いた。"],["She is an ardent supporter of animal rights.","彼女は動物の権利の熱心な支持者である。"]],"arduous":[["The climbers made an arduous journey to the top of the mountain.","登山家たちは山頂まで骨の折れる道のりを進んだ。"],["Rebuilding the town after the flood was an arduous task.","洪水の後に町を再建するのは困難な作業だった。"]],"argue":[["Some scientists argue that the climate is changing faster than expected.","気候は予想より速く変化していると主張する科学者もいる。"],["The two scholars argued about the origin of the language for hours.","2人の学者はその言語の起源について何時間も議論した。"],["My parents rarely argue in front of the children.","私の両親は子どもの前で口論することはめったにない。"]],"arise":[["Problems often arise when people fail to communicate clearly.","人々がはっきり意思疎通できないとき、問題はしばしば生じる。"],["A serious dispute may arise when two countries disagree about the border.","2国が国境をめぐって対立すると、深刻な紛争が起こることがある。"]],"arouse":[["The speech aroused memories of his childhood in the village.","その演説は、彼の村での子ども時代の記憶を呼び起こした。"],["The strange noise aroused the curiosity of the children.","その奇妙な物音は子どもたちの好奇心をかき立てた。"]],"arrange":[["I will arrange a meeting with the manager for next Monday.","来週月曜日に部長との面会を手配しておきます。"],["She arranged the flowers carefully in a glass vase.","彼女は花をガラスの花瓶に丁寧に整えて生けた。"],["The books are arranged in alphabetical order by author.","本は著者名のアルファベット順に配列されている。"]],"array":[["The store offers a wide array of products at low prices.","その店は低価格で多種多様な商品を取りそろえている。"],["The program stores the data in an array of numbers.","そのプログラムはデータを数値の配列に保存する。"]],"articulate":[["She articulated her concerns clearly at the meeting.","彼女は会議で自分の懸念をはっきりと述べた。"],["She is an articulate speaker who explains complex ideas clearly.","彼女は複雑な考えを明瞭に説明する表現力のある話し手だ。"]],"ascertain":[["Please ascertain the exact time of the meeting before you leave.","出かける前に会議の正確な時刻を確かめてください。"],["The police tried to ascertain the cause of the fire.","警察は火災の原因を突き止めようとした。"]],"ascetic":[["The monk lived an ascetic life in a small mountain hut.","その僧は山中の小屋で禁欲的な生活を送った。"],["The ascetic lived alone in the mountains for decades.","その苦行者は何十年も山中で一人暮らしをした。"]],"aspect":[["Education is an important aspect of a child's development.","教育は子どもの成長の重要な側面である。"],["We must consider the problem from every aspect before deciding.","決定する前に、あらゆる観点からその問題を検討しなければならない。"]],"aspire":[["Many young athletes aspire to compete in the Olympics.","多くの若い選手がオリンピックへの出場を熱望している。"],["He aspires to a career in international law.","彼は国際法の分野でのキャリアを目指している。"]],"assemble":[["The teacher assembled the students in the hall for the announcement.","先生は発表のために生徒たちを講堂に集めた。"],["Workers assemble the cars on a long production line.","作業員は長い生産ラインで自動車を組み立てる。"],["Thousands of people assembled in the square to hear the speech.","数千人が演説を聞くために広場に集まった。"]],"asset":[["The company sold several of its assets to pay its debts.","その会社は借金を返すために資産のいくつかを売却した。"],["Her fluency in three languages is a great asset to the company.","三か国語に堪能であることは会社にとって彼女の大きな強みだ。"]],"assiduous":[["Years of assiduous study finally brought him success.","長年の勤勉な学習がついに彼に成功をもたらした。"],["Her assiduous efforts to find the missing child never stopped.","行方不明の子どもを探す彼女の根気強い努力は決して止まらなかった。"]],"assign":[["The teacher assigned each student a different topic to research.","先生は各生徒に調べるべき異なる題材を割り当てた。"],["The company assigned her to lead the overseas sales team.","会社は彼女を海外営業チームの責任者に任命した。"]],"assimilate":[["The body assimilates nutrients from the food we eat.","体は私たちが食べる食物から栄養素を吸収する。"],["Immigrants often take years to assimilate into a new culture.","移民が新しい文化に同化するには何年もかかることが多い。"]],"assist":[["Volunteers assisted the elderly residents during the evacuation.","ボランティアが避難の間、高齢の住民を手助けした。"],["The government assists families who lost their homes in the flood.","政府は洪水で家を失った家族を援助している。"]],"associate":[["Many people associate the color green with nature and peace.","多くの人は緑色を自然や平和と結びつけて考える。"],["Doctors associate high blood pressure with an unhealthy diet.","医師たちは高血圧を不健康な食事と関連づ y difficulties.","前向きな姿勢は多くの困難を乗り越える助けになる。"]],"attract":[["The new museum is expected to attract many tourists.","その新しい博物館は多くの観光客を引きつけると期待されている。"],["Her charm and humor attracted everyone she met.","彼女の魅力とユーモアは出会う人すべてを魅了した。"]],"attribute":[["Scientists attribute the rise in sea levels to melting glaciers.","科学者は海面上昇を氷河の融解のせいだと考えている。"],["Honesty is an important attribute of a good leader.","誠実さは優れた指導者の重要な特性だ。"]],"audacious":[["The architect presented an audacious design for the new bridge.","その建築家は新しい橋の大胆なデザインを提示した。"],["It was audacious of him to ask for a raise after one week.","入社1週間で昇給を求めるとは、彼も厚かましい。"]],"audience":[["The speaker held the attention of the audience for an hour.","講演者は1時間にわたって聴衆の関心を引きつけ続けた。"],["The audience applauded loudly at the end of the play.","劇の終わりに観客は大きな拍手を送った。"]],"augment":[["The government plans to augment spending on education next year.","政府は来年、教育への支出を増大させる計画だ。"],["He augmented his salary by teaching evening classes.","彼は夜間の講座を教えて給料を補った。"]],"auspicious":[["The team made an auspicious start to the new season.","チームは新シーズンに幸先のよいスタートを切った。"],["Red is considered an auspicious color in many Asian cultures.","赤はアジアの多くの文化で縁起のよい色とされている。"]],"austere":[["The monks lived an austere life, free from luxury.","修道士たちはぜいたくから離れた質素な生活を送っていた。"],["The headmaster was an austere man who never smiled.","校長は決して笑わない厳格な人物だった。"]],"authority":[["She is a leading authority on ancient Greek history.","彼女は古代ギリシャ史の第一人者の権威だ。"],["Local authorities warned residents to stay away from the river.","地元当局は住民に川に近づかないよう警告した。"],["Only the manager has the authority to approve such expenses.","そのような経費を承認する権限を持つのは部長だけだ。"]],"automatic":[["Breathing is an automatic action that we rarely think about.","呼吸は私たちがほとんど意識しない自動的な動作である。"],["Blinking is an automatic response to bright light.","まばたきは強い光に対する無意識の反応だ。"]],"aversion":[["Many children have a strong aversion to vegetables.","多くの子どもは野菜をひどく嫌う。"],["Spiders are my greatest aversion; I cannot even look at them.","クモは私の一番の大嫌いなものだ。見ることさえできない。"]] ill harmful bacteria in food.","熱は食品中の有害な細菌を殺すことができる。"],["Some bacteria in the gut are essential for good health.","腸内のバクテリアの中には健康に不可欠なものもある。"]],"baffle":[["The strange results baffled even the most experienced researchers.","奇妙な結果は経験豊富な研究者たちさえ当惑させた。"],["Her sudden decision to leave baffled her closest friends.","彼女が突然去ると決めたことは親友たちを困惑させた。"]],"balance":[["It is hard to balance work and family life.","仕事と家庭生活の釣り合いを取るのは難しい。"],["The balance of power in the region has changed dramatically.","その地域の力の均衡は劇的に変化した。"],["Check your account balance before you make a payment.","支払いをする前に口座の残高を確認しなさい。"]],"ballot":[["The union will hold a ballot on the strike next week.","組合は来週、ストライキについての投票を行う。"],["Each voter received a ballot with the names of three candidates.","各有権者は3人の候補者の名前が載った投票用紙を受け取った。"]],"ban":[["The city banned smoking in all public parks.","市は公園での喫煙をすべて禁止した。"],["The government announced a ban on the sale of ivory.","政府は象牙の販売禁止令を発表した。"]],"bankrupt":[["The airline went bankrupt after years of heavy losses.","その航空会社は長年の巨額の損失の末に破産した。"],["The speech was bankrupt of any real new ideas.","その演説には本当に新しい考えが何一つ欠けていた。"]],"bare":[["A bare light bulb hung from the ceiling of the small cell.","むき出しの電球が小さな独房の天井からぶら下がっていた。"],["The bare minimum of food was provided to the refugees.","難民には最低限ぎりぎりの食料しか提供されなかった。"],["The trees stood bare in winter, without a single leaf.","冬の木々は一枚の葉もつけず、裸のまま立っていた。"]],"barely":[["He barely escaped from the burning building.","彼は燃える建物からかろうじて脱出した。"],["She was so tired that she could barely keep her eyes open.","彼女はひどく疲れていて、目を開けているのがやっとだった。"]],"bargain":[["At only ten dollars, the jacket was a real bargain.","わずか10ドルで、そのジャケットは本当に掘り出し物だった。"],["Tourists often bargain with street vendors over the price.","観光客はしばしば露天商と値段を交渉する。"],["The two parties struck a bargain after hours of talks.","双方は何時間もの話し合いの末に取引を成立させた。"]],"barren":[["Years of drought turned the fertile land into a barren desert.","何年もの干ばつが肥沃な土地を不毛の砂漠に変えた。"],["Years of barren negotiations produced no agreement k for school performance.","テストの点数は学校の成績を測る基準として用いられる。"],["Inflation is an important benchmark for judging the economy.","インフレは経済を判断する重要な指標だ。"]],"beneath":[["The ancient ruins lay hidden beneath several meters of sand.","古代遺跡は数メートルの砂の下に隠れていた。"],["He thought the job was beneath him, so he refused it.","彼はその仕事は自分が引き受けるに値しないと考え、断った。"]],"beneficial":[["Regular exercise is beneficial to both body and mind.","定期的な運動は心身の両方に有益だ。"],["The lecture was beneficial to students preparing for the exam.","その講義は試験に備える学生にとってためになった。"]],"benefit":[["The main benefit of the new system is its lower cost.","新システムの主な利益は費用が安いことだ。"],["Rural areas have not yet enjoyed the benefits of economic growth.","地方はまだ経済成長の恩恵を受けていない。"],["Children benefit greatly from reading aloud with their parents.","子どもは親と一緒に音読することで大いに恩恵を受ける。"]],"beset":[["The project was beset by technical problems from the start.","そのプロジェクトは当初から技術的問題に悩まされた。"],["The explorers were beset by wolves on all sides.","探検家たちは四方をオオカミに取り囲まれた。"]],"besides":[["Besides English, she speaks French and Spanish fluently.","英語のほかに、彼女はフランス語とスペイン語も流暢に話す。"],["The room is too small; besides, it is far too expensive.","その部屋は狭すぎる。その上、値段も高すぎる。"]],"bestow":[["The queen bestowed the title of knight on the explorer.","女王はその探検家にナイトの称号を授けた。"],["The university bestowed an honorary degree on the scientist.","大学はその科学者に名誉学位を与えた。"]],"betray":[["He betrayed his friends by revealing their secret.","彼は友人たちの秘密を明かして彼らを裏切った。"],["His trembling voice betrayed how nervous he really was.","声の震えが、彼が実際どれほど緊張しているかをうっかり表していた。"]],"bewilder":[["The complicated instructions bewildered many first-time users.","複雑な説明に初めての利用者の多くが当惑した。"],["The busy station bewildered the tourists who had just arrived.","混雑した駅は到着したばかりの観光客をまごつかせた。"]],"bias":[["The survey results may reflect a bias in the sample.","調査結果は標本の偏りを反映しているかもしれない。"],["Advertising can bias children against healthy foods.","広告は子どもに健康的な食べ物への偏見を抱かせることがある。"]],"bid":[["The company submitted the lowest bid for the construction work.","その会 ineers studied the blueprint of the building carefully.","技術者たちはその建物の設計図を注意深く調べた。"],["The group drew up a blueprint for the future of the city.","そのグループは市の将来に向けた計画を作成した。"]],"blunt":[["His blunt criticism hurt her feelings more than he intended.","彼の率直な批判は、意図した以上に彼女を傷つけた。"],["A blunt knife is more dangerous than a sharp one.","鈍いナイフは鋭いナイフよりも危険だ。"],["His blunt reply to the question surprised the audience.","質問に対する彼のぶっきらぼうな返事は聴衆を驚かせた。"]],"blur":[["Tears blurred her vision as she read the letter.","手紙を読むうちに、涙で彼女の視界がぼやけた。"],["Social media has blurred the line between public and private life.","ソーシャルメディアは公的生活と私的生活の境界を曖昧にした。"]],"boast":[["He likes to boast about his expensive new car.","彼は高価な新車を自慢するのが好きだ。"],["The town boasts a beautiful beach and a famous castle.","その町は美しい浜辺と有名な城を誇りにしている。"]],"bold":[["The company made a bold decision to enter the Asian market.","その会社はアジア市場に参入するという大胆な決断を下した。"],["Important terms are printed in bold type in this textbook.","この教科書では重要な用語が太字で印刷されている。"]],"bond":[["Shared experiences strengthen the bond between teammates.","共有した経験はチームメイトの絆を強める。"],["Investors bought government bonds as a safe investment.","投資家は安全な投資として政府の債券を購入した。"],["Mothers and babies bond within the first few hours after birth.","母親と赤ちゃんは出産後の数時間のうちに結びつく。"]],"boom":[["The country enjoyed an economic boom in the 1980s.","その国は1980年代に経済の急成長を経験した。"],["The housing boom ended when interest rates suddenly rose.","金利が急に上がると、住宅ブームは終わった。"],["The boom of thunder echoed across the valley.","雷のとどろきが谷間に響き渡った。"]],"boost":[["The new policy is expected to boost the local economy.","新政策は地域経済を押し上げると期待されている。"],["The company announced a boost in production capacity this year.","会社は今年、生産能力の増強を発表した。"],["The victory gave the team a big boost before the finals.","その勝利は決勝戦を前にチームに大きな後押しとなった。"]],"border":[["Thousands of people cross the border every day for work.","毎日何千人もが仕事のために国境を越える。"],["A narrow river forms the border between the two provinces.","狭い川が二つの州の境界をなしている。"]],"bother":[["The noise from the stree  the nation's history.","その地震は国の歴史上最悪の大災害だった。"],["The loss of his job was a calamity for the whole family.","失業は一家全体にとって災難だった。"]],"calculate":[["Scientists calculated the speed of the approaching asteroid.","科学者たちは接近する小惑星の速度を計算した。"],["It is hard to calculate how the policy will affect the economy.","その政策が経済にどう影響するかを予測するのは難しい。"]],"campaign":[["The group launched a campaign to protect local forests.","そのグループは地元の森林を守る運動を始めた。"],["The candidate spent millions of dollars on his election campaign.","その候補者は選挙戦に何百万ドルも費やした。"],["Activists have campaigned for years to ban plastic bags.","活動家たちはビニール袋を禁止するために何年も運動してきた。"]],"candidate":[["Each candidate gave a short speech to the voters.","候補者はそれぞれ有権者に短い演説を行った。"],["Every candidate for the university must take an entrance exam.","その大学の志願者は全員入学試験を受けなければならない。"]],"capability":[["The robot has the capability to learn from its mistakes.","そのロボットは失敗から学ぶ能力を備えている。"],["Engineers tested the engine's capability under extreme heat.","技術者たちは極度の高温下でエンジンの性能を試験した。"]],"capable":[["She is capable of solving problems under great pressure.","彼女は大きなプレッシャーの中でも問題を解決する能力がある。"],["The new engine is capable of running on solar energy.","その新しいエンジンは太陽エネルギーで動かすことができる。"]],"capacity":[["The water tank has a capacity of fifty liters.","その貯水タンクの容量は50リットルだ。"],["Humans have a remarkable capacity for learning languages.","人間には言語を学ぶ驚くべき能力がある。"],["The stadium has a seating capacity of fifty thousand.","そのスタジアムの収容能力は5万席である。"]],"capital":[["Paris is the capital of France and its largest city.","パリはフランスの首都であり、最大の都市でもある。"],["Foreign capital flowed into the country after the reforms.","改革の後、外国資本がその国に流れ込んだ。"],["Please write your name in capital letters on the form.","用紙にお名前を大文字で書いてください。"]],"capture":[["Police captured the escaped prisoner near the border.","警察は国境近くで脱走した囚人を捕らえた。"],["The photograph perfectly captures the mood of the city.","その写真は街の雰囲気を見事にとらえている。"],["The army captured the city after a long siege.","軍は長い包囲の末にその都市を占領した。"]],"career":[["Her career as a diplomat lasted more than thirty years.","外交官としての彼女の経歴は30年以上に及んだ。"],["Many students feel anxious about choosing a career.","多くの学生が職業を選ぶことに不安を感じている。"]],"cargo":[["The ship carried cargo from Asia to ports in Europe.","その船はアジアからヨーロッパの港へ貨物を運んだ。"],["The ship sank, and its entire cargo was lost at sea.","船は沈没し、積荷はすべて海に失われた。"]],"casual":[["The company encourages a casual atmosphere in the office.","その会社は職場に気楽な雰囲気を奨励している。"],["He made a casual remark that upset everyone in the room.","彼の何気ない一言が部屋にいた全員を動揺させた。"],["Casual clothes are allowed at the office on Fridays.","金曜日は職場で普段着が認められている。"]],"casualty":[["Heavy rain caused many casualties in the mountain village.","大雨により山間部の村で多数の死傷者が出た。"],["Small shops were the main casualties of the economic crisis.","小さな店が経済危機の主な被害者だった。"]],"catalyst":[["The chemical reaction needs a catalyst to proceed quickly.","その化学反応が速く進むには触媒が必要だ。"],["The scandal acted as a catalyst for political reform.","そのスキャンダルは政治改革のきっかけとなった。"]],"catastrophe":[["Experts warn that climate change could lead to global catastrophe.","専門家は気候変動が地球規模の大惨事につながりかねないと警告する。"],["The war ended in catastrophe for the whole nation.","戦争はその国全体にとって破局に終わった。"]],"category":[["The book does not fit neatly into any single category.","その本はどの単一の部類にもきれいには収まらない。"],["These problems fall outside the category of ordinary crimes.","これらの問題は通常の犯罪という範疇には収まらない。"]],"cater":[["The hotel caters to guests from many different countries.","そのホテルは様々な国からの宿泊客の要望に応えている。"],["A local company will cater the wedding party for two hundred guests.","地元の会社が200人の招待客に披露宴の料理を提供する。"]],"cattle":[["Raising cattle requires large amounts of water and land.","牛の飼育には大量の水と土地が必要だ。"],["Thousands of cattle were moved to higher ground before the flood.","洪水の前に何千頭もの畜牛が高台に移された。"]],"cause":[["Heavy smoking is a leading cause of lung disease.","ヘビースモーキングは肺疾患の主要な原因である。"],["Careless driving can cause serious accidents.","不注意な運転は重大な事故を引き起こしかねない。"],["He gave his life for the cause of freedom.","彼は自由という大義のために命を捧げた。"]],"caution":[["Drivers should use caution on icy roads in winter.","運転手は冬の凍結した道路では用心すべきだ。"],["The police gave him a caution for speeding.","警察はスピード違反で彼に警告を与えた。"],["The teacher cautioned the students not to touch the chemicals.","先生は生徒たちに薬品に触れないよう注意した。"]],"cautious":[["Doctors are cautious about using the new drug on children.","医師たちはその新薬を子どもに使うことに慎重だ。"],["He is a cautious man who never lends money to strangers.","彼は見知らぬ人には決して金を貸さない用心深い人だ。"]],"ceiling":[["The room had a high ceiling painted with flowers.","その部屋には花が描かれた高い天井があった。"],["The government set a ceiling on the price of rice.","政府は米の価格に上限を設けた。"]],"cell":[["Every living thing is made up of one or more cells.","すべての生き物は一つ以上の細胞からできている。"],["The prisoner spent twenty years alone in a small cell.","その囚人は小さな独房で20年間一人で過ごした。"]],"censor":[["The government censored news about the protests.","政府は抗議運動に関する報道を検閲した。"],["The censor ordered several scenes to be removed from the film.","検閲官はその映画から数場面を削除するよう命じた。"]],"cereal":[["Rice and wheat are the most widely grown cereals in the world.","米と小麦は世界で最も広く栽培されている穀物だ。"],["I usually have a bowl of cereal with milk for breakfast.","私はたいてい朝食にミルクをかけたシリアルを一杯食べる。"]],"ceremony":[["The ancient ceremony is performed every spring at the shrine.","その古代の儀式は毎年春に神社で執り行われる。"],["The graduation ceremony will be held in the school gym.","卒業式は学校の体育館で行われる。"]],"certificate":[["You need a birth certificate to apply for a passport.","パスポートを申請するには出生証明書が必要だ。"],["She received a teaching certificate after completing the course.","彼女は課程を修了して教員免状を取得した。"]],"challenge":[["Aging populations pose a major challenge for many countries.","高齢化する人口は多くの国にとって大きな課題となっている。"],["Students should challenge ideas instead of simply accepting them.","学生は考えをただ受け入れるのでなく、疑ってかかるべきだ。"],["The young boxer challenged the world champion to a match.","その若いボクサーは世界王者に試合を挑んだ。"]],"chaos":[["According to the myth, the universe began as a state of chaos.","神話によれば、宇宙は混沌の状態から始まった。"],["The sudden power failure threw the whole city into chaos.","突然の停電が街全体を大混乱に陥れた。"]],"characteristic":[["Warm 況でもパスワードを教えてはならない。"],["Family circumstances forced her to leave school early.","家庭の事情で彼女は早く学校をやめざるを得なかった。"]],"cite":[["The author cites several studies to support her argument.","著者は自分の主張を裏付けるためにいくつかの研究を引用している。"],["Experts cite poor management as the main cause of the failure.","専門家は失敗の主な原因として不適切な経営を挙げている。"]],"citizen":[["Every citizen has the right to vote at the age of eighteen.","市民は誰でも18歳で投票する権利を持つ。"],["Citizens of that country can travel to Japan without a visa.","その国の国民はビザなしで日本に渡航できる。"]],"citizenship":[["He applied for citizenship after living in Canada for ten years.","彼はカナダに10年住んだ後、市民権を申請した。"],["She holds dual citizenship in Japan and the United States.","彼女は日本とアメリカの二重国籍を持っている。"]],"civil":[["Civil rights movements have changed laws in many countries.","公民権運動は多くの国で法律を変えてきた。"],["Even in anger, he remained civil to everyone.","怒っていても、彼は誰に対しても礼儀正しかった。"],["The airport is used for both military and civil flights.","その空港は軍用と民間の両方の飛行に使われている。"]],"claim":[["He claims that he never saw the document before the meeting.","彼は会議の前にその書類を見たことはないと主張している。"],["She made a claim for compensation after the accident.","彼女は事故の後、補償を要求した。"],["The claim that the earth is flat has no scientific basis.","地球が平らだという主張には科学的根拠がない。"]],"clarify":[["The government must clarify its position on the new tax.","政府は新税に関する立場を明確にしなければならない。"],["Could you clarify what you mean by that statement?","その発言の意味をはっきりさせていただけますか。"]],"clash":[["Protesters clashed with the police outside the parliament.","デモ隊は議会の外で警察と衝突した。"],["There is a clash of values between the older and younger generations.","年上の世代と若い世代の間には価値観の対立がある。"],["A violent clash broke out between rival fans after the game.","試合後、敵対するファン同士の激しい衝突が起きた。"]],"classify":[["Biologists classify living things into groups by shared features.","生物学者は生物を共通の特徴でグループに分類する。"],["The agency classifies hotels according to their quality and service.","その機関はホテルを質とサービスに応じて格付けする。"]],"clause":[["The contract contains a clause that limits the company's liability.","その契約書には会社の責 た。"],["The government cannot coerce citizens into joining the program.","政府は市民にそのプログラムへの参加を強制することはできない。"]],"cohesion":[["Shared goals help to create social cohesion within a community.","共通の目標は地域社会に社会的結束を生む助けとなる。"],["The cohesion of water molecules produces surface tension.","水分子の凝集が表面張力を生み出す。"]],"coincide":[["The festival coincides with the harvest season.","その祭りは収穫期と時期が重なる。"],["Her opinion does not always coincide with mine.","彼女の意見は必ずしも私の意見と一致するわけではない。"]],"collapse":[["The bridge collapsed under the weight of the trucks.","その橋はトラックの重みで崩落した。"],["The collapse of the company shocked its thousands of employees.","その会社の崩壊は何千人もの従業員に衝撃を与えた。"]],"collective":[["The collective wisdom of a group is often better than individual judgment.","集団の知恵は、しばしば個人の判断より優れている。"],["Solving climate change requires collective action by all nations.","気候変動の解決にはすべての国による共同行動が必要だ。"]],"colloquial":[["The novel is written in colloquial language that feels natural.","その小説は自然に感じられる口語体で書かれている。"],["Colloquial expressions are often not found in formal writing.","日常会話の表現は、しばしば正式な文章には見られない。"]],"colony":[["The island was once a colony of a European empire.","その島はかつてヨーロッパの帝国の植民地だった。"],["A colony of ants can contain millions of individuals.","アリの集団は数百万もの個体を含むことがある。"]],"colossal":[["Archaeologists found a colossal statue buried in the desert.","考古学者たちは砂漠に埋もれた巨大な像を発見した。"],["The company suffered colossal losses during the financial crisis.","その会社は金融危機の間に莫大な損失を被った。"]],"combat":[["Many soldiers returning from combat suffer from stress.","戦闘から戻った多くの兵士がストレスに苦しんでいる。"],["New measures were introduced to combat online fraud.","オンライン詐欺と闘うために新たな対策が導入された。"],["Better lighting was installed to combat crime in the area.","地域の犯罪を防止するために、より明るい照明が設置された。"]],"combine":[["Scientists combined two metals to create a stronger material.","科学者たちは二つの金属を結合させて、より強い素材を作った。"],["The artist combines photography with traditional painting techniques.","その芸術家は写真と伝統的な絵画技法を組み合わせている。"]],"comfort":[["Passengers value comfort more than speed on long trips.","乗客は長旅ではスピードより快適さを重視する。"],["Her kind words gave great comfort to the grieving family.","彼女の優しい言葉は悲しむ家族に大きな慰めを与えた。"],["She tried to comfort the crying child with a soft song.","彼女はやさしい歌で泣いている子どもを慰めようとした。"]],"command":[["The general commanded his troops to retreat.","将軍は部隊に撤退するよう命令した。"],["She has an excellent command of three foreign languages.","彼女は3つの外国語を見事に使いこなす。"],["The captain took command of the ship during the storm.","船長は嵐の間、船の指揮を執った。"]],"commemorate":[["The nation commemorates its independence with a parade every year.","その国は毎年パレードで独立を記念する。"],["The monument commemorates those who died in the war.","その記念碑は戦争で亡くなった人々を追悼している。"]],"commence":[["The ceremony will commence at ten o'clock sharp.","式典は10時ちょうどに始まる。"],["The company will commence production of the new model next month.","その会社は来月、新型モデルの生産を開始する。"]],"commend":[["The mayor commended the volunteers for their tireless efforts.","市長はボランティアの尽力を称賛した。"],["I can commend this restaurant to anyone who loves seafood.","海鮮好きの人なら誰にでも、このレストランを推薦できる。"]],"comment":[["Please leave your comments on the survey form.","アンケート用紙にご意見をお書きください。"],["The professor's comment on the novel appeared in a magazine.","その小説に対する教授の論評が雑誌に載った。"],["The minister declined to comment on the rumor.","大臣はその噂についてのコメントを控えた。"]],"commentary":[["The radio commentary explained each move of the chess match.","ラジオの解説はチェスの対局の一手一手を説明した。"],["The newspaper published a sharp commentary on the new law.","新聞はその新法に関する鋭い論評を掲載した。"]],"commerce":[["Online commerce has grown rapidly over the past decade.","オンライン商取引は過去10年で急速に成長した。"],["The treaty was designed to promote commerce between the two nations.","その条約は二国間の通商を促進するために作られた。"]],"commercial":[["The film was a commercial success, earning millions worldwide.","その映画は商業的に成功し、世界中で数百万ドルを稼いだ。"],["The museum is a nonprofit and does not engage in commercial activities.","その博物館は非営利で、営利的な活動は行っていない。"],["A thirty-second commercial during the final costs millions of dollars.","決勝戦中の30秒の広告放送には何百万ドルもかかる。"]],"commission":[["A special commission was set up to investigate the accident.","事故を調査するために特別委員会が設置された。"],["The agent receives a commission of five percent on every sale.","代理人は販売ごとに5パーセントの手数料を受け取る。"],["The city commissioned a famous sculptor to create a statue.","市は有名な彫刻家に像の制作を委託した。"]],"commit":[["He committed a serious crime and was sent to prison.","彼は重大な罪を犯して刑務所に送られた。"],["The two countries committed themselves to reducing emissions.","両国は排出量の削減に取り組むと約束した。"],["The king committed the government of the country to his trusted minister.","王は国の統治を信頼する大臣に委ねた。"]],"commitment":[["He made a commitment to visit his grandmother every week.","彼は毎週祖母を訪ねるという約束をした。"],["Success requires a strong commitment to long-term goals.","成功には長期的な目標への強い献身が必要だ。"],["Having children is a big commitment that changes your whole life.","子どもを持つことは人生全体を変える大きな責任だ。"]],"commodity":[["Oil is one of the most important commodities in the world.","石油は世界で最も重要な商品の一つだ。"],["Rice and tea are the main commodities of the region.","米と茶がその地域の主な産物だ。"]],"commonplace":[["Smartphones have become commonplace even in remote villages.","スマートフォンは辺境の村でさえありふれたものとなった。"],["His commonplace remarks failed to interest the audience.","彼の平凡な発言は聴衆の関心を引かなかった。"]],"communal":[["The residents share a communal garden behind the building.","住民たちは建物の裏にある共同の庭を共有している。"],["Students use communal facilities such as the kitchen and laundry room.","学生たちは台所や洗濯室などの共有の設備を使う。"]],"communicate":[["Pilots communicate weather information to the control tower.","操縦士は気象情報を管制塔に伝達する。"],["Dolphins communicate with each other using a variety of sounds.","イルカはさまざまな音を使って互いに意思を伝え合う。"]],"community":[["Local volunteers play an important role in the community.","地元のボランティアは地域社会で重要な役割を果たしている。"],["Monks live together as a religious community in the mountains.","修道士たちは山中で宗教的な共同体として共に暮らしている。"]],"commute":[["Many people commute to the city center by train.","多くの人が電車で都心へ通勤している。"],["My daily commute takes more than an hour each way.","私の毎日の通勤は片道1時間以上かかる。"]],"compact":[["This compact camera ion among companies often leads to lower prices.","企業間の競争はしばしば価格の低下につながる。"],["She won first place in the swimming competition.","彼女は水泳の試合で優勝した。"]],"competitive":[["The company offers competitive salaries to attract talented workers.","その会社は優秀な人材を引きつけるため、競争力のある給与を提示している。"],["The job market for graduates is extremely competitive.","卒業生の就職市場は非常に競争が激しい。"]],"compile":[["The editor compiled the essays into a single volume.","編集者はそれらの随筆を一冊の本に編集した。"],["Researchers compiled data from over one hundred hospitals.","研究者たちは100以上の病院からデータを収集した。"]],"complacent":[["We must not become complacent after a single victory.","一度の勝利で自己満足してはならない。"],["The complacent leaders ignored the warning signs of decline.","現状に甘んじた指導者たちは衰退の兆候を無視した。"]],"complain":[["Residents complained about the noise from the construction site.","住民たちは工事現場の騒音について不平を言った。"],["She complained of a headache and went home early.","彼女は頭痛を訴えて早く帰宅した。"]],"complement":[["Good teaching complements what students learn from books.","優れた指導は生徒が本から学ぶことを補う。"],["Her cautious nature is a useful complement to his bold ideas.","彼女の慎重な性格は、彼の大胆な考えを補完するものとして役立つ。"]],"complex":[["The causes of the war are far more complex than they seem.","その戦争の原因は見かけよりはるかに複雑だ。"],["A huge sports complex was built near the station.","駅の近くに巨大なスポーツ複合施設が建設された。"],["Many teenagers develop a complex about their appearance.","多くの十代の若者が外見についてコンプレックスを抱く。"]],"compliance":[["Companies must ensure compliance with environmental regulations.","企業は環境規制の順守を確実にしなければならない。"],["Compliance with the teacher's instructions is expected of all students.","教師の指示に従うことは全生徒に求められている。"]],"complicate":[["Her sudden resignation complicated the situation even further.","彼女の突然の辞職は状況をさらに複雑にした。"],["Infection can complicate the recovery from a simple operation.","感染症は簡単な手術からの回復を悪化させることがある。"]],"complicated":[["The rules of the game are too complicated for beginners.","そのゲームの規則は初心者には複雑すぎる。"],["The two families have a complicated history of land disputes.","両家には土地をめぐる込み入った歴史がある。"]],"compliment":[["The st experts concur with the committee's findings.","ほとんどの専門家は委員会の調査結果に同意している。"],["Heavy rain and a high tide concurred to flood the town.","大雨と満潮が同時に起こり、町は水に浸かった。"]],"condemn":[["World leaders condemned the attack in the strongest terms.","世界の指導者たちはその攻撃を最も強い言葉で非難した。"],["The court condemned the killer to life in prison.","裁判所は殺人犯に有罪判決を下し、終身刑を言い渡した。"]],"condition":[["The patient is in stable condition after the operation.","患者は手術後、安定した状態にある。"],["You may borrow the car on one condition: drive carefully.","一つ条件付きでその車を貸してもよい。慎重に運転することだ。"]],"conduct":[["Scientists conducted an experiment to test the new theory.","科学者たちは新しい理論を検証するため実験を行った。"],["The teacher praised the students for their good conduct on the trip.","先生は旅行中の生徒たちの立派な行いを称賛した。"]],"confer":[["The university conferred an honorary degree on the author.","大学はその作家に名誉学位を授与した。"],["The two leaders conferred privately before the press conference.","二人の指導者は記者会見の前に内密に協議した。"]],"confess":[["The suspect finally confessed to the crime after hours of questioning.","容疑者は何時間もの尋問の末、ついに犯行を自白した。"],["I must confess that I have never read the book.","正直に言って、私はその本を読んだことがないと認めざるを得ない。"]],"confidence":[["She spoke with confidence in front of the large audience.","彼女は大勢の聴衆の前で自信をもって話した。"],["The public has lost confidence in the government's economic policy.","国民は政府の経済政策への信頼を失った。"]],"confine":[["Please confine your answer to a hundred words or less.","答えは100語以内にとどめてください。"],["The prisoners were confined to their cells for twenty-three hours a day.","囚人たちは一日23時間、独房に閉じ込められた。"]],"confirm":[["Please confirm your reservation by phone at least a day before.","少なくとも前日までに電話で予約を確認してください。"],["New evidence confirmed the scientist's theory.","新たな証拠がその科学者の理論を裏付けた。"]],"conflict":[["The conflict between the two nations lasted for decades.","その二国間の対立は数十年続いた。"],["His account of the event conflicts with the police report.","彼の事件についての説明は警察の報告書と矛盾する。"]],"confound":[["The unexpected results confounded even the most experienced researchers.","予想外の結果は最も経験豊富な研究者さえ当惑させ y athletes represented the country.","50人の選手からなる派遣団がその国を代表した。"]],"contract":[["The company signed a three-year contract with the supplier.","その会社は供給業者と三年契約を結んだ。"],["Muscles contract when they receive a signal from the brain.","筋肉は脳から信号を受けると収縮する。"]],"contradict":[["The witness's testimony contradicts the evidence.","証人の証言は証拠と矛盾している。"],["She dared to contradict her boss in front of everyone.","彼女は皆の前で敢えて上司に反論した。"]],"contradiction":[["There is a clear contradiction between what he says and what he does.","彼の言うことと行うことの間には明らかな矛盾がある。"],["He spoke so confidently that no one offered a contradiction.","彼は自信たっぷりに話したので、誰も反論を出さなかった。"]],"contrary":[["The two sides hold contrary views on the issue.","両者はその問題について反対の見解を持っている。"],["I am not angry; on the contrary, I am delighted.","私は怒っていない。それどころか喜んでいる。"]],"contrast":[["There is a striking contrast between the rich and the poor.","富裕層と貧困層の間には著しい対照がある。"],["The author contrasts life in the city with life in the country.","著者は都会の暮らしと田舎の暮らしを対比している。"]],"contravene":[["The new regulation contravenes international agreements on human rights.","その新規制は人権に関する国際協定に違反している。"],["Such behavior contravenes the principles on which the school was founded.","そのような行動は学校創立の原則と矛盾する。"]],"contribute":[["Exercise contributes to both physical and mental health.","運動は身体と精神の両方の健康に寄与する。"],["Air pollution contributes to the rise in asthma.","大気汚染は喘息の増加の一因となっている。"],["Wealthy citizens contributed large sums to build the new hospital.","裕福な市民たちは新しい病院を建てるために多額の金を寄付した。"]],"contrive":[["She contrived a clever way to solve the problem with few resources.","彼女は乏しい資源で問題を解決する巧みな方法を考え出した。"],["Somehow he contrived to arrive on time despite the storm.","嵐にもかかわらず、彼はどうにか時間通りに到着した。"]],"convene":[["The committee will convene next week to discuss the budget.","委員会は予算を議論するために来週招集される。"],["The members of the board convene once a month.","理事会のメンバーは月に一度集まる。"]],"convenient":[["The new station is convenient for people who commute to Tokyo.","その新駅は東京へ通勤する人々にとって便利だ。"],["Please let me know ments.","多くの客は信用貸しで家具を購入し、毎月分割で支払う。"],["Students need 124 credits to graduate from this university.","この大学を卒業するには124単位が必要だ。"]],"creed":[["The school welcomes students of every race, creed, and nationality.","その学校はあらゆる人種、信条、国籍の学生を歓迎する。"],["Each religion has its own creed and its own rituals.","どの宗教にも独自の教義と儀式がある。"]],"cripple":[["A long strike crippled the nation's transportation system.","長期のストライキは国の交通網に大打撃を与えた。"],["A car accident crippled him for life and forced him to use a wheelchair.","交通事故で彼は一生身体が不自由になり、車いすを使わざるを得なくなった。"]],"crisis":[["The country faced a serious economic crisis in the 1990s.","その国は1990年代に深刻な経済危機に直面した。"],["The talks reached a crisis when both sides refused to compromise.","双方が妥協を拒んだため、交渉は重大局面を迎えた。"]],"critical":[["It is important to be critical of what you read online.","オンラインで読むものに批判的であることは重要だ。"],["Early detection is critical to the successful treatment of cancer.","がんの治療を成功させるには早期発見が決定的に重要だ。"]],"criticize":[["The press criticized the government for its slow response.","報道機関は政府の対応の遅さを批判した。"],["Several newspapers criticized the new film in long reviews.","複数の新聞が長い評論でその新作映画を批評した。"]],"crop":[["Heavy rain destroyed most of the crops in the region.","大雨でその地域の作物の大半がだめになった。"],["This year's rice crop was the largest in a decade.","今年の米の収穫高は10年で最大だった。"]],"crude":[["The scientists used crude tools, but their results were accurate.","科学者たちは粗末な道具を使ったが、結果は正確だった。"],["Crude oil must be refined before it can be used as fuel.","未加工の原油は、燃料として使えるようになる前に精製しなければならない。"]],"crumble":[["The old stone walls slowly crumbled over hundreds of years.","古い石壁は何百年もかけてゆっくり崩れていった。"],["The empire began to crumble after years of war and debt.","戦争と負債の年月を経て、その帝国は崩壊し始めた。"]],"cull":[["The report culled data from dozens of studies on child development.","その報告書は子どもの発達に関する数十の研究からデータを選び出した。"],["Officials culled thousands of deer to protect the forest.","当局は森を守るために数千頭のシカを間引いた。"]],"culprit":[["Investigators are still trying to identify the real culprit.","捜査官たちはまだ本当の犯人を特定しようとしている。"],["Stress
