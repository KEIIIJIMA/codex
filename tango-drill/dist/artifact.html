ntangible, so they can be neither touched nor measured.","愛や信頼は触れることのできないものであり、測ることもできない。"],["Cultural heritage includes intangible traditions such as music and festivals.","文化遺産には音楽や祭りなどの無形の伝統が含まれる。"]],"integrity":[["He is a politician of great integrity.","彼は非常に誠実な政治家だ。"],["Engineers tested the structural integrity of the bridge.","技術者たちはその橋の構造上の完全性を調べた。"]],"intellectual":[["Reading widely develops both intellectual and emotional abilities.","幅広い読書は知的能力と感情面の能力の両方を育てる。"],["Many intellectuals criticized the government's decision to limit free speech.","多くの知識人が、言論の自由を制限する政府の決定を批判した。"]],"intend":[["I never intended to hurt your feelings.","あなたの気持ちを傷つけるつもりは全くなかった。"],["The law was intended to protect workers from unfair dismissal.","その法律は労働者を不当な解雇から守ることを意図していた。"]],"intense":[["Athletes must cope with intense pressure during competitions.","運動選手は試合中の激しい重圧に対処しなければならない。"],["The intense heat of the desert makes travel dangerous at noon.","砂漠の強烈な暑さのせいで、正午の移動は危険だ。"]],"intention":[["I did not understand the intention behind his strange question.","私は彼の奇妙な質問の背後にある意図が理解できなかった。"],["She has a firm intention to become a doctor and help others.","彼女は医者になって人を助けるという固い意志を持っている。"]],"interact":[["Children learn social skills by interacting with their peers.","子どもは同年代の仲間と交流することで社会性を学ぶ。"],["Some medicines interact with each other and cause harmful effects.","薬の中には、相互に作用して有害な影響を及ぼすものがある。"]],"interfere":[["Parents should not interfere in their children's every decision.","親は子どものあらゆる決定に干渉すべきではない。"],["Noise from the street interfered with my ability to concentrate.","通りの騒音が私の集中を妨げた。"]],"interim":[["An interim government was set up until elections could be held.","選挙が実施できるまで暫定政府が設置された。"],["In the interim between the two meetings, he answered his emails.","二つの会議の合間に、彼はメールに返信した。"]],"interpret":[["Different people may interpret the same poem in different ways.","同じ詩でも人によって解釈は異なりうる。"],["She interpreted the speech for the foreign guests at the conference.","彼女は会議で外国人客のために演説を通訳した。"]],"interval":[["Buses run at ten-minute intervals during the rush hour.","ラッシュ時にはバスは10分間隔で運行している。"],["There will be a short interval between the first and second acts.","第一幕と第二幕の合間に短い休憩がある。"]],"intervene":[["The government intervened to prevent the bank from collapsing.","政府はその銀行の破綻を防ぐために介入した。"],["Several events intervened between the two elections.","二つの選挙の間に、いくつかの出来事が起こった。"]],"intimate":[["They developed an intimate friendship over many years.","彼らは長年かけて親密な友情を育んだ。"],["She has an intimate knowledge of the history of the region.","彼女はその地域の歴史について詳しい知識を持っている。"]],"intimidate":[["The gang tried to intimidate witnesses into staying silent.","そのギャングは目撃者を脅して黙らせようとした。"],["His tall figure and loud voice tended to intimidate the younger staff.","彼の長身と大きな声は、若手の職員を威圧しがちだった。"]],"intransigent":[["The union took an intransigent position and rejected every compromise.","組合は非妥協的な立場をとり、あらゆる妥協案を退けた。"],["The old farmer was intransigent and refused to sell his land.","その老農夫は頑固で、土地を売ることを拒んだ。"]],"intrude":[["A stranger intruded into the garden and frightened the children.","見知らぬ男が庭に侵入して、子どもたちを怖がらせた。"],["I'm sorry to intrude, but may I ask a quick question?","お邪魔をして申し訳ありませんが、ちょっと質問してもよろしいですか。"]],"inundate":[["The company was inundated with complaints after the announcement.","発表の後、その会社には苦情が殺到した。"],["Heavy rain inundated the valley and destroyed many farms.","大雨が谷を水浸しにし、多くの農場を壊滅させた。"]],"invade":[["Foreign species can invade an ecosystem and destroy native plants.","外来種は生態系に侵入し在来の植物を破壊することがある。"],["Hidden cameras invade people's privacy and should be banned.","隠しカメラは人々のプライバシーを侵害するため、禁止されるべきだ。"]],"invest":[["Many companies invest heavily in research and development.","多くの企業が研究開発に多額の投資をしている。"],["She invested years of effort in learning to play the piano.","彼女はピアノを習うことに何年もの努力をつぎ込んだ。"]],"inveterate":[["The inveterate prejudice against the minority is hard to remove.","その少数派に対する根深い偏見は、取り除くのが難しい。"],["He is an inveterate liar who rarely tells the truth.","彼は常習的なうそつきで、めったに本当のことを言わない。"]],"invoke":[["The government invoked national security to justify the new law.","政府は新しい法を正当化するために国家安全保障を持ち出した。"],["Protesters invoked the right to free speech in defense of their march.","抗議者たちは行進を擁護するために、言論の自由の権利に訴えた。"],["The old photograph invoked memories of his childhood home.","その古い写真は、彼の子ども時代の家の記憶を呼び起こした。"]],"involve":[["Any surgery involves some risk, so doctors explain it carefully.","どんな手術にもある程度の危険が伴うので、医師は慎重に説明する。"],["Don't involve me in your quarrel with your brother.","兄とのけんかに私を巻き込まないでくれ。"]],"irony":[["It is a great irony that the cure caused new problems.","その治療法が新たな問題を引き起こしたのは大きな皮肉だ。"],["The author uses irony to criticize society without saying so directly.","著者は反語を用いて、直接言わずに社会を批判している。"]],"irrational":[["Fear of flying is often irrational, since flying is very safe.","飛行機は非常に安全なので、飛行機への恐怖はしばしば不合理だ。"],["People in a panic often behave in an irrational way.","パニック状態の人々は、しばしば理性のない行動をとる。"]],"irrevocable":[["Once signed, the contract becomes irrevocable.","署名されたら、その契約は取り消せなくなる。"],["Leaving school was an irrevocable choice that shaped his whole life.","退学は彼の人生全体を形作った、変えられない選択だった。"]],"irritate":[["Loud noise from the construction site irritated the neighbors.","工事現場の大きな騒音は近所の人々をいらだたせた。"],["Strong soap can irritate the skin of young children.","強い石鹸は幼い子どもの肌を刺激することがある。"]],"isolate":[["The new sanctions threaten to isolate the country from the world economy.","新たな制裁は、その国を世界経済から孤立させる恐れがある。"],["Patients with the virus were isolated from other people.","そのウイルスの患者は他の人から隔離された。"]],"issue":[["Climate change is one of the most pressing issues today.","気候変動は今日最も差し迫った問題の一つだ。"],["The issue of new coins was announced by the central bank.","新硬貨の発行が中央銀行によって発表された。"],["The embassy issues visas to foreign students within two weeks.","大使館は2週間以内に外国人留学生にビザを発行する。"]],"itinerary":[["Our itinerary includes visits to several historic sites.","私たちの旅程には、いくつかの史跡の訪問が含まれている。"],["She drew up an itinerary for the summer trip with her friends.","彼女は友人との夏の旅行の旅行計画を立てた。"]],"jaundiced":[["Years of failure gave him a jaundiced view of politics.","長年の失敗が彼に政治への冷めた偏見を与えた。"],["He cast a jaundiced eye on his friend's sudden success.","彼は友人の突然の成功をひがんだ目で見た。"]],"jealous":[["She became jealous when her friend received more attention.","友人がより多くの注目を集めると、彼女は嫉妬した。"],["Some colleagues were jealous of her quick promotion.","一部の同僚たちは彼女の早い昇進をねたんでいた。"]],"jocular":[["The teacher's jocular remarks eased the tension in the classroom.","その先生のおどけた発言が教室の緊張を和らげた。"],["My uncle is a jocular man who loves to tell funny stories.","私のおじは冗談好きな人で、おもしろい話をするのが大好きだ。"]],"journalism":[["Good journalism requires checking facts before publishing a story.","優れた報道には、記事を出す前に事実を確認することが求められる。"],["She studied journalism at university and became a newspaper reporter.","彼女は大学でジャーナリズムを学び、新聞記者になった。"]],"judge":[["We should not judge people by their appearance alone.","人を外見だけで判断すべきではない。"],["The judge sentenced the man to five years in prison.","裁判官はその男に懲役5年を言い渡した。"]],"judicious":[["A judicious use of resources will benefit future generations.","資源の賢明な利用は将来の世代のためになる。"],["A judicious leader listens to all sides before deciding.","思慮分別のある指導者は、決定する前にあらゆる側の意見を聞く。"]],"juncture":[["At this critical juncture, we must make a firm decision.","この重大な局面で、私たちは断固たる決断を下さなければならない。"],["The two rivers meet at a juncture just north of the town.","二つの川は町のすぐ北の接合点で合流する。"]],"junior":[["She is three years junior to her husband.","彼女は夫より3歳年下だ。"],["Junior officers must obey the orders of their superiors.","下級の将校は上官の命令に従わなければならない。"],["She was a junior at my high school, so I often helped her.","彼女は私の高校の後輩だったので、私はよく彼女を助けた。"]],"jurisdiction":[["The state has no jurisdiction over crimes committed in other countries.","国は他国で行われた犯罪に対する司法権を持たない。"],["The case falls outside the jurisdiction of this court.","その事件はこの裁判所の管轄外だ。"]],"justice":[["The court's duty is to ensure that justice is done.","裁判所の務めは正義が果たされるようにすることだ。"],["The system treats all citizens with justice, regardless of wealth.","その制度は、富に関係なくすべての市民を公正に扱う。"],["Many people believe the criminal justice system needs reform.","多くの人が、刑事司法制度は改革が必要だと考えている。"]],"justification":[["The politician's justification of the war persuaded few voters.","その政治家による戦争の正当化は、ほとんどの有権者を納得させなかった。"],["There is no justification for such cruel treatment.","そのような残酷な扱いには何の正当な理由もない。"]],"juxtapose":[["The artist juxtaposes photographs of different cities in a single frame.","その芸術家は、異なる都市の写真を一つの額に並置している。"],["The exhibition juxtaposes ancient art with modern designs.","その展覧会は古代美術と現代デザインを並べて対比させている。"]],"keen":[["He is a keen supporter of the local football team.","彼は地元のサッカーチームの熱心なファンだ。"],["Dogs have a keen sense of smell compared with humans.","犬は人間に比べて鋭い嗅覚を持っている。"]],"kinship":[["In many societies, kinship determines who may marry whom.","多くの社会では、親族関係によって誰が誰と結婚できるかが決まる。"],["Many people feel a deep kinship with others who share their culture.","多くの人は同じ文化を持つ人々に強い親近感を覚える。"]],"labor":[["Manual labor in hot weather can be dangerous to your health.","暑い中での肉体労働は健康に危険を及ぼすことがある。"],["The factory has trouble finding skilled labor in rural areas.","その工場は農村部で熟練した労働者を見つけるのに苦労している。"]],"lack":[["Lack of sleep can seriously affect your ability to concentrate.","睡眠不足は集中力に深刻な影響を与えうる。"],["Many young drivers lack the experience to handle bad weather.","多くの若いドライバーは、悪天候に対処する経験を欠いている。"]],"laconic":[["The laconic old farmer answered every question in just a few words.","言葉数の少ない老農夫は、どんな質問にもほんの数語で答えた。"],["His laconic reply, just one word, ended the discussion.","一言だけの彼の簡潔な返事で議論は終わった。"]],"lament":[["Many older people lament the loss of traditional values.","多くの高齢者が伝統的価値観の喪失を嘆いている。"],["A cry of lament rose from the crowd when the news arrived.","知らせが届くと、群衆から嘆きの声が上がった。"]],"landmark":[["The ruling was a landmark in the history of civil rights.","その判決は公民権の歴史における画期的な出来事だった。"],["The tall clock tower is a useful landmark for travelers.","その高い時計塔は旅行者にとって便利な目印だ。"],["Kyoto has many historic landmarks that attract tourists.","京都には観光客を引きつける歴史的な名所が数多くある。"]],"landscape":[["From the top of the hill, we enjoyed a beautiful landscape.","丘の上から、私たちは美しい景色を楽しんだ。"],["The rural landscape has changed dramatically over the past fifty years.","田園の風景はこの50年で劇的に変化した。"]],"languid":[["With a languid yawn, he stretched himself out on the sofa.","だるそうなあくびをして、彼はソファの上で体を伸ばした。"],["The languid economy showed no sign of recovery.","活気のない経済は、回復の兆しを見せなかった。"]],"lassitude":[["A strange lassitude overcame her after the long illness.","長い闘病の後、奇妙な倦怠感が彼女を襲った。"],["Hot weather often brings a feeling of lassitude to the whole body.","暑い気候はしばしば全身にけだるさをもたらす。"]],"latent":[["Latent talent often emerges when people face new challenges.","潜在的な才能は、人が新たな課題に直面したときにしばしば現れる。"],["The virus can remain latent in the body for many years.","そのウイルスは何年も体内に潜伏したままでいることがある。"]],"latter":[["Of the two options, I prefer the latter.","二つの選択肢のうち、私は後者の方が好きだ。"],["The latter half of the film was much more exciting than the first.","その映画の後半は前半よりずっとおもしろかった。"]],"launch":[["The government launched a campaign to encourage healthy eating.","政府は健康的な食事を奨励するキャンペーンを始めた。"],["The company plans to launch a new product next spring.","その会社は来春に新製品を発売する予定だ。"],["Scientists plan to launch a new satellite next year.","科学者たちは来年、新しい人工衛星を打ち上げる計画だ。"]],"lavish":[["The wealthy couple held a lavish wedding in Paris.","その裕福な夫婦はパリで豪華な結婚式を挙げた。"],["The audience gave the singer lavish praise after the concert.","コンサートの後、聴衆は歌手に惜しみない称賛を送った。"],["Grandparents often lavish gifts on their grandchildren.","祖父母はよく孫に贈り物を惜しみなく与える。"]],"lax":[["The school has lax rules about wearing uniforms.","その学校は制服の着用についての規則がゆるい。"],["His lax attitude toward deadlines annoyed his coworkers.","締め切りに対する彼のいい加減な態度は同僚をいらだたせた。"]],"layer":[["The ozone layer protects us from harmful ultraviolet rays.","オゾン層は有害な紫外線から私たちを守っている。"],["Put on several layers of clothing to keep warm in winter.","冬に暖かく過ごすため、服を何枚も重ね着しなさい。"]],"lease":[["The lease ends in March, so we must find a new office.","賃貸借契約が3月末で切れるので、新しい事務所を探さなければならない。"],["The restaurant leases its building from a local company.","そのレストランは地元の会社から建物を賃借している。"]],"lecture":[["The professor gave a lecture on the history of democracy.","教授は民主主義の歴史について講義を行った。"],["My father gave me a long lecture about being late.","父は遅刻について私に長い説教をした。"],["She lectures on modern literature at a national university.","彼女は国立大学で現代文学を講義している。"]],"legacy":[["The war left a legacy of bitterness between the two nations.","その戦争は両国の間に憎しみという負の遺産を残した。"],["The company's legacy of quality still guides its work today.","その会社に受け継がれた品質へのこだわりは、今日もその仕事の指針となっている。"]],"legal":[["Parents have a legal duty to send their children to school.","親には子どもを学校に通わせる法律上の義務がある。"],["Gambling is not legal in many countries.","多くの国ではギャンブルは合法ではない。"]],"lengthy":[["I was bored by his lengthy speech full of unnecessary details.","私は不要な細部だらけの彼の長ったらしい演説に退屈した。"],["The committee held a lengthy discussion before reaching a decision.","委員会は決定に至る前に長時間の議論を行った。"]],"lenient":[["The judge was lenient with first-time offenders.","その裁判官は初犯者に寛大だった。"],["Critics said the punishment was too lenient for such a crime.","批評家たちは、そのような罪に対して処罰が甘すぎると述べた。"]],"lessen":[["New roads were built to lessen traffic in the city center.","市の中心部の交通量を減らすために新しい道路が造られた。"],["The pain gradually lessened after he took the medicine.","薬を飲んだ後、痛みは次第に減った。"]],"lethargy":[["A long winter often brings lethargy and low spirits.","長い冬はしばしば無気力と落ち込みをもたらす。"],["A feeling of lethargy came over him after the heavy meal.","たっぷり食事をした後、彼はけだるさに襲われた。"]],"liable":[["The company is liable for any damage caused by its products.","その会社は自社製品が引き起こす損害に責任を負う。"],["Old bridges are liable to collapse during strong earthquakes.","古い橋は強い地震のときに崩れがちだ。"]],"liaison":[["Close liaison between the two agencies prevented any confusion.","二つの機関の緊密な連絡が混乱を防いだ。"],["The hospital works in liaison with local schools on health education.","その病院は地元の学校と連携して健康教育に取り組んでいる。"],["A liaison from the city office visited the school every week.","市役所の連絡係が毎週その学校を訪れた。"]],"liberal":[["The liberal party supports free trade and individual rights.","自由主義の政党は自由貿易と個人の権利を支持している。"],["My grandfather was a liberal man who forgave our mistakes easily.","祖父は寛大な人で、私たちの失敗をすぐに許してくれた。"],["Liberal education aims to broaden students' knowledge rather than train them for jobs.","一般教養の教育は、職業訓練ではなく生徒の知識を広げることを目指している。"]],"lifespan":[["Medical advances have greatly extended the average human lifespan.","医学の進歩は人間の平均寿命を大きく延ばした。"],["The lifespan of most small companies is shorter than ten years.","ほとんどの小企業の存続期間は10年に満たない。"]],"likelihood":[["There is a strong likelihood that prices will rise next year.","来年物価が上がる可能性が高い。"],["Given the poor sales, the likelihood of recovery this year is slim.","売り上げが悪いため、今年中に回復する見込みは薄い。"]],"likely":[["It is likely to rain this afternoon, so take an umbrella.","午後は雨が降りそうなので、傘を持っていきなさい。"],["He will most likely arrive late because of the train delay.","電車の遅れのせいで、彼はおそらく遅れて到着するだろう。"]],"limitation":[["The law places strict limitations on the use of private data.","その法律は個人データの使用に厳しい制限を課している。"],["Every scientific method has its own limitations.","どの科学的手法にもそれぞれ限界がある。"]],"linger":[["A cough can linger for weeks after a bad cold.","ひどい風邪の後、せきは何週間も長引くことがある。"],["Don't linger over breakfast, or you'll miss the bus.","朝食でぐずぐずしていると、バスに乗り遅れるよ。"],["Some students lingered in the classroom after the bell rang.","チャイムが鳴った後も、教室に居残る生徒たちがいた。"]],"linguistic":[["Children show remarkable linguistic ability in their early years.","子どもは幼い時期に驚くべき言語の能力を示す。"],["She published a linguistic study of dialects in northern Japan.","彼女は北日本の方言についての言語学の研究を発表した。"]],"link":[["Scientists have found a link between diet and mental health.","科学者たちは食事と心の健康の間の関連を発見した。"],["Pen pals build a link between people in different countries.","ペンフレンドは異なる国の人々の間につながりを築く。"],["The new bridge will link the island to the mainland.","新しい橋は島を本土に結びつけることになる。"]],"literally":[["Don't take his words literally; he was only joking.","彼の言葉を文字通りに受け取るな。冗談を言っただけだ。"],["I was literally shaking with fear when the plane began to drop.","飛行機が降下し始めたとき、私は本当に恐怖で震えていた。"]],"literate":[["Most adults in developed countries are literate.","先進国のほとんどの大人は読み書きができる。"],["He is a literate man who can discuss history, art, and music.","彼は歴史や芸術や音楽を語れる教養のある人だ。"]],"lobby":[["The farming lobby has strong influence on trade policy.","農業の圧力団体は貿易政策に強い影響力を持っている。"],["Please wait for me in the hotel lobby at nine o'clock.","9時にホテルのロビーで待っていてください。"],["Environmental groups lobby the government to protect forests.","環境団体は森林を守るよう政府に働きかけている。"]],"locate":[["Rescue teams used satellite data to locate the missing ship.","救助隊は衛星データを使って行方不明の船の位置を突き止めた。"],["They decided to locate the new factory near the harbor.","彼らは新しい工場を港の近くに置くことに決めた。"]],"logic":[["His argument lacks logic and is based only on emotion.","彼の議論は論理性に欠け、感情だけに基づいている。"],["There is no logic in punishing people for telling the truth.","真実を語った人を罰するのは道理に合わない。"]],"logical":[["She gave a clear and logical explanation of her decision.","彼女は自分の決定について明確で論理的な説明をした。"],["It is only logical to ask for advice before making a big decision.","大きな決断をする前に助言を求めるのは当然のことだ。"]],"loyal":[["Dogs are famous for being loyal to their owners.","犬は飼い主に忠実なことで有名だ。"],["She remained loyal to her friends even in difficult times.","彼女は困難なときでも友人に対して誠実であり続けた。"]],"lucid":[["Her lucid explanation made the complex theory easy to understand.","彼女の明快な説明のおかげで、複雑な理論が理解しやすくなった。"],["After the fever dropped, the patient became lucid again.","熱が下がると、その患者は再び正気に戻った。"]],"lucrative":[["Many graduates are attracted to lucrative careers in finance.","多くの卒業生は金融業界のもうかる職に引きつけられる。"],["The company signed a lucrative contract with a foreign supplier.","その会社は外国の供給業者と有利な契約を結んだ。"]],"ludicrous":[["It is ludicrous to expect immediate results from such a policy.","そのような政策に即座の結果を期待するのはばかげている。"],["The clown's ludicrous costume made the children laugh.","ピエロの滑稽な衣装は子どもたちを笑わせた。"]],"lugubrious":[["He wore a lugubrious expression throughout the entire ceremony.","彼は式の間ずっと陰気な表情を浮かべていた。"],["The dog gave a lugubrious look and begged for food.","その犬は哀れっぽい顔つきで食べ物をねだった。"]],"lure":[["Fast food ads lure children with toys and bright colors.","ファストフードの広告は、おもちゃと明るい色で子どもを誘惑する。"],["Hunters used food to lure the bear out of the forest.","猟師たちは食べ物を使って、熊を森からおびき寄せた。"],["Many young people feel the lure of life in big cities.","多くの若者が大都市での暮らしの魅力を感じている。"]],"magnanimous":[["The magnanimous winner praised his opponent after the match.","寛大な勝者は試合後に対戦相手を称えた。"],["A magnanimous leader accepts criticism without becoming angry.","度量の大きい指導者は、怒らずに批判を受け入れる。"]],"magnify":[["A microscope magnifies small objects so we can study them.","顕微鏡は小さな物を拡大して観察できるようにする。"],["The media tend to magnify small problems into national scandals.","メディアは小さな問題を国民的なスキャンダルに誇張しがちだ。"]],"magnitude":[["The sheer magnitude of the universe is hard to imagine.","宇宙の途方もない大きさは想像しがたい。"],["Few people understood the magnitude of the environmental crisis.","その環境危機の重大さを理解している人はほとんどいなかった。"],["The earthquake had a magnitude of 7.2 on the scale.","その地震の規模はマグニチュード7.2だった。"]],"maintain":[["It is hard to maintain a healthy lifestyle when you are busy.","忙しいと健康的な生活を維持するのは難しい。"],["The suspect maintained that he was at home all evening.","容疑者は、夜の間ずっと自宅にいたと主張した。"],["He works two jobs to maintain his wife and three children.","彼は妻と3人の子どもを養うために仕事を二つ掛け持ちしている。"]],"major":[["Agriculture is a major industry in this region.","農業はこの地域の主要な産業である。"],["Air pollution is a major problem in many large cities.","大気汚染は多くの大都市で大きな問題である。"],["She chose economics as her major at university.","彼女は大学で経済学を専攻に選んだ。"]],"majority":[["The majority of students walk to school in this town.","この町では大多数の生徒が徒歩で通学している。"],["The proposal needs a majority of the votes to pass.","その提案が可決されるには、票の過半数が必要だ。"]],"makeshift":[["Survivors built makeshift shelters from pieces of wood and plastic.","生存者たちは木片やプラスチックで間に合わせの避難所を作った。"],["The hall served as a makeshift hospital during the flood.","洪水の間、そのホールは仮の病院として使われた。"]],"malicious":[["Spreading malicious rumors about a colleague is a serious offense.","同僚について悪意のあるうわさを広めることは重大な違反だ。"],["She gave a malicious smile as her rival failed again.","ライバルがまた失敗すると、彼女は意地の悪い笑みを浮かべた。"]],"malleable":[["Children's minds are malleable and easily shaped by experience.","子どもの心は柔軟で、経験によって容易に形作られる。"],["Gold is so malleable that it can be beaten into thin sheets.","金は非常に打ち延ばせる性質があり、薄い板に加工できる。"]],"manage":[["She managed to finish the report before the deadline.","彼女は締め切り前になんとか報告書を仕上げた。"],["He manages a small hotel in a mountain village.","彼は山村で小さなホテルを経営している。"],["Good software helps companies manage their data safely.","優れたソフトウェアは、企業がデータを安全に管理するのに役立つ。"]],"mandate":[["The committee has no mandate to change the school rules.","その委員会には校則を変更する権限はない。"],["The court issued a mandate requiring the factory to close.","裁判所は工場の閉鎖を求める命令を出した。"],["The council held a mandate from the residents to manage the fund.","評議会は住民から基金を運営する委任を受けていた。"]],"mandatory":[["Attendance at the safety training is mandatory for all staff.","安全研修への出席は全職員にとって義務的である。"],["A passport is a mandatory document for international travel.","海外旅行にはパスポートが必須の書類である。"]],"manifest":[["Her actions manifested her deep concern for the patients.","彼女の行動は、患者への深い気遣いを明らかにしていた。"],["His anxiety manifested itself in a number of physical symptoms.","彼の不安はいくつかの身体症状となって表れた。"],["It was manifest to everyone that the plan had failed.","その計画が失敗したことは誰の目にも明白だった。"]],"manifestation":[["Fever is often a manifestation of a deeper infection.","発熱はしばしばより深刻な感染の表れである。"],["The villagers believed the storm was a manifestation of the gods' anger.","村人たちは、その嵐は神々の怒りの現れだと信じていた。"]],"manner":[["She solved the problem in a very simple manner.","彼女はその問題をとても簡単な方法で解いた。"],["He spoke to the audience in a calm and polite manner.","彼は落ち着いた丁寧な態度で聴衆に話しかけた。"],["Children learn good manners by watching their parents.","子どもは親を見て行儀作法を学ぶ。"]],"manufacture":[["The company manufactures car parts for several overseas firms.","その会社は複数の海外企業向けに自動車部品を製造している。"],["The manufacture of cars has become increasingly automated.","自動車の製造はますます自動化されてきた。"]],"margin":[["She wrote notes in the margin of the textbook.","彼女は教科書の余白にメモを書き込んだ。"],["Leave a margin of safety when planning a mountain trip.","登山の計画を立てるときは、安全のための余裕を残しておきなさい。"],["She won the election by a narrow margin of fifty votes.","彼女は50票というわずかな差で選挙に勝った。"]],"mass":[["A mass of data was collected during the three-year study.","3年間の調査で大量のデータが集められた。"],["A mass of dark clouds was moving toward the city.","黒い雲の大きな塊が街に向かって動いていた。"],["Mass culture spread rapidly among ordinary people in the twentieth century.","二十世紀には大衆文化が一般の人々の間に急速に広まった。"]],"massive":[["A massive rock fell from the cliff onto the road.","巨大な岩が崖から道路に落ちてきた。"],["Massive protests spread across the capital.","首都全域に大規模な抗議デモが広がった。"]],"material":[["Wood is still used as a building material in many countries.","多くの国で木材は今も建築材料として使われている。"],["Students must collect material for their research papers in the library.","学生は図書館で研究論文のための資料を集めなければならない。"],["Money alone cannot bring happiness, and material wealth is not everything.","お金だけでは幸福になれず、物質的な豊かさがすべてではない。"]],"mature":[["Children become more mature as they take on responsibilities.","子どもは責任を負うにつれて成熟していく。"],["Wait until the cheese is fully mature before eating it.","チーズが十分に熟したら食べなさい。"],["Boys tend to mature later than girls in some respects.","男の子は、ある面で女の子より遅く成熟する傾向がある。"]],"maximum":[["The elevator can carry a maximum of ten people at once.","そのエレベーターは一度に最大10人まで乗れる。"],["It is the maximum penalty that the court can impose.","それは裁判所が科すことのできる最大の刑罰だ。"]],"meager":[["The village has meager supplies of clean water.","その村にはきれいな水の蓄えが乏しい。"],["Workers had to survive on a meager income during the crisis.","労働者たちは危機の間わずかな収入で生き延びなければならなかった。"]],"means":[["The Internet has become an important means of communication.","インターネットは重要なコミュニケーション手段になった。"],["Walking is an inexpensive means of keeping fit.","歩くことは健康を保つための安上がりな方法だ。"],["He lacks the means to buy a house in the city.","彼には市内に家を買う資力がない。"]],"measure":[["The government took strong measures to reduce unemployment.","政府は失業率を下げるために強力な対策を講じた。"],["Test scores are not the only measure of a student's ability.","テストの点数は生徒の能力を測る唯一の基準ではない。"],["Doctors measure blood pressure with a special device.","医師は特別な器具で血圧を測る。"]],"mechanism":[["The body has a natural mechanism for controlling temperature.","体には体温を調節する自然な仕組みがある。"],["The government set up a new mechanism for handling complaints.","政府は苦情を処理する新たな機構を設けた。"],["Researchers are trying to understand the mechanism of memory.","研究者たちは記憶のメカニズムを理解しようとしている。"]],"meddle":[["Parents should not meddle in the lives of their grown children.","親は成人した子どもの生活に干渉すべきではない。"],["Don't meddle with the settings of the machine without permission.","許可なく機械の設定をいじってはいけない。"]],"mediocre":[["The film received mediocre reviews and soon disappeared from theaters.","その映画は平凡な評価しか得られず、すぐ上映が終わった。"],["They stayed at a mediocre hotel on the edge of town.","彼らは町外れの二流のホテルに泊まった。"]],"melancholy":[["A deep melancholy settled over him as autumn came.","秋が来ると彼は深い憂うつに沈んだ。"],["The melancholy sound of the violin filled the empty hall.","ヴァイオリンの物悲しい音色が、がらんとしたホールに満ちた。"]],"mendacious":[["The mendacious report was full of invented statistics.","その虚偽の報告書は捏造された統計で満ちていた。"],["No one trusted the mendacious politician anymore.","もはや誰もその嘘つきの政治家を信用しなかった。"]],"mental":[["Regular exercise is good for both physical and mental health.","定期的な運動は身体と精神の両方の健康に良い。"],["He made a mental note of the street names to find his way back.","彼は帰り道を見つけるため、通りの名前を心の中に書き留めた。"]],"mention":[["The president mentioned the economy several times in his speech.","大統領は演説で何度か経済に言及した。"],["He did not mention the problem during the meeting.","彼は会議でその問題には触れなかった。"]],"mercenary":[["Her mercenary motives were obvious when she asked for payment first.","先に報酬を求めたことで、彼女の金目当ての動機は明らかだった。"],["The king hired mercenaries from abroad to strengthen his army.","王は軍を強化するため、外国から傭兵を雇った。"]],"mercurial":[["The director's mercurial temper made the staff nervous.","監督の気まぐれな気性に、スタッフは神経をとがらせた。"],["Voters in the region are mercurial and change parties easily.","その地域の有権者は移り気で、支持政党を簡単に変える。"]],"merely":[["This is merely a suggestion, not an official order.","これは単なる提案であって、正式な命令ではない。"],["She is merely a child, so don't expect too much of her.","彼女はただの子どもにすぎないのだから、あまり期待してはいけない。"]],"merge":[["The two banks merged to form one of the largest in Japan.","その2つの銀行は合併して日本最大級の銀行の一つになった。"],["In this painting, the sea and the sky seem to merge.","この絵では、海と空が融合しているように見える。"]],"merit":[["Both plans have their merits, but neither is perfect.","どちらの案にも長所はあるが、完璧なものはない。"],["The idea has little merit and will not solve the problem.","その考えにはほとんど価値がなく、問題を解決しないだろう。"],["Her research merits serious attention from the scientific community.","彼女の研究は科学界の真剣な注目に値する。"]],"method":[["Scientists are developing a new method of detecting cancer early.","科学者たちはがんを早期発見する新しい方法を開発している。"],["The company adopted a new method of payment based on performance.","その会社は成果に基づく新しい支払い方式を採用した。"]],"migrate":[["Many farmers migrated to the cities in search of work.","多くの農民が仕事を求めて都市に移住した。"],["Many birds migrate south to avoid the cold winter.","多くの鳥は寒い冬を避けて南へ渡る。"]],"military":[["Military officers attended the ceremony in uniform.","軍の将校たちは制服姿で式典に出席した。"],["The military was sent to help the flood victims.","洪水の被災者を助けるために軍隊が派遣された。"]],"mimic":[["Parrots can mimic human voices with surprising accuracy.","オウムは驚くほど正確に人間の声をまねることができる。"],["Young artists often mimic the style of famous painters.","若い芸術家は有名な画家の様式をよく模倣する。"]],"mingle":[["The smell of coffee mingled with the smell of fresh bread.","コーヒーの香りが焼きたてのパンの香りと混ざった。"],["Rich and poor mingled freely at the street festival.","お祭りでは、富める者も貧しい者も自由に交わっていた。"]],"minimize":[["Good planning can minimize the risk of failure.","よい計画は失敗の危険を最小限に抑えられる。"],["Do not minimize the dangers of drinking and driving.","飲酒運転の危険を軽視してはならない。"]],"minimum":[["We need a minimum of three staff to run the event.","行事の運営には、最小限として3人のスタッフが必要だ。"],["Workers must be paid at least the legal minimum wage.","労働者は少なくとも法定最低賃金を支払われなければならない。"]],"ministry":[["The Ministry of Education announced a new curriculum.","文部科学省が新しい学習指導要領を発表した。"],["He felt a calling to enter the ministry and serve the church.","彼は聖職に就いて教会に仕えるようにとの天命を感じた。"]],"minor":[["Only minor changes were needed to the original plan.","元の計画には小さな変更しか必要なかった。"],["Don't waste time on minor details that do not affect the result.","結果に影響しない重要でない細部に時間を費やすな。"],["It is illegal to sell alcohol to a minor.","未成年者に酒を売ることは違法だ。"]],"minority":[["The party remained in the minority in parliament for years.","その党は何年も議会で少数派のままだった。"],["Language rights for minorities are protected by the constitution.","少数民族の言語の権利は憲法で保護されている。"]],"miracle":[["It was a miracle that nobody was hurt in the crash.","その衝突で誰も怪我をしなかったのは奇跡だった。"],["Her quick recovery was nothing short of a miracle, doctors said.","医師たちは、彼女の早い回復はまさに驚くべきことだと言った。"]],"mischief":[["The boys were always getting into mischief after school.","少年たちは放課後いつもいたずらをしていた。"],["The storm did great mischief to the crops in the valley.","嵐は谷の作物に大きな害を与えた。"]],"misconception":[["It is a common misconception that sugar makes children hyper.","砂糖で子どもが興奮するというのはよくある誤解だ。"],["I realized my misconception about the schedule when I arrived late.","遅れて到着して、私は日程についての思い違いに気づいた。"]],"misgiving":[["She had serious misgivings about moving to a new city.","彼女は新しい街への引っ越しに強い不安を抱いていた。"],["Several members expressed misgivings about the honesty of the report.","数名の委員が、その報告書の誠実さに疑念を示した。"]],"mislead":[["The advertisement misled customers about the price of the product.","その広告は商品の価格について消費者に誤解を与えた。"],["He misled the police by giving a false name.","彼は偽名を使って警察を欺いた。"]],"mobilize":[["The government mobilized thousands of volunteers after the flood.","政府は洪水の後、何千人ものボランティアを動員した。"],["The party tried to mobilize its supporters before the election.","その党は選挙の前に支持者を結集しようとした。"]],"moderate":[["Moderate exercise every day can lower the risk of disease.","毎日の適度な運動は病気のリスクを下げる。"],["Moderate politicians from both parties agreed on the budget.","両党の穏健な政治家たちが予算に合意した。"],["She tried to moderate her tone to avoid an argument.","彼女は口論を避けるため、口調を和らげようとした。"]],"modify":[["The designer modified the plan after hearing the customer's opinion.","設計者は顧客の意見を聞いた後、計画を修正した。"],["Users can modify the settings of the program at any time.","ユーザーはいつでもプログラムの設定を変更できる。"]],"moisture":[["Moisture in the walls caused the paint to peel off.","壁の湿気のせいで塗料がはがれた。"],["Plants take moisture from the soil through their roots.","植物は根から土の水分を吸い上げる。"]],"mollify":[["The manager tried to mollify the angry customers with an apology.","支配人は謝罪して怒った客をなだめようとした。"],["A kind letter mollified his anger toward her.","親切な手紙が彼女に対する彼の怒りを和らげた。"]],"momentous":[["The two leaders made a momentous decision to end the war.","両首脳は戦争を終わらせる重大な決断を下した。"],["The invention of the printing press was a momentous event in history.","印刷機の発明は歴史上の画期的な出来事だった。"]],"momentum":[["The campaign gained momentum as more people joined it.","参加者が増えるにつれて、その運動は勢いを増した。"],["The early goal gave the team the momentum it needed to win.","早い時間の得点が、チームに勝つために必要なはずみを与えた。"],["In physics, momentum is the product of mass and velocity.","物理学では、運動量は質量と速度の積である。"]],"monetary":[["The couple received no monetary reward for their volunteer work.","その夫婦はボランティア活動に対して金銭的な報酬を受け取らなかった。"],["The monetary system of the country was reformed after the war.","戦後、その国の通貨制度は改革された。"]],"monitor":[["Doctors monitor the patient's heart rate throughout the night.","医師たちは夜通し患者の心拍数を監視する。"],["Scientists monitor changes in the ocean temperature every day.","科学者たちは毎日、海水温の変化を観察している。"],["The nurse watched the heart monitor beside the patient's bed.","看護師は患者のベッド脇の心臓モニターを見守った。"]],"monopoly":[["The company held a monopoly on electricity in the region.","その会社は地域の電力を独占していた。"],["The government once held a monopoly on the sale of salt.","政府はかつて塩の専売権を握っていた。"]],"monotonous":[["The monotonous work made the employees lose interest quickly.","単調な仕事のせいで、従業員はすぐに興味を失った。"],["The long, monotonous lecture made me fall asleep.","長くて退屈な講義のせいで、私は眠ってしまった。"]],"monumental":[["The city built a monumental statue to honor the war dead.","市は戦没者をたたえるため記念碑的な像を建てた。"],["Building the bridge was a monumental task for the engineers.","その橋の建設は技術者にとって途方もない大仕事だった。"]],"moral":[["Parents have a moral duty to protect their young children.","親には幼い子どもを守る道徳的義務がある。"],["The moral of the story is that honesty is the best policy.","その物語の教訓は、正直が最善の策だということだ。"],["Some people believe that morals are declining among young people.","若者の間で道徳が衰えていると考える人もいる。"]],"morale":[["Low pay and long hours damaged the morale of the staff.","低賃金と長時間労働が職員の士気を損なった。"],["Praise from the manager raised the morale of the new employees.","部長の称賛は新入社員のやる気を高めた。"]],"moratorium":[["The country announced a moratorium on new nuclear plants.","その国は新たな原発の建設を一時停止すると発表した。"],["The bank agreed to a moratorium on loan payments during the crisis.","銀行は危機の間、ローン返済の猶予に同意した。"]],"morbid":[["He has a morbid fear of closed spaces.","彼は閉所に対して病的な恐怖を抱いている。"],["The film's morbid atmosphere left the audience feeling uneasy.","その映画の不気味な雰囲気に、観客は不安な気持ちになった。"]],"moreover":[["The plan is too expensive; moreover, it is unlikely to work.","その計画は費用がかかりすぎる。さらに、うまくいきそうにもない。"],["The room was small; moreover, it had no windows at all.","その部屋は狭かった。その上、窓が全くなかった。"]],"mortal":[["All human beings are mortal, and life is precious.","人間は皆いつかは死ぬものであり、命は貴い。"],["The soldier suffered a mortal wound in the battle and died soon after.","その兵士は戦いで致命傷を負い、まもなく亡くなった。"],["Mere mortals cannot grasp the vast scale of the universe.","ただの人間には宇宙の広大な規模は理解できない。"]],"mortality":[["Improved hygiene has greatly reduced infant mortality.","衛生状態の改善により乳児死亡率が大きく下がった。"],["Facing his own mortality made him rethink how he spent his time.","自らがいつか死ぬ運命にあることに向き合い、彼は時間の使い方を考え直した。"]],"motivate":[["Money alone may not motivate employees to work harder for long.","お金だけでは、従業員を長期にわたって一層努力するよう動機づけることはできないかもしれない。"],["Good teachers know how to motivate their students to learn.","よい教師は生徒に学ぶ意欲を持たせる方法を知っている。"]],"motive":[["The police could not find any motive for the crime.","警察はその犯罪の動機を何も見つけられなかった。"],["The motive of the campaign was to raise awareness about clean water.","そのキャンペーンの目的は、きれいな水への関心を高めることだった。"]],"multiple":[["The city has multiple museums, and many tourists visit them every year.","その市には多数の博物館があり、毎年多くの観光客が訪れる。"],["The disease can be caused by multiple factors at the same time.","その病気は複数の要因が同時に重なって起こりうる。"]],"municipal":[["The municipal government plans to build a new public library.","市当局は新しい公立図書館を建てる計画だ。"],["Municipal governments are responsible for collecting garbage and maintaining local roads.","地方自治体はごみの収集や地域の道路の維持を担当している。"]],"mutate":[["Viruses can mutate quickly, making vaccines less effective.","ウイルスは急速に変異し、ワクチンの効果を弱めることがある。"],["Over time, the original plan mutated into something quite different.","時が経つにつれ、当初の計画はまったく別のものに変化した。"]],"myopic":[["Myopic children often need glasses to see the blackboard clearly.","近視の子どもは黒板をはっきり見るためにしばしば眼鏡を必要とする。"],["Their myopic policy ignored the long-term effects on the environment.","彼らの近視眼的な政策は環境への長期的影響を無視していた。"]],"myriad":[["The city offers a myriad of opportunities for young artists.","その街は若い芸術家に無数の機会を提供している。"],["The night sky was full of myriad stars shining above the desert.","砂漠の上の夜空は無数の星で満ちていた。"]],"nadir":[["Sales reached their nadir in January before slowly beginning to recover.","売上は1月に最低点に達し、その後ゆっくり回復し始めた。"],["Having lost everything, he felt he was at the nadir of his life.","すべてを失い、彼は自分が人生のどん底にいると感じた。"]],"naive":[["She was too naive to realize that the stranger was lying.","彼女は世間知らずで、その見知らぬ男が嘘をついていると気づかなかった。"],["The artist painted in a naive style, with simple shapes and bright colors.","その画家は単純な形と明るい色を用いた素朴な画風で描いた。"]],"narrative":[["Children enjoy a good narrative with a clear beginning and a happy ending.","子どもたちは、はっきりした始まりと幸せな結末のある良い物語を楽しむ。"],["The author uses a first-person narrative to draw readers in.","その作家は読者を引き込むために一人称の語りを用いている。"],["The film is praised for its narrative structure, which links three separate stories.","その映画は、三つの別々の話を結びつける物語の構造が高く評価されている。"]],"narrow":[["The narrow road made it difficult for two cars to pass.","その道は狭く、車2台がすれ違うのは難しかった。"],["The team won the match by a narrow margin of one point.","そのチームは1点というわずかな差で試合に勝った。"],["Education can narrow the gap between rich and poor families.","教育は裕福な家庭と貧しい家庭の格差を狭めることができる。"]],"nascent":[["The nascent technology still needs years of development.","その初期段階の技術は、実用化までなお何年もの開発を要する。"],["A nascent sense of national identity began to emerge in the region.","その地域に、生まれつつある国民意識が芽生え始めた。"]],"native":[["Salmon return to their native river to lay their eggs.","サケは卵を産むために生まれた川に戻る。"],["Her native language is Spanish, but she also speaks English fluently.","彼女の母国語はスペイン語だが、英語も流暢に話す。"],["Many natives of the island still follow traditional ways of fishing.","その島の原住民の多くは今も伝統的な漁法を守っている。"]],"nebulous":[["The report gives only a nebulous idea of what went wrong.","その報告書は何が問題だったかについて漠然とした見解しか示していない。"],["The boundary between the two concepts remains nebulous and hard to define.","その二つの概念の境界は依然として不明瞭で、定義しにくい。"]],"necessity":[["There is no necessity to hurry because the meeting starts at noon.","会議は正午に始まるので、急ぐ必要はない。"],["Water is a basic necessity for all living things.","水はすべての生き物にとって基本的な必需品である。"]],"nefarious":[["The nefarious villain in the story plans to poison the town's water.","その物語の極悪な悪党は、町の水に毒を入れようと企んでいる。"],["The king's nefarious advisor secretly worked to destroy his rivals.","王の邪悪な側近は、ひそかにライバルたちを破滅させようと動いた。"]],"negative":[["The teacher gave a negative answer when asked about extra time.","追加の時間を求められて、先生は否定的な返事をした。"],["Many students have a negative attitude toward speaking in front of others.","多くの生徒は人前で話すことに消極的な態度をとる。"],["A negative number multiplied by another negative number gives a positive number.","負の数に別の負の数をかけると正の数になる。"]],"neglect":[["He neglected to lock the door, and someone entered the house.","彼は鍵をかけるのを怠り、誰かが家に入った。"],["The government has long neglected the needs of elderly people in rural areas.","政府は地方の高齢者のニーズを長い間無視してきた。"],["The old building fell into ruin through years of neglect.","その古い建物は長年の放置のために荒れ果てた。"]],"negotiate":[["The union negotiated with the company for better working hours.","組合はより良い労働時間を求めて会社と交渉した。"],["The hikers carefully negotiated the steep and slippery path down the mountain.","ハイカーたちは山を下る急で滑りやすい道を慎重に乗り越えた。"]],"neutral":[["The journalist tried to remain neutral in the political debate.","その記者は政治論争で中立を保とうとした。"],["Try to use neutral language that does not favor either side.","どちらの側にも肩入れしない、偏らない言葉遣いを心がけなさい。"]],"nevertheless":[["The weather was terrible; nevertheless, thousands of fans came to the stadium.","天気は最悪だったが、それにもかかわらず何千人ものファンがスタジアムに来た。"],["The test was difficult; nevertheless, most students passed it.","試験は難しかったが、それでも大半の生徒が合格した。"]],"nomadic":[["The nomadic people moved their herds across the plains each season.","遊牧民は季節ごとに家畜を連れて平原を移動した。"],["He led a nomadic life, moving from one city to another every year.","彼は毎年ある都市から別の都市へ移り住む、放浪の生活を送った。"]],"nominal":[["The king was only the nominal ruler, and the council held the real power.","王は名目上の統治者にすぎず、実権は評議会が握っていた。"],["The museum charges only a nominal fee for children.","その博物館は子どもからはわずかな料金しか取らない。"]],"nonchalant":[["He is nonchalant about money and often forgets to pay his bills.","彼はお金に無頓着で、よく請求書の支払いを忘れる。"],["He remained nonchalant even though the exam was tomorrow.","試験は明日なのに、彼は平然としていた。"]],"nonetheless":[["The task was tiring but enjoyable nonetheless.","その作業は疲れたが、それでも楽しかった。"],["The evidence was weak. Nonetheless, the jury found him guilty.","証拠は弱かった。にもかかわらず、陪審は彼を有罪とした。"]],"norm":[["Social norms differ greatly from one culture to another.","社会規範は文化によって大きく異なる。"],["Working from home has become the norm in many industries since 2020.","2020年以降、多くの業界で在宅勤務が標準になっている。"],["The new building does not meet the safety norms set by the city.","その新しい建物は市が定めた安全基準を満たしていない。"]],"nostalgia":[["The old photos filled him with nostalgia for his childhood.","古い写真を見て、彼は子ども時代への郷愁にかられた。"],["A wave of nostalgia came over her as she walked through the old school.","古い校舎を歩くと、懐かしさが彼女を襲った。"]],"notable":[["The study made several notable discoveries about how the brain stores memories.","その研究は、脳が記憶を蓄える仕組みについて注目すべき発見をいくつかもたらした。"],["The festival attracted several notable artists from abroad.","その祭りには海外から数名の著名な芸術家が集まった。"]],"notify":[["The bank ging climate.","その種は、子孫が変化する気候に適応できてはじめて生き残る。"],["Many animals protect their offspring from enemies in the wild.","多くの動物は野生で子を外敵から守る。"]],"ominous":[["Ominous clouds gathered above the hills before the storm.","嵐の前、丘の上に不吉な雲が集まった。"],["An ominous silence filled the house after the lights went out.","明かりが消えると、不気味な静けさが家を満たした。"]],"omit":[["The editor omitted several paragraphs to shorten the article.","編集者は記事を短くするために数段落を省いた。"],["He omitted to mention that he had already met the client.","彼はすでに顧客に会っていたことを伝えるのを怠った。"]],"onerous":[["Filling in the onerous paperwork took the clerk nearly the whole day.","煩わしい書類の記入に、事務員はほぼ丸一日を費やした。"],["The new rules placed an onerous burden on small businesses.","新しい規則は中小企業に重い負担を課した。"]],"ongoing":[["The ongoing research may lead to a cure for the disease.","進行中のその研究はその病気の治療法につながるかもしれない。"],["The ongoing conflict between the two countries has forced thousands to flee.","両国間で継続している紛争のため、数千人が避難を余儀なくされた。"]],"onset":[["The onset of the war changed the lives of ordinary people.","戦争の開始は庶民の生活を一変させた。"],["Early treatment can delay the onset of the disease.","早期治療によりその病気の発症を遅らせることができる。"]],"opaque":[["The opaque glass allowed light in but hid the view outside.","その不透明なガラスは光は通したが外の景色は見えなかった。"],["The company's opaque accounting made it hard for investors to trust it.","その会社の不明瞭な会計処理のため、投資家は信頼しにくかった。"]],"opponent":[["He was a fierce opponent of the war and spoke out publicly.","彼は戦争の激しい敵対者で、公然と反対の声を上げた。"],["The tennis player shook hands with her opponent after the match.","そのテニス選手は試合後、対戦相手と握手を交わした。"]],"oppose":[["Many residents opposed the plan to build a new airport.","多くの住民が新空港の建設計画に反対した。"],["Several small parties joined together to oppose the ruling party.","いくつかの小政党が手を組み、与党に対抗した。"]],"oppress":[["The government oppressed the people who criticized its policies.","政府は自らの政策を批判する人々を抑圧した。"],["Landowners oppressed the poor farmers by demanding unfair rents.","地主たちは不当な小作料を要求して貧しい農民を虐げた。"]],"option":[["Moving abroad is one option, but staying here is also possible ],"ostensible":[["The ostensible reason for the visit was to discuss trade.","訪問の表向きの理由は貿易の協議だった。"],["The ostensible leader of the group had little real influence over decisions.","そのグループの名目上のリーダーは、決定にほとんど実際の影響力を持たなかった。"]],"ostentatious":[["Her ostentatious behavior, always boasting about her money, annoyed her classmates.","いつもお金を自慢する見せびらかしの態度が、同級生をいらだたせた。"],["The ostentatious house showed off the owner's great wealth.","その派手な家は所有者の莫大な富を見せつけていた。"]],"ostracize":[["In ancient Athens, citizens could vote to ostracize a dangerous politician.","古代アテネでは、市民は投票で危険な政治家を追放することができた。"],["Children who look different are sometimes ostracized by their classmates.","見た目が違う子どもは、時にクラスメートから仲間外れにされる。"]],"otherwise":[["Leave now; otherwise, you will miss the last train.","今出なさい。そうしないと終電に乗り遅れるよ。"],["The house is small but otherwise perfect for a young couple.","その家は狭いが、その他の点では若い夫婦にぴったりだ。"],["I had planned to travel by train, but circumstances forced me to do otherwise.","私は電車で行くつもりだったが、事情により別のやり方で行かざるを得なかった。"]],"outbreak":[["The outbreak of the disease spread quickly across the country.","その病気の発生は国中に急速に広がった。"],["The outbreak of the war forced thousands of families to leave their homes.","戦争の勃発により、何千もの家族が家を離れざるを得なかった。"]],"outcome":[["No one could predict the outcome of the election.","選挙の結果を誰も予測できなかった。"],["The meeting produced a positive outcome for both the company and the workers.","その会合は会社と労働者の双方にとって好ましい成果をもたらした。"]],"outlook":[["The economic outlook for next year remains uncertain.","来年の経済見通しはなお不透明である。"],["Their outlook on life changed completely after they traveled around the world.","世界を旅して、彼らの人生に対する見解は完全に変わった。"]],"output":[["The factory has doubled its output over the past five years.","その工場は過去5年間で生産高を倍増させた。"],["The solar panel's output falls sharply on cloudy days.","ソーラーパネルの出力は曇りの日に大きく低下する。"]],"outright":[["He lied outright when the police asked where he had been.","警察にどこにいたのか尋ねられて、彼はあからさまに嘘をついた。"],["The report called the plan an outright failure.","報告書はその計画を完全な失敗だと断じた。"],["The driver was killed outright when the truck hit his car.","トラックが衝突し、運転手は即座に死亡した。"]],"outset":[["We should make the rules clear from the outset.","最初からルールを明確にしておくべきだ。"],["The outset of the conflict was a small disagreement over land.","その紛争の発端は、土地をめぐる小さな意見の相違だった。"]],"outweigh":[["The benefits of the new system outweigh its costs.","新制度の利点は費用を上回る。"],["For many people, the value of friendship outweighs money.","多くの人にとって、友情の価値はお金より重要である。"]],"overall":[["The overall length of the bridge is about two kilometers.","その橋の全体の長さは約2キロメートルである。"],["The students were given an overall score based on four different tests.","生徒たちは4つの試験に基づく総合的な得点を与えられた。"],["Overall, the trip was a great success despite the bad weather.","悪天候にもかかわらず、全体的に見て旅行は大成功だった。"]],"overcome":[["She overcame her fear of speaking in front of others.","彼女は人前で話す恐怖を克服した。"],["The team overcame many difficulties and finally won the championship.","そのチームは多くの困難に打ち勝ち、ついに優勝した。"]],"overdue":[["The library fined him for returning an overdue book.","図書館は返却期限を過ぎた本を返した彼に罰金を科した。"],["The reforms are badly overdue, and the public is losing patience.","改革は大幅に遅れており、国民は我慢の限界に達しつつある。"]],"overhaul":[["The government promised to overhaul the entire tax system.","政府は税制全体を抜本的に見直すと約束した。"],["Mechanics overhauled the engine completely before the plane flew again.","飛行機が再び飛ぶ前に、整備士たちはエンジンを完全に分解修理した。"]],"overlap":[["The two circles overlap in the middle, forming a small shared area.","2つの円は中央で重なり合い、小さな共有部分をつくっている。"],["There is some overlap between the two departments' duties.","2つの部署の職務には若干の重複がある。"]],"override":[["The president can override a decision made by the committee.","大統領は委員会の決定を覆すことができる。"],["In an emergency, safety must override all other considerations.","緊急時には、安全が他のあらゆる配慮に優先する。"]],"overseas":[["Many students go overseas to study English every year.","毎年多くの学生が英語を学びに海外へ行く。"],["The company has opened several overseas offices in recent years.","その会社は近年、海外の事務所をいくつも開設した。"]],"oversee":[["A committee was formed to oversee the construction project.","建設計画を監督するための委員会が設置された。"],["From the tower, guards could oversee the entire valley.","塔から、見張りは谷全体を見渡すことができた。"]],"overt":[["There was no overt opposition, but many people were uneasy.","公然とした反対はなかったが、多くの人が不安を抱いていた。"],["The company showed overt signs of financial trouble last year.","その会社は昨年、財政難の明白な兆候を示していた。"]],"overtake":[["China may soon overtake the United States in total exports.","中国は輸出総額で間もなく米国を追い抜くかもしれない。"],["A sudden storm overtook the climbers before they reached the hut.","山小屋に着く前に、登山者たちを突然の嵐が不意に襲った。"]],"overthrow":[["The people finally rose up to overthrow the corrupt dictator.","国民はついに立ち上がり、腐敗した独裁者を打倒した。"],["The overthrow of the king was followed by years of unrest.","王の転覆の後、数年間の混乱が続いた。"]],"overturn":[["The court overturned the earlier decision on the case.","裁判所はその事件に関する以前の判決を覆した。"],["The strong wind overturned several boats in the harbor.","強風が港の数隻の船をひっくり返した。"]],"overwhelm":[["The beauty of the mountains overwhelmed the visitors.","山々の美しさは訪れた人々を圧倒した。"],["The sudden loss of her husband overwhelmed her with grief.","突然夫を失い、彼女は悲しみに打ちのめされた。"]],"palliate":[["The drug can only palliate the pain, not cure the disease.","その薬は痛みを和らげるだけで病気を治すことはできない。"],["He tried to palliate his mistake by blaming the heavy traffic.","彼は渋滞のせいにして自分の失敗を言い繕おうとした。"]],"panacea":[["Technology is not a panacea for every social problem.","技術はあらゆる社会問題の万能薬ではない。"],["Scientists are still searching for a panacea that can cure the common cold.","科学者たちは、風邪を治せる特効薬を今も探している。"]],"paradigm":[["The discovery forced scientists to rethink the dominant paradigm of physics.","その発見は科学者に物理学の支配的な枠組みを再考させた。"],["This case is a paradigm of how small mistakes can lead to disaster.","この事例は、小さな誤りがいかに大惨事を招くかを示す典型である。"],["The shift to digital media created a new paradigm in journalism.","デジタルメディアへの移行が、報道に新しいパラダイムを生み出した。"]],"paragon":[["She was regarded as a paragon of honesty and generosity.","彼女は誠実さと寛大さの模範と見なされていた。"],["The village is a paragon of peaceful living among people of different faiths.","その村は、異なる信仰を持つ人々が平和に暮らす典型である。"]],"parallel":[["The two roads run parallel to each other for several kilometers.","その2本の道路は数キロにわたって互いに平行に走っている。"],["Scientists found a parallel case in the history of another country.","科学者たちは他国の歴史に類似した事例を見つけた。"],["There are striking parallels between the two historical events.","その二つの歴史的事件には著しい類似点がある。"]],"paramount":[["Safety is of paramount importance in the construction industry.","建設業界では安全が最も重要である。"],["For the king, absolute loyalty was the paramount virtue of a soldier.","王にとって、絶対の忠誠は兵士の至上の美徳だった。"]],"parochial":[["Critics accused the politician of having a parochial view of the world.","批評家たちはその政治家の世界観が狭量だと非難した。"],["The priest visited every family in the parochial district each year.","司祭は毎年、教区内のすべての家庭を訪問した。"]],"parsimonious":[["The parsimonious old man refused to spend money on heating.","そのけちな老人は暖房に金を使うことを拒んだ。"],["She was so parsimonious that she saved enough to buy a small house.","彼女は極端に倹約したので、小さな家を買えるだけの貯金ができた。"]],"partial":[["The plan was only a partial success because of limited funds.","その計画は資金不足のため部分的な成功にとどまった。"],["Critics said the referee was partial, and several of his decisions were unfair.","審判は不公平で、判定のいくつかは不当だったと批評家は言った。"],["My brother is partial to chocolate and eats it every day.","弟はチョコレートが好きで、毎日食べている。"]],"participate":[["All students are encouraged to participate in the school festival.","全生徒が文化祭に参加するよう奨励されている。"],["Citizens should participate in decisions that affect their daily lives.","市民は日常生活に影響する決定に関与すべきだ。"]],"partisan":[["Partisan politics often prevents the parliament from passing useful laws.","党派的な政治のせいで議会が有益な法律を可決できないことが多い。"],["He was a partisan of free trade and argued for it in every speech.","彼は自由貿易の熱烈な支持者で、あらゆる演説でそれを主張した。"]],"passage":[["Read the following passage and answer the questions below.","次の一節を読み、下の問いに答えなさい。"],["A narrow passage led from the kitchen to the back garden.","狭い通路が台所から裏庭へと続いていた。"],["With the passage of time, the pain of the loss slowly faded.","時の経過とともに、喪失の痛みは次第に薄れていった。"]],"passive":[["Students learn more when they are not passive listeners.","学生は受け身の聞き手でないほうがより多くを学ぶ。"],["His passive attitude toward his career worried his parents.","自分の進路に対する消極的な態度が、両親を心配させた。"]],"pathetic":[["The pathetic sight of the lost puppy in the rain moved everyone.","雨の中の迷子の子犬の哀れな姿に、みんなが心を動かされた。"],["The team put on a pathetic performance in the final match.","そのチームは決勝戦でお粗末な試合を演じた。"]],"patient":[["The hospital is crowded with patients waiting to see a doctor.","病院は診察を待つ患者でごった返している。"],["The doctor was patient with every worried patient who came in.","その医師は来院する不安げな患者一人ひとりに辛抱強く接した。"]],"patronize":[["He hated the way the manager patronized the younger staff.","彼は部長が若手社員を見下した態度で扱うのが嫌だった。"],["Local people patronize the small shop because the owner is kind.","店主が親切なので、地元の人々はその小さな店をひいきにしている。"]],"pattern":[["The designer cut the cloth from a paper pattern.","デザイナーは紙の型に合わせて布を裁断した。"],["Different cultures show different patterns of family life.","文化が違えば、家族生活の様式も異なる。"],["The curtains have a pattern of small blue flowers.","そのカーテンには小さな青い花の模様がある。"]],"peculiar":[["He has a peculiar habit of talking to himself while cooking.","彼は料理中に独り言を言う奇妙な癖がある。"],["This custom is peculiar to the region.","この慣習はその地域に特有のものだ。"]],"pedantic":[["His pedantic lectures, full of unnecessary quotations, bored the students.","不要な引用だらけの学者ぶった講義に、学生たちは退屈した。"],["The editor was pedantic about even the smallest grammatical errors.","編集者はごく小さな文法の誤りにまで細かくこだわった。"]],"peer":[["She asked her peers in the department for feedback on her paper.","彼女は学部の同僚たちに論文への意見を求めた。"],["Teenagers are often strongly influenced by their peers.","10代の若者は仲間から強い影響を受けることが多い。"],["She is a leader who treats everyone as a peer, regardless of rank.","彼女は階級に関係なく、誰もを同等の人として扱う指導者だ。"]],"penalty":[["The penalty for the crime was five years in prison.","その犯罪に対する刑罰は懲役5年だった。"],["The penalty for driving without a license is a heavy fine.","無免許運転の罰則は高額の罰金である。"],["Workers who change jobs often pay a penalty in lower pensions.","転職を繰り返す労働者は、年金が減るという不利益を被る。"]],"penchant":[["He has a penchant for collecting rare books from foreign countries.","彼は外国の希少本を集めるのが大好きだ。"],["He has a penchant for exaggerating when he tells stories to friends.","彼は友人に話をするとき、誇張する傾向がある。"]],"pending":[["The decision remains pending until more evidence is collected.","より多くの証拠が集まるまで、決定は保留のままだ。"],["The villagers were worried about the pending storm.","村人たちは差し迫った嵐を心配していた。"]],"penetrate":[["The bullet penetrated the thick wall and hit the car behind it.","弾丸は厚い壁を貫通し、背後の車に当たった。"],["Rainwater slowly penetrates the soil and reaches the underground rivers.","雨水は土壌にゆっくり浸透し、地下水脈に達する。"],["The detective could penetrate the thief's disguise at once.","探偵は泥棒の変装をすぐに見抜くことができた。"]],"perceive":[["We perceive the world through our senses.","私たちは感覚を通して世界を知覚する。"],["Many people perceive him as a leader who cares about workers.","多くの人が彼を労働者を思いやる指導者と見なしている。"]],"perception":[["Our perception of risk is often different from the actual danger.","リスクに対する私たちの認識は、実際の危険とは異なることが多い。"],["Damage to the brain can affect a person's perception of color.","脳が損傷すると、色の知覚に影響が出ることがある。"],["Public perception of the new law differs greatly by region.","その新法に対する世間の受け止め方は地域によって大きく異なる。"]],"perennial":[["Traffic congestion is a perennial problem in large cities.","交通渋滞は大都市における長年の問題である。"],["The perennial noise of the city kept him awake every night.","街の絶え間ない騒音のせいで、彼は毎晩眠れなかった。"],["Roses are perennial plants that bloom again every summer.","バラは毎年夏に再び花を咲かせる多年生の植物である。"]],"perform":[["The surgeon performed the operation with remarkable skill.","その外科医は驚くべき技術で手術を行った。"],["Each officer must perform his duties faithfully and honestly.","各職員は自分の職務を忠実かつ誠実に遂行しなければならない。"],["The students will perform a short play at the school festival.","生徒たちは文化祭で短い劇を演じる。"]],"perfunctory":[["The guard gave the passports only a perfunctory glance.","警備員はパスポートをおざなりに一瞥しただけだった。"],["The ceremony was perfunctory, with a few formal words and no real discussion.","その式典は形だけのもので、儀礼的な言葉が少しあるだけで、実質的な議論はなかった。"]],"period":[["The medicine should be taken for a period of seven days.","その薬は7日間の期間、飲み続けるべきだ。"],["The country enjoyed a long period of peace after the war.","その国は戦後、長い平和の時代を享受した。"],["Put a period at the end of every sentence you write.","書く文の終わりには必ず終止符を打ちなさい。"]],"peripheral":[["Peripheral areas of the city have fewer hospitals and schools.","その都市の周辺地域には、病院や学校が少ない。"],["Cost is a peripheral issue compared with the safety of patients.","費用は患者の安全に比べれば二次的な問題だ。"]],"perish":[["Ancient empires rise and perish, but their art often survives.","古代の帝国は興っては滅びるが、その芸術は残ることが多い。"],["Thousands of people perished in the earthquake and the fires that followed.","数千人が地震とその後の火災で命を落とした。"]],"permanent":[["The accident left him with a permanent injury to his knee.","その事故で彼は膝に一生治らない傷を負った。"],["The city decided to set up a permanent committee on traffic safety.","市は交通安全に関する常設の委員会を設けることにした。"]],"permit":[["The law does not permit children to work in factories.","その法律は子どもが工場で働くことを許していない。"],["You need a permit to park your car in this area.","この地域に駐車するには許可証が必要だ。"]],"pernicious":[["The pernicious effects of the rumor lasted for years.","そのうわさの有害な影響は何年も続いた。"],["The pernicious influence of corruption slowly destroyed the nation's institutions.","汚職の破壊的な影響は、国の諸制度を徐々に崩壊させた。"]],"perpetual":[["The residents lived in perpetual fear of another earthquake.","住民たちは再び地震が来る恐怖の中で絶えず暮らしていた。"],["Some scientists dreamed of building a machine with perpetual motion.","科学者の中には、永続的に動き続ける機械を作ることを夢見た者もいた。"]],"persist":[["He persisted in his belief even after the evidence proved him wrong.","証拠で誤りが証明された後も、彼は自分の信念に固執した。"],["If the symptoms persist, you should see a doctor.","症状が続くようなら、医師の診察を受けるべきだ。"],["She persisted despite many failures and finally finished the long course.","彼女は何度も失敗しながらもやり抜き、ついに長い課程を修了した。"]],"persistent":[["A persistent salesman kept calling until the customer finally agreed.","粘り強い販売員は、客がついに同意するまで電話をかけ続けた。"],["She has had a persistent cough since last winter.","彼女は去年の冬からしつこい咳が続いている。"]],"perspective":[["Travel helps us see our own culture from a different perspective.","旅行は私たちが自国の文化を別の視点から見る助けとなる。"],["We need a long-term perspective when planning for the future of the city.","都市の将来を計画するときは、長期的な見通しが必要だ。"],["Renaissance painters used perspective to create the illusion of depth.","ルネサンスの画家たちは遠近法を用いて奥行きの錯覚を生み出した。"]],"persuade":[["She persuaded her parents to let her study abroad.","彼女は両親を説得して留学させてもらった。"],["The evidence persuaded the jury that the defendant was innocent.","その証拠は、被告が無実であると陪審員を納得させた。"]],"pertinent":[["The teacher gave a pertinent answer to each of the questions.","教師はその質問の一つ一つに適切な答えを返した。"],["Please provide all information pertinent to the case.","その件に関連する情報はすべて提供してください。"]],"pervade":[["A sense of optimism pervaded the whole country after the victory.","勝利の後、国じゅうに楽観的な空気が行き渡った。"],["The smell of fresh bread pervaded the whole kitchen.","焼きたてのパンの匂いが台所じゅうに充満した。"]],"phase":[["The project is now entering its final phase of development.","そのプロジェクトは今や開発の最終段階に入っている。"],["The war entered a new and more dangerous phase last spring.","戦争は昨年の春、新たなより危険な局面に入った。"]],"philosophy":[["He studied philosophy at university and became interested in ethics.","彼は大学で哲学を学び、倫理学に興味を持つようになった。"],["Her philosophy of life is to live simply and honestly.","彼女の人生哲学は簡素に誠実に生きることだ。"],["The company's philosophy is to put customers' needs before profits.","その会社の理念は、利益より顧客のニーズを優先することだ。"]],"pioneer":[["He was a pioneer in the field of computer science.","彼はコンピューター科学の分野の先駆者だった。"],["The pioneers crossed the mountains in wagons in search of new land.","開拓者たちは新天地を求め、幌馬車で山を越えた。"],["Her team pioneered a new method for treating heart disease.","彼女のチームは心臓病治療の新しい方法を開拓した。"]],"pitfall":[["The article explains common pitfalls of learning a new language.","その記事は新しい言語を学ぶ際のよくある落とし穴を説明している。"],["Online shopping has pitfalls that careful buyers should know about.","ネット通販には、慎重な買い手が知っておくべき隠れた危険がある。"]],"pivotal":[["The leader played a pivotal role in ending the conflict.","その指導者は紛争を終わらせる上で極めて重要な役割を果たした。"],["The city has long been a pivotal center of trade in the region.","その都市は長い間、地域の貿易の中心的な拠点であった。"]],"placid":[["The lake was placid, with not a single ripple on its surface.","湖は穏やかで、水面にはさざ波ひとつなかった。"],["She remained placid even when the crowd shouted angrily at her.","群衆が怒鳴りつけても、彼女は平静なままだった。"]],"plague":[["The plague killed a third of Europe's population in the 14th century.","14世紀、疫病はヨーロッパの人口の3分の1を死に至らしめた。"],["The farmers suffered a plague of locusts that destroyed their crops.","農民たちは作物を食い荒らすイナゴの災難に見舞われた。"],["Engine trouble plagued the team throughout the whole race.","エンジンの不調がレースの間じゅうチームを悩ませた。"]],"platitude":[["Tired of hearing platitudes, she wanted real solutions to her problems.","陳腐な言葉を聞き飽きて、彼女は問題への本当の解決策を求めた。"],["His speech was full of platitudes and said nothing new.","彼の演説は陳腐な決まり文句ばかりで、何ら新しいことを述べなかった。"]],"pledge":[["The new members signed a pledge to follow the club rules.","新会員たちはクラブの規則を守るという誓約書に署名した。"],["The mayor kept his pledge to build more parks in the city.","市長は市内に公園をもっと造るという公約を守った。"],["The soldiers pledged to defend their country with their lives.","兵士たちは命をかけて祖国を守ると誓った。"]],"plentiful":[["Food was plentiful at the harvest festival, and everyone ate well.","収穫祭には食べ物が豊富にあり、誰もが十分に食べた。"],["Fish were plentiful in the river before the factory was built.","工場が建つ前、その川には魚がたくさんいた。"]],"plethora":[["The Internet offers a plethora of information, not all of it reliable.","インターネットは大量の情報を提供するが、すべてが信頼できるわけではない。"],["The plethora of choices on the menu made it hard to decide.","メニューに選択肢が多すぎて、決めるのが難しかった。"]],"plight":[["The company's plight worsened as its debts continued to grow.","借金が増え続け、その会社の苦境は悪化した。"],["The film draws attention to the plight of refugee children.","その映画は難民の子どもたちの窮状に関心を向けさせる。"]],"plot":[["The plot of the novel is simple, but its message is deep.","その小説の筋は単純だが、そのメッセージは深い。"],["Police discovered a plot to blow up the railway bridge.","警察は鉄道橋を爆破する陰謀を発見した。"],["The generals plotted to seize power while the king was abroad.","将軍たちは王の外遊中に権力を奪おうと企んだ。"]],"plunge":[["Stock prices plunged after the unexpected announcemen
