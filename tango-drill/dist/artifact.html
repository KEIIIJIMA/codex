rthern coast.","海軍は北の沿岸に数隻の艦船を配備した。"],["Schools should deploy digital tools more effectively in the classroom.","学校は教室でデジタル機器をもっと効果的に活用すべきだ。"]],"deposit":[["She made a deposit of fifty thousand yen at the bank.","彼女は銀行に5万円の預金をした。"],["You must pay a deposit to reserve the room.","部屋を予約するには手付金を払わねばならない。"],["He deposited his savings in a local bank account.","彼は貯金を地元銀行の口座に預けた。"]],"depress":[["The bad news depressed her for several days.","その悪い知らせは彼女を数日間落ち込ませた。"],["The financial crisis depressed the economy for several years.","金融危機は数年間にわたって経済を不景気にした。"]],"derive":[["Many people derive great comfort from reading poetry.","多くの人が詩を読むことから大きな安らぎを得ている。"],["The word 'salary' derives from the Latin word for salt.","salaryという語はラテン語の塩を表す語に由来する。"]],"derogatory":[["He was fired for making derogatory remarks about his colleagues.","彼は同僚を軽蔑する発言をして解雇された。"],["He was offended by the derogatory tone of her reply.","彼は彼女の返事の見下すような口調に気分を害した。"]],"describe":[["The author describes the village in great detail.","作者はその村を非常に細かく描写している。"],["No words can describe the beauty of the sunset.","その夕日の美しさは言葉では言い表せない。"]],"deserve":[["Every child deserves a safe place to grow up.","どの子どもも安全に育つ場所を得るに値する。"],["That idea deserves serious consideration by the committee.","その案は委員会による真剣な検討を受けるに足るものだ。"]],"designate":[["The area was designated a national park in 1950.","その地域は1950年に国立公園に指定された。"],["The board designated her as the next chairperson of the company.","理事会は彼女を会社の次の議長に指名した。"]],"desire":[["She has a strong desire to study abroad.","彼女は留学したいという強い願望を持っている。"],["Many people desire a quiet life away from the city.","多くの人が都会から離れた静かな暮らしを強く望んでいる。"]],"despair":[["Many workers fell into despair after the factory closed.","工場の閉鎖後、多くの労働者が絶望に陥った。"],["Do not despair; there is still time to change the result.","絶望してはいけない。結果を変える時間はまだある。"]],"destiny":[["She believed that people could shape their own destiny.","彼女は人は自分の運命を切り開けると信じていた。"],["Some believed it was their destiny to rule the land.","その土地を治めるのは自分たちの宿命だと信じる者もいた。"]],"destroy":[["The storm destroyed hundreds of homes along the coast.","嵐は沿岸の数百の家屋を破壊した。"],["One careless remark can destroy years of trust.","不用意な一言が長年の信頼を台なしにしかねない。"]],"desultory":[["They made a desultory attempt at conversation and then fell silent.","彼らは散漫な会話を試みたあと黙り込んだ。"],["The desultory discussion jumped from one topic to another.","そのとりとめのない議論は話題から話題へと飛び移った。"]],"detach":[["The pictures can be easily detached from the page.","その絵はページから簡単に切り離せる。"],["You can detach the handle and wash it separately.","持ち手は取り外して別に洗うことができる。"]],"detail":[["The police asked her to give every detail of the accident.","警察は彼女に事故の詳細をすべて話すよう求めた。"],["The painter paid close attention to the small details of the face.","画家は顔の細部に細心の注意を払った。"]],"detect":[["Doctors can detect the disease at a very early stage.","医師はその病気をごく初期の段階で検出できる。"],["She detected a note of sadness in his voice.","彼女は彼の声に悲しみの響きがあることに気づいた。"]],"determine":[["The size of the budget will determine how many staff we hire.","予算の規模が、何人のスタッフを雇うかを決定する。"],["Police are trying to determine the cause of the fire.","警察は火事の原因を突き止めようとしている。"],["She determined to finish the marathon despite the pain.","彼女は痛みにもかかわらずマラソンを完走しようと決心した。"]],"device":[["This device can measure heart rate and sleep quality.","この機器は心拍数と睡眠の質を測定できる。"],["The author uses humor as a device to hold the readers' attention.","著者は読者の関心を引きつけるための工夫としてユーモアを用いている。"]],"dichotomy":[["Critics reject the simple dichotomy of mind and body.","批評家たちは心と体という単純な二分法を退けている。"],["The dichotomy between work and leisure is no longer clear.","仕事と余暇の二項対立はもはや明確ではない。"]],"dictate":[["Economic conditions often dictate the direction of policy.","経済状況が政策の方向をしばしば決定する。"],["The teacher read out a passage and dictated it to the students.","先生は文章を読み上げて生徒たちに書き取らせた。"]],"didactic":[["The novel was criticized for its heavy-handed didactic tone.","その小説は押しつけがましい教訓的な調子を批判された。"],["His didactic manner annoyed his friends, who hated being lectured.","彼の説教くさい態度は、説教されるのを嫌う友人たちをいらだたせた。"]],"differ":[["Customs differ widely from one country to another.","風習は国によって大きく異なる。"],["The two leaders differ sharply on how to reduce the deficit.","二人の指導者は赤字の減らし方について大きく意見が合わない。"]],"differentiate":[["It is important to differentiate between opinion and fact.","意見と事実を区別することは重要だ。"],["Companies try to differentiate their products from those of rivals.","企業は自社の製品をライバルの製品と差別化しようとする。"]],"dignity":[["Every person has the right to live with dignity.","すべての人は尊厳をもって生きる権利がある。"],["The old judge entered the room with calm dignity.","年老いた判事は落ち着いた威厳をもって部屋に入ってきた。"]],"dilute":[["Dilute the juice with water before giving it to the baby.","赤ちゃんに与える前にジュースを水で薄めなさい。"],["Compromises may dilute the force of the original proposal.","妥協は当初の提案の力を弱めるかもしれない。"]],"dimension":[["Physicists study the extra dimensions beyond the three we can see.","物理学者は私たちが認識できる三つを超える余剰次元を研究している。"],["Poverty has a social dimension as well as an economic one.","貧困には経済面だけでなく社会的な側面もある。"]],"diplomatic":[["The two nations are trying to solve the issue by diplomatic means.","両国は外交手段でその問題を解決しようとしている。"],["She gave a diplomatic answer so as not to hurt his feelings.","彼女は彼の気持ちを傷つけないよう、如才ない答えをした。"]],"direct":[["There is a direct link between diet and health.","食事と健康には直接的な関連がある。"],["The conductor directed the orchestra with great energy.","指揮者は力強く楽団を指揮した。"],["Could you direct me to the nearest station, please?","最寄りの駅への道を教えていただけますか。"]],"disability":[["The law protects people with a disability from discrimination.","その法律は障害のある人々を差別から守る。"],["The government's disability to deal with the crisis soon became obvious.","その危機に対処できない政府の無力さがすぐに明らかになった。"]],"discipline":[["Strict discipline is a part of life in the military.","厳しい規律は軍隊生活の一部である。"],["Economics and sociology are closely related disciplines.","経済学と社会学は密接に関連した学問分野だ。"],["The school disciplined the students who had cheated on the exam.","学校は試験で不正をした生徒たちを罰した。"]],"discourage":[["Repeated failure can discourage even the most determined students.","失敗の繰り返しは、最も意志の強い生徒でさえ落胆させかねない。"],["High prices discourage many people from buying electric cars.","高い価格は多くの人が電気自動車を買うのを思いとどまらせる。"]],"discourse":[["Political discourse in the country has become more divided.","その国の政治的言説はいっそう分断されてきた。"],["The professor wrote a long discourse on the nature of freedom.","教授は自由の本質について長い論述を書いた。"]],"discover":[["Researchers discovered a new species of frog in the forest.","研究者たちはその森で新種のカエルを発見した。"],["He discovered that his wallet was missing when he reached home.","彼は帰宅したとき、財布がなくなっていることに気づいた。"]],"discrimination":[["Racial discrimination is illegal in the workplace.","職場での人種差別は違法だ。"],["Dogs have a remarkable power of discrimination between different smells.","犬は異なるにおいを識別する驚くべき力を持っている。"]],"disgust":[["Many people expressed disgust at the way the animals were treated.","多くの人々が動物の扱われ方に嫌悪感を示した。"],["The cruel treatment of prisoners disgusted people around the world.","囚人への残酷な扱いは世界中の人々をうんざりさせた。"]],"dismantle":[["Workers began to dismantle the old bridge piece by piece.","作業員たちは古い橋を少しずつ解体し始めた。"],["The new government promised to dismantle the old tax system.","新政府は旧来の税制を廃止すると約束した。"]],"dismiss":[["The company dismissed fifty workers after its profits fell.","会社は利益が落ち込んだ後、50人の従業員を解雇した。"],["The manager dismissed the idea as unrealistic.","部長はその案を非現実的だとして退けた。"],["The teacher dismissed the class a few minutes early.","先生はクラスを数分早く解散させた。"]],"disorder":[["The riot threw the entire city into disorder.","暴動は街全体を混乱に陥れた。"],["Eating disorders are becoming more common among young people.","摂食障害は若者の間でより一般的になりつつある。"]],"disparage":[["It is unwise to disparage the achievements of others.","他人の業績をけなすのは賢明ではない。"],["Some people disparage manual labor as less valuable than office work.","肉体労働は事務職より価値が低いとして軽んじる人もいる。"]],"dispatch":[["The city dispatched rescue teams to the flooded area.","市は浸水地域に救助隊を派遣した。"],["A dispatch from the front reported heavy fighting near the border.","前線からの急報は国境付近での激しい戦闘を伝えた。"]],"dispense":[["Volunteers dispensed free meals to homeless people every evening.","ボランティアは毎晩、ホームレスの人々に無料の食事を分配した。"],["Pharmacists dispense medicine according to the doctor's orders.","薬剤師は医師の指示に従って薬を調剤する。"],["Modern offices can hardly dispense with computers.","現代の職場はコンピューターなしで済ませることはほとんどできない。"]],"displace":[["Strong waves displaced the heavy rocks from their original positions.","強い波が重い岩を元の位置から移動させた。"],["Automation may displace many workers in the factory.","自動化によって工場の多くの労働者が職を奪われるかもしれない。"]],"dispose":[["Factories must dispose of waste safely.","工場は廃棄物を安全に処分しなければならない。"],["The board seemed disposed to accept the new proposal.","理事会は新しい提案を受け入れる気があるようだった。"]],"dispute":[["A territorial dispute between the two nations lasted for decades.","両国間の領土紛争は数十年続いた。"],["No one disputes that the climate is changing.","気候が変化していることに異議を唱える者はいない。"]],"dissent":[["The government does not tolerate dissent from its citizens.","政府は市民からの異論を許さない。"],["Two judges dissented from the court's decision.","二人の裁判官が裁判所の判断に異議を唱えた。"]],"dissolve":[["Sugar dissolves quickly in hot water.","砂糖は熱い湯にすぐ溶ける。"],["The two companies decided to dissolve their partnership.","二社は提携関係を解消することに決めた。"]],"distinct":[["The two species are quite distinct from each other.","その二つの種は互いにまったく異なる。"],["There was a distinct smell of smoke in the room.","部屋ではっきりとした煙のにおいがした。"]],"distinguish":[["Young children cannot always distinguish fact from fantasy.","幼い子どもは事実と空想を必ずしも区別できない。"],["I could not distinguish his face in the dim light.","薄暗い明かりの中では彼の顔を見分けられなかった。"]],"distress":[["The news caused great distress to the family.","その知らせは家族に大きな苦痛を与えた。"],["The ship sent out a distress signal before it sank.","その船は沈む前に遭難信号を発信した。"]],"distribute":[["The inheritance was distributed equally among the three children.","遺産は三人の子どもに均等に分配された。"],["Volunteers distributed food to the families affected by the flood.","ボランティアは洪水の被災家族に食料を配った。"]],"disturb":[["Please do not disturb the patients while they are sleeping.","患者が眠っている間は邪魔しないでください。"],["The violent scenes in the film disturbed many viewers.","その映画の暴力的な場面は多くの観客を不安にさせた。"]],"diverge":[["The path diverges into two roads at the edge of the forest.","その小道は森のはずれで二本の道に分岐する。"],["Their opinions diverge sharply when it comes to money.","お金のことになると、二人の意見は大きく食い違う。"]],"divide":[["The class was divided into four groups.","クラスは4つのグループに分けられた。"],["The river divides into two streams near the sea.","その川は海の近くで二つの流れに分かれる。"]],"divulge":[["The doctor refused to divulge any information about his patient.","医師は患者に関する情報を一切漏らすことを拒んだ。"],["The newspaper divulged secrets about the company's finances.","その新聞は会社の財務に関する秘密を暴露した。"]],"doctrine":[["The doctrine was taught in schools for many generations.","その教義は何世代にもわたって学校で教えられた。"],["The doctrine of free trade shaped the country's economic policy.","自由貿易の主義がその国の経済政策を形づくった。"]],"dogma":[["The scientist rejected religious dogma in favor of evidence.","その科学者は宗教上の教義を退け、証拠を重んじた。"],["Their dogma that only one method works blocked all progress.","一つの方法だけが有効だという彼らの独断的な意見が、あらゆる進歩を妨げた。"]],"domain":[["Medicine is no longer the exclusive domain of doctors.","医療はもはや医師だけの領域ではない。"],["The lord ruled his vast domain from a castle on the hill.","領主は丘の上の城から広大な領地を治めた。"]],"domestic":[["The government is focusing on domestic issues rather than foreign policy.","政府は外交政策より国内問題に重点を置いている。"],["Domestic chores should be shared among all family members.","家庭の雑事は家族全員で分担すべきだ。"]],"dominate":[["A few large companies dominate the global market.","少数の大企業が世界市場を支配している。"],["Our team dominated the game from the very first minute.","私たちのチームは試合開始から相手を圧倒した。"]],"dormant":[["The volcano has been dormant for over a thousand years.","その火山は千年以上休眠状態にある。"],["Her talent lay dormant until she met a good teacher.","彼女の才能は良い先生に出会うまで潜在的なままだった。"]],"doubt":[["There is no doubt that exercise improves mental health.","運動が心の健康を改善することは疑いない。"],["I doubt that the plan will work in practice.","その計画が実際にうまくいくのかどうか疑っている。"]],"draft":[["The committee prepared a draft of the new law.","委員会は新しい法律の草案を作成した。"],["She drafted a speech for the school ceremony.","彼女は学校の式典のために演説を起草した。"]],"dramatic":[["The city has seen a dramatic rise in housing prices.","その都市では住宅価格が劇的に上昇している。"],["Dramatic performances at the festival attracted large audiences.","その祭りでの芝居の上演は大勢の観客を集めた。"]],"drastic":[["Drastic measures are needed to reduce carbon emissions.","炭素排出量を減らすには思い切った対策が必要だ。"],["A drastic change in temperature killed many of the plants.","気温の激しい変化が多くの植物を枯らした。"]],"dubious":[["The study's results are dubious because the sample was small.","標本が小さいため、その研究の結果は疑わしい。"],["He made a living by selling dubious medicines.","彼はいかがわしい薬を売って生計を立てていた。"]],"due":[["The train is due to arrive at noon.","列車は正午に到着予定だ。"],["The delay was due to bad weather.","遅れは悪天候が原因だった。"],["The rent is due on the first of every month.","家賃は毎月1日に支払われるべきものだ。"]],"duplicate":[["Please do not duplicate these documents without permission.","許可なくこれらの書類を複製しないでください。"],["Delete the duplicate files to save space on the disk.","ディスクの容量を節約するため、複製のファイルを削除しなさい。"]],"duty":[["Teachers have a duty to protect their students.","教師には生徒を守る義務がある。"],["Import duties on cars were reduced last year.","自動車の輸入関税は昨年引き下げられた。"]],"dwell":[["Many rare birds dwell in the wetlands along the coast.","多くの珍しい鳥が沿岸の湿地に住んでいる。"],["It is unhelpful to dwell on past mistakes.","過去の失敗をくよくよ考えても役に立たない。"]],"dwindle":[["Support for the policy dwindled as costs rose.","費用が上がるにつれてその政策への支持は減っていった。"],["The candle's flame dwindled and finally went out.","ろうそくの炎は小さくなり、ついに消えた。"]],"dynamic":[["Language is a dynamic system that keeps changing over time.","言語は時間とともに変化し続ける動的な体系である。"],["The city has a dynamic economy and a young population.","その都市は活気ある経済と若い人口を持つ。"]],"eager":[["He is an eager student who always asks questions.","彼はいつも質問する熱心な生徒だ。"],["The students were eager to hear the results of the experiment.","生徒たちはその実験の結果を聞きたくてたまらなかった。"]],"earn":[["He earns enough money to support his family.","彼は家族を養うのに十分なお金を稼いでいる。"],["She earned the respect of her colleagues through hard work.","彼女は努力によって同僚の尊敬を得た。"]],"ease":[["The ease of online shopping has changed how people buy things.","オンラインで買い物をする容易さは、人々の購入の仕方を変えた。"],["Medicine can ease the pain, but it cannot cure the disease.","薬は痛みを和らげられるが、病気を治すことはできない。"]],"ebullient":[["The ebullient mood at the party lifted everyone's spirits.","パーティーの活気に満ちた雰囲気はみんなの気分を高めた。"],["The ebullient crowd danced in the streets all night.","熱気あふれる群衆は一晩中通りで踊った。"]],"eccentric":[["The eccentric professor always wore two different socks.","その風変わりな教授はいつも左右違う靴下をはいていた。"],["The village knew him as a harmless eccentric who talked to trees.","村では彼は木に話しかける害のない変わり者として知られていた。"]],"ecology":[["Ecology is the study of how living things relate to their environment.","生態学は生き物が環境とどう関わるかを研究する学問だ。"],["Pollution has seriously damaged the ecology of the lake.","汚染は湖の生態系に深刻な被害を与えた。"]],"edifice":[["The tall stone edifice dominates the center of the town.","その背の高い石造りの大建築物が町の中心にそびえている。"],["The edifice of the old empire finally collapsed.","古い帝国の大きな体制はついに崩壊した。"]],"effect":[["Lack of sleep has a serious effect on memory.","睡眠不足は記憶に深刻な影響を及ぼす。"],["Scientists study the cause and effect of climate change.","科学者たちは気候変動の原因と結果を研究している。"]],"efficient":[["Public transport is a more efficient way to move people.","公共交通は人々を移動させるより効率的な方法だ。"],["She is an efficient manager who always meets deadlines.","彼女はいつも締め切りを守る有能な管理者だ。"]],"effort":[["Great effort is needed to learn a foreign language.","外国語を習得するには大変な努力が必要だ。"],["Their effort to save the old theater finally succeeded.","古い劇場を救おうとする彼らの試みはついに成功した。"]],"elaborate":[["The thieves had made an elaborate plan to enter the bank.","泥棒たちは銀行に侵入するための入念な計画を立てていた。"],["Could you elaborate on your proposal?","あなたの提案についてもっと詳しく説明していただけますか。"]],"elderly":[["An elderly woman helped me find the way to the station.","年配の女性が駅への道を見つけるのを手伝ってくれた。"],["The elderly often feel isolated in big cities.","高齢者は大都市で孤立を感じることが多い。"]],"element":[["Trust is an essential element of any good relationship.","信頼はあらゆる良好な関係の不可欠な要素だ。"],["Oxygen is the most common element in the Earth's crust.","酸素は地殻で最も多い元素だ。"]],"eligible":[["Citizens over eighteen are eligible to vote.","18歳を超える市民には投票する資格がある。"],["She is not eligible for the job because she lacks experience.","彼女は経験が足りないので、その職に適格ではない。"]],"elucidate":[["The study helps elucidate how the brain stores memories.","その研究は脳がどのように記憶を蓄えるかの解明に役立つ。"],["The author elucidates her argument with clear examples.","著者は明快な例を使って自分の主張を明らかにしている。"]],"elusive":[["True happiness often seems elusive to those who chase it.","幸福は追い求める人にはしばしばとらえどころなく思える。"],["The elusive thief escaped from the police once again.","つかまえにくいその泥棒は、またしても警察から逃げおおせた。"]],"embark":[["She embarked on a new career in journalism.","彼女はジャーナリズムという新しい経歴に乗り出した。"],["The passengers embarked at noon and the ship left the port.","乗客は正午に乗船し、船は港を出た。"]],"embody":[["The new law embodies the ideals of equality and freedom.","新しい法律は平等と自由の理想を具体化している。"],["The new building embodies the values of the community.","その新しい建物は地域社会の価値観を体現している。"]],"embrace":[["The mother embraced her son warmly at the airport.","母親は空港で息子を温かく抱きしめた。"],["The company has embraced new technology.","その会社は新しい技術を積極的に取り入れた。"],["The term embraces a wide range of different activities.","その用語は幅広いさまざまな活動を含んでいる。"]],"emission":[["The country aims to cut carbon emissions by half.","その国は炭素排出量を半減させることを目指している。"],["Emissions from the factory have polluted the nearby river.","その工場の排出物が近くの川を汚染した。"]],"empathy":[["Good doctors show empathy toward their patients.","良い医師は患者に共感を示す。"],["Readers develop deep empathy with the main character of the novel.","読者はその小説の主人公に深く感情移入する。"]],"emphasis":[["He spoke slowly, with emphasis on each key word.","彼は重要な語の一つひとつを強調して、ゆっくり話した。"],["The school places great emphasis on foreign language education.","その学校は外国語教育に大きな重点を置いている。"]],"employ":[["The factory employs over a thousand local people.","その工場は千人以上の地元の人々を雇用している。"],["Researchers employed a new method to analyze the data.","研究者たちはデータを分析するために新しい方法を用いた。"]],"empower":[["The law empowers local governments to set their own taxes.","その法律は地方自治体に独自に課税する権限を与えている。"],["Education empowers women to make their own decisions.","教育は女性が自分で決断する力を与える。"]],"enact":[["Parliament enacted a law to protect personal data.","議会は個人情報を保護する法律を制定した。"],["The students enacted a famous scene from the play.","生徒たちはその劇の有名な場面を演じた。"]],"enclose":[["A high wall encloses the garden on all sides.","高い壁が庭を四方から囲んでいる。"],["Please enclose a photograph with your application form.","申込用紙に写真を1枚同封してください。"]],"encompass":[["A thick forest encompasses the lake on three sides.","深い森が湖を三方から取り囲んでいる。"],["The course encompasses history, politics and economics.","その講座は歴史、政治、経済を包括している。"]],"encounter":[["We encountered a herd of deer on the mountain path.","私たちは山道でシカの群れに出くわした。"],["Travelers often encounter unexpected problems abroad.","旅行者は海外でしばしば予期せぬ問題に直面する。"],["The sailors told stories of their encounter with a huge whale.","船乗りたちは巨大なクジラとの遭遇について語った。"]],"encourage":[["Her parents encouraged her when she failed the exam.","試験に落ちたとき、両親は彼女を励ました。"],["Teachers should encourage students to ask questions.","教師は生徒が質問するよう促すべきだ。"]],"endeavor":[["Scientific endeavor requires patience and curiosity.","科学的な取り組みには忍耐と好奇心が必要だ。"],["We will endeavor to answer all of your questions.","私たちはあなたのすべての質問に答えるよう努力します。"]],"endorse":[["Several leading doctors endorsed the new treatment.","著名な医師が数人、その新しい治療法を支持した。"],["A well-known chef endorsed the new cookbook.","有名なシェフがその新しい料理本を推薦した。"],["The bank manager endorsed the check before paying it.","銀行の支店長は支払う前にその小切手に裏書きをした。"]],"endow":[["Nature has endowed her with a remarkable memory.","彼女は生まれつき並外れた記憶力に恵まれている。"],["A wealthy businessman endowed the university with a million dollars.","裕福な実業家が大学に100万ドルを寄付した。"]],"endure":[["The villagers endured months of drought.","村人たちは数か月の干ばつに耐えた。"],["These ancient traditions have endured for over a thousand years.","これらの古い伝統は千年以上も持ちこたえてきた。"]],"enforce":[["The new rules will be enforced from next April.","新しい規則は来年4月から施行される。"],["Parents should not enforce their own beliefs on their children.","親は自分の信念を子どもに強制すべきではない。"]],"engage":[["Many young people are engaged in volunteer work.","多くの若者がボランティア活動に従事している。"],["A good teacher knows how to engage students' attention.","良い教師は生徒の注意を引く方法を知っている。"],["He got engaged to his college classmate last spring.","彼は昨年の春、大学の同級生と婚約した。"]],"enigma":[["The cause of the explosion remains an enigma.","その爆発の原因はいまだ謎のままだ。"],["The artist remained an enigma even to his closest friends.","その芸術家は最も親しい友人たちにとってさえ不可解な人物のままだった。"]],"enmity":[["He felt no enmity toward the people who had hurt him.","彼は自分を傷つけた人々に敵意を抱かなかった。"],["Deep enmity between the two tribes led to constant fighting.","二つの部族の間の根深い憎悪が絶え間ない争いを招いた。"]],"enrich":[["Reading widely can enrich your vocabulary and imagination.","幅広く読書すると語彙と想像力が豊かになる。"],["Studying abroad enriched the quality of her education.","留学は彼女の教育の質を向上させた。"]],"ensue":[["A heated debate ensued after the announcement.","発表の後、白熱した議論が続いた。"],["Serious problems may ensue if the rules are ignored.","規則が無視されれば、結果として深刻な問題が生じうる。"]],"ensure":[["Regular checks ensure that the machines are safe to use.","定期点検によって機械が安全に使えることが保証される。"],["Please ensure that all the doors are locked before you leave.","出かける前に、すべてのドアに確実に鍵をかけてください。"]],"enterprise":[["Small enterprises play a key role in local economies.","小企業は地域経済で重要な役割を果たしている。"],["The explorers set out on a daring enterprise across the desert.","探検家たちは砂漠を横断する大胆な事業に乗り出した。"]],"enthusiasm":[["The new teacher is full of enthusiasm for her work.","新任の先生は仕事への熱意にあふれている。"],["Her enthusiasm for tennis began when she was only five.","彼女のテニスへの熱中は、わずか5歳のときに始まった。"]],"entitle":[["Employees are entitled to at least ten days of paid leave.","従業員は少なくとも10日間の有給休暇を取る権利がある。"],["The book is entitled A Brief History of Time.","その本は『時間の簡潔な歴史』と題されている。"]],"entrench":[["Years of corruption have entrenched bad habits in the department.","長年の汚職が、その部署に悪い習慣を定着させた。"],["Both sides entrenched themselves in their positions and refused to compromise.","双方とも自分たちの立場を固守し、妥協を拒んだ。"]],"environment":[["Plastic waste is a serious threat to the marine environment.","プラスチックごみは海洋環境への深刻な脅威だ。"],["Children learn best in a calm and supportive environment.","子どもは穏やかで協力的な環境で最もよく学ぶ。"]],"envision":[["Few people envisioned how quickly technology would change life.","技術が生活をどれほど急速に変えるか思い描いた人はほとんどいなかった。"],["It is hard to envision life without electricity.","電気のない生活を想像するのは難しい。"]],"ephemeral":[["Fame can be ephemeral, vanishing as quickly as it came.","名声ははかないもので、来たときと同じくらいすぐ消えうる。"],["The ephemeral beauty of cherry blossoms moves many Japanese people.","桜のつかの間の美しさは多くの日本人の心を打つ。"]],"epidemic":[["The epidemic spread rapidly through the crowded city.","その伝染病は人口密集都市で急速に広がった。"],["A dangerous epidemic of online fraud is spreading among young people.","オンライン詐欺の危険な流行が若者の間に広がっている。"]],"equal":[["All citizens should have equal access to education.","すべての市民が教育を平等に受けられるべきだ。"],["No other player can equal her skill on the court.","コート上で彼女の技術に匹敵する選手は他にいない。"]],"equilibrium":[["The market tends to return to a state of equilibrium.","市場は均衡状態に戻る傾向がある。"],["Meditation helps her keep her emotional equilibrium in stressful times.","瞑想は、ストレスの多い時期に彼女が心の平静を保つのに役立つ。"]],"equip":[["Every classroom is equipped with a projector.","どの教室にもプロジェクターが備えられている。"],["The soldiers were equipped with warm clothes and heavy boots.","兵士たちは暖かい衣類と重い長靴を装備していた。"]],"equitable":[["The group seeks a more equitable distribution of wealth.","そのグループは富のより公平な分配を求めている。"],["The court ordered an equitable settlement for both parties.","裁判所は双方に公正な和解を命じた。"]],"equivalent":[["A mile is equivalent to about 1.6 kilometers.","1マイルは約1.6キロメートルに相当する。"],["This word has no exact equivalent in English.","この語には英語に正確に対応する同等のものがない。"]],"erode":[["Constant rain has eroded the hillside over the years.","絶え間ない雨が何年もかけて山腹を侵食した。"],["Constant criticism can erode a child's confidence.","絶え間ない批判は子どもの自信を徐々に損なう。"]],"erratic":[["The patient's heartbeat became erratic during the night.","患者の心拍は夜の間に不規則になった。"],["His erratic behavior worried his friends and family.","彼の気まぐれな行動は友人や家族を心配させた。"]],"erupt":[["The volcano erupted without warning and covered the town in ash.","火山は突然噴火し、町を灰で覆った。"],["Violence erupted in the city after the election results.","選挙結果の後、市内で暴力が突発した。"]],"escalate":[["The conflict escalated into a full-scale war.","その衝突は全面戦争へと拡大した。"],["Tensions escalated quickly after the two leaders exchanged angry words.","二人の指導者が怒りの言葉を交わした後、緊張は急速に悪化した。"]],"esoteric":[["The lecture was too esoteric for most of the audience.","その講義は聴衆の大半には難解すぎた。"],["Esoteric jokes about mathematics amused only a few of the guests.","数学に関する一部の人にしか分からない冗談は、客の何人かだけを笑わせた。"]],"espouse":[["The senator espoused a policy of free trade.","その上院議員は自由貿易政策を支持した。"],["In the old story, the prince espoused a farmer's daughter.","昔話の中で、王子は農夫の娘と結婚した。"]],"essence":[["The essence of democracy is the equal voice of every citizen.","民主主義の本質はすべての市民の平等な発言権にある。"],["Add a few drops of vanilla essence to the cake mixture.","ケーキの生地にバニラエッセンスを数滴加えなさい。"]],"essential":[["Sleep is essential for good health.","睡眠は健康に不可欠だ。"],["The essential difference between the two theories is their view of time.","その二つの理論の本質的な違いは時間に対する見方にある。"]],"establish":[["The university was established in 1868.","その大学は1868年に設立された。"],["The company worked hard to establish a good reputation.","その会社は良い評判を確立するために懸命に努力した。"]],"esteem":[["The professor is held in high esteem by her students.","その教授は学生から非常に尊敬されている。"],["Our school esteems honesty above all other virtues.","わが校は何よりも誠実さを尊重している。"]],"estimate":[["Experts estimate that the cost will exceed one billion yen.","専門家はその費用が10億円を超えると見積もっている。"],["The builder gave us an estimate of two million yen.","建築業者は私たちに200万円の見積もりを出した。"]],"eternal":[["People have long dreamed of eternal youth.","人々は長い間、永遠の若さを夢見てきた。"],["His eternal complaints about the weather tired everyone out.","天気に対する彼の絶え間ない文句に、だれもがうんざりした。"]],"ethnic":[["The country is home to dozens of ethnic groups.","その国には数十の民族集団が暮らしている。"],["The festival offers ethnic food and traditional music from many regions.","その祭りでは多くの地域の民族特有の料理や伝統音楽が楽しめる。"]],"evacuate":[["Firefighters evacuated the hospital as the flames came closer.","炎が近づくと、消防士たちは病院にいた人々を避難させた。"],["Residents were told to evacuate immediately because of the tsunami warning.","津波警報のため、住民はただちに避難するよう指示された。"]],"evaporate":[["Water evaporates faster in hot and dry weather.","水は暑くて乾燥した天気だと速く蒸発する。"],["His anger evaporated as soon as he saw her smile.","彼女の笑顔を見たとたん、彼の怒りは消え去った。"]],"eventual":[["The eventual outcome of the talks remains unclear.","その協議の最終的な結果はまだ不明だ。"],["Poor planning led to the eventual failure of the whole project.","ずさんな計画が、結果として起こったプロジェクト全体の失敗を招いた。"]],"evidence":[["There is no scientific evidence to support this claim.","この主張を裏づける科学的証拠はない。"],["Is there any evidence for your belief that prices will fall?","物価が下がるというあなたの考えに根拠はありますか。"]],"evolve":[["Human language evolves constantly as society and culture change.","人間の言語は、社会や文化の変化とともに絶えず進化する。"],["The small shop evolved into a large international company.","その小さな店は徐々に発展して大きな国際企業になった。"]],"examine":[["Scientists examined the soil samples for traces of metal.","科学者たちは金属の痕跡がないか土壌サンプルを調べた。"],["Doctors examined the patient for signs of infection.","医師たちは感染の兆候がないか患者を診察した。"]],"exceptional":[["The young pianist showed exceptional talent.","その若いピアニストは並外れた才能を示した。"],["Schools may allow late entry only in exceptional circumstances.","学校は例外的な事情がある場合に限り、遅れての入場を認める。"]],"excess":[["An excess of sugar in the diet can lead to illness.","食事での糖分の過剰摂取は病気につながりうる。"],["Remove the excess water from the vegetables before cooking.","調理する前に、野菜の余分な水分を取り除きなさい。"]],"exchange":[["Students from both countries exchange ideas online.","両国の学生がオンラインで意見を交換している。"],["The two leaders had a frank exchange of views.","両首脳は率直な意見のやりとりを行った。"]],"exclaim":[["He exclaimed 'Look out!' as the car came toward us.","車がこちらに向かってくると、彼は『危ない!』と叫んだ。"],["She exclaimed that she had never seen such a beautiful view.","彼女はこんなに美しい景色は見たことがないと大声で言った。"]],"exclude":[["Foreign students are excluded from this scholarship program.","外国人留学生はこの奨学金制度から除外されている。"],["The club excluded women from membership for many years.","そのクラブは長年、女性を会員から締め出していた。"]],"exclusive":[["The company has the exclusive right to いで、共通の基盤を見いだすのは難しかった。"],["Climbers must endure extreme cold at the top of the mountain.","登山者は山頂で極度の寒さに耐えなければならない。"]],"exuberant":[["The exuberant children ran through the park shouting with joy.","元気いっぱいの子どもたちは喜びの声をあげながら公園を駆け抜けた。"],["The tropical forest is known for its exuberant vegetation.","その熱帯林は豊富な植生で知られている。"]],"fabric":[["She chose a soft cotton fabric for the curtains.","彼女はカーテン用に柔らかい綿の布地を選んだ。"],["The region is famous for its traditional woven fabrics and fine silk.","その地域は伝統的な織物と上質な絹で有名だ。"],["The fabric of society depends on trust between citizens.","社会の構造は市民同士の信頼に依存している。"]],"fabricate":[["The witness was accused of fabricating evidence against the defendant.","その証人は被告に不利な証拠をでっち上げたとして非難された。"],["The factory fabricates steel parts for cars and airplanes.","その工場は自動車や飛行機向けの鋼鉄部品を製造している。"]],"facade":[["The museum's marble facade faces the main square.","その美術館の大理石の正面は中央広場に面している。"],["The government's friendly facade hid a ruthless desire for control.","政府の友好的な見せかけは、支配への冷酷な欲望を隠していた。"],["Behind his cheerful facade, he was deeply unhappy.","陽気なうわべの裏で、彼は深く不幸だった。"]],"facet":[["The diamond's many facets sparkle in the light.","そのダイヤモンドの多くの面が光を受けて輝く。"],["Every facet of the problem needs to be examined carefully.","その問題のあらゆる側面を注意深く検討する必要がある。"]],"facetious":[["His facetious remarks were out of place at the funeral.","彼のふざけた発言は葬儀の場にふさわしくなかった。"],["He gave a facetious answer to the reporter's serious question.","彼は記者の真剣な質問に冗談めかした答えを返した。"]],"factor":[["Economic factors played a major role in the decision.","経済的要因がその決定に大きな役割を果たした。"],["Humor is an important factor in making a speech memorable.","ユーモアはスピーチを記憶に残るものにする重要な要素だ。"]],"faculty":[["Sight is the faculty that we depend on most.","視覚は私たちが最も頼りにしている能力だ。"],["She teaches in the faculty of law at the university.","彼女は大学の法学部で教えている。"],["The faculty voted to change the graduation requirements.","教授陣は卒業要件の変更を決議した。"]],"failure":[["The failure of the first experiment taught the team a valuable lesson.","最初の実験の失敗はチームに貴重な教訓を与えた。"],["Engine failure forced the pilot to land in an open field.","エンジンの故障により、パイロットは野原に着陸せざるを得なかった。"],["The failure to pay the debt led to legal action.","債務の不履行は法的措置を招いた。"]],"fallacy":[["It is a common fallacy that money brings happiness.","金で幸せが買えるというのはよくある誤った考えだ。"],["The argument contains a logical fallacy that weakens its conclusion.","その議論には結論を弱める論理的誤謬が含まれている。"]],"familiar":[["Few students are familiar with the history of this old school.","この古い学校の歴史をよく知っている生徒はほとんどいない。"],["A familiar face appeared in the crowd, and she smiled.","群衆の中に見慣れた顔が現れ、彼女は微笑んだ。"]],"famine":[["A severe famine forced thousands to leave their villages.","深刻な飢饉により数千人が村を離れざるを得なかった。"],["Many large cities face a famine of affordable housing.","多くの大都市は手頃な住宅の深刻な不足に直面している。"]],"fanatic":[["The coach was a fanatic about physical fitness.","そのコーチは体力づくりに熱狂的だった。"],["The religious fanatic attacked the peaceful gathering in the square.","その宗教的な狂信者は広場の平和な集会を襲撃した。"]],"fashion":[["Short skirts went out of fashion in the late 1970s.","短いスカートは1970年代後半に流行遅れになった。"],["She arranged the files in a systematic fashion.","彼女は書類を体系的な方法で整理した。"],["The cathedral was built in the Gothic fashion in the thirteenth century.","その大聖堂は13世紀にゴシック様式で建てられた。"]],"fastidious":[["Her fastidious father rejected every dish the waiter brought him.","気難しい彼女の父は、ウェイターが持ってきた料理をすべて突き返した。"],["The editor is fastidious about details and checks every comma.","その編集者は細部にうるさく、すべてのコンマを確認する。"],["She is so fastidious that she washes her hands every hour.","彼女はとても潔癖で、1時間おきに手を洗う。"]],"fate":[["The villagers accepted their fate with quiet dignity.","村人たちは静かな威厳をもって自らの運命を受け入れた。"],["Many ancient stories describe the hero's fate as unavoidable from birth.","多くの古い物語は、英雄の宿命を生まれたときから避けられないものとして描く。"]],"fathom":[["No one could fathom his true intentions behind the sudden offer.","誰も、その突然の申し出の裏にある彼の真意を見抜けなかった。"],["I cannot fathom why he made such a foolish decision.","なぜ彼がそんな愚かな決断をしたのか理解できない。"]],"fatigue":[["Chronic fatigue can make it hard to concentrate at work.","慢性的な疲労は仕事での集 ellows.","彼は同輩のだれよりも早く昇進した。"],["She was admired by her fellow students for her honesty.","彼女は正直さゆえに同級生たちから敬われた。"]],"ferment":[["Grape juice ferments into wine when yeast is added.","ブドウジュースは酵母を加えると発酵してワインになる。"],["Rumors of layoffs fermented unrest among the already anxious employees.","人員削減のうわさは、すでに不安を抱えていた従業員たちを動揺させた。"],["The country was in a state of political ferment.","その国は政治的騒乱の状態にあった。"]],"fertile":[["The river valley has fertile soil ideal for growing rice.","その川の谷は稲作に理想的な肥沃な土壌を持つ。"],["A fertile female fish can lay thousands of eggs each year.","多産の雌の魚は毎年何千もの卵を産むことができる。"],["She has a fertile mind and always comes up with new ideas.","彼女は創造力に富んだ頭脳の持ち主で、いつも新しい案を思いつく。"]],"fervent":[["She is a fervent supporter of animal rights.","彼女は動物の権利を熱烈に支持している。"],["He is a fervent reader who finishes two books every week.","彼は毎週2冊の本を読み終える熱心な読書家だ。"]],"fickle":[["Public opinion can be fickle and change within a week.","世論は気まぐれで、1週間のうちに変わることもある。"],["The fickle weather in spring changes several times a day.","春の変わりやすい天気は一日に何度も変化する。"]],"fiction":[["Truth is sometimes stranger than fiction.","事実は時に小説よりも奇なり。"],["His story about meeting a celebrity turned out to be pure fiction.","有名人に会ったという彼の話は完全な作り話だった。"],["The film blurs the line between fact and fiction.","その映画は事実と虚構の境界をあいまいにしている。"]],"fidelity":[["The translation was praised for its fidelity to the original.","その翻訳は原文への忠実さが高く評価された。"],["The new speakers reproduce music with remarkable fidelity.","その新しいスピーカーは驚くほどの正確さで音楽を再現する。"],["The ring is a symbol of fidelity between husband and wife.","その指輪は夫婦間の貞節の象徴である。"]],"fierce":[["Competition among the companies has become increasingly fierce.","その企業間の競争はますます激しくなっている。"],["The villagers feared the fierce wolves that roamed the hills.","村人たちは丘をうろつく獰猛なオオカミを恐れていた。"]],"figure":[["Sales figures for this year are higher than expected.","今年の売上の数字は予想より高かった。"],["She is a leading figure in the field of modern architecture.","彼女は現代建築の分野における有力な人物だ。"],["A tall figure appeared at the end of the dark corridor.","背の高い人の姿が暗い廊下の端に現れた。"],["I figure we should leave early to avoid the traffic.","渋滞を避けるため早めに出発したほうがいいと私は考える。"]],"finance":[["The minister is responsible for managing the nation's finances.","その大臣は国の財政を管理する責任を負っている。"],["She studied finance at university before joining a bank.","彼女は大学で金融を学んだのち銀行に入った。"],["The city plans to finance the new bridge by issuing bonds.","市は債券を発行して新しい橋の資金を調達する計画だ。"]],"fiscal":[["The government faces a large fiscal deficit this year.","政府は今年、巨額の財政赤字に直面している。"],["The company's fiscal year ends in March.","その会社の会計年度は3月に終わる。"]],"flagrant":[["The referee ignored the flagrant fouls committed by the home team.","審判はホームチームの目に余る反則を見逃した。"],["The decision was a flagrant violation of human rights.","その決定は人権のあからさまな侵害だった。"]],"flamboyant":[["The singer was known for his flamboyant costumes.","その歌手は派手な衣装で知られていた。"],["The mayor's flamboyant parties are the talk of the town.","市長の華やかなパーティーは町の語り草になっている。"]],"flaw":[["The study was rejected because of a serious flaw in its method.","その研究は方法に重大な欠陥があるとして却下された。"],["Pride is his greatest flaw, and it often causes trouble.","プライドの高さが彼の最大の欠点で、しばしばトラブルを招く。"],["Inspectors found several flaws in the safety procedures at the plant.","検査官はその工場の安全手順にいくつかの不備を見つけた。"]],"fledgling":[["The fledgling writer sent her first story to many magazines.","駆け出しの作家は最初の作品を多くの雑誌に送った。"],["The fledgling company struggled to compete with larger rivals.","その新興企業は大手のライバルに対抗するのに苦労した。"],["The fledgling left the nest and flew to a nearby tree.","巣立ちの雛は巣を離れ、近くの木へ飛んでいった。"]],"flee":[["The thief fled the scene as soon as the alarm sounded.","警報が鳴るとすぐに泥棒は現場から逃げた。"],["Thousands of people fled the country to escape the war.","何千人もの人々が戦争を逃れるために国を脱出した。"]],"flexible":[["We need a more flexible approach to working hours.","我々は労働時間に対しもっと柔軟な取り組みを必要としている。"],["Our manager is flexible and lets us change shifts when necessary.","うちの上司は融通のきく人で、必要なときにシフトの変更を認めてくれる。"],["Thin plastic is flexible enough to be rolled into a tube.","薄いプラスチックは曲げやすく、筒状に丸めることができる。"]],"flood":[["Heavy rain caused a flood that destroyed many homes.","大雨が洪水を引き起こし、多くの家が流された。"],["A flood of complaints arrived after the new policy was announced.","新方針の発表後、苦情が殺到した。"],["The river floods almost every spring when the snow melts.","その川は雪解けの春になるとほぼ毎年氾濫する。"]],"flourish":[["Small businesses flourish when the local economy is strong.","地域経済が堅調なとき、小規模事業は繁栄する。"],["Tropical plants flourish in the warm, humid climate of the island.","熱帯植物は島の温暖で湿潤な気候の中で繁茂する。"],["The magician flourished a bright scarf before the audience.","手品師は観客の前で鮮やかなスカーフを振り回した。"]],"flout":[["Some drivers flout the law by ignoring speed limits.","制限速度を無視して法を軽んじる運転手もいる。"],["The young players flouted the coach's instructions and played their own way.","若い選手たちはコーチの指示を無視して自分たちのやり方でプレーした。"]],"fluent":[["He is fluent in three languages, including Japanese.","彼は日本語を含む3言語を流暢に話す。"],["She became fluent in French after living in Paris for two years.","彼女はパリで2年暮らした後、フランス語がすらすら話せるようになった。"]],"fluid":[["Blood is a fluid that carries oxygen to every part of the body.","血液は酸素を体のあらゆる部分に運ぶ流動体である。"],["The situation in the region remains fluid and unpredictable.","その地域の情勢は依然として流動的で予測できない。"]],"focus":[["The photographer focused the lens on the bird sitting on the branch.","写真家は枝にとまった鳥にレンズの焦点を合わせた。"],["I can't focus on my homework when the television is on.","テレビがついていると宿題に集中できない。"],["The economy remains the main focus of the election campaign.","経済は依然として選挙戦の主な焦点である。"]],"foment":[["The article was accused of fomenting racial hatred.","その記事は人種的憎悪を扇動したとして非難された。"],["Poor living conditions can foment resentment toward the government.","劣悪な生活環境は政府への憤りを助長しかねない。"]],"forbid":[["The school rules forbid students from using phones in class.","校則は生徒が授業中に携帯電話を使うことを禁じている。"],["My parents forbid me to stay out late on school nights.","両親は平日の夜に遅くまで外出することを私に許さない。"]],"forecast":[["The weather forecast predicts snow for the whole weekend.","天気予報では週末中ずっと雪が降る見込みだ。"],["Economists issued a gloomy forecast for next year's growth.","経済学者たちは来年の成長について悲観的な予測を発表した。"],["Experts forecast that unemployment will fall slowly over the next decade.","専門家は今後10年で失業率がゆっくり低下すると予測している。"]],"foremost":[["Her foremost concern was the safety of the children.","彼女の最も重要な関心事は子どもたちの安全だった。"],["She is one of the foremost experts in marine biology.","彼女は海洋生物学の第一人者の一人だ。"]],"foresee":[["No one could have foreseen such a rapid change in technology.","これほど急激な技術の変化を誰も予見できなかっただろう。"],["Few analysts could foresee how the market would develop.","市場がどう展開するかを見通せたアナリストはほとんどいなかった。"]],"forestall":[["The bank acted quickly to forestall a financial crisis.","銀行は金融危機を未然に防ぐため迅速に動いた。"],["The mayor met the protesters early to forestall their demands.","市長は抗議者たちの要求に先手を打つため早めに面会した。"]],"forfeit":[["Anyone caught cheating will forfeit the right to take the exam.","不正行為が発覚した者は受験する権利を失う。"],["Property bought with stolen money may be forfeited to the state.","盗まれた金で買った財産は国に没収されることがある。"],["Loss of privacy is the forfeit that famous people must pay.","プライバシーの喪失は有名人が払わねばならない代償である。"]],"forge":[["The two nations worked to forge a stronger partnership.","両国はより強固な協力関係を築くために努力した。"],["He was arrested for forging his employer's signature on checks.","彼は小切手に雇い主の署名を偽造したとして逮捕された。"],["The blacksmith forged a sword from a single piece of iron.","鍛冶屋は一本の鉄から剣を鍛造した。"]],"former":[["The former president gave a speech at the university.","前大統領がその大学で講演を行った。"],["The former factory was turned into a shopping center.","元工場だった建物はショッピングセンターに改装された。"],["Of the two options, the former seems far more practical.","2つの案のうち、前者のほうがはるかに現実的に思える。"]],"formulate":[["Students should learn to formulate their ideas in a logical way.","生徒は自分の考えを論理的に体系立てて述べられるようになるべきだ。"],["Newton formulated the laws of motion in a mathematical form.","ニュートンは運動の法則を数式の形で公式化した。"],["The government formulated a new plan to reduce energy use.","政府はエネルギー使用を減らす新たな計画を策定した。"]],"forthright":[["She was forthright about her doubts concerning the plan.","彼女はその計画に対する疑念を率直に述べた。"],["I appreciate your forthright advice, even when it is hard to hear.","聞くのがつらいときでも、あなたの遠慮のない助言に感謝している。"]],"fortuitous":[["Their meeting was entirely fortuitous, not planned.","彼らの出会いは計画されたものではなく、まったくの偶然だった。"],["A fortuitous encounter with a stranger changed the course of her life.","思いがけない見知らぬ人との出会いが彼女の人生の流れを変えた。"]],"fortunate":[["We were fortunate to find a hotel on such short notice.","急な話だったのにホテルが見つかって幸運だった。"],["Children in fortunate families rarely worry about their daily meals.","恵まれた家庭の子どもたちは日々の食事を心配することはめったにない。"]],"fortune":[["He made a fortune by investing in technology companies.","彼はテクノロジー企業への投資で財を成した。"],["Some people believe that fortune, not effort, decides who succeeds.","成功するかどうかを決めるのは努力ではなく運だと考える人もいる。"],["By good fortune, no one was injured in the accident.","幸運にも、その事故でけが人は出なかった。"]],"forum":[["The internet has become a forum for public debate.","インターネットは公開討論の場となっている。"],["The university will hold a forum on climate change next week.","大学は来週、気候変動に関するフォーラムを開催する。"]],"foster":[["The program aims to foster creativity in young children.","そのプログラムは幼児の創造性を育むことを目指している。"],["The couple fostered three children over the past ten years.","その夫婦は過去10年間に3人の子どもを養育した。"]],"fraction":[["Only a fraction of the budget was spent on education.","予算のごく一部しか教育に使われなかった。"],["Write the answer as a fraction in its simplest form.","答えを最も簡単な形の分数で書きなさい。"],["Only fractions of the ancient manuscript survived the fire.","その古文書はほんの断片しか火事を免れなかった。"]],"fractious":[["The tired child grew fractious and refused to eat dinner.","疲れた子どもは怒りっぽくなり、夕食を食べるのを拒んだ。"],["The fractious committee failed to reach an agreement.","その手に負えない委員会は合意に至れなかった。"]],"fragment":[["Archaeologists found fragments of pottery near the river.","考古学者たちは川の近くで陶器の破片を見つけた。"],["She could recall only fragments of the conversation the next day.","彼女は翌日、会話のほんの断片しか思い出せなかった。"]],"frame":[["The report provides a frame for discussing climate policy.","その報告書は気候政策を議論するための枠組みを提供している。"],["The frame of the house was made of steel and timber.","その家の骨組みは鋼鉄と木材でできていた。"],["She framed the old photograph and hung it above the fireplace.","彼女は古い写真を額の枠にはめ、暖炉の上に掛けた。"]],"framework":[["The treaty set up a legal framework for protecting the sea.","その条約は海洋を保護するための法的枠組みを定めた。"],["The framework of the old bridge was made of iron beams.","その古い橋の骨組みは鉄の梁でできていた。"]],"fraud":[["He was arrested for credit card fraud last month.","彼は先月クレジットカード詐欺で逮捕された。"],["The election results were canceled after reports of widespread fraud.","広範な不正行為が報告されたため、選挙結果は取り消された。"]],"frenzy":[["The news sent the crowd into a frenzy of excitement.","そのニュースは群衆を熱狂の渦に巻き込んだ。"],["In a frenzy of anger, he smashed the vase against the wall.","怒りに逆上し、彼は花瓶を壁にたたきつけた。"]],"frequent":[["Frequent exercise can reduce the risk of heart disease.","頻繁に運動すると心臓病のリスクを下げられる。"],["Power cuts are frequent in this region during the rainy season.","この地域では雨季に停電がよくある。"]],"frontier":[["Soldiers guarded the frontier between the two countries day and night.","兵士たちは昼夜を問わず両国の国境を警備した。"],["In the nineteenth century, settlers moved west to farm the frontier.","19世紀、入植者たちは辺境の地を耕すために西へ移動した。"],["The research is pushing the frontiers of medical science.","その研究は医学の最先端を押し広げている。"]],"frugal":[["He is frugal with his money and rarely buys anything new.","彼はお金を倹約し、新しい物をめったに買わない。"],["Their frugal lifestyle allowed them to save for retirement.","質素な暮らしぶりのおかげで彼らは老後資金を貯められた。"]],"frustrate":[["Long delays at the airport frustrated many passengers.","空港での長い遅延は多くの乗客をいらだたせた。"],["A lack of funds frustrated their plan to build a school.","資金不足は学校を建てる彼らの計画を挫折させた。"]],"fuel":[["Rising fuel prices have forced many airlines to cut flights.","燃料価格の高騰で多くの航空会社が減便を余儀なくされた。"],["The unfair decision added fuel to the public's anger.","その不公平な決定は世間の怒りにさらなる刺激を与えた。"],["Workers fueled the aircraft before the early morning flight.","作業員たちは早朝の便の前に航空機に燃料を供給した。"]],"fulfill":[["Every citizen must fulfill his duty to pay taxes.","すべての市民は納税の義務を果たさなければならない。"],["The new product fulfills all the requirements of the safety standard.","その新製品は安全基準のあらゆる要件を満たしている。"],["She worked hard to fulfill her dream of becoming a doctor.","彼女は医者になるという夢を実現するために懸命に働いた。"]],"function":[["The phone has a function that translates speech in real time.","その電話には音声をリアルタイムで翻訳する機能がある。"],["The main function of the kidneys is to filter blood.","腎臓の主な働きは血液をろ過することだ。"],["The machine failed to function properly after the power cut.","停電後、その機械は正常に作動しなかった。"]],"fund":[["The government created a fund to support small businesses.","政府は中小企業を支援するための基金を設立した。"],["The school is raising funds to build a new library.","学校は新しい図書館を建てる資金を集めている。"],["The government agreed to fund the research for three more years.","政府はその研究にさらに3年間資金を出すことに同意した。"]],"furious":[["He was furious when he learned that the plan had been canceled.","計画が中止されたと知って彼は激怒した。"],["A furious storm battered the coast throughout the night.","猛烈な嵐が一晩中、海岸に打ちつけた。"]],"furthermore":[["The plan is costly; furthermore, it takes too much time.","その計画は費用がかかり、さらに時間もかかりすぎる。"],["The hotel is cheap; furthermore, it is only a minute from the station.","そのホテルは安く、その上、駅から徒歩1分だ。"]],"furtive":[["The furtive movements of the stranger made the guard suspicious.","その見知らぬ男のこそこそした動きが警備員に疑念を抱かせた。"],["They held furtive meetings late at night to avoid being noticed.","彼らは気づかれないよう、夜遅くに人目を忍ぶ会合を開いた。"]],"futile":[["It is futile to argue with someone who refuses to listen.","聞く耳を持たない人と議論しても無益だ。"],["All attempts to repair the old machine proved futile.","その古い機械を修理しようとする試みはすべて無駄に終わった。"]],"gain":[["Children gain confidence by solving problems on their own.","子どもは自力で問題を解くことで自信を得る。"],["The runner gained speed as he approached the final turn.","その走者は最後のカーブに近づくにつれ速度を増した。"],["The company reported a net gain of two million dollars.","その会社は200万ドルの純利益を報告した。"]],"galvanize":[["The new coach galvanized the tired team with an inspiring speech.","新任のコーチは心を揺さぶる演説で疲れたチームを活気づけた。"],["The success of the first experiment galvanized researchers to try again.","最初の実験の成功は研究者たちを刺激し、再挑戦させた。"]],"gamble":[["Some people gamble their whole salary at the casino every weekend.","毎週末カジノで給料をすべて賭ける人もいる。"],["She took a risk and gambled on a bold plan, and it paid off.","彼女は危険を冒して大胆な計画に賭け、それが功を奏した。"],["Investing all your savings in one company is a dangerous gamble.","貯金すべてを1社に投資するのは危険な賭けだ。"]],"gap":[["There is a wide gap between what he says and what he does.","彼の言うことと行うことの間には大きな隔たりがある。"],["The gap between rich and poor continues to widen.","貧富の格差は拡大し続けている。"],["Sunlight came through a small gap in the curtains.","カーテンの小さな隙間から日の光が差し込んだ。"]],"garner":[["The film garnered praise from critics around the world.","その映画は世界中の批評家から称賛を集めた。"],["The candidate garnered more than half of the votes.","その候補者は票の半数以上を獲得した。"]],"garrulous":[["The garrulous old man talked for hours about his youth.","そのおしゃべりな老人は若い頃のことを何時間も語り続けた。"],["The garrulous speaker gave a long and rambling speech.","多弁な講演者は長くとりとめのない話をした。"]],"gather":[["Hundreds of people gathered in front of the station.","数百人の人々が駅前に集まった。"],["Bees gather nectar from flowers and carry it back to the hive.","ミツバチは花から蜜を集めて巣に運ぶ。"],["I gather from her tone that she is not happy.","彼女の口調から、機嫌が悪いのだと推測する。"]],"gauge":[["It is hard to gauge how long the repairs will take.","修理にどれくらいかかるか見積もるのは難しい。"],["The device gauges the pressure inside the tank.","その装置はタンク内の圧力を測る。"],["Test scores are not the only gauge of a student's ability.","テストの点数は生徒の能力を測る唯一の基準ではない。"]],"gaze":[["The children gazed at the stars in silent wonder.","子どもたちは驚嘆して黙って星を見つめた。"],["The man's long gaze made her feel uncomfortable.","その男の長い凝視に彼女は居心地の悪さを感じた。"]],"gender":[["The survey asked participants to state their age and gender.","その調査は参加者に年齢と性別を答えるよう求めた。"],["Gender roles in many societies have changed greatly in recent decades.","ここ数十年で、多くの社会におけるジェンダーの役割は大きく変化した。"]],"generalize":[["It is dangerous to generalize from a single example.","一つの例から一般化するのは危険だ。"],["The author generalized the findings of many studies in a single chapter.","著者は多数の研究の結果を1章に概括した。"]],"generate":[["Wind turbines generate electricity without producing carbon dioxide.","風力タービンは二酸化炭素を出さずに電気を生み出す。"],["Friction generates heat when two surfaces rub together.","2つの表面がこすれ合うと、摩擦が熱を発生させる。"]],"generation":[["Each generation faces its own set of social problems.","どの世代もそれぞれ固有の社会問題に直面する。"],["Burning coal causes the generation of large amounts of carbon dioxide.","石炭を燃やすと大量の二酸化炭素が発生する。"]],"generic":[["The email was generic and clearly sent to hundreds of people.","そのメールは一般的な内容で、明らかに何百人もに送られていた。"],["Mammal is a generic term for animals that feed their young milk.","哺乳類は子に乳を与える動物を指す総称の語だ。"],["Generic drugs are cheaper than brand-name medicines.","ジェネリック医薬品は有名ブランドの薬より安い。"]],"generous":[["A generous donor gave the library a large sum of money.","気前のよい寄付者が図書館に多額の資金を寄付した。"],["The judge was generous to the young offender and gave him a second chance.","裁判官は若い違反者に寛大で、再起の機会を与えた。"],["The restaurant is famous for its generous portions of fresh seafood.","そのレストランは新鮮な魚介類を豊富な量で出すことで有名だ。"]],"genetic":[["Some diseases are caused by genetic factors.","一部の病気は遺伝的要因によって引き起こされる。"],["Doctors can now run a genetic test to detect the disorder.","医師は今では遺伝子検査でその疾患を発見できる。"]],"germane":[["His comments were not germane to the topic under discussion.","彼の意見は議論中の話題と関連がなかった。"],["Her question was germane, so the professor answered it fully.","彼女の質問は適切だったので、教授は十分に答えた。"]],"gesture":[["He made a friendly gesture to show he meant no harm.","彼は悪意がないことを示すため友好的な身振りをした。"],["Releasing the prisoners was a gesture of goodwill by the government.","囚人の釈放は政府の善意の意思表示だった。"],["He gestured toward the door to show that the meeting was over.","彼は会議が終わったことを示すためドアのほうを身振りで示した。"]],"gist":[["I only caught the gist of what he was saying.","私は彼の話の要点しかつかめなかった。"],["The gist of his argument is that schools need more funding.","彼の主張の趣旨は、学校にはもっと資金が必要だということだ。"]],"glance":[["A quick glance at the clock told him he was late.","時計をちらりと見て、彼は遅刻だとわかった。"],["She glanced at her watch and stood up to leave.","彼女は腕時計をちらりと見て、帰ろうと立ち上がった。"]],"glean":[["Historians glean facts from scattered letters and diaries.","歴史家は散らばった手紙や日記から事実を少しずつ集める。"],["We gleaned useful information from old newspaper articles.","私たちは古い新聞記事から有益な情報を拾い集めた。"]],"glimpse":[["I caught a glimpse of the singer as she left the hotel.","私はホテルを出る歌手の姿をちらりと見かけた。"],["Through the window, we glimpsed the sea between the trees.","窓越しに、木々の間に海が垣間見えた。"]],"global":[["The company has become a global leader in electric vehicles.","その会社は電気自動車の世界的な主導企業になった。"],["Plastic waste is now a global problem that no country can ignore.","プラスチックごみは今や、どの国も無視できない地球規模の問題だ。"]],"gloomy":[["He felt gloomy after failing the entrance examination for the second time.","彼は2度目の入試に落ちて憂鬱な気分になった。"],["The gloomy room had only one small window facing the wall.","その薄暗い部屋には壁に面した小さな窓が一つあるだけだった。"],["Experts are gloomy about the prospects for peace in the region.","専門家たちはその地域の和平の見通しについて悲観的だ。"]],"govern":[["The king governed the country wisely for more than forty years.","王は40年以上にわたり賢明に国を統治した。"],["Greed governed his every action, and he trusted no one.","欲が彼のあらゆる行動を支配し、彼は誰も信用しなかった。"],["Supply and demand govern the price of goods in a market.","需要と供給が市場の商品の価格を左右する。"]],"gradual":[["The government favors a gradual reduction of the national debt.","政府は国の債務の段階的な削減を支持している。"],["There has been a gradual improvement in air quality.","大気の質は徐々に改善されてきている。"]],"grant":[["The university granted her a scholarship to study abroad.","大学は彼女に留学のための奨学金を与えた。"],["The court granted his request to postpone the trial.","裁判所は裁判を延期するという彼の請求を認めた。"],["The research team received a grant of fifty thousand dollars.","研究チームは5万ドルの補助金を受け取った。"]],"grapple":[["Governments around the world are grappling with an aging population.","世界の政府は人口高齢化に取り組んでいる。"],["The two men grappled on the ground until police arrived.","警察が到着するまで、2人の男は地面で格闘した。"]],"grasp":[["The baby grasped her mother's finger with a tiny hand.","赤ん坊は小さな手で母親の指をつかんだ。"],["It took me a while to grasp the main idea of the lecture.","講義の要点を把握するのにしばらくかかった。"],["The topic is beyond my grasp without more background knowledge.","十分な予備知識がなければ、その話題は私の理解を超えている。"]],"gratitude":[["She sent a letter to express her gratitude for their help.","彼女は彼らの助力への感謝を伝える手紙を送った。"],["He bowed deeply to show his gratitude to the teacher.","彼は先生への感謝の気持ちを示すために深くお辞儀をした。"]],"gratuitous":[["The film was criticized for its gratuitous violence.","その映画は不必要な暴力描写を批判された。"],["The critic made gratuitous remarks about the author's private life.","その評論家は著者の私生活についていわれのない発言をした。"],["The monastery provided gratuitous lodging to travelers.","その修道院は旅人に無料の宿を提供した。"]],"gravity":[["On the moon, gravity is much weaker than on Earth.","月では、重力は地球よりはるかに弱い。"],["People did not fully understand the gravity of the situation.","人々はその事態の深刻さを十分に理解していなかった。"]],"gregarious":[["He is a gregarious man who enjoys large parties.","彼は大人数のパーティーを楽しむ社交的な男だ。"],["Gregarious animals such as sheep tend to stay in large flocks.","ヒツジのように群生する動物は大きな群れでいる傾向がある。"]],"grief":[["The whole town was filled with grief after the accident.","事故のあと、町全体が深い悲しみに包まれた。"],["Counselors help people who are struggling with grief after a death.","カウンセラーは死別後の悲嘆に苦しむ人々を支援する。"]],"grievance":[["Workers voiced their grievances about long hours and low pay.","労働者たちは長時間労働と低賃金への不満を訴えた。"],["The company set up a system for handling employee grievances.","その会社は従業員の苦情を処理する仕組みを整えた。"]],"grim":[["The doctor gave the family some grim news about his condition.","医師は彼の容態について家族に厳しい知らせを伝えた。"],["He had a grim expression and said nothing throughout dinner.","彼は陰気な表情で、夕食の間ずっと何も言わなかった。"],["The grim fight for survival left little room for mercy.","生き残りをかけた容赦のない戦いに慈悲の余地はほとんどなかった。"]],"gross":[["The country's gross domestic product rose by two percent.","その国の国内総生産は2パーセント上昇した。"],["The inspectors were shocked by the gross conditions in the kitchen.","検査官たちは台所のひどい状態に衝撃を受けた。"],["The company was fined for gross negligence in handling dangerous chemicals.","その会社は危険な化学物質の取り扱いにおけるはなはだしい過失で罰金を科された。"]],"grudge":[["She bears no grudge against those who criticized her.","彼女は自分を批判した人々に恨みを抱いていない。"],["She grudges every penny she spends on gifts.","彼女は贈り物に使うお金を1ペニーも出し惜しむ。"]],"guarantee":[["Hard work does not guarantee success, but it helps.","努力が成功を保証するわけではないが、助けにはなる。"],["The camera comes with a two-year guarantee against defects.","そのカメラには欠陥に対する2年間の保証がついている。"],["The mayor gave a guarantee that the school would stay open.","市長はその学校を閉鎖しないという確約をした。"]],"guard":[["A security guard checked every visitor at the entrance.","警備員が入口ですべての訪問者を確認した。"],["The dog guards the farm against thieves at night.","その犬は夜間、泥棒から農場を守る。"],["Doctors told the public to be on guard against the new virus.","医師たちは新しいウイルスに対して警戒するよう市民に呼びかけた。"]],"guideline":[["The ministry issued new guidelines for online education.","省はオンライン教育に関する新たな指針を出した。"],["The organization published guidelines on healthy eating for children.","その団体は子どもの健康的な食事に関するガイドラインを公表した。"]],"guile":[["The politician rose to power through guile rather than honesty.","その政治家は誠実さではなく狡猾さによって権力の座に上り詰めた。"],["The merchant used guile to cheat his customers.","その商人は客をだますためにずる賢さを用いた。"]],"guilty":[["The jury found the man guilty of fraud.","陪審員はその男を詐欺罪で有罪とした。"],["She felt guilty about forgetting her friend's birthday.","彼女は友人の誕生日を忘れて罪悪感を覚えた。"]],"gullible":[["Gullible customers were tricked into buying worthless products.","だまされやすい客たちは価値のない商品を買わされた。"],["He was too gullible to realize that the stranger was lying.","彼はお人よしすぎて、その見知らぬ男が嘘をついていると気づかなかった。"]],"habit":[["Reading before bed is a habit I developed in childhood.","寝る前に読書するのは子どもの頃に身についた習慣だ。"],["Biting your nails is a bad habit that is hard to break.","爪をかむのは直しにくい悪い癖だ。"]],"habitat":[["Destruction of habitat is the main threat to wildlife.","生息地の破壊が野生生物に対する最大の脅威だ。"],["Pollution has changed the habitat of fish living in the river.","汚染は川に住む魚の生息環境を変えてしまった。"]],"hackneyed":[["The film's plot was hackneyed and entirely predictable.","その映画の筋はありふれていて完全に予想がついた。"],["The speech was full of hackneyed phrases and empty promises.","その演説は陳腐な言い回しと空約束に満ちていた。"]],"halcyon":[["The halcyon weather lasted all week, with calm seas and clear skies.","穏やかな天気が一週間続き、海は凪ぎ空は澄みわたっていた。"],["He often recalled the halcyon days of his childhood.","彼は子どもの頃の平穏な日々をよく思い出した。"]],"hallmark":[["Honesty is the hallmark of a good leader.","正直さは優れた指導者の特徴である。"],["The silver spoon bore the hallmark of a famous London workshop.","その銀のスプーンには有名なロンドンの工房の品質証明の刻印があった。"]],"halt":[["The court halted construction of the dam.","裁判所はダムの建設を停止させた。"],["The procession halted at the gate and waited for the signal.","行列は門のところで止まり、合図を待った。"],["Heavy snow brought all train services to a halt.","大雪ですべての列車の運行が止まった。"]],"handicap":[["Lack of experience was a major handicap in the interview.","経験不足は面接での大きな不利益だった。"],["He overcame a physical handicap to become a champion swimmer.","彼は身体的な障害を乗り越えて水泳の優秀な選手になった。"],["The weaker player was given a handicap of two strokes.","実力の劣る選手には2打のハンディが与えられた。"]],"handle":[["Please handle the glass carefully because it breaks easily.","ガラスは割れやすいので、慎重に扱ってください。"],["She handled the complaint calmly and professionally.","彼女はその苦情を冷静かつ専門的に処理した。"],["The handle of the door was cold to the touch.","ドアの取っ手は触ると冷たかった。"]],"haphazard":[["The haphazard way he filed documents made them impossible to find.","彼のでたらめな書類の整理の仕方のせいで、書類は見つけようがなかった。"],["Their haphazard planning meant the trip was a series of mishaps.","彼らの行き当たりばったりの計画のせいで、旅行は失敗の連続だった。"]],"hapless":[["The hapless tourist lost his passport on the first day.","その不運な旅行者は初日にパスポートをなくした。"],["The hapless victims of the scam lost all their savings.","その詐欺の哀れな被害者たちは貯金をすべて失った。"]],"harbinger":[["Early flowers are a harbinger of spring.","早咲きの花は春の訪れの前触れである。"],["The writer was a harbinger of the modern novel in Japan.","その作家は日本における近代小説の先駆者だった。"]],"harbor":[["Fishing boats returned to the harbor before the storm arrived.","漁船は嵐が来る前に港へ戻った。"],["He had long harbored doubts about the plan.","彼はその計画に対して長らく疑念を抱いていた。"],["The family was arrested for harboring a criminal in their home.","その家族は自宅に犯罪者をかくまったとして逮捕された。"]],"hardship":[["The family endured years of hardship after the war.","その家族は戦後何年もの苦難に耐えた。"],["Many farmers faced economic hardship after the failed harvest.","不作の後、多くの農家が経済的な困窮に直面した。"]],"harm":[["Too much sugar can do serious harm to your health.","糖分の取りすぎは健康に深刻な害を及ぼしうる。"],["The flood caused great harm to crops in the region.","洪水はその地域の作物に大きな損害を与えた。"],["Smoking can harm not only you but also the people around you.","喫煙は自分だけでなく周りの人も害することがある。"]],"harmony":[["People of different cultures live in harmony in this city.","異なる文化の人々がこの都市では調和して暮らしている。"],["The treaty restored harmony between the neighboring countries after years of conflict.","その条約は長年の対立のあと、隣り合う両国の和合を取り戻した。"]],"harsh":[["Many animals cannot survive the harsh winters in the north.","北部の厳しい冬を生き延びられない動物は多い。"],["Workers endured harsh conditions in the mines for low pay.","労働者たちは低賃金で鉱山の過酷な環境に耐えた。"],["A harsh voice shouted from the other side of the wall.","壁の向こうから耳障りな声が響いてきた。"]],"harvest":[["A poor harvest this year pushed up food prices.","今年の不作が食料価格を押し上げた。"],["Farmers harvest the rice in early autumn before the typhoons arrive.","農家は台風が来る前の初秋に米を収穫する。"]],"hasten":[["The captain hastened the crew to prepare the ship for departure.","船長は出港の準備をするよう乗組員を急がせた。"],["Pollution may hasten the decline of many species.","汚染は多くの種の衰退を早めるかもしれない。"]],"hatred":[["Hatred between the two groups has lasted for centuries.","その二つの集団間の憎しみは何世紀も続いている。"],["The speech was full of hatred toward immigrants.","その演説は移民に対する憎悪に満ちていた。"]],"haughty":[["The haughty king refused to listen to the advice of his ministers.","傲慢な王は大臣たちの助言に耳を貸そうとしなかった。"],["Her haughty manner made her unpopular with colleagues.","彼女の横柄な態度は同僚の間で不評だった。"]],"haunt":[["Memories of the accident haunted him for many years.","事故の記憶が長年彼につきまとった。"],["Local people say a ghost haunts the old house at night.","地元の人々は、夜になると古い屋敷に幽霊が出没すると言う。"]],"havoc":[["The sudden strike played havoc with the city's train schedule.","突然のストライキは市の電車のダイヤを大混乱に陥れた。"],["The storm wreaked havoc across the coastal towns.","嵐は沿岸の町々に大被害をもたらした。"]],"hazard":[["Smoking is a serious health hazard.","喫煙は深刻な健康上の危険である。"],["Loose cables on the floor are a safety hazard in offices.","床に散らばったケーブルはオフィスの危険要素となる。"]],"heal":[["Time can heal even the deepest emotional wounds.","時間はどんなに深い心の傷でも癒すことができる。"],["The wound healed slowly, and he was able to walk again.","傷はゆっくり治り、彼は再び歩けるようになった。"]],"hedge":[["Gold is often bought as a hedge against inflation.","金はインフレに対する備えとして購入されることが多い。"],["A neat hedge separates their garden from the road.","きれいな生け垣が彼らの庭と道路を隔てている。"],["The spokesman hedged his answers to avoid blame if things went wrong.","報道官は、事態が悪化した場合の非難を避けようと答えに予防線を張った。"]],"hedonism":[["The novel criticizes the hedonism of modern city life.","その小説は現代の都会生活の快楽主義を批判している。"],["Critics saw the festival as a celebration of mindless hedonism.","批評家たちはその祭りを、思慮のない享楽主義の祝典とみなした。"]],"heed":[["Drivers should heed road signs, especially near schools.","運転手は、特に学校の近くでは道路標識に注意を払うべきだ。"],["He refused to heed his doctor's advice and kept working.","彼は医者の助言に従うことを拒み、働き続けた。"],["You should take heed of the warning on the label.","ラベルの警告に注意すべきだ。"]],"hegemony":[["The empire sought hegemony over the whole region.","その帝国は地域全体に対する覇権を求めた。"],["The two companies fought for hegemony in the smartphone market.","2社はスマートフォン市場の主導権を争った。"]],"heighten":[["The incident heightened public concern about food safety.","その事件は食品の安全に対する世間の不安を高めた。"],["The loud noise heightened her fear as she walked alone.","一人で歩いていると、大きな音が彼女の恐怖を強めた。"]],"hence":[["The roads were icy; hence the long delays this morning.","道路が凍結しており、それゆえ今朝は大幅な遅れが出た。"],["The conference will be held two weeks hence.","その会議は今から2週間後に開かれる。"]],"hereditary":[["The disease is hereditary and often runs in families.","その病気は遺伝性で、家系に現れることが多い。"],["In some countries, the throne is a hereditary position.","国によっては、王位は世襲の地位である。"]],"heritage":[["The old temple is part of the nation's cultural heritage.","その古い寺院は国の文化遺産の一部だ。"],["Schools should teach children about their cultural heritage and traditions.","学校は子どもたちに文化的な伝統について教えるべきだ。"]],"hesitate":[["She hesitated for a moment before opening the old letter.","彼女は古い手紙を開く前に一瞬ためらった。"],["Investors hesitate to buy shares when the market is unstable.","市場が不安定なとき、投資家は株の購入を躊躇する。"]],"heterogeneous":[["The experiment used a heterogeneous mixture of metals and plastic.","その実験では金属とプラスチックの異質な混合物が使われた。"],["The city has a heterogeneous population of many ethnic groups.","その都市には多くの民族からなる多様な人口構成がある。"]],"highlight":[["The report highlights the need for better public transport.","その報告書はより良い公共交通の必要性を強調している。"],["She used a yellow pen to highlight important words in the text.","彼女は黄色いペンで本文の重要な語を目立たせた。"],["The boat tour was the highlight of our trip to the island.","ボートツアーは島への旅行の呼び物だった。"]],"hire":[["The firm plans to hire fifty new engineers next year.","その会社は来年50人の新しい技術者を雇う予定だ。"],["We hired a car at the airport and drove along the coast.","私たちは空港で車を賃借りし、海岸沿いを走った。"]],"hoard":[["Squirrels hoard nuts in preparation for winter.","リスは冬に備えて木の実を蓄える。"],["People began to hoard rice and water when the typhoon approached.","台風が近づくと、人々は米と水を買いだめし始めた。"],["The police discovered a hoard of gold coins buried in the garden.","警察は庭に埋められた金貨の蓄えを発見した。"]],"holistic":[["Doctors increasingly favor a holistic approach to treatment.","医師は治療に対する全体論的なアプローチをますます好んでいる。"],["The city needs a holistic plan that covers housing, transport and jobs.","その市には住宅、交通、雇用を網羅する包括的な計画が必要だ。"]],"hollow":[["The owl lived in a hollow tree near the river.","そのフクロウは川の近くの空洞のある木に住んでいた。"],["She gave a hollow laugh and stared out of the window.","彼女はうつろな笑い声をあげ、窓の外を見つめた。"],["His promises sounded hollow after so many broken pledges.","あまりに多くの約束を破ったため、彼の約束は空虚に響いた。"]],"homogeneous":[["Japan is often described as a homogeneous society.","日本はしばしば均質な社会と言われる。"],["A homogeneous group of plants is easily destroyed by a single disease.","同種の植物の集団は、一つの病気で簡単に全滅する。"]],"hone":[["Daily practice helped her hone her skills as a pianist.","毎日の練習のおかげで彼女はピアニストとしての技術を磨いた。"],["Years of travel honed his senses and sharpened his judgment.","長年の旅が彼の感覚を研ぎ澄まし、判断力を鋭くした。"]],"honor":[["It is a great honor to receive this award.","この賞をいただけることは大変な名誉です。"],["The crowd stood in honor of the soldiers who died in the war.","群衆は戦争で亡くなった兵士たちに敬意を表して起立した。"],["We honor those who worked hard to protect our environment.","私たちは環境を守るために尽力した人々を尊敬する。"]],"horizon":[["The sun slowly sank below the horizon, and the sky turned red.","太陽はゆっくりと地平線の下に沈み、空は赤く染まった。"],["Travel can broaden your horizons and change how you think.","旅行は視野を広げ、ものの考え方を変えることがある。"],["New technology has opened up a bright horizon for the industry.","新技術はその産業に明るい展望を開いた。"]],"host":[["The host of the conference thanked all the speakers.","会議の主催者はすべての講演者に感謝した。"],["The host welcomed each guest warmly and showed them to the table.","主人は客一人ひとりを温かく迎え、席へ案内した。"],["Japan will host the international conference next spring.","日本は来春その国際会議を主催する予定だ。"]],"hostile":[["The new manager faced a hostile reaction from the staff.","新しい部長は職員から敵意ある反応に直面した。"],["The plants could not grow in the hostile climate of the desert.","植物は砂漠の不利な気候では育たなかった。"]],"household":[["The average household now owns more than one computer.","現在の平均的な世帯はコンピューターを1台以上所有している。"],["She grew up in a household where music was always played.","彼女は音楽がいつも流れている家庭で育った。"]],"hover":[["A helicopter hovered above the field while rescuers searched.","救助隊が捜索している間、ヘリコプターが野原の上空に浮かんでいた。"],["Reporters hovered outside the building, hoping to see him.","記者たちは彼に会おうと建物の外をうろついた。"],["A thin mist hovered over the lake early in the morning.","早朝、薄い霧が湖面に漂っていた。"]],"hubris":[["His hubris led him to ignore the advice of experts.","彼は傲慢さゆえに専門家の助言を無視した。"],["The general's hubris after the victory led to his downfall.","勝利のあとの将軍の思い上がりが彼の失脚を招いた。"]],"humanitarian":[["The country sent humanitarian aid to the flooded regions.","その国は洪水に見舞われた地域に人道支援を送った。"],["Humanitarian ideals inspired him to found the hospital.","人道主義の理想に突き動かされて、彼はその病院を設立した。"]],"humanity":[["Climate change is a threat to all of humanity.","気候変動は全人類に対する脅威だ。"],["The film reminds us of the humanity that exists even in war.","その映画は戦争の中にさえ存在する人間性を私たちに思い出させる。"],["The doctor treated every patient with humanity and kindness.","その医師はすべての患者を人間愛と優しさをもって診た。"]],"humble":[["Despite his fame, he remained a humble and kind man.","名声があっても、彼は謙虚で親切な人であり続けた。"],["He was born in a humble house at the edge of the village.","彼は村はずれの質素な家に生まれた。"]],"humility":[["True leaders show humility even in moments of success.","真の指導者は成功のときでさえ謙虚さを示す。"],["She accepted the award with humility, thanking everyone who helped her.","彼女は助けてくれた皆に感謝し、謙遜してその賞を受け取った。"]],"hurdle":[["Raising enough money is the biggest hurdle for the project.","十分な資金を集めることがその計画の最大の障害だ。"],["Learning the language was the first hurdle for the new immigrants.","新しい移民にとって、言語の習得は最初の困難だった。"],["The athlete cleared the last hurdle and ran to the finish line.","その選手は最後のハードルを越えてゴールへ走った。"]],"hybrid":[["The new material is a hybrid of plastic and natural fibers.","その新素材はプラスチックと天然繊維の混合物だ。"],["Hybrid cars use both petrol and electric power.","ハイブリッド車はガソリンと電力の両方を使う。"],["Farmers crossed two varieties to produce a hybrid with larger fruit.","農家は2品種を交配させ、実の大きい雑種をつくった。"]],"hygiene":[["Good hygiene helps prevent the spread of infection.","良好な衛生は感染拡大の防止に役立つ。"],["She teaches hygiene at a medical college.","彼女は医科大学で衛生学を教えている。"]],"hypocrisy":[["Critics pointed out the hypocrisy of the politician's statement.","批評家たちはその政治家の発言の偽善を指摘した。"],["Her kindness was nothing but hypocrisy to win votes.","彼女の親切は票を得るための見せかけにすぎなかった。"]],"iconoclast":[["The artist was an iconoclast who rejected every accepted convention.","その芸術家はあらゆる既成の慣習を拒む因習打破者だった。"],["In the eighth century, iconoclasts destroyed many sacred images in churches.","8世紀、偶像破壊者たちは教会の聖像を数多く破壊した。"]],"ideal":[["This region offers an ideal climate for growing grapes.","この地域はブドウ栽培に理想的な気候である。"],["He never gave up his ideal of a world without war.","彼は戦争のない世界という理想を決して捨てなかった。"]],"identify":[["Researchers have identified the gene responsible for the disease.","研究者たちはその病気の原因となる遺伝子を特定した。"],["Fans often identify themselves with the characters in their favorite novels.","ファンは好きな小説の登場人物と自分を同一視することが多い。"]],"identity":[["The police are trying to confirm the identity of the injured man.","警察は負傷した男の身元の確認を急いでいる。"],["Doctors confirmed the identity of the two samples using a DNA test.","医師はDNA検査で2つの検体の同一性を確認した。"],["Small towns should protect their local identity from global chains.","小さな町はグローバルチェーンから地域の独自性を守るべきだ。"]],"idiosyncrasy":[["The idiosyncrasy of the language makes it hard for foreigners to learn.","その言語の特異性が、外国人にとってその習得を難しくしている。"],["Every writer has his own idiosyncrasies of style.","どの作家にも文体上の独特の癖がある。"],["The idiosyncrasy of this breed is its remarkable sense of smell.","この犬種の特質は、並外れた嗅覚である。"]],"ignominious":[["The scandal brought an ignominious end to the senator's career.","そのスキャンダルは上院議員の経歴に不名誉な終わりをもたらした。"],["The team suffered an ignominious defeat in the final.","そのチームは決勝で屈辱的な敗北を喫した。"]],"ignorant":[["Ignorant people often fear what they do not understand.","無知な人々は、理解できないものを恐れることが多い。"],["He was ignorant of the dangers involved in the experiment.","彼はその実験に伴う危険を知らなかった。"]],"illiterate":[["Millions of adults around the world remain illiterate.","世界中で何百万人もの大人が読み書きができないままである。"],["The professor dismissed him as an illiterate who had never read a serious book.","教授は、まともな本を一冊も読んだことのない無教養の人間だと彼を一蹴した。"]],"illuminate":[["Street lamps illuminate the path to the station at night.","街灯が夜間、駅へ続く道を照らす。"],["The study illuminates the causes of urban poverty.","その研究は都市の貧困の原因を明らかにしている。"]],"illusion":[["Optical illusions show that our eyes can easily be deceived.","目の錯覚は、私たちの目が簡単にだまされうることを示している。"],["He lost his illusions about politics after working in government.","彼は政府で働いた後、政治に対する幻想を失った。"]],"illustrate":[["This example clearly illustrates the importance of early education.","この例は早期教育の重要性をはっきりと示している。"],["She illustrated the children's book with colorful pictures of animals.","彼女はその児童書に動物のカラフルな絵で挿絵を入れた。"]],"imaginary":[["Many young children have imaginary friends.","多くの幼い子どもには想像上の友達がいる。"],["The novel is set in an imaginary country in northern Europe.","その小説は北欧の架空の国を舞台にしている。"]],"imitate":[["Children learn language by imitating the adults around them.","子どもは周りの大人をまねることで言語を学ぶ。"],["Many companies tried to imitate the successful design of the smartphone.","多くの会社がそのスマートフォンの成功したデザインを模倣しようとした。"]],"immerse":[["Immerse the cloth in cold water for ten minutes before washing.","洗う前に、その布を冷水に10分間浸しなさい。"],["She immersed herself in her studies and ignored everything else.","彼女は勉強に没頭し、ほかのすべてを無視した。"]],"immigrant":[["Many immigrants face difficulties learning a new language.","多くの移民は新しい言語の習得に苦労する。"],["Each year thousands of immigrants arrive at the port seeking work.","毎年何千人もの移住者が仕事を求めてその港に到着する。"]],"imminence":[["The imminence of the deadline made everyone work through the night.","締め切りの切迫が、全員を徹夜で働かせた。"],["Scientists warned of the imminence of a major earthquake.","科学者たちは大地震が差し迫っていると警告した。"]],"immune":[["Most adults are immune to the virus because they were vaccinated.","ほとんどの大人は予防接種を受けたため、そのウイルスに免疫がある。"],["Few people are completely immune to advertising.","広告の影響をまったく受けない人はほとんどいない。"]],"impact":[["Social media has had a huge impact on how we communicate.","ソーシャルメディアは私たちの意思疎通の仕方に大きな影響を与えてきた。"],["The new law will impact small businesses more than large ones.","その新しい法律は大企業より中小企業に影響を与えるだろう。"]],"impatience":[["She tapped her fingers in impatience while waiting for the reply.","彼女は返事を待つ間、いらいらして指で机をたたいた。"],["His impatience often causes him to quarrel with colleagues.","彼の短気はしばしば同僚との口論を招く。"]],"impatient":[["Customers grew impatient as the line moved slowly.","列がゆっくりとしか進まず、客はいらだってきた。"],["The children were impatient to open their presents.","子どもたちはプレゼントを開けるのが待ちきれなかった。"]],"impede":[["Heavy snow impeded the rescue team's progress.","大雪が救助隊の進行を妨げた。"],["Bad weather impeded the delivery of supplies by several days.","悪天候が物資の配達を数日遅らせた。"]],"imperative":[["It is imperative that we act before the damage becomes irreversible.","被害が取り返しのつかなくなる前に行動することが不可欠だ。"],["The teacher spoke in an imperative tone that silenced the class.","先生は教室を静まらせる命令的な口調で話した。"],["Feeding the hungry is a moral imperative for any society.","飢えた人々を養うことは、どの社
